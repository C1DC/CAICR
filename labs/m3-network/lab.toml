[lab]
id = "m3"
module = "M3"
day = 2
title = "Network Compromise Investigation — Nmap, NSE & Wireshark"
tools = ["nmap", "nmap NSE", "wireshark", "tcpdump", "netstat"]
estimated_minutes = 120
briefing = "briefing.md"
objective = """
Work a live network-compromise case across three evidence sources: scan the \
subnet with Nmap and its scripting engine to find exposed services, follow a \
packet capture in Wireshark to recover a C2 beacon AND cleartext credentials, \
and correlate a netstat capture from the suspect host to identify the backdoor \
and the C2 infrastructure. Map the chain to MITRE ATT&CK and design the controls."""

[network]
name = "caic_m3_range"
subnet = "10.13.3.0/24"
ready = ["10.13.3.10:80", "10.13.3.20:21", "10.13.3.30:22", "10.13.3.40:3389"]

[[targets]]
name = "gateway"
ip = "10.13.3.1"
role = "Lab network gateway (your host side — not a target to report)"

[[targets]]
name = "web-admin"
ip = "10.13.3.10"
role = "Web server — unauthenticated admin console on :80"

[[targets]]
name = "fileserver"
ip = "10.13.3.20"
role = "Anonymous, unencrypted FTP on :21"

[[targets]]
name = "workstation"
ip = "10.13.3.30"
role = "SSH on :22 — the infected host (see the capture and netstat)"

[[targets]]
name = "legacy-host"
ip = "10.13.3.40"
role = "Exposed legacy remote-access (RDP) on :3389"

# ── Part 1: scan & fingerprint with Nmap + NSE ──────────────────────────────
[[check]]
id = "targets_live"
type = "script"
prompt = "All four lab targets are reachable on the range"
points = 1

[[check]]
id = "hosts_found"
type = "numeric"
prompt = "How many TARGET hosts are live on 10.13.3.0/24 (exclude the .1 gateway)?"
answer = 4
tolerance = 0
hint = "nmap -sn 10.13.3.0/24"

[[check]]
id = "web_admin_ip"
type = "string_any"
prompt = "Which host serves an unauthenticated web admin panel? Give its IP."
accept = ["10.13.3.10"]
hint = "nmap --script=http-title -p80 10.13.3.0/24"

[[check]]
id = "rdp_port"
type = "numeric"
prompt = "On which TCP port is the exposed legacy remote-access service?"
answer = 3389
hint = "nmap -p- 10.13.3.40  — the open port"

[[check]]
id = "ssh_version"
type = "string_any"
prompt = "Fingerprint the SSH host (10.13.3.30). What SSH software/version does nmap report?"
accept = ["openssh", "openssh 9.7", "9.7", "openssh 9", "openssh 9.7 (protocol 2.0)"]
hint = "nmap -sV -p22 10.13.3.30"

[[check]]
id = "ftp_anon"
type = "string_any"
prompt = "Run the ftp-anon NSE script against the fileserver. Is anonymous FTP login allowed?"
accept = ["yes", "allowed", "anonymous allowed", "anonymous ftp login allowed", "y", "230"]
hint = "nmap --script ftp-anon -p21 10.13.3.20"

[[check]]
id = "cleartext_proto"
type = "string_any"
prompt = "Which protocol on the fileserver transmits credentials in cleartext?"
accept = ["ftp", "ftp (21)", "file transfer protocol"]
hint = "nmap -sV -p21 10.13.3.20  — and see the capture"

# ── Part 2: follow the capture in Wireshark ─────────────────────────────────
[[check]]
id = "c2_domain"
type = "string_any"
prompt = "In network-capture.pcap, what domain is the infected host beaconing to?"
accept = ["sync-telemetry.duckdns.org", "duckdns.org"]
hint = "wireshark assets/network-capture.pcap ; filter: dns"

[[check]]
id = "beacon_interval"
type = "numeric"
prompt = "What is the beaconing interval, in seconds?"
answer = 30
tolerance = 3
hint = "Compare the timestamps of the repeated DNS queries"

[[check]]
id = "infected_host"
type = "string"
prompt = "Which internal IP is making those beacon queries?"
answer = "10.13.3.30"
hint = "The source IP of the repeated DNS queries"

[[check]]
id = "ftp_user"
type = "string_any"
prompt = "Follow the FTP TCP stream in the capture. What USERNAME logged in?"
accept = ["backupsvc"]
hint = "Wireshark: right-click an FTP packet → Follow → TCP Stream (or tcpdump -A)"

[[check]]
id = "ftp_pass"
type = "string"
prompt = "And what PASSWORD was sent — in the clear?"
answer = "Backup#2021"
hint = "It's in the same FTP stream, right after USER"

# ── Part 3: correlate the netstat capture from the suspect host ─────────────
[[check]]
id = "malware_name"
type = "string_any"
prompt = "In netstat-FIN03.txt, what process name is masquerading as a Windows service?"
accept = ["svch0st", "svch0st (pid 3391)", "sv ch0st"]
hint = "cat assets/netstat-FIN03.txt — look closely at the spelling of 'svchost'"

[[check]]
id = "backdoor_port"
type = "numeric"
prompt = "What TCP port is that malware LISTENING on as a backdoor?"
answer = 4444
hint = "The LISTEN line owned by the suspicious process"

[[check]]
id = "c2_ip"
type = "string"
prompt = "What external C2 IP does the malware hold an ESTABLISHED connection to? (correlates with the beacon domain)"
answer = "185.220.101.44"
hint = "The ESTABLISHED foreign address owned by the malware process"

[[check]]
id = "attack_technique"
type = "string_any"
prompt = "Which MITRE ATT&CK technique covers the DNS command-and-control channel?"
accept = ["T1071", "T1071.004"]
hint = "Command and Control → Application Layer Protocol (DNS sub-technique)"
