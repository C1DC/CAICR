[lab]
id = "rt"
module = "RT"
day = 1
title = "Operation First Blood — Your First Live Intrusion"
tools = ["nmap", "gobuster", "curl", "ssh", "sudo"]
estimated_minutes = 75
briefing = "briefing.md"
objective = """
Break into a live internal server end to end — the real thing, on an isolated \
range you're authorised to attack. Scan it, discover a web service, loot a \
credential a careless admin left exposed, use it to get a foothold over SSH, \
capture the user flag, then exploit a sudo misconfiguration to escalate to root \
and capture the root flag. Finally, flip to defender: name what would have broken \
each step of the chain. This is the whole attacker lifecycle in 75 minutes."""

[network]
name = "caic_rt_range"
subnet = "10.13.2.0/24"
ready = ["10.13.2.10:80", "10.13.2.10:22"]

[[targets]]
name = "intranet"
ip = "10.13.2.10"
role = "Volta internal server — web (:80) + SSH (:22). Your authorised target."

# ── 1. Recon ────────────────────────────────────────────────────────────────
[[check]]
id = "target_up"
type = "script"
prompt = "The target's web and SSH services are reachable"
points = 1

[[check]]
id = "web_server"
type = "string_any"
prompt = "Fingerprint the web service (nmap -sV -p80 10.13.2.10). What server software is it?"
accept = ["darkhttpd", "dark httpd"]
hint = "nmap -sV -p80 10.13.2.10  — read the VERSION column."

[[check]]
id = "hidden_path"
type = "string_any"
prompt = "The web root hides a directory an admin forgot to move. What path is it? (robots.txt hints; gobuster confirms)"
accept = ["/backup/", "/backup", "backup", "backup/"]
hint = "curl http://10.13.2.10/robots.txt  — or gobuster dir -u http://10.13.2.10 -w /usr/share/wordlists/dirb/common.txt"

# ── 2. Loot the leaked credential ───────────────────────────────────────────
[[check]]
id = "ssh_user"
type = "string_any"
prompt = "That directory leaks an ops handover note with SSH credentials. What is the SSH username?"
accept = ["webadmin"]
hint = "curl http://10.13.2.10/backup/notes.txt"

[[check]]
id = "ssh_pass"
type = "string"
prompt = "And the SSH password in that note?"
answer = "{{ssh_pass}}"
hint = "It's in the same notes.txt — right under the username."

# ── 3. Foothold + user flag ─────────────────────────────────────────────────
[[check]]
id = "user_flag"
type = "string"
prompt = "SSH in with those credentials (ssh webadmin@10.13.2.10). What flag is in user.txt in the home directory?"
answer = "{{user_flag}}"
hint = "ssh webadmin@10.13.2.10  then:  cat user.txt"

# ── 4. Privilege escalation + root flag ─────────────────────────────────────
[[check]]
id = "privesc_method"
type = "string_any"
prompt = "Run 'sudo -l'. It shows webadmin may run a shell as root with NO password. What is the privilege-escalation method?"
accept = ["sudo", "sudo misconfiguration", "sudo misconfig", "sudo -l", "sudo to root",
          "sudo shell", "nopasswd sudo", "sudo ash", "abuse sudo", "sudo privilege escalation"]
hint = "sudo -l  — a NOPASSWD entry for a shell binary is a classic misconfiguration."

[[check]]
id = "root_flag"
type = "string"
prompt = "Escalate to root (e.g. 'sudo /bin/ash') and read /root/root.txt. What is the root flag?"
answer = "{{root_flag}}"
hint = "sudo /bin/ash   then:  cat /root/root.txt"

# ── 5. Flip to defender ─────────────────────────────────────────────────────
[[check]]
id = "foothold_technique"
type = "string_any"
prompt = "Which MITRE ATT&CK technique covers getting in with the leaked, legitimate credentials?"
accept = ["T1078", "valid accounts", "t1078 valid accounts"]
hint = "Initial Access / Persistence → using legitimate credentials."

[[check]]
id = "stopping_control"
type = "string_any"
prompt = "Name ONE control that would have broken this chain."
accept = ["mfa", "multi-factor", "multi factor authentication", "phishing-resistant mfa",
          "least privilege", "remove sudo", "restrict sudo", "fix sudo", "remove the sudo misconfiguration",
          "don't store credentials", "do not store credentials", "secrets management", "remove the backup",
          "strong unique password", "unique password", "password manager", "take the backup off the web root",
          "network segmentation", "key-based ssh", "disable password auth"]
hint = "Any real break in the chain: MFA on SSH, not leaving creds in the web root, or fixing the NOPASSWD sudo."

[randomize.ssh_pass]
kind = "password"

[randomize.user_flag]
kind = "flag"
prefix = "user_"

[randomize.root_flag]
kind = "flag"
prefix = "root_"
