# Authoritative lab zone for lab-corp.com.gh — a fuller passive-recon practicum.
# dig returns real answers with no internet. The zone has SPF (weak ~all) and a
# DKIM selector, but deliberately NO DMARC and NO CAA record — the exposures the
# analyst must spot.
no-resolv
no-hosts
log-queries

# Authoritative mode: unknown names (e.g. _dmarc, CAA) return a clean NXDOMAIN,
# which is exactly what "no DMARC / no CAA published" looks like to an analyst.
auth-zone=lab-corp.com.gh
auth-server=ns1.lab-corp.com.gh

# A / AAAA records
host-record=lab-corp.com.gh,41.210.15.20,2001:db8:ac10:f15::20
host-record=www.lab-corp.com.gh,41.210.15.20
host-record=mail.lab-corp.com.gh,41.210.15.21
host-record=vpn.lab-corp.com.gh,41.210.15.30
host-record=dev.lab-corp.com.gh,41.210.15.40
host-record=ns1.lab-corp.com.gh,41.210.15.5

# Mail routing — on-premises mail server (not an outsourced provider)
mx-host=lab-corp.com.gh,mail.lab-corp.com.gh,10

# SPF published — but note the weak "~all" (soft fail) qualifier
txt-record=lab-corp.com.gh,"v=spf1 ip4:41.210.15.21 ~all"

# DKIM public key published at the "default" selector
txt-record=default._domainkey.lab-corp.com.gh,"v=DKIM1; k=rsa; p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQLabCorpDkimPublicKeyExample000111222333"

# NO _dmarc.lab-corp.com.gh record — no DMARC policy, the domain is spoofable.
# NO CAA record — any certificate authority may issue certs for this domain.
