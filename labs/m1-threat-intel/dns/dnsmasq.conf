# Lab DNS zone for lab-corp.com.gh — served authoritatively, no upstream.
no-resolv
no-hosts
log-queries

# Authoritative zone so unknown names (e.g. _dmarc) return a clean NXDOMAIN,
# which is exactly what "no DMARC published" looks like to an investigator.
auth-zone=lab-corp.com.gh
auth-server=ns1.lab-corp.com.gh

# A records
host-record=lab-corp.com.gh,41.210.15.20
host-record=www.lab-corp.com.gh,41.210.15.20
host-record=mail.lab-corp.com.gh,41.210.15.21
host-record=ns1.lab-corp.com.gh,41.210.15.5

# Mail routing
mx-host=lab-corp.com.gh,mail.lab-corp.com.gh,10

# SPF published — but note the weak "~all" (softfail) qualifier
txt-record=lab-corp.com.gh,"v=spf1 ip4:41.210.15.21 ~all"

# NO _dmarc.lab-corp.com.gh record exists. That omission is the whole point:
# with no DMARC policy, anyone can spoof this domain and nothing rejects it.
