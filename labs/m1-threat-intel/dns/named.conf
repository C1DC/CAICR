options {
    directory "/var/cache/bind";
    recursion no;                 // authoritative only — not an open resolver
    listen-on { any; };
    listen-on-v6 { any; };
    allow-transfer { any; };      // *** MISCONFIGURATION *** — zone transfer to anyone
    dnssec-validation no;
};

zone "lab-corp.com.gh" {
    type master;
    file "/etc/bind/db.lab-corp";
};
