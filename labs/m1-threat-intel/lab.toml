[lab]
id = "m1"
module = "M1"
day = 1
title = "Threat Intelligence & OSINT — Passive Reconnaissance"
tools = ["dig", "whois", "theHarvester"]
estimated_minutes = 90
briefing = "briefing.md"
objective = """
Run a full passive-reconnaissance profile of a target domain the way an attacker \
does before a phishing campaign: sweep its DNS, read its email-authentication \
posture, analyse its registration, harvest its OSINT footprint, and find the \
missing controls (DMARC, CAA) that leave it exposed. Map every finding to MITRE \
ATT&CK and write it into a threat brief."""

[network]
name = "caic_m1_range"
subnet = "10.13.1.0/24"
ready = ["10.13.1.10:53"]

[[targets]]
name = "labdns"
ip = "10.13.1.10"
role = "Authoritative DNS for lab-corp.com.gh — query every record type with dig"

# ── Verification checks (a fuller passive-recon practicum) ───────────────────
[[check]]
id = "dns_up"
type = "script"
prompt = "The lab DNS server answers queries for lab-corp.com.gh"
points = 1

[[check]]
id = "a_record"
type = "string"
prompt = "What IPv4 address does lab-corp.com.gh resolve to? (A record)"
answer = "41.210.15.20"
hint = "dig @10.13.1.10 lab-corp.com.gh A +short"

[[check]]
id = "aaaa_record"
type = "string_any"
prompt = "What IPv6 address does it publish? (AAAA record)"
accept = ["2001:db8:ac10:f15::20"]
hint = "dig @10.13.1.10 lab-corp.com.gh AAAA +short"

[[check]]
id = "mx_host"
type = "string_any"
prompt = "What is the mail server (MX) host?"
accept = ["mail.lab-corp.com.gh", "mail.lab-corp.com.gh."]
hint = "dig @10.13.1.10 lab-corp.com.gh MX +short"

[[check]]
id = "mail_ip"
type = "string"
prompt = "What IP does that mail server resolve to?"
answer = "41.210.15.21"
hint = "dig @10.13.1.10 mail.lab-corp.com.gh A +short"

[[check]]
id = "auth_ns"
type = "string_any"
prompt = "From the SOA record, what is the authoritative name server?"
accept = ["ns1.lab-corp.com.gh", "ns1.lab-corp.com.gh."]
hint = "dig @10.13.1.10 lab-corp.com.gh SOA +short  (first field)"

[[check]]
id = "spf_qualifier"
type = "string_any"
prompt = "The SPF record ends in a qualifier — what is it, and what does it mean?"
accept = ["~all", "softfail", "soft fail", "~all softfail", "tilde all"]
hint = "dig @10.13.1.10 lab-corp.com.gh TXT  —  -all=hard, ~all=soft"

[[check]]
id = "dkim_selector"
type = "string_any"
prompt = "A DKIM public key is published. At which selector?"
accept = ["default", "default._domainkey", "default._domainkey.lab-corp.com.gh"]
hint = "dig @10.13.1.10 default._domainkey.lab-corp.com.gh TXT"

[[check]]
id = "dmarc_present"
type = "string_any"
prompt = "Is a DMARC record published for lab-corp.com.gh?"
accept = ["no", "none", "no dmarc", "absent", "not published", "nxdomain", "missing"]
hint = "dig @10.13.1.10 _dmarc.lab-corp.com.gh TXT  — what status comes back?"

[[check]]
id = "caa_present"
type = "string_any"
prompt = "Is a CAA record published (which would restrict who can issue TLS certs)?"
accept = ["no", "none", "absent", "not published", "missing", "no caa"]
hint = "dig @10.13.1.10 lab-corp.com.gh CAA  — empty answer means any CA may issue"

[[check]]
id = "missing_control"
type = "string_any"
prompt = "Which single email-authentication control is missing and enables spoofing?"
accept = ["dmarc"]
hint = "SPF present (weak) + DKIM present + ??? — the policy + alignment layer"

[[check]]
id = "reg_year"
type = "numeric"
prompt = "From the WHOIS export, in what YEAR was lab-corp.com.gh originally registered?"
answer = 2019
hint = "cat assets/whois-lab-corp.txt  — the Creation Date"

[[check]]
id = "lookalike_domain"
type = "string_any"
prompt = "The WHOIS export flags a recently-registered look-alike domain. Name it."
accept = ["lab-corp-gh.com"]
hint = "Compare the Creation Dates in assets/whois-lab-corp.txt"

[[check]]
id = "emails_found"
type = "numeric"
prompt = "In the OSINT report, how many employee email addresses were found?"
answer = 5
hint = "cat assets/osint-report.txt"

[[check]]
id = "attack_technique"
type = "string_any"
prompt = "Which MITRE ATT&CK technique covers gathering victim DNS/network info?"
accept = ["T1590", "T1590.002", "T1589", "T1598"]
hint = "Reconnaissance (TA0043) → Gather Victim Network Information"
