[lab]
id = "m4"
module = "M4"
day = 2
title = "Vulnerability Management & SOC Operations"
tools = ["nmap", "nikto", "gobuster", "whatweb", "hashcat", "john", "hydra", "jq (Wazuh)"]
estimated_minutes = 150
briefing = "briefing.md"
objective = """
Run a full web assessment and a cracking chain, then triage the SOC: fingerprint \
and scan the web server (nmap/whatweb/nikto), brute-force hidden content \
(gobuster) to find a leaked database backup, crack its unsalted MD5 hashes \
(hashcat/john), demonstrate weak SSH credentials (Hydra), and correlate the \
Wazuh alert feed into one attack story with a remediation register and SOC ticket."""

[network]
name = "caic_m4_range"
subnet = "10.13.4.0/24"
ready = ["10.13.4.10:80", "10.13.4.20:22"]

[[targets]]
name = "web"
ip = "10.13.4.10"
role = "Leaky Apache web server — scan, fuzz and loot"

[[targets]]
name = "ssh"
ip = "10.13.4.20"
role = "SSH host with a weak account — authorised Hydra demo target"

# ── Part 1: assess the web server ───────────────────────────────────────────
[[check]]
id = "web_up"
type = "script"
prompt = "The web target (10.13.4.10) is serving"
points = 1

[[check]]
id = "ssh_up"
type = "script"
prompt = "The SSH target (10.13.4.20) is listening"
points = 1

[[check]]
id = "web_server"
type = "string_any"
prompt = "Fingerprint the web server — what server software is it?"
accept = ["apache", "apache httpd", "httpd"]
hint = "nmap -sV -p80 10.13.4.10   (or: whatweb http://10.13.4.10)"

[[check]]
id = "admin_path"
type = "string_any"
prompt = "Brute-force the web content. What administrative path is exposed?"
accept = ["/admin/", "/admin", "admin", "admin/"]
hint = "gobuster dir -u http://10.13.4.10 -w /usr/share/wordlists/dirb/common.txt"

[[check]]
id = "leaked_dump"
type = "string_any"
prompt = "A database backup was left world-readable under /backup/. Name the file."
accept = ["db_dump.sql", "/backup/db_dump.sql", "backup/db_dump.sql"]
hint = "curl http://10.13.4.10/backup/   (directory listing is on)"

[[check]]
id = "config_db_pass"
type = "string"
prompt = "A leftover config backup leaks the database password. What is it?"
answer = "{{db_pass}}"
hint = "curl http://10.13.4.10/config.php.bak"

# ── Part 2: crack the looted hashes ─────────────────────────────────────────
[[check]]
id = "hash_algo"
type = "string_any"
prompt = "How are the passwords in db_dump.sql stored (the weakness)?"
accept = ["md5", "raw-md5", "unsalted md5", "raw md5", "unsalted", "md5 unsalted"]
hint = "Look at the comment and the 32-hex-char values; what hashcat mode (-m 0) is that?"

[[check]]
id = "admin_hash"
type = "string"
prompt = "What is the stored hash for the 'admin' account?"
answer = "{{admin_hash}}"
hint = "It's the pass_md5 value on the admin row"

[[check]]
id = "admin_cracked"
type = "string"
prompt = "Crack it. What is admin's plaintext password?"
answer = "{{admin_pw}}"
hint = "hashcat -m 0 -a 0 hashes.txt assets/lab-wordlist.txt   (or john --format=raw-md5)"

[[check]]
id = "backup_cracked"
type = "string"
prompt = "Crack the 'backup' service account's hash too. What is its password?"
answer = "12345"
hint = "Same wordlist; 827ccb0eea8a706c4c34a16891f84e7b"

[[check]]
id = "hydra_pass"
type = "string"
prompt = "Hydra: what password works for 'labuser' over SSH?"
answer = "Password123"
hint = "hydra -l labuser -P assets/lab-wordlist.txt ssh://10.13.4.20"

# ── Part 3: triage & correlate the SOC alerts ──────────────────────────────
[[check]]
id = "brute_src_ip"
type = "string"
prompt = "In the Wazuh feed, which source IP is behind the brute force AND the web scan?"
answer = "10.13.4.66"
hint = "jq -r '.[].data.srcip // empty' assets/wazuh-alerts.json | sort | uniq -c | sort -rn"

[[check]]
id = "top_level"
type = "numeric"
prompt = "What is the highest Wazuh rule level (severity) firing?"
answer = 12
hint = "jq '[.[].rule.level] | max' assets/wazuh-alerts.json"

[[check]]
id = "got_in"
type = "string_any"
prompt = "Did the attacker ultimately succeed in logging in? (yes/no or the rule id)"
accept = ["yes", "5715", "authentication success", "successful login", "success"]
hint = "Find an sshd authentication SUCCESS from the same srcip, after the failures"

[[check]]
id = "persistence_technique"
type = "string_any"
prompt = "After root access, how did the attacker establish persistence (ATT&CK technique or method)?"
accept = ["T1053", "T1053.003", "cron", "cron job", "scheduled task", "scheduled task/job"]
hint = "Look for the highest-severity alert — what did they create as root?"

[[check]]
id = "attack_technique"
type = "string_any"
prompt = "Which MITRE ATT&CK technique covers the SSH brute force?"
accept = ["T1110", "T1110.001", "T1110.003"]
hint = "Credential Access → Brute Force"

# ── Apply the toolkit (Module 4 §2–§3, §7–§8) ────────────────────────────────
[[check]]
id = "authenticated_scan"
type = "string_any"
prompt = "Name a vulnerability scanner you'd run for an AUTHENTICATED full-estate scan (not just the web)."
accept = ["openvas", "greenbone", "nessus", "nuclei", "qualys", "rapid7", "insightvm"]
hint = "Module 4 §2.1 — OpenVAS/Greenbone or Nessus log in to each host to find missing patches."

[[check]]
id = "validate_cmd"
type = "string_any"
prompt = "In Metasploit, which command VERIFIES a target is exploitable WITHOUT firing the exploit (so you report proven, not possible, risk)?"
accept = ["check", "msf check", "the check command"]
hint = "Module 4 §3 — validation before you escalate a scanner finding."

[[check]]
id = "container_scanner"
type = "string_any"
prompt = "Which tool scans a container image or a repo's dependencies for known-vulnerable packages (the Log4Shell class)?"
accept = ["trivy", "grype", "snyk"]
hint = "Module 4 §2.4 — the modern attack surface is dependencies & cloud, not just hosts."

[[check]]
id = "detection_test"
type = "string_any"
prompt = "Which free, ATT&CK-mapped toolset safely triggers techniques so you can confirm your detections actually fire?"
accept = ["atomic red team", "atomic-red-team", "atomicredteam", "atomic red team (art)", "art"]
hint = "Module 4 §7.3 — a detection you've never triggered is a hope; test it, map coverage on the ATT&CK Navigator."

[randomize.admin_pw]
kind = "choice"
choices = ["password", "123456", "iloveyou", "letmein", "password1", "12345678", "monkey", "dragon", "sunshine"]

[randomize.admin_hash]
kind = "md5"
of = "admin_pw"

[randomize.db_pass]
kind = "password"
