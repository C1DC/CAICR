# M4 — Vulnerability Management & SOC Ops targets.
# web   : leaky Apache for the Nikto scan
# ssh   : the shared target image with a weak account for the Hydra demo
# No ports published to the host LAN; reachable only on the private range.
name: caic-m4

services:
  web:
    build: ./web
    image: caic-m4web:1.0
    networks: { range: { ipv4_address: 10.13.4.10 } }
    restart: unless-stopped

  ssh:
    build: ../_base
    image: caic-target:1.0
    environment: { SERVICE: ssh, HOSTLABEL: ssh-target }
    networks: { range: { ipv4_address: 10.13.4.20 } }
    restart: unless-stopped

networks:
  range:
    name: caic_m4_range
    ipam:
      config:
        - subnet: 10.13.4.0/24
          gateway: 10.13.4.1
