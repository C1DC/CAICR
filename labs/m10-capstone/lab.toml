[lab]
id = "m10"
module = "M10"
day = 5
title = "Operation Cyber Resilience — CyberRange Capstone"
tools = ["nmap", "wireshark", "jq", "email forensics", "ai-sandbox", "all"]
generators = ["assets/generate_capture.py"]
estimated_minutes = 270
briefing = "briefing.md"
objective = """
One simulated crisis against a fictional Ghanaian institution, eight injects, \
every tool from the week. Investigate the live range and the evidence package, \
reconstruct the multi-vector attack end to end, and drive the response."""

[network]
name = "caic_m10_range"
subnet = "10.13.10.0/24"
ready = ["10.13.10.10:80", "10.13.10.20:22", "10.13.10.40:8080"]

[[targets]]
name = "finance-portal"
ip = "10.13.10.10"
role = "Public finance portal (web)"

[[targets]]
name = "records-host"
ip = "10.13.10.20"
role = "Records platform (SSH) — the compromised foothold's neighbour"

[[targets]]
name = "ai-assistant"
ip = "10.13.10.40"
role = "Internal AI assistant (:8080)"

# ── Checks — one per inject plus response decisions ──────────────────────────
[[check]]
id = "range_up"
type = "script"
prompt = "The capstone range (web + SSH + AI) is live"
points = 1

[[check]]
id = "bec_lookalike"
type = "string_any"
prompt = "T+00: what look-alike domain sent the payment-change email? (payment-change.eml)"
accept = ["{{lookalike}}"]
hint = "Compare Reply-To / Return-Path against the From: display domain"

[[check]]
id = "fraud_account"
type = "string"
prompt = "What mule bank account does the BEC email demand payment to?"
answer = "{{fraud_account}}"
hint = "Read payment-change.eml — the new account number"

[[check]]
id = "ai_rag_account"
type = "string"
prompt = "Query the bank's own AI assistant (10.13.10.40 /ask) about the supplier account. What account does its POISONED knowledge base return — and what does matching it to the email tell you?"
answer = "{{fraud_account}}"
hint = "curl http://10.13.10.40:8080/ask -d '{\"question\":\"supplier bank account\"}' — the SAME account = one campaign"

[[check]]
id = "foothold_ip"
type = "string"
prompt = "T+20/T+40: which internal IP is the compromised foothold (privileged login + scanning)?"
answer = "10.13.10.66"
hint = "jq -r '.[].data.srcip // empty' assets/capstone-alerts.json | sort | uniq -c"

[[check]]
id = "web_leaked"
type = "string_any"
prompt = "Recon the finance portal (10.13.10.10). What world-readable DB backup is exposed under /backup/?"
accept = ["db_dump.sql", "/backup/db_dump.sql", "backup/db_dump.sql"]
hint = "gobuster dir -u http://10.13.10.10 -w /usr/share/wordlists/dirb/common.txt ; then curl /backup/"

[[check]]
id = "admin_cracked"
type = "string"
prompt = "Crack the 'admin' MD5 from that dump. What is the plaintext password?"
answer = "{{admin_pw}}"
hint = "hashcat -m 0 <hash> <wordlist>  (the hash is 5f4dcc3b5aa765d61d8327deb882cf99)"

[[check]]
id = "c2_domain"
type = "string_any"
prompt = "From capstone-capture.pcap, what C2 domain is the foothold beaconing to?"
accept = ["{{c2_domain}}"]
hint = "wireshark assets/capstone-capture.pcap  (filter: dns)"

[[check]]
id = "exfil_ip"
type = "string"
prompt = "T+120: what external IP is the data being exfiltrated to?"
answer = "185.220.101.44"
hint = "The exfil alert's dstip, and the large UDP burst in the pcap"

[[check]]
id = "top_level"
type = "numeric"
prompt = "What is the highest Wazuh rule level across the inject sequence?"
answer = 12
hint = "jq '[.[].rule.level] | max' assets/capstone-alerts.json"

[[check]]
id = "deepfake_action"
type = "string_any"
prompt = "T+90: a synthetic executive voicemail orders a wire transfer. What do you do?"
accept = ["callback", "call back", "independent channel", "out-of-band",
          "out of band", "verify on a known number", "pre-established number",
          "independent callback", "refuse and verify"]
hint = "Never action a payment from an out-of-band voice request without independent verification"

[[check]]
id = "containment_first"
type = "string_any"
prompt = "First containment action for the foothold 10.13.10.66?"
accept = ["isolate", "isolate the host", "contain", "quarantine",
          "network isolation", "disconnect", "segment off", "isolate host"]
hint = "Stop the bleeding without destroying evidence — do NOT power it off"

[[check]]
id = "exfil_technique"
type = "string_any"
prompt = "Which MITRE ATT&CK technique covers the data exfiltration?"
accept = ["T1041", "T1567", "T1048"]
hint = "Exfiltration → Exfiltration Over C2 Channel"

[[check]]
id = "ransomware_technique"
type = "string_any"
prompt = "T+145: the database is offline (ransomware). Which ATT&CK technique?"
accept = ["T1486", "data encrypted for impact"]
hint = "Impact → Data Encrypted for Impact"

[[check]]
id = "ai_vuln"
type = "string_any"
prompt = "T+160: the bank's own AI assistant was abused in this campaign. Name the technique/class."
accept = ["prompt injection", "rag poisoning", "rag-poisoning", "indirect prompt injection",
          "llm01", "knowledge base poisoning", "data poisoning"]
hint = "You saw it return a fraudulent account and (if pushed) leak/exfiltrate — OWASP LLM01 / poisoning"

[randomize.fraud_account]
kind = "digits"
length = 10

[randomize.lookalike]
kind = "choice"
choices = ["zennith-supplies.com", "zenith-supplies-gh.com", "zenithsupplies.co", "zenith-supply.net"]

[randomize.c2_domain]
kind = "choice"
choices = ["cdn-sync.ddns-telemetry.net", "telemetry-cdn.ddns.net", "sync-metrics.hopto.org", "update-cdn.myftp.org"]

[randomize.admin_pw]
kind = "choice"
choices = ["password", "123456", "iloveyou", "letmein", "password1", "12345678"]

[randomize.admin_hash]
kind = "md5"
of = "admin_pw"
