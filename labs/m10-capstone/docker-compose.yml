# M10 — Operation Cyber Resilience capstone range.
# Reuses the proven target images from earlier labs (build contexts point at
# the sibling lab dirs so this range is self-sufficient on a fresh machine).
# No ports published to the host LAN.
name: caic-m10

services:
  finance-portal:
    build: ../m4-vulnmgmt/web
    image: caic-m4web:1.0
    environment:
      CAIC_ADMIN_HASH: ${CAIC_ADMIN_HASH:-5f4dcc3b5aa765d61d8327deb882cf99}
    networks: { range: { ipv4_address: 10.13.10.10 } }
    restart: unless-stopped

  records-host:
    build: ../_base
    image: caic-target:1.0
    environment: { SERVICE: ssh, HOSTLABEL: records-host }
    networks: { range: { ipv4_address: 10.13.10.20 } }
    restart: unless-stopped

  ai-assistant:
    build: ../m7-ai-security/sandbox
    image: caic-aisandbox:1.0
    environment:
      CAIC_RAG_ACCOUNT: ${CAIC_FRAUD_ACCOUNT:-9900778100}
    networks: { range: { ipv4_address: 10.13.10.40 } }
    restart: unless-stopped

networks:
  range:
    name: caic_m10_range
    ipam:
      config:
        - subnet: 10.13.10.0/24
          gateway: 10.13.10.1
