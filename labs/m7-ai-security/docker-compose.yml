# M7 — AI security sandbox. A single scripted assistant service.
# No ports published to the host LAN; reachable only on the private range.
name: caic-m7

services:
  ai-sandbox:
    build: ./sandbox
    image: caic-aisandbox:1.0
    environment:
      CAIC_FLAG: ${CAIC_FLAG:-FLAG{pr0mpt_1nj3ction_sh4d0w_ai}}
      CAIC_RAG_ACCOUNT: ${CAIC_RAG_ACCOUNT:-9900778100}
    networks: { range: { ipv4_address: 10.13.7.10 } }
    restart: unless-stopped

networks:
  range:
    name: caic_m7_range
    ipam:
      config:
        - subnet: 10.13.7.0/24
          gateway: 10.13.7.1
