 class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Express a technical threat as a board-ready <strong>business-risk statement</strong>.</li>\n<li>Assess risk qualitatively (likelihood × impact) and <strong>quantify</strong> a top risk in money with <strong>FAIR</strong> (ALE = frequency × magnitude).</li>\n<li>Distinguish <strong>inherent</strong> from <strong>residual</strong> risk, and <strong>appetite</strong> from <strong>tolerance</strong>.</li>\n<li>Choose among the four <strong>treatments</strong> and apply accountable risk acceptance.</li>\n<li>Place controls against the six <strong>NIST CSF 2.0</strong> functions and build a current/target profile.</li>\n<li>Set <strong>RTO/RPO</strong> per critical service and connect risk to resilience.</li>\n<li><strong>Run a risk assessment on a real-shaped case</strong> — critique a draft register, catch the governance failures, and rank by residual.</li>\n<li>Build a risk register with named owners and a 90-day treatment backlog, and brief it to a board on one page.</li>\n</ol></div></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Prerequisites &amp; deliverables</div><div class='callout-b'><p>This module turns Module 1's threat intelligence into institutional decisions. There is a <strong>hands-on, graded case lab</strong> — <code>labctl start m2</code> (the <strong>Sankofa Rural Bank</strong> case pack) — and two written deliverables: a <strong>cyber risk register</strong> and a <strong>CSF 2.0 current/target profile</strong> (<code>labctl worksheet m2</code>).</p></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:25</td><td>Risk as a decision tool; writing board-ready risk statements</td></tr><tr><td>0:25 – 1:00</td><td>Qualitative (5×5) vs quantitative (FAIR); the standards</td></tr><tr><td>1:00 – 1:30</td><td>The four treatments and accountable acceptance</td></tr><tr><td>1:30 – 1:40</td><td>Break</td></tr><tr><td>1:40 – 2:15</td><td>NIST CSF 2.0 functions; current/target profile</td></tr><tr><td>2:15 – 2:40</td><td>Resilience: RTO/RPO and the link to continuity</td></tr><tr><td>2:40 – 3:00</td><td>Running the assessment + board communication</td></tr><tr><td>Lab</td><td>The Sankofa Rural Bank case (<code>labctl start m2</code>) + the register &amp; CSF deliverables</td></tr></tbody></table></div>\n<hr>\n<h2>1 · Risk Is a Decision Tool, Not a Feeling</h2>\n<p>A <strong>risk</strong> combines how <em>likely</em> a harmful event is with how <em>badly</em> it would hurt. The purpose of assessing it is singular: <strong>to decide where to spend finite money and attention first.</strong> You cannot fix everything, so you rank.</p>\n<p>Write every risk as a sentence a non-technical director understands:</p>\n<blockquote>IF <em>[a threat]</em> exploits <em>[a vulnerability]</em>, THEN the institution suffers</blockquote>\n<blockquote><em>[a business consequence]</em>.</blockquote>\n<p>For example: <em>IF an attacker exploits our unpatched internet-facing VPN, THEN citizen records are stolen and we face DPC penalties, breach-notification costs and loss of public trust.</em> The consequence is money, law and trust — not \"a box gets owned\". <strong>Boards fund consequences they can see.</strong></p>\n<p>The vocabulary auditors expect you to use precisely:</p>\n<ul>\n<li><strong>Threat</strong> (the actor/event) · <strong>vulnerability</strong> (the weakness) · <strong>likelihood</strong> · <strong>impact</strong>.</li>\n<li><strong>Inherent risk</strong> — exposure with <em>no</em> controls. <strong>Residual risk</strong> — what remains <em>after</em> controls. The gap is the value your controls deliver.</li>\n<li><strong>Risk appetite</strong> — how much risk the organisation is <em>willing</em> to take to pursue its goals. <strong>Risk tolerance</strong> — the acceptable variation around that appetite for a specific risk.</li>\n<li><strong>Risk owner</strong> — the single named person accountable for a risk.</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Name the property first</div><div class='callout-b'><p>Before scoring anything, state which of Module 1's five security properties the risk threatens (confidentiality, integrity, availability, authenticity, continuity). It focuses the whole assessment — a confidentiality risk and an availability risk need different controls and different consequences.</p></div></div>\n<hr>\n<h2>2 · How Risk Assessment Actually Works</h2>\n<p>The common method is <strong>qualitative</strong>: score likelihood and impact (say 1–5), multiply or plot on a 5×5 heat map, and rank. It is fast and communicates to a board. Its weakness is false precision — \"a 15\" feels exact but is a judgement. Tie every score to <strong>evidence</strong>: a scan result, a past incident, a missing control, a threat-intel report (Module 1).</p>\n<div class='tablewrap'><table><thead><tr><th></th><th><strong>1 Negligible</strong></th><th><strong>2 Minor</strong></th><th><strong>3 Moderate</strong></th><th><strong>4 Major</strong></th><th><strong>5 Severe</strong></th></tr></thead><tbody><tr><td><strong>5 Almost certain</strong></td><td>5</td><td>10</td><td>15</td><td>20</td><td>25</td></tr><tr><td><strong>4 Likely</strong></td><td>4</td><td>8</td><td>12</td><td>16</td><td>20</td></tr><tr><td><strong>3 Possible</strong></td><td>3</td><td>6</td><td>9</td><td>12</td><td>15</td></tr><tr><td><strong>2 Unlikely</strong></td><td>2</td><td>4</td><td>6</td><td>8</td><td>10</td></tr><tr><td><strong>1 Rare</strong></td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></tbody></table></div>\n<p>Where decisions are large (a multi-million-cedi control, cyber-insurance limits), professionals add <strong>quantitative</strong> analysis. <strong>FAIR</strong> (Factor Analysis of Information Risk) decomposes risk into loss-event <em>frequency</em> and <em>magnitude</em> and expresses it in money with ranges — e.g. \"annual loss exposure: GHS 0.4M–3.1M, most likely 1.2M\". That lets a board compare a security spend against the loss it avoids, like any other investment. The public standards behind all of this are <strong>NIST SP 800-30</strong> (risk assessment), <strong>ISO/IEC 27005</strong> (information-risk management) and <strong>ISO 31000</strong> (enterprise risk).</p>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Qualitative vs quantitative — when to use which</div><div class='callout-b'><p>Use the <strong>5×5 heat map</strong> to triage the whole register quickly and communicate to the board. Reach for <strong>FAIR</strong> on the two or three biggest decisions, where turning risk into a cedi range justifies (or kills) a large spend.</p></div></div>\n<h3>2.1 A worked FAIR quantification</h3>\n<p>A heat-map \"16\" doesn't tell a board how much to spend. <strong>FAIR</strong> turns a risk into money by decomposing it into two things you <em>can</em> estimate, then multiplying:</p>\n<p><strong>Annual Loss Exposure (ALE) = Loss Event Frequency (LEF) × Loss Magnitude (LM).</strong></p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 620 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <g text-anchor=\"middle\" font-size=\"11\">\n    <rect x=\"200\" y=\"12\" width=\"220\" height=\"42\" rx=\"6\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <text x=\"310\" y=\"30\" fill=\"currentColor\" font-weight=\"bold\">Annual Loss Exposure</text>\n    <text x=\"310\" y=\"46\" fill=\"currentColor\" font-size=\"9\">GHS per year</text>\n    <rect x=\"60\"  y=\"96\" width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"160\" y=\"116\" fill=\"currentColor\" font-weight=\"bold\">Loss Event Frequency</text>\n    <text x=\"160\" y=\"131\" fill=\"currentColor\" font-size=\"9\">how often per year (e.g. 2×)</text>\n    <rect x=\"360\" y=\"96\" width=\"200\" height=\"46\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"460\" y=\"116\" fill=\"currentColor\" font-weight=\"bold\">Loss Magnitude</text>\n    <text x=\"460\" y=\"131\" fill=\"currentColor\" font-size=\"9\">GHS per event</text>\n    <rect x=\"360\" y=\"160\" width=\"200\" height=\"40\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/>\n    <text x=\"460\" y=\"177\" fill=\"currentColor\" font-size=\"9.5\">primary (funds, recovery)</text>\n    <text x=\"460\" y=\"191\" fill=\"currentColor\" font-size=\"9.5\">+ secondary (fines, trust)</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.3\">\n    <line x1=\"260\" y1=\"54\" x2=\"175\" y2=\"94\"/><line x1=\"360\" y1=\"54\" x2=\"445\" y2=\"94\"/>\n    <line x1=\"460\" y1=\"142\" x2=\"460\" y2=\"158\"/>\n    <text x=\"300\" y=\"80\" font-size=\"14\" font-weight=\"bold\" fill=\"currentColor\">×</text>\n  </g>\n</svg></div><figcaption>FAIR, decomposed — estimate the parts, then multiply up</figcaption></figure>\n<p><strong>Worked example — Sankofa Rural Bank's BEC fraud risk.</strong> The team estimates, from the near-miss and peer data, that a <em>successful</em> fraudulent payment would happen about <strong>twice a year</strong> (LEF = 2). Each event averages <strong>GHS 600,000</strong> of diverted funds plus <strong>GHS 300,000</strong> of investigation, recovery and regulatory cost — <strong>LM ≈ GHS 900,000</strong>. So:</p>\n<blockquote><strong>ALE = 2 × GHS 900,000 = GHS 1,800,000 per year</strong> (most likely), modelled as a</blockquote>\n<blockquote><em>range</em> — say GHS 0.4M (one small event) to GHS 6M (a bad year) — because every</blockquote>\n<blockquote>input is an estimate, not a fact.</blockquote>\n<p>Now the board can compare: a <strong>GHS 150,000</strong> dual-control + callback programme against a <strong>GHS 1.8M/year</strong> exposure is an obvious yes. That is the power of quantification — it converts \"that feels risky\" into an investment decision. Note FAIR never claims false precision: it always carries a <strong>range</strong>, and you state your confidence.</p>\n<hr>\n<h2>3 · The Four Treatments</h2>\n<p>Memorise them, because an auditor will ask which you chose and why:</p>\n<ul>\n<li><strong>Mitigate</strong> — add controls to cut likelihood or impact (patch, MFA, backups, segmentation).</li>\n<li><strong>Transfer</strong> — shift the cost (cyber insurance, a contractual indemnity). Note: it shifts <em>financial</em> cost, not the operational disruption or the reputational harm.</li>\n<li><strong>Avoid</strong> — stop the risky activity (decommission the exposed service, end the data collection).</li>\n<li><strong>Accept</strong> — knowingly live with it — <strong>only</strong> with a named owner and a review date.</li>\n</ul>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Acceptance without accountability is negligence</div><div class='callout-b'><p>Every accepted risk needs a <strong>named owner</strong> and a <strong>review date</strong>, recorded in the register. \"We decided to accept it\" with no name and no date is not a decision — it is an unmanaged exposure that a regulator will treat as negligence.</p></div></div>\n<hr>\n<h2>4 · NIST CSF 2.0 — The Control Map Boards Answer To</h2>\n<p>Controls are organised against six functions. CSF 2.0 (2024) added <strong>GOVERN</strong> at the centre, and that is the headline: cybersecurity is now explicitly a <strong>board-level accountability</strong>, not a task delegated to \"the IT person\".</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"40 0 390 290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <g stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"0.55\">\n    <line x1=\"230\" y1=\"150\" x2=\"230\" y2=\"45\"/>  <line x1=\"230\" y1=\"150\" x2=\"330\" y2=\"118\"/>\n    <line x1=\"230\" y1=\"150\" x2=\"292\" y2=\"235\"/> <line x1=\"230\" y1=\"150\" x2=\"168\" y2=\"235\"/>\n    <line x1=\"230\" y1=\"150\" x2=\"130\" y2=\"118\"/>\n  </g>\n  <g text-anchor=\"middle\">\n    <circle cx=\"230\" cy=\"150\" r=\"48\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.22\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n    <text x=\"230\" y=\"148\" font-size=\"13\" font-weight=\"bold\" fill=\"currentColor\">GOVERN</text>\n    <text x=\"230\" y=\"162\" font-size=\"8\" fill=\"currentColor\" opacity=\"0.85\">board duty</text>\n    <circle cx=\"230\" cy=\"45\"  r=\"37\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"230\" y=\"49\" font-size=\"11\" fill=\"currentColor\">IDENTIFY</text>\n    <circle cx=\"330\" cy=\"118\" r=\"37\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"330\" y=\"122\" font-size=\"11\" fill=\"currentColor\">PROTECT</text>\n    <circle cx=\"292\" cy=\"235\" r=\"37\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"292\" y=\"239\" font-size=\"11\" fill=\"currentColor\">DETECT</text>\n    <circle cx=\"168\" cy=\"235\" r=\"37\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"168\" y=\"239\" font-size=\"11\" fill=\"currentColor\">RESPOND</text>\n    <circle cx=\"130\" cy=\"118\" r=\"37\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"130\" y=\"122\" font-size=\"11\" fill=\"currentColor\">RECOVER</text>\n  </g>\n</svg></div><figcaption>NIST CSF 2.0 — five functions around GOVERN at the centre</figcaption></figure>\n<div class='tablewrap'><table><thead><tr><th>Function</th><th>Plain meaning</th><th>Example for a Ghanaian institution</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Accountability, strategy, policy, risk appetite</td><td>Board approves the cyber-risk policy and budget; CISO has authority</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Know your assets, data, dependencies and risks</td><td>A current asset inventory exists; crown-jewel data documented</td></tr><tr><td><strong>PROTECT</strong></td><td>Deploy safeguards</td><td>MFA on all accounts; patching; email filtering; staff trained</td></tr><tr><td><strong>DETECT</strong></td><td>Notice when something's wrong</td><td>SIEM running; alerts reviewed daily</td></tr><tr><td><strong>RESPOND</strong></td><td>Act on an incident</td><td>A tested plan; the team knows who calls whom</td></tr><tr><td><strong>RECOVER</strong></td><td>Restore and improve</td><td>Backups tested monthly; lessons from incidents applied</td></tr></tbody></table></div>\n<p>A <strong>current/target profile</strong> rates the institution against each function today (0–4 maturity) and sets a realistic target — the gap list becomes your plan.</p>\n<hr>\n<h2>5 · Resilience — RTO, RPO and the Link to Continuity</h2>\n<p>Risk treatment reduces the chance and cost of harm; <strong>resilience</strong> is the ability to keep running and recover when harm lands anyway. Two numbers, agreed with the business per critical service, drive it:</p>\n<ul>\n<li><strong>RTO</strong> (Recovery Time Objective) — the maximum acceptable <em>downtime</em> before real harm. Sometimes expressed as <strong>MTD</strong> (Maximum Tolerable Downtime).</li>\n<li><strong>RPO</strong> (Recovery Point Objective) — the maximum acceptable <em>data loss</em>, i.e. how far back your last good backup is. Sometimes expressed as <strong>MADL</strong> (Maximum Acceptable Data Loss).</li>\n</ul>\n<p>These are <strong>business decisions</strong>, not IT guesses, and they feed the Business Impact Analysis and recovery priorities you build in Module 9.</p>\n<hr>\n<h2>6 · Scenarios — Risk Owned, and Risk Ignored</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>CSSPS disruption, 2022 (~500,000 students)</div><div class='callout-b'><p>As institutional risk: the <em>likelihood</em> of a targeted attack on a high-visibility national system was real and knowable; the <em>impact</em> — half a million families unable to confirm placements — was severe across availability, reputation and public trust. The governing questions were owed <em>before</em> the event: Who owned this risk? Was there an RTO for the service? Was recovery tested? A risk register forces those answers in advance. Under <strong>Act 1038</strong> the CSA can request your risk documentation — a current, owned register is something a regulator may demand to see.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Equifax, 2017 (147M+ people) — negligent acceptance</div><div class='callout-b'><p>A <em>known</em> vulnerability in Apache Struts (CVE-2017-5638) had a patch available for months. The risk was identifiable and treatable — and effectively <em>accepted by inaction</em>, with no owner. This is what \"acceptance without accountability\" looks like at scale.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Maersk / NotPetya, 2017 (~US$300M) — resilience saved them</div><div class='callout-b'><p>A destructive worm halted the world's largest shipping line. Survival hinged on a single surviving domain-controller backup (offline, by chance, in a Ghana office). The lesson boards now cite: <strong>tested recovery (RTO/RPO) is not optional</strong>, and luck is not a strategy.</p></div></div>\n<p>The pattern: organisations rarely fail because a risk was <em>unknown</em>. They fail because a known risk had <strong>no owner and no treatment</strong>.</p>\n<hr>\n<h2>7 · Running the Assessment in Practice</h2>\n<p>A risk assessment is not a spreadsheet filled in alone at a desk — it is a <strong>facilitated workshop</strong> that turns scattered knowledge into ranked decisions.</p>\n<p><strong>Who is in the room.</strong> The risk owner/facilitator (you), someone who knows the <em>business</em> (operations, finance), someone who knows the <em>systems</em> (IT), and — for the sign-off — someone with <em>authority to accept risk</em> (an executive). Cyber risk lives at the intersection of all three; none of them can do it alone.</p>\n<p><strong>The inputs you bring.</strong> Your Module 1 threat intelligence (who would attack and how), an <strong>asset inventory</strong> (what matters, and how critical), <strong>incident history and near-misses</strong> (evidence for <em>likelihood</em>), and any <strong>external assessment</strong> — a pen-test or audit (evidence for <em>vulnerability</em>). Opinions without these are guesses.</p>\n<p><strong>The five steps, in the room:</strong></p>\n<ol>\n<li><strong>Identify</strong> — list the risks as IF/THEN business statements; name the security property each threatens.</li>\n<li><strong>Score inherent</strong> — L × I with <em>no</em> controls, each score tied to a piece of evidence you just listed (\"3 staff fell for the last phish\" → likelihood is not a 1).</li>\n<li><strong>Credit controls → residual</strong> — only count a control if it genuinely lowers L or I. If the residual equals the inherent, the \"control\" is theatre.</li>\n<li><strong>Treat &amp; assign</strong> — pick mitigate / transfer / avoid / accept, name a single <strong>owner</strong>, set a <strong>review date</strong>. Quantify the top two or three with <strong>FAIR</strong>.</li>\n<li><strong>Rank &amp; schedule</strong> — sort by <strong>residual</strong> rating; the top items become the <strong>90-day treatment backlog</strong> leadership funds.</li>\n</ol>\n<h3>7.1 Communicating it to the board</h3>\n<p>A board does not read a 40-row register. It acts on a <strong>risk-on-a-page</strong>:</p>\n<ul>\n<li>the <strong>top 5 risks by residual</strong>, each as one business sentence + the decision asked;</li>\n<li>the <strong>two or three FAIR numbers</strong> (exposure in GHS vs the cost to reduce it);</li>\n<li>the <strong>heat map</strong> so directors see the shape at a glance;</li>\n<li>a short list of <strong>accepted</strong> risks (each with its owner) — so acceptance is a conscious board act, not a silent omission.</li>\n</ul>\n<p>Directors will ask three things, so have the answers ready: <em>\"What is our biggest exposure in cedis?\"</em>, <em>\"Who owns it?\"</em>, and <em>\"What do you need from us?\"</em> If your register can't answer those in one page, it isn't finished.</p>\n<h3>7.2 The register itself (your deliverable)</h3>\n<p>Every row carries: the <strong>IF/THEN statement</strong>, an <strong>inherent</strong> score (L×I), the <strong>controls</strong> in place or planned, a <strong>residual</strong> score, a <strong>treatment</strong>, a named <strong>owner</strong>, and a <strong>review date</strong>. Top risks by residual are acted on first; gaps map to the six CSF functions; actions become the 90-day backlog.</p>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Worked example (one row)</div><div class='callout-b'><p><em>IF an attacker exploits our unpatched remote-access service (no MFA), THEN citizen records are exfiltrated and we face DPC penalties and public-trust loss.</em> — Inherent <strong>4×5 = 20</strong>; controls: patch SLA + MFA + monitoring; Residual <strong>2×5 = 10</strong>; Treatment <strong>Mitigate</strong>; Owner <strong>Head of IT</strong>; Review <strong>2026-01-15</strong>. The full eight-entry model is in <code>labctl worksheet m2</code>.</p></div></div>\n<hr>\n<h2>8 · Do It — the Sankofa Rural Bank case</h2>\n<p>This module has a <strong>hands-on, graded case lab</strong>. You are handed a real-shaped case pack for <strong>Sankofa Rural Bank</strong> — its assets, a year of incidents, a pen-test, a FAIR estimate, and a <strong>draft register with planted governance failures</strong> — and you must triage it into a board-ready risk picture: find the crown jewels, score the exposure against evidence, <strong>catch the negligent acceptance and the ineffective control in the draft</strong>, read the RTO gap, and map controls to CSF 2.0.</p>\n<figure class='fig'><pre class='fig-ascii'>  labctl start m2   →   read casefile.md + draft-risk-register.md\n                    →   labctl verify m2   (17 graded checks)\n                    →   labctl worksheet m2   (write the register + CSF profile)</pre><figcaption>How to run the M2 case lab</figcaption></figure>\n<p>Your case figures are <strong>randomised to you</strong>, so the analysis is your own. Launch it from the <strong>Labs</strong> view in the app, or:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the Module 2 practical</span></div><pre><code>labctl start m2        # personalises your case pack (file-based — nothing to boot)\nlabctl verify m2       # grade your analysis\nlabctl worksheet m2    # build the register + CSF profile deliverables</code></pre></div>\n<hr>\n<h2>Key takeaways</h2>\n<ul>\n<li>Cyber risk = <strong>likelihood × impact</strong>, written as a <strong>business consequence</strong>.</li>\n<li><strong>Inherent → residual</strong>; the gap is your controls' value. Use <strong>FAIR</strong> to put big decisions in money.</li>\n<li>Four treatments: <strong>mitigate, transfer, avoid, accept</strong> — accept only with an owner + date.</li>\n<li><strong>NIST CSF 2.0</strong>'s six functions; <strong>GOVERN</strong> makes cyber a board duty.</li>\n<li>Set <strong>RTO</strong> (downtime) and <strong>RPO</strong> (data loss) per critical service.</li>\n<li>A register without <strong>named owners</strong> is a wish list.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>Rewrite as a risk statement: \"the payroll server hasn't been patched in a year.\"</strong> → <em>IF an attacker exploits the unpatched payroll server, THEN staff salary data is exposed and we face DPC penalties and payroll disruption.</em></li>\n</ol>\n<ol>\n<li><strong>Risk A scores 2×5, risk B scores 4×2 — both ≈10. Which gets attention, and why isn't the number enough?</strong> → Judgement: a catastrophic-but-rare impact (A, impact 5) often wins because the <em>consequence</em> is unacceptable even if unlikely. The score ranks; it does not decide.</li>\n</ol>\n<ol>\n<li><strong>You buy cyber insurance for a risk — which treatment, and what does it NOT fix?</strong> → Transfer — it shifts financial cost but not the operational disruption or reputational harm, so it is rarely sufficient alone.</li>\n</ol>\n<ol>\n<li><strong>Which NIST CSF 2.0 function is new in 2.0, and what does it signal?</strong> → GOVERN — cybersecurity accountability sits with the board.</li>\n</ol>\n<ol>\n<li><strong>Equifax had a patch available for the vulnerability that breached it. In risk terms, what went wrong?</strong> → A known, treatable risk was effectively <em>accepted by inaction</em> — no owner, no treatment, no review. Negligent acceptance.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Inherent / residual risk</strong> — exposure before / after controls.</li>\n<li><strong>Risk appetite / tolerance</strong> — risk the organisation will take / acceptable variation on a specific risk.</li>\n<li><strong>FAIR</strong> — quantitative model expressing exposure in money.</li>\n<li><strong>NIST SP 800-30 / ISO 27005 / ISO 31000</strong> — risk-assessment / information-risk / enterprise-risk standards.</li>\n<li><strong>NIST CSF 2.0</strong> — Govern, Identify, Protect, Detect, Respond, Recover.</li>\n<li><strong>RTO / RPO (MTD / MADL)</strong> — max downtime / max data loss per service.</li>\n<li><strong>Risk owner</strong> — the one person accountable for a specific risk.</li>\n</ul>\n<h2>Further reading</h2>\n<ul>\n<li>NIST SP 800-30 Rev.1 — <em>Guide for Conducting Risk Assessments</em></li>\n<li>NIST Cybersecurity Framework 2.0 — nist.gov/cyberframework</li>\n<li>The Open Group — <em>FAIR</em> risk-quantification standard</li>\n<li>ISO/IEC 27005 and ISO 31000 — risk-management standards</li>\n<li>Ghana Cyber Security Authority — csa.gov.gh</li>\n</ul>", "sheets": [{"name": "m2-csf-profile.md", "html": "<h1>NIST CSF 2.0 Current / Target Profile — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>Rate your institution against each of the six CSF 2.0 functions on a 0–4</blockquote>\n<blockquote>maturity scale, then set a realistic target and note the gap action. See</blockquote>\n<blockquote><code>labctl learn m2</code>.</blockquote>\n<p>Maturity scale: <strong>0</strong> none · <strong>1</strong> ad-hoc · <strong>2</strong> developing · <strong>3</strong> defined &amp; repeatable · <strong>4</strong> managed &amp; measured.</p>\n<div class='tablewrap'><table><thead><tr><th>Function</th><th>What good looks like</th><th>Current (0–4)</th><th>Target (0–4)</th><th>Priority gap action</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Board-approved cyber policy, risk appetite, named accountability &amp; budget</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Current asset inventory; risks &amp; dependencies documented</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>PROTECT</strong></td><td>MFA everywhere, patching, email filtering, staff training</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>DETECT</strong></td><td>SIEM/monitoring, alerts reviewed daily, anomaly detection</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RESPOND</strong></td><td>Tested incident plan, defined roles, escalation paths</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RECOVER</strong></td><td>Backups tested monthly (3-2-1), recovery priorities set</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr></tbody></table></div>\n<h2>Narrative summary (3–5 sentences for leadership)</h2>\n<p>[Where is the institution strongest and weakest? Which function, if improved, reduces the most risk? What is the single most important investment?]</p>\n<h2>The honest GOVERN check</h2>\n<ul>\n<li>Does the board have a standing cybersecurity agenda item? [yes/no]</li>\n<li>Is there a named, resourced person accountable for cyber risk? [who]</li>\n<li>When was the cyber-risk policy last approved? [date]</li>\n</ul>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<div class='tablewrap'><table><thead><tr><th>Function</th><th>Current (0–4)</th><th>Target</th><th>Priority gap action</th></tr></thead><tbody><tr><td>GOVERN</td><td>1</td><td>3</td><td>Add a standing board cyber agenda item; name an accountable executive; approve the cyber-risk policy</td></tr><tr><td>IDENTIFY</td><td>2</td><td>3</td><td>Complete the asset inventory; document crown-jewel data and third-party dependencies</td></tr><tr><td>PROTECT</td><td>1</td><td>3</td><td>MFA on all remote access; enforce patch SLA; roll out phishing training</td></tr><tr><td>DETECT</td><td>1</td><td>3</td><td>Stand up centralised logging; review alerts daily</td></tr><tr><td>RESPOND</td><td>1</td><td>3</td><td>Write and table-top an incident-response plan; define escalation</td></tr><tr><td>RECOVER</td><td>2</td><td>4</td><td>Move one backup offline (3-2-1); test restores monthly</td></tr></tbody></table></div>\n<p><strong>Narrative:</strong> GOVERN and DETECT are weakest. Fixing GOVERN (board ownership) unlocks the budget for the rest; standing up DETECT gives the earliest warning. Single most important investment: <strong>MFA everywhere</strong>, which most reduces credential-theft risk.</p>"}, {"name": "m2-cyber-risk-register.md", "html": "<h1>Cyber Risk Register — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Review cycle:</strong> [e.g. quarterly]</p>\n<blockquote>How to use this. Fill in at least <strong>eight</strong> risks. Write each as an IF/THEN</blockquote>\n<blockquote>statement in business terms. Score <strong>Likelihood (L)</strong> and <strong>Impact (I)</strong> 1–5.</blockquote>\n<blockquote><strong>Inherent</strong> = score with no controls; <strong>Residual</strong> = score after the controls</blockquote>\n<blockquote>you list. Every risk needs a named <strong>Owner</strong>, a <strong>Treatment</strong> (Mitigate /</blockquote>\n<blockquote>Transfer / Avoid / Accept) and a <strong>Review date</strong>. See <code>labctl learn m2</code>.</blockquote>\n<p>Scoring key — Likelihood: 1 rare · 2 unlikely · 3 possible · 4 likely · 5 almost certain. Impact: 1 negligible · 2 minor · 3 moderate · 4 major · 5 severe. Rating = L × I (1–25).</p>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Risk statement (IF threat exploits vulnerability THEN business consequence)</th><th>Inherent L×I</th><th>Existing / planned controls</th><th>Residual L×I</th><th>Treatment</th><th>Owner</th><th>Review</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> IF an attacker exploits our internet-facing unpatched VPN THEN citizen records are stolen and we face DPC penalties + loss of trust</td><td>4×5 = 20</td><td>Patch SLA, MFA on VPN, monitoring</td><td>2×5 = 10</td><td>Mitigate</td><td>Head of IT</td><td>2026-01-15</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>8</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Top 3 risks by residual rating (what leadership must act on first)</h2>\n<ol>\n<li>[risk # and one line on the decision needed]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>Accepted risks (must have owner + review date)</h2>\n<ul>\n<li>[risk # — why it is being accepted, by whom, review date] — <em>acceptance without accountability is negligence.</em></li>\n</ul>\n<h2>90-day treatment backlog</h2>\n<div class='tablewrap'><table><thead><tr><th>Action</th><th>Addresses risk #</th><th>Owner</th><th>Target date</th><th>Cost / effort</th></tr></thead><tbody><tr><td>[FILL IN]</td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Quantify your top risk in money (FAIR)</h2>\n<p>Pick your #1 risk and turn it into an annual loss exposure a board can weigh against a spend. <strong>ALE = Loss Event Frequency × Loss Magnitude.</strong></p>\n<ul>\n<li>Risk chosen: [ ]</li>\n<li>Loss Event Frequency (how many successful events per year): [ ]</li>\n<li>Loss Magnitude per event (GHS): primary [funds/recovery] + secondary [fines/trust] = [ ]</li>\n<li><strong>Annual Loss Exposure (ALE) = GHS [ ]</strong> (most likely), range GHS [ ] – [ ]</li>\n<li>Cost of the control that reduces it: GHS [ ] → <strong>is the spend justified?</strong> [yes/no, why]</li>\n</ul>\n<blockquote>You can do this exercise on the <strong>Sankofa Rural Bank</strong> case (<code>labctl start m2</code>)</blockquote>\n<blockquote>or on your own institution.</blockquote>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Risk statement</th><th>Inherent L×I</th><th>Controls</th><th>Residual L×I</th><th>Treatment</th><th>Owner</th><th>Review</th></tr></thead><tbody><tr><td>1</td><td>IF an attacker exploits our internet-facing VPN (no MFA) THEN member records are stolen → DPC penalties + trust loss</td><td>4×5=20</td><td>Patch SLA, MFA, DNS monitoring</td><td>2×5=10</td><td>Mitigate</td><td>Head of IT</td><td>2026-01-15</td></tr><tr><td>2</td><td>IF a finance officer actions a spoofed supplier email THEN funds are wired to a mule account</td><td>4×4=16</td><td>Dual-control + callback on known number</td><td>2×4=8</td><td>Mitigate</td><td>CFO</td><td>2026-01-31</td></tr><tr><td>3</td><td>IF ransomware encrypts the core banking server AND backups THEN multi-day outage + data loss</td><td>3×5=15</td><td>3-2-1 backups, monthly restore test, segmentation</td><td>2×4=8</td><td>Mitigate</td><td>Head of IT</td><td>2026-02-15</td></tr><tr><td>4</td><td>IF a laptop with member PII is lost unencrypted THEN confidentiality breach + notification</td><td>3×3=9</td><td>Full-disk encryption, remote wipe</td><td>1×3=3</td><td>Mitigate</td><td>Ops Manager</td><td>2026-02-28</td></tr></tbody></table></div>\n<p><strong>Top 3 by residual:</strong> #1 (fund the MFA rollout now), #2 (mandate callback before the next payment run), #3 (verify the restore test).</p>\n<p><strong>Accepted risk:</strong> #5 — legacy reporting tool cannot support MFA; compensating control = IP allow-list; accepted by <strong>CFO</strong>, review <strong>2026-03-31</strong>.</p>\n<p><strong>90-day backlog:</strong> MFA on VPN (IT, wk 2) · dual-control payment policy (CFO, wk 3) · first monthly restore test (IT, wk 4) · laptop encryption rollout (Ops, wk 8).</p>"}]}, "m3": {"day": 2, "title": "Module 3 — Network Compromise Investigation", "lesson": "<h1>Module 3 — Network Compromise Investigation</h1>\n<p><strong>Day 2 · Morning Session · ~4 hours · Hands-on lab: <code>labctl start m3</code></strong></p>\n<p>A network breach is almost never a single dramatic event. It is a chain of small, quiet steps — a scan, an exposed service, a stolen credential, a process that checks in with its operator every thirty seconds — and the defender's job is to read that chain from the evidence it leaves behind. This module turns you from someone who <em>knows</em> a network is \"computers talking\" into someone who can open a live subnet, a packet capture and a compromised host's connection table, and say with evidence: <em>this host is infected, it was reached through that exposed service, it is talking to that controller, and here are the four controls that would have stopped it.</em></p>\n<p>The module runs on two registers at once, like the rest of the programme. The first is <strong>conceptual</strong> — how networks are structured, why attacks and defences live at specific layers, and the architectural ideas (defence in depth, Zero Trust, segmentation, strong identity) that decide whether a small foothold stays small or becomes a national headline. The second is <strong>practical</strong> — the three instruments every network investigator lives on: <strong>Nmap</strong> (with its scripting engine) to see what is exposed, <strong>Wireshark/tcpdump</strong> to read what is being said on the wire, and the humble <strong>netstat</strong> to interrogate a suspect host. Both registers are treated with equal rigour, because an analyst who can run the tools but cannot reason about architecture produces findings nobody can act on.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Explain a network as layered conversations (OSI and TCP/IP) and locate an attack or control at the correct layer.</li>\n<li>Enumerate a subnet with <strong>Nmap</strong> — host discovery, service/version detection, port ranges — and read the output critically.</li>\n<li>Use the <strong>Nmap Scripting Engine (NSE)</strong> to test specific weaknesses (e.g. <code>ftp-anon</code>, <code>http-title</code>).</li>\n<li>Analyse a packet capture in <strong>Wireshark/tcpdump</strong>: apply display filters, follow a TCP stream, and recover cleartext credentials.</li>\n<li>Identify <strong>command-and-control (C2) beaconing</strong> from timing regularity and explain why DNS is the favoured channel.</li>\n<li>Read a host's connection table (<strong>netstat</strong>): distinguish <code>LISTEN</code> from <code>ESTABLISHED</code>, and spot a process <strong>masquerading</strong> as a system service.</li>\n<li><strong>Correlate</strong> three independent evidence sources — scan, capture, host table — into one coherent compromise narrative.</li>\n<li>Choose the right <strong>Nmap scan type, timing and output</strong> for the job, and drive <strong>Wireshark</strong> like an analyst (display filters, Statistics, Follow Stream, the beacon workflow).</li>\n<li>Explain enterprise <strong>identity</strong> (Active Directory, Kerberos), how attackers steal credentials and move <strong>laterally</strong> (pass-the-hash, SMB/RDP/WinRM), and the <strong>tiering/PAM</strong> controls that stop them.</li>\n<li><strong>Engineer detection</strong> for each stage of the attack — DNS query logging, an IDS/Suricata rule, NetFlow, EDR — the blue-team view.</li>\n<li>Map the full chain to <strong>MITRE ATT&amp;CK</strong> and design a prioritised set of controls — segmentation, Zero Trust, phishing-resistant MFA, PAM, DNS monitoring — that close each proven gap.</li>\n<li>State the legal boundary (Cybersecurity Act 2020, Act 1038) that governs when scanning is lawful.</li>\n</ol></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:25</td><td>A network is conversations: layers, ports, protocols — and why the layer tells you the control</td></tr><tr><td>0:25 – 1:05</td><td>Nmap deep dive: host discovery → service detection → NSE, quiet to loud, reading output</td></tr><tr><td>1:05 – 1:50</td><td>Traffic analysis: capture vs display filters, following streams, cleartext credentials</td></tr><tr><td>1:50 – 2:05</td><td>Break</td></tr><tr><td>2:05 – 2:35</td><td>C2 beaconing: timing, jitter, and why ~90% of malware uses DNS</td></tr><tr><td>2:35 – 3:05</td><td>Endpoint evidence: netstat, LISTEN vs ESTABLISHED, masquerading processes</td></tr><tr><td>3:05 – 3:25</td><td>Identity &amp; lateral movement: AD/Kerberos, pass-the-hash, tiering &amp; PAM</td></tr><tr><td>3:25 – 3:45</td><td>Defensive architecture + the blue-team view: how each stage is detected</td></tr><tr><td>3:45 – 4:15</td><td>Lab: <code>labctl start m3</code> — the three-source investigation and debrief</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> skim the Nmap reference (<code>man nmap</code>) and Wireshark's \"Follow TCP Stream\" help. <strong>Lab requirement:</strong> a Kali terminal (the built-in <strong>Terminal</strong> tab) with <code>nmap</code>, <code>wireshark</code>/<code>tcpdump</code> and Docker running. <strong>Assessment:</strong> your lab submission — the <em>Traffic Analysis Findings &amp; Control Design</em> brief (<code>labctl worksheet m3</code>) — counts toward the Module 3 practical grade. <strong>The rule:</strong> every target IP in this lab is on <code>10.13.3.0/24</code>. Scan those and <strong>only</strong> those.</p></div></div>\n<hr>\n<h2>1 · A Network Is Conversations</h2>\n<h3>1.1 Ports, protocols and layers</h3>\n<p>Every network is computers having conversations. Each conversation uses a <strong>port</strong> — a numbered door on a host (there are 65,535 of them per protocol) — and a <strong>protocol</strong> — the language spoken through that door. Web traffic uses TCP port 80 (HTTP) or 443 (HTTPS); SSH uses 22; FTP uses 21; Windows remote desktop (RDP) uses 3389; DNS uses UDP/TCP 53. When you hear \"an exposed service\", it means a door is open to people who should not be able to reach it.</p>\n<p>Two models organise this traffic into <strong>layers</strong>. The academic <strong>OSI</strong> model has seven; the practical <strong>TCP/IP</strong> stack has four. You do not need to recite them, but you must grasp the single idea that makes them useful to an investigator: <em>attacks and defences each live at a specific layer, and naming the layer tells you which control applies.</em></p>\n<div class='tablewrap'><table><thead><tr><th>Layer (TCP/IP)</th><th>What lives here</th><th>Example attack</th><th>Example control</th></tr></thead><tbody><tr><td>Application</td><td>HTTP, DNS, FTP, SSH</td><td>C2 over DNS; cleartext FTP credentials</td><td>DNS monitoring; encryption (SSH/HTTPS)</td></tr><tr><td>Transport</td><td>TCP/UDP ports</td><td>Port scanning; port-based backdoor</td><td>Host firewall; least-exposure</td></tr><tr><td>Internet</td><td>IP addresses, routing</td><td>IP spoofing; lateral movement</td><td>Segmentation; ACLs</td></tr><tr><td>Link</td><td>MAC addresses, the local wire</td><td>ARP spoofing; rogue device</td><td>802.1X; port security</td></tr></tbody></table></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The investigator&#x27;s reflex</div><div class='callout-b'><p>Name the <strong>layer</strong> and you have narrowed the <strong>control</strong>. A port scan is a transport-layer event — the answer is least-exposure and a host firewall. A C2 lookup is an application-layer event — the answer is DNS monitoring. Train yourself to locate every finding on this table before recommending a fix.</p></div></div>\n<h3>1.2 The attacker's first question</h3>\n<p>An intruder's opening move on any network is blunt: <strong>which doors are open, and what is standing behind them?</strong> They scan, they fingerprint the services, they look for the one that is unauthenticated, unencrypted, or years out of date. Your job is to answer that question about your <em>own</em> estate — continuously — before someone else answers it about you. The uncomfortable truth in most organisations is that the real inventory (what is actually listening on the network) differs sharply from the inventory on paper. Scanning closes that gap.</p>\n<h3>1.3 The handshake, and what a port scan really does</h3>\n<p>Before you can read a scan you must know how a TCP connection is born: the <strong>three-way handshake</strong>. The client sends <strong>SYN</strong> (\"let's talk\"), the server replies <strong>SYN-ACK</strong> (\"ok, let's talk\"), the client sends <strong>ACK</strong> (\"agreed\") — and only then does data flow. A port scanner <em>abuses</em> the start of that handshake to learn a port's state without completing a connection:</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"h3-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <text x=\"90\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" font-weight=\"bold\">client</text>\n  <text x=\"250\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" font-weight=\"bold\">server</text>\n  <line x1=\"90\" y1=\"26\" x2=\"90\" y2=\"120\" stroke=\"currentColor\" opacity=\"0.4\"/>\n  <line x1=\"250\" y1=\"26\" x2=\"250\" y2=\"120\" stroke=\"currentColor\" opacity=\"0.4\"/>\n  <line x1=\"92\" y1=\"40\" x2=\"246\" y2=\"40\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#h3-a)\"/>\n  <text x=\"169\" y=\"36\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">SYN</text>\n  <line x1=\"248\" y1=\"62\" x2=\"94\" y2=\"62\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#h3-a)\"/>\n  <text x=\"169\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">SYN-ACK</text>\n  <line x1=\"92\" y1=\"84\" x2=\"246\" y2=\"84\" stroke=\"currentColor\" stroke-width=\"1.4\" marker-end=\"url(#h3-a)\"/>\n  <text x=\"169\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">ACK → data flows</text>\n  <text x=\"169\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.7\">the 3-way handshake</text>\n  <text x=\"430\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\" font-weight=\"bold\">a SYN scan reads one reply:</text>\n  <g font-size=\"10.5\">\n    <rect x=\"330\" y=\"36\" width=\"290\" height=\"30\" rx=\"5\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"344\" y=\"55\" fill=\"currentColor\"><tspan font-weight=\"bold\">SYN-ACK</tspan> back  →  port OPEN (listening)</text>\n    <rect x=\"330\" y=\"74\" width=\"290\" height=\"30\" rx=\"5\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"344\" y=\"93\" fill=\"currentColor\"><tspan font-weight=\"bold\">RST</tspan> back  →  port CLOSED (nothing there)</text>\n    <rect x=\"330\" y=\"112\" width=\"290\" height=\"30\" rx=\"5\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"344\" y=\"131\" fill=\"currentColor\"><tspan font-weight=\"bold\">no reply</tspan>  →  FILTERED (a firewall dropped it)</text>\n  </g>\n  <text x=\"330\" y=\"168\" font-size=\"9.5\" fill=\"currentColor\" opacity=\"0.85\">OPEN = a door you must account for · FILTERED = a firewall is doing its job</text>\n</svg></div><figcaption>The TCP handshake, and the three answers a scan gets</figcaption></figure>\n<p>This is why Nmap reports <strong>open / closed / filtered</strong> — and why a <strong>filtered</strong> result is good news (a firewall is silently dropping probes). UDP services (like DNS on 53) have no handshake, so UDP scanning is slower and noisier — Nmap infers state from whether a reply or an ICMP \"port unreachable\" comes back.</p>\n<hr>\n<h2>2 · Nmap — Seeing What Is Exposed</h2>\n<p><strong>Nmap</strong> is the scanner that maps a network: which hosts are alive, which ports are open, and — crucially — <em>what software and version</em> sits behind each one. The professional discipline is to move <strong>from quiet to loud</strong>: start with the least intrusive probe that answers your question, and escalate only as needed.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the Nmap workflow, quiet to loud</span></div><pre><code># 1. Host discovery — who is alive? (no port scan yet)\nnmap -sn 10.13.3.0/24\n\n# 2. Targeted service + version detection on the ports that matter\nnmap -sV -p 21,22,80,443,3389 10.13.3.0/24\n\n# 3. Full TCP port sweep of one suspect host (find the odd port)\nnmap -p- 10.13.3.40\n\n# 4. Run a specific NSE script against a specific service\nnmap --script ftp-anon -p21 10.13.3.20\n\n# 5. Always save your evidence\nnmap -sV -oN m3-scan.txt 10.13.3.0/24</code></pre></div>\n<p>Reading the output is the skill, not running the command. A <code>-sV</code> scan returns a line per open port; the <code>VERSION</code> column is where investigations are won:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — reading -sV output (your values will differ)</span></div><pre><code>$ nmap -sV -p22 10.13.3.30\nPORT   STATE SERVICE VERSION\n22/tcp open  ssh     OpenSSH 9.7 (protocol 2.0)\n\n$ nmap --script ftp-anon -p21 10.13.3.20\n21/tcp open  ftp\n| ftp-anon: Anonymous FTP login allowed (FTP code 230)</code></pre></div>\n<p>The first result fingerprints the SSH host; the second tells you — in one line — that <em>anyone</em> can log into the fileserver without a password. That is a finding a board understands.</p>\n<h3>2.1 The Nmap Scripting Engine (NSE)</h3>\n<p>Beyond open/closed, NSE runs hundreds of targeted checks: <code>http-title</code> reveals what a web server is serving (an \"Admin Login\" title with no auth is a red flag), <code>ftp-anon</code> tests anonymous FTP, <code>ssl-enum-ciphers</code> grades TLS, <code>smb-vuln-*</code> tests known SMB flaws. NSE is how a port scan becomes a vulnerability triage.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Scanning is regulated — know the line</div><div class='callout-b'><p>Running Nmap against a network you do not own or have written authorisation to test is an offence under Ghana's <strong>Cybersecurity Act 2020 (Act 1038)</strong>. The same command is lawful on your own estate and unlawful against a neighbour's. In this lab the authorised scope is exactly <code>10.13.3.0/24</code> — nothing else, ever.</p></div></div>\n<h3>2.2 The flags a professional actually chooses</h3>\n<p>Nmap has hundreds of options; a working analyst reaches for a handful and knows <em>why</em>:</p>\n<div class='tablewrap'><table><thead><tr><th>Flag</th><th>What it does</th><th>When</th></tr></thead><tbody><tr><td><code>-sn</code></td><td>Host discovery only (ping sweep), no port scan</td><td>\"Who is alive?\" first pass</td></tr><tr><td><code>-sS</code></td><td>SYN / \"half-open\" scan (default as root) — fast, never completes the handshake</td><td>The everyday TCP scan</td></tr><tr><td><code>-sT</code></td><td>Full TCP connect — used when you're not root</td><td>Unprivileged shells</td></tr><tr><td><code>-sU</code></td><td>UDP scan — slow but finds DNS, SNMP, etc.</td><td>Don't forget UDP services</td></tr><tr><td><code>-sV</code></td><td>Service + <strong>version</strong> detection</td><td>The column investigations are won on</td></tr><tr><td><code>-O</code> / <code>-A</code></td><td>OS fingerprint / <strong>aggressive</strong> (<code>-sV -O</code> + default scripts + traceroute)</td><td>Deep profile of one host</td></tr><tr><td><code>-p-</code> / <code>--top-ports 100</code></td><td>All 65,535 ports / the 100 most common</td><td>Find the odd high port / go fast</td></tr><tr><td><code>-Pn</code></td><td>Skip host discovery, treat the host as up</td><td>When a host blocks pings but is really there</td></tr><tr><td><code>-T0 … -T5</code></td><td>Timing: paranoid → insane</td><td><strong><code>-T4</code></strong> is the sane default on a lab LAN</td></tr><tr><td><code>-oN</code> / <code>-oG</code> / <code>-oX</code> / <code>-oA</code></td><td>Save output: normal / greppable / XML / <strong>all three</strong></td><td><strong>Always</strong> — your evidence</td></tr></tbody></table></div>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a real, evidence-saving scan of the lab</span></div><pre><code>nmap -sS -sV -T4 -p- -oA m3-fullscan 10.13.3.0/24\n#   half-open · version detect · fast · all ports · save normal+grep+XML\ngrep -E \"open\" m3-fullscan.gnmap          # grep the greppable output later</code></pre></div>\n<p><strong>NSE comes in categories</strong> you can run as a group: <code>default</code> (safe, run with <code>-sC</code>/<code>-A</code>), <code>safe</code>, <code>discovery</code>, <code>vuln</code> (checks for known CVEs), <code>auth</code>, <code>brute</code>, and <code>exploit</code>. <em>Never</em> run <code>brute</code> or <code>exploit</code> categories outside an authorised engagement — in this course, only against the lab targets.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The workflow to internalise</div><div class='callout-b'><p><strong>Discover (<code>-sn</code>) → enumerate (<code>-sV -p-</code>) → investigate (targeted NSE) → save (<code>-oA</code>).</strong> Quiet to loud, and write everything to disk as you go — an investigation you can't reproduce from saved evidence is not an investigation.</p></div></div>\n<hr>\n<h2>3 · Traffic Analysis — Reading What Is Said</h2>\n<p>Nmap tells you which doors are open; <strong>Wireshark</strong> and <strong>tcpdump</strong> let you listen to the conversations going through them. A packet capture (a <code>.pcap</code> file) is a recording of raw network traffic; the analyst's craft is cutting the noise down to the one conversation that matters.</p>\n<h3>3.1 Capture filters vs display filters</h3>\n<p>These are constantly confused, so fix the distinction now:</p>\n<ul>\n<li>A <strong>capture filter</strong> decides what is <em>recorded</em> (set before/while capturing; BPF syntax, e.g. <code>udp port 53</code>). Once traffic is discarded, it is gone.</li>\n<li>A <strong>display filter</strong> decides what is <em>shown</em> from what was recorded (set afterwards in Wireshark, e.g. <code>dns</code>, <code>ftp</code>, <code>ip.addr == 10.13.3.30</code>). It is non-destructive — you can refine it endlessly.</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — tcpdump: capture, then read back</span></div><pre><code># Capture everything to a file (capture filter: DNS only, to stay small)\ntcpdump -i eth0 -w capture.pcap 'udp port 53'\n\n# Read a saved capture back, DNS only, with payloads in ASCII\ntcpdump -r capture.pcap -A 'udp port 53'</code></pre></div>\n<h3>3.2 Following a stream — where cleartext credentials fall out</h3>\n<p>Protocols like FTP, HTTP and Telnet send everything — including usernames and passwords — in <strong>plaintext</strong>. In Wireshark, right-click any packet of such a conversation → <strong>Follow → TCP Stream</strong>, and the entire exchange reassembles in front of you:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — an FTP control stream reassembled (illustrative)</span></div><pre><code>220 FileServer FTP ready\nUSER backupsvc\n331 Password required for backupsvc\nPASS S3rv!ce-2bf9\n230 User backupsvc logged in</code></pre></div>\n<p>There it is: a username and password captured off the wire, because FTP never encrypted them. The lesson for defenders is absolute — <strong>cleartext protocols have no place on a modern network</strong>; replace FTP with SFTP/FTPS, Telnet with SSH.</p>\n<h3>3.3 Command-and-control beaconing</h3>\n<p>The signature finding in a compromised network is <strong>C2 beaconing</strong>: an infected host contacting the same external destination at a <strong>fixed interval</strong>. Human and application traffic is bursty and irregular — a person reads, pauses, clicks. Malware is a <strong>metronome</strong>: it checks in with its controller every 30, 60 or 300 seconds, all day and all night, waiting for orders. That regularity is the tell.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The beacon signature</div><div class='callout-b'><p><strong>Same destination + fixed interval + runs around the clock = beacon.</strong> Real malware often adds <em>jitter</em> (a little random variation) to hide, so look for <em>approximate</em> regularity, not perfect clockwork. In this lab the beacon fires roughly every 30 seconds.</p></div></div>\n<p>Why DNS? Roughly <strong>90% of malware uses DNS</strong> to reach its controller, because DNS is allowed out of almost every network (block it and the internet stops working) and is rarely inspected as closely as web traffic. A host repeatedly resolving <code>cdn-update.ddns.net</code> — a dynamic-DNS domain dressed up to look like a software updater — every half-minute is not updating anything. It is phoning home. Monitoring and logging DNS is therefore one of the highest-value, lowest-cost detections a Ghanaian organisation can deploy.</p>\n<h3>3.4 Driving Wireshark like an analyst</h3>\n<p>Three skills turn a wall of packets into findings:</p>\n<p><strong>Display filters</strong> — the ones you use every day:</p>\n<div class='tablewrap'><table><thead><tr><th>Filter</th><th>Shows</th></tr></thead><tbody><tr><td><code>dns</code> · <code>http</code> · <code>ftp</code></td><td>one protocol only</td></tr><tr><td><code>ip.addr == 10.13.3.30</code></td><td>everything to/from one host</td></tr><tr><td><code>tcp.port == 21</code></td><td>one service</td></tr><tr><td><code>tcp.flags.syn == 1 &amp;&amp; tcp.flags.ack == 0</code></td><td>bare SYNs — <strong>a port scan in progress</strong></td></tr><tr><td><code>dns.qry.name contains \"ddns\"</code></td><td>suspicious dynamic-DNS lookups</td></tr><tr><td><code>tcp.stream eq 3</code></td><td>just the Nth conversation</td></tr></tbody></table></div>\n<p><strong>Statistics menu</strong> — where the story is, without reading every packet:</p>\n<ul>\n<li><strong>Protocol Hierarchy</strong> — what is this capture <em>made of</em>? Unexpected protocols stand out.</li>\n<li><strong>Conversations</strong> — who talks to whom; <strong>sort by Bytes</strong> and a data exfiltration jumps out as one huge outbound conversation, a beacon as many tiny identical ones.</li>\n<li><strong>Expert Information</strong> — Wireshark's own flags (retransmissions, resets, malformed).</li>\n</ul>\n<p><strong>Follow Stream &amp; Export Objects</strong> — right-click → <strong>Follow → TCP/HTTP/TLS Stream</strong> reassembles one conversation (how you read the FTP login); <strong>File → Export Objects → HTTP/SMB</strong> pulls transferred <em>files</em> straight out of the capture.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The beacon-detection workflow</div><div class='callout-b'><p>Filter to <code>dns</code>, note the one host repeatedly resolving an odd domain, then watch the <strong>time between those packets</strong> (add <code>frame.time_delta</code> as a column, or use <strong>Statistics → I/O Graph</strong>). Human DNS is irregular; a beacon is a near-constant interval — the periodicity <em>is</em> the detection, even when the payload is encrypted.</p></div></div>\n<hr>\n<h2>4 · Endpoint Evidence — Interrogating the Suspect Host</h2>\n<p>Network evidence tells you <em>that</em> a host is misbehaving; the host's own <strong>connection table</strong> tells you <em>what process is doing it</em>. <code>netstat</code> (or <code>ss</code> on modern Linux) lists every socket: what the machine is <strong>listening</strong> on and what it is <strong>connected</strong> to.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the two states that matter</span></div><pre><code># Windows (as captured on the suspect host)\nnetstat -ano          # all connections + owning process IDs\n\n# Linux equivalent\nss -tulpan</code></pre></div>\n<p>Two states decide the investigation:</p>\n<ul>\n<li><strong><code>LISTEN</code></strong> — the host is waiting for an inbound connection on this port. An unexpected high port in <code>LISTEN</code> (e.g. 4444, 1337, 31337) is a classic <strong>backdoor</strong> — a door the malware opened for its operator to walk back in.</li>\n<li><strong><code>ESTABLISHED</code></strong> — an active connection to a remote address. An <code>ESTABLISHED</code> line to an unfamiliar public IP, owned by a suspicious process, is the host <em>actively</em> talking to its controller.</li>\n</ul>\n<h3>4.1 Masquerading — the process that is almost right</h3>\n<p>Malware hides by naming itself after something you trust. Windows legitimately runs <strong><code>svchost.exe</code></strong> (dozens of them). An attacker names their implant <strong><code>svch0st.exe</code></strong> — a zero for the letter <em>o</em> — so a tired analyst scrolling a process list slides right past it. This is MITRE ATT&amp;CK <strong>Masquerading (T1036)</strong>, and catching it is a matter of reading <em>carefully</em>:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a netstat capture from the infected host (values vary per student)</span></div><pre><code>Proto  Local Address        Foreign Address        State         PID/Program\nTCP    0.0.0.0:4444         0.0.0.0:0              LISTENING     3391/svch0st.exe\nTCP    10.13.3.30:49713     203.0.113.47:443      ESTABLISHED   3391/svch0st.exe\nTCP    10.13.3.30:49720     10.13.3.20:21         ESTABLISHED   2208/ftp.exe</code></pre></div>\n<p>Read that table like a story. A process spelled <code>svch0st</code> is <strong>listening</strong> on 4444 (the backdoor) <strong>and</strong> holds an <strong>established</strong> connection to a public IP on 443 (the C2). The same PID owns both — one implant, two behaviours. And the foreign IP on that established line should <strong>match</strong> the address the beacon domain from the capture resolves to. When three sources agree, you have proof, not a hunch.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Correlation is the whole game</div><div class='callout-b'><p>Any single source can mislead. The scan shows exposure, the capture shows behaviour, the host table shows the responsible process — and the <strong>C2 IP in the netstat must match the C2 domain in the pcap.</strong> An analyst who correlates writes a conclusion that survives scrutiny; one who reports a single tool's output writes a guess.</p></div></div>\n<hr>\n<h2>5 · Identity &amp; Lateral Movement — How a Foothold Becomes a Catastrophe</h2>\n<p>Finding the open door is half the module; the other half — the part that turns one infected workstation into an owned institution — is <strong>identity</strong>. Knowing <em>what</em> connects is not enough; you must know <em>who</em>. <strong>Authentication</strong> proves identity; <strong>authorisation</strong> decides what that identity may do. Weak identity is how almost every breach <em>escalates</em>.</p>\n<h3>5.1 The enterprise identity backbone</h3>\n<p>Most organisations run <strong>Active Directory (AD)</strong>: a central directory where a <strong>domain controller (DC)</strong> holds every account, and <strong>Kerberos</strong> issues time- limited <em>tickets</em> that prove \"this user is who they say\". It is enormously convenient — one login reaches everything the user is entitled to — and that is exactly why it is the attacker's prize. <strong>Compromise the domain controller and you own every account and every machine.</strong> The DC is the crown jewel behind the crown jewels.</p>\n<h3>5.2 Credential theft and lateral movement</h3>\n<p>Once an attacker has local <strong>admin on one box</strong> (via the exposed service, the cracked password, or the phishing foothold), they rarely stop there. They harvest credentials from memory (the <code>LSASS</code> process holds password hashes and Kerberos tickets) and then <strong>move sideways</strong>:</p>\n<ul>\n<li><strong>Pass-the-Hash (PtH)</strong> — reuse a stolen NTLM <strong>hash</strong> to authenticate as that user <em>without ever knowing the plaintext</em>. (ATT&amp;CK <strong>T1550.002</strong>.)</li>\n<li><strong>Pass-the-Ticket / Kerberoasting</strong> — steal or forge Kerberos tickets to move as a privileged account. (T1558.)</li>\n<li><strong>Lateral movement</strong> itself — hopping host → host with those stolen credentials over <strong>SMB</strong> (admin shares, PsExec), <strong>RDP</strong> (3389), or <strong>WinRM</strong>. (T1021 Remote Services; T1003 for the credential dump that fuels it.)</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Shared local-admin passwords are how a toehold becomes a takeover</div><div class='callout-b'><p>Target (2013) and NotPetya (2017) were not clever zero-days at the spread stage — they were <strong>lateral movement across a flat network using the same local-admin credential everywhere.</strong> One stolen hash unlocked thousands of machines. This is the single most important escalation pattern to understand.</p></div></div>\n<h3>5.3 The identity controls that actually stop it</h3>\n<ul>\n<li><strong>Phishing-resistant MFA.</strong> Not all MFA is equal: SMS one-time codes are phishable and defeated by SIM-swap (Module 5); TOTP apps are better; <strong>FIDO2/passkeys</strong> are best — bound to the real site, immune to replay.</li>\n<li><strong>Tiering.</strong> Separate admin accounts for workstations, servers and domain controllers, and <strong>never</strong> log a Domain Admin into an ordinary workstation — so a workstation compromise can't harvest a DA credential.</li>\n<li><strong>Unique local-admin passwords</strong> (e.g. Microsoft <strong>LAPS</strong>) — so one stolen hash opens <em>one</em> machine, not all of them. This alone would have blunted NotPetya.</li>\n<li><strong>Privileged Access Management (PAM)</strong> — just-in-time admin rights, vaulted credentials, recorded sessions — contains the damage when an account falls.</li>\n<li><strong>Detection signals:</strong> impossible travel, off-hours privileged logon, a burst of SMB/WinRM connections from one host, or new service creation (the PsExec tell).</li>\n</ul>\n<hr>\n<h2>6 · Defensive Architecture — Keeping Small Things Small</h2>\n<p>Identity decides <em>whether</em> a foothold spreads; <strong>architecture</strong> decides <em>how far</em>. Three ideas carry most of the weight.</p>\n<p><strong>Defence in depth.</strong> No single control is trusted to hold. You layer them — perimeter firewall, segmentation, host firewall, EDR, MFA, monitoring — so the failure of any one is not fatal. The attacker must defeat <em>every</em> layer; the defender must hold <em>any</em> one.</p>\n<p><strong>Zero Trust.</strong> The old model trusted anything <em>inside</em> the perimeter — a hard shell around a soft centre. Zero Trust assumes the attacker is <strong>already inside</strong> and therefore <em>never trusts, always verifies</em>: every request is authenticated and authorised, every time, regardless of where it originates.</p>\n<p><strong>Segmentation.</strong> Dividing the network so a breach in one zone cannot reach another. Its opposite is the <strong>flat network</strong>, where everything can reach everything — a single foothold then reaches the crown jewels unimpeded. Segmentation is the single control that most often turns a catastrophe back into a contained incident.</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"seg-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <text x=\"20\" y=\"24\" font-size=\"11\" fill=\"currentColor\" font-weight=\"bold\">Flat network — one foothold reaches everything</text>\n  <g font-size=\"9.5\" text-anchor=\"middle\">\n    <rect x=\"20\"  y=\"36\" width=\"96\" height=\"34\" rx=\"5\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/><text x=\"68\" y=\"57\" fill=\"currentColor\">foothold</text>\n    <rect x=\"180\" y=\"36\" width=\"96\" height=\"34\" rx=\"5\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/><text x=\"228\" y=\"57\" fill=\"currentColor\">payments</text>\n    <rect x=\"340\" y=\"36\" width=\"96\" height=\"34\" rx=\"5\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/><text x=\"388\" y=\"57\" fill=\"currentColor\">HR</text>\n    <rect x=\"500\" y=\"36\" width=\"120\" height=\"34\" rx=\"5\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/><text x=\"560\" y=\"57\" fill=\"currentColor\">core banking</text>\n  </g>\n  <g stroke=\"var(--red,#ff6b7a)\" stroke-width=\"1.5\">\n    <line x1=\"116\" y1=\"53\" x2=\"178\" y2=\"53\" marker-end=\"url(#seg-a)\"/>\n    <line x1=\"276\" y1=\"53\" x2=\"338\" y2=\"53\" marker-end=\"url(#seg-a)\"/>\n    <line x1=\"436\" y1=\"53\" x2=\"498\" y2=\"53\" marker-end=\"url(#seg-a)\"/>\n  </g>\n  <text x=\"20\" y=\"118\" font-size=\"11\" fill=\"currentColor\" font-weight=\"bold\">Segmented — zones stop the hop</text>\n  <g font-size=\"9.5\" text-anchor=\"middle\">\n    <rect x=\"20\"  y=\"130\" width=\"96\" height=\"34\" rx=\"5\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/><text x=\"68\" y=\"151\" fill=\"currentColor\">foothold</text>\n    <rect x=\"180\" y=\"130\" width=\"96\" height=\"34\" rx=\"5\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\" stroke-dasharray=\"4 3\"/><text x=\"228\" y=\"151\" fill=\"currentColor\">payments</text>\n    <rect x=\"500\" y=\"130\" width=\"120\" height=\"34\" rx=\"5\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/><text x=\"560\" y=\"151\" fill=\"currentColor\">core banking</text>\n  </g>\n  <g stroke=\"var(--teal,#2bb6a8)\" stroke-width=\"1.6\">\n    <line x1=\"116\" y1=\"147\" x2=\"170\" y2=\"147\"/>\n    <text x=\"150\" y=\"140\" font-size=\"13\" fill=\"var(--teal,#2bb6a8)\" text-anchor=\"middle\">✗</text>\n    <text x=\"300\" y=\"140\" font-size=\"13\" fill=\"var(--teal,#2bb6a8)\" text-anchor=\"middle\">✗</text>\n  </g>\n  <text x=\"300\" y=\"192\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.8\">segmentation + Zero Trust = the breach is caught at the first firewall, not at the vault</text>\n</svg></div><figcaption>Flat network vs segmented — why segmentation contains a breach</figcaption></figure>\n<hr>\n<h2>7 · Detecting It — the Blue-Team View</h2>\n<p>A professional doesn't only <em>find</em> a breach after the fact — they <strong>engineer detection</strong> so the next one is caught in minutes. Every stage of this lab's attack leaves a signal, if you are logging the right thing:</p>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>The signal to watch</th><th>Where / tool</th><th>Control that contains it</th></tr></thead><tbody><tr><td>Recon scan</td><td>a burst of SYNs to many ports from one source</td><td>IDS (Suricata/Snort), firewall logs</td><td>host firewall, least-exposure</td></tr><tr><td>Exposed service</td><td>a service appears that isn't in your inventory</td><td>your <strong>own</strong> monthly Nmap + asset list</td><td>close it / segment it</td></tr><tr><td>Cleartext creds</td><td>a password visible in a packet payload</td><td>IDS content match</td><td>SFTP/SSH, egress DLP</td></tr><tr><td><strong>C2 DNS beacon</strong></td><td>repeated fixed-interval lookups to dynamic DNS</td><td><strong>DNS query logging</strong>, Suricata</td><td>DNS firewall / sinkhole</td></tr><tr><td>Masquerade (<code>svch0st</code>)</td><td>a process whose name/path/signature is wrong</td><td><strong>EDR</strong></td><td>application allow-listing</td></tr><tr><td>Exfiltration</td><td>large sustained outbound to a new IP</td><td><strong>NetFlow</strong>, Wireshark Conversations</td><td>egress filtering</td></tr></tbody></table></div>\n<p>The highest-value, lowest-cost detection for a Ghanaian institution is <strong>DNS query logging</strong> — because ~90% of malware beacons over DNS, and you cannot detect what you do not log. A simple IDS rule turns that log into an alert:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a Suricata rule that flags the beacon pattern</span></div><pre><code>alert dns $HOME_NET any -&gt; any any ( \\\n    msg:\"CAIC M3 - repeated dynamic-DNS lookup (possible C2 beacon)\"; \\\n    dns.query; content:\".ddns.net\"; endswith; \\\n    threshold: type both, track by_src, count 5, seconds 300; \\\n    sid:1000031; rev:1; )\n# fires when one host makes 5+ lookups to a .ddns.net domain within 5 minutes</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>You cannot detect what you do not log</div><div class='callout-b'><p>Before any clever rule: turn on <strong>DNS query logging</strong>, central <strong>authentication logs</strong>, and <strong>NetFlow/egress logging</strong>. Most breached institutions already <em>had</em> the evidence of the beacon and the exfil — they simply were not recording or reviewing it. Logging is the prerequisite; the rule is the easy part.</p></div></div>\n<hr>\n<h2>8 · Mapping the Chain to MITRE ATT&amp;CK</h2>\n<p>Every step of a network compromise maps to a technique. Naming them gives your report a shared, defensible vocabulary and lets you check coverage.</p>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>What happened</th><th>ATT&amp;CK technique</th></tr></thead><tbody><tr><td>Reconnaissance</td><td>Scanning for live hosts and services</td><td><strong>T1046</strong> Network Service Discovery</td></tr><tr><td>Initial Access / Credential capture</td><td>Anonymous FTP; cleartext credentials sniffed</td><td>T1078 Valid Accounts; T1040 Network Sniffing</td></tr><tr><td>Persistence / backdoor</td><td>Implant listening on a high port</td><td>T1543 Create/Modify System Process</td></tr><tr><td>Defense Evasion</td><td><code>svch0st</code> posing as <code>svchost</code></td><td><strong>T1036</strong> Masquerading</td></tr><tr><td>Credential Access</td><td>Dumping hashes/tickets from LSASS</td><td>T1003 OS Credential Dumping</td></tr><tr><td>Command and Control</td><td>DNS beacon to a dynamic-DNS domain</td><td><strong>T1071.004</strong> Application Layer Protocol: DNS</td></tr><tr><td>Lateral Movement</td><td>Pass-the-hash / remote services (SMB, RDP, WinRM)</td><td><strong>T1550.002</strong> Pass-the-Hash; T1021 Remote Services</td></tr></tbody></table></div>\n<p>Recall the <strong>Pyramid of Pain</strong> from Module 1: blocking the C2 <em>IP</em> or <em>domain</em> (bottom of the pyramid) is cheap for the attacker to change. Detecting the <em>behaviour</em> — \"any host beaconing to dynamic DNS on a fixed interval\" (TTP, top of the pyramid) — causes them real pain, because they would have to change <em>how they operate</em>, not just <em>which address they use</em>.</p>\n<hr>\n<h2>9 · Scenarios — Why Flat Networks and Exposed Services Cost Millions</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana &amp; West Africa</div><div class='callout-b'><ul>\n<li><strong>The forgotten remote-access port.</strong> A large share of West African intrusions begin with an RDP or SSH port opened \"temporarily\" for a vendor and never closed. Internet-wide scanners (Shodan, Censys) index it within <em>hours</em>. The discipline that prevents it is free: <strong>scan your own ranges monthly with the same Nmap</strong>, before someone else does.</li>\n<li><strong>Cloud misconfiguration is the regional epidemic.</strong> Public storage buckets, databases listening on the open internet, default admin credentials left in place. Treat cloud security groups as part of your network perimeter and audit them quarterly.</li>\n<li><strong>MoMo-linked fraud infrastructure.</strong> Beaconing hosts inside fintech and agent networks have been traced to credential-harvesting and transaction-tampering operations — exactly the chain this lab recreates.</li>\n</ul></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Target, 2013 — ~40 million payment cards</div><div class='callout-b'><p>Attackers entered through an <strong>HVAC vendor's</strong> stolen credentials, then moved freely to the point-of-sale systems because the network was <strong>flat</strong> — the vendor's segment could reach the payment environment. The intrusion was small; the catastrophe was architectural. <strong>Segmentation</strong> would have contained it. This is a textbook Lateral Movement and poor-segmentation case, and it reshaped retail security worldwide.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>NotPetya, 2017 — ~US$10 billion in global damage</div><div class='callout-b'><p>Once inside, the worm spread uncontrolled across flat, trusted internal networks, reaching global scale within hours and crippling shipping giant Maersk among many others. <strong>Zero Trust and segmentation</strong> are the direct architectural answers to exactly this failure mode.</p></div></div>\n<p>The through-line of every case: the <em>initial</em> foothold is usually small; the disaster comes from a <strong>flat network and weak identity</strong> that let it spread.</p>\n<hr>\n<h2>10 · The Worked Investigation (what the lab asks of you)</h2>\n<p><code>labctl start m3</code> brings up a four-host enterprise subnet on <code>10.13.3.0/24</code> — a web server with an unauthenticated admin console, an anonymous/cleartext FTP fileserver, an SSH workstation (the infected host), and an exposed legacy RDP host — plus a packet capture and a <code>netstat</code> dump from the suspect machine. Work the three sources in order and correlate them:</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 720 230\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"m3-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L5,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <rect x=\"20\" y=\"92\" width=\"120\" height=\"46\" rx=\"6\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n  <text x=\"80\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\" font-weight=\"bold\">YOU (Kali)</text>\n  <text x=\"80\" y=\"128\" text-anchor=\"middle\" font-size=\"9\"  fill=\"currentColor\" opacity=\"0.8\">authorised scanner</text>\n  <rect x=\"250\" y=\"20\" width=\"22\" height=\"190\" rx=\"4\" fill=\"currentColor\" fill-opacity=\"0.10\" stroke=\"currentColor\"/>\n  <text x=\"261\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" transform=\"rotate(-90 261 115)\">10.13.3.0/24 switch</text>\n  <line x1=\"140\" y1=\"115\" x2=\"250\" y2=\"115\" stroke=\"currentColor\" stroke-width=\"1.5\" marker-end=\"url(#m3-a)\"/>\n  <g font-size=\"11\">\n    <rect x=\"360\" y=\"16\"  width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\
