<script>
const DATA = {"m0": {"day": 1, "title": "Day 1 Orientation — Your Kali Workstation & the Linux Command Line", "lesson": "<h1>Day 1 Orientation — Your Kali Workstation &amp; the Linux Command Line</h1>\n<p><strong>Day 1 · Session 0 · Read this before anything else.</strong></p>\n<p>This is a practitioner course. By Friday you will have scanned networks, analysed real packet captures, cracked password hashes, investigated a business email compromise, worked a disk image in a forensic tool, broken an AI assistant, and run a live multi-vector incident — on the same tools used by professionals in the field. None of that works if you are not fluent in the terminal. This session makes you fluent, and sets the rules of engagement.</p>\n<p>By the end of this session you will:</p>\n<ul>\n<li>understand how the course is structured and how to drive it;</li>\n<li>know the CyberRange rules of engagement and the law that governs them;</li>\n<li>be able to navigate, inspect, search and manipulate a Linux system from the command line with confidence;</li>\n<li>recognise the commands that matter most to a security professional, and <em>why</em>.</li>\n</ul>\n<hr>\n<h2>1. How this course works</h2>\n<p>The programme has ten modules across five days. Every module gives you three things, and you move through them in order:</p>\n<ul>\n<li><strong>Learn</strong> — a deep lesson (like this one). In the web app it's the <em>Course</em> view; in the terminal it's <code>labctl learn m1</code>.</li>\n<li><strong>Do</strong> — a hands-on lab against isolated targets on this machine. In the web app, the <em>Labs</em> view (Start / Verify buttons); in the terminal, <code>labctl start m1</code> then <code>labctl verify m1</code>.</li>\n<li><strong>Produce</strong> — a professional deliverable (a risk register, an incident report, a board memo). Get the template with <code>labctl worksheet m1</code>.</li>\n</ul>\n<p>Everything runs <strong>on this machine, offline</strong>. Your progress is saved locally. You can use the browser app (<code>./start.sh</code>) or the terminal (<code>labctl</code>) — they are the same engine, kept in sync.</p>\n<blockquote>Assessment is built on the deliverables and the lab verifications, not on</blockquote>\n<blockquote>memorising slides. Treat every lab as if the evidence were real and your</blockquote>\n<blockquote>report would be read by a regulator or a court. That mindset is the course.</blockquote>\n<h2>2. Rules of engagement — read carefully</h2>\n<p>Every lab target lives on a private network on this computer (addresses in the range <code>10.13.x.x</code>). Those are the <strong>only</strong> systems you are authorised to touch.</p>\n<ul>\n<li><strong>Never</strong> point any tool in this course — Nmap, Nikto, Hydra, anything — at a network, website, phone or system you do not own or have <strong>written</strong> permission to test.</li>\n<li>Scanning or attacking a third party is a criminal offence under the <strong>Ghana Cybersecurity Act 2020 (Act 1038)</strong>, and carries real penalties.</li>\n<li>The techniques here are taught so you can <strong>defend</strong>. A professional's power comes with a professional's restraint. Authorisation is the line between a security engineer and a criminal; it is never optional.</li>\n</ul>\n<p>This is not boilerplate. People lose careers and liberty by forgetting it.</p>\n<h2>3. Your workstation: Kali Linux</h2>\n<p>Kali Linux is a Debian-based operating system maintained by OffSec, pre-loaded with hundreds of security tools. It is the industry-standard platform for penetration testers, incident responders and forensic analysts worldwide. You will learn on exactly what you will use in the field.</p>\n<p>Confirm the environment is ready before Day 1 proper:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>labctl doctor        # checks Docker, the engine, and the installed tools</code></pre></div>\n<p>Green ticks mean you are ready. If Docker needs attention, <code>doctor</code> tells you the exact command to run.</p>\n<h2>4. The command line, and why it is non-negotiable</h2>\n<p>A graphical interface shows you what someone decided to show you. The command line shows you <em>everything</em>, exactly, and lets you combine small tools into powerful investigations. Security work is about precision and evidence: the terminal gives you both, and it scripts and repeats. Every serious tool in this field is driven from it.</p>\n<p>The shell prompt tells you who and where you are:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>┌──(kali㉿kali)-[~]\n└─$</code></pre></div>\n<p><code>kali@kali</code> is <em>user@host</em>; <code>~</code> is your current directory (your home folder); <code>$</code> means a normal user (a <code>#</code> would mean root). Read the prompt before you type.</p>\n<hr>\n<h2>5. The Linux command line — the commands that matter</h2>\n<p>Work through these at the terminal. Each block is real; type them, don't just read them. Everything here you will use again in the labs.</p>\n<h3>5.1 Who and where am I?</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>whoami              # your username\nid                  # your user id, groups (shows if you have sudo/root power)\nhostname            # the machine's name\npwd                 # \"print working directory\" — where you are right now\nuname -a            # kernel and architecture — know the system you're on\ndate                # current date/time (matters for evidence timestamps)</code></pre></div>\n<p>A security professional <em>always</em> knows which account they are using and on which host. Acting as the wrong user, on the wrong box, is how mistakes and incidents happen.</p>\n<h3>5.2 Getting help — the habit that makes you self-sufficient</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>man nmap            # the full manual for a command (press q to quit, / to search)\nnmap --help         # quick option summary\nwhatis grep         # one-line description\napropos password    # find commands related to a keyword</code></pre></div>\n<p>Nobody memorises every flag. Professionals read the manual fast. <code>man</code> is your first move with any unfamiliar tool.</p>\n<h3>5.3 Moving around the filesystem</h3>\n<p>Linux is a single tree starting at <code>/</code> (root). Everything hangs off it.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>ls                  # list files here\nls -la              # long listing, including hidden files (names starting with .)\nls -lh              # human-readable sizes (K, M, G)\ncd /etc             # change to an absolute path\ncd ..               # up one level\ncd ~                # home;  cd -  returns to the previous directory\ntree -L 2           # a visual tree, two levels deep</code></pre></div>\n<p>Paths are <strong>absolute</strong> (start with <code>/</code>, e.g. <code>/etc/passwd</code>) or <strong>relative</strong> (from where you are, e.g. <code>../logs</code>). <code>.</code> is here, <code>..</code> is the parent, <code>~</code> is home.</p>\n<h3>5.4 Reading files</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>cat notes.txt               # dump a whole file\nless /var/log/syslog        # page through a big file (q to quit, / to search)\nhead -n 20 file             # first 20 lines\ntail -n 20 file             # last 20 lines\ntail -f /var/log/auth.log   # follow a log live as it grows — vital in IR\nfile evidence.img           # what KIND of file is this, really?\nstrings binary.bin          # pull readable text out of a binary (find URLs, keys)\nxxd capture.bin | head      # raw hex view — forensics bread and butter</code></pre></div>\n<p><code>file</code>, <code>strings</code> and <code>xxd</code> are the ones beginners skip and professionals live on — they tell you what something actually is when the extension lies.</p>\n<h3>5.5 Creating, copying, moving, deleting</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>mkdir -p cases/2026/incident-07   # make nested directories in one go\ntouch report.md                   # create an empty file / update its timestamp\ncp -r evidence/ evidence-copy/     # copy (work on COPIES, never originals)\nmv draft.md final.md               # move or rename\nrm file.txt                        # delete a file\nrm -rf folder/                     # delete a folder and everything in it</code></pre></div>\n<blockquote><code>rm -rf</code> is irreversible and asks no questions. There is no recycle bin. Read</blockquote>\n<blockquote>the path twice before you press Enter — especially as root.</blockquote>\n<h3>5.6 Finding things</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>find /home -name \"*.pcap\"             # by name, anywhere under /home\nfind . -type f -mtime -1              # files modified in the last day (IR triage)\nfind / -perm -4000 -type f 2&gt;/dev/null  # setuid binaries — classic priv-esc hunt\nwhich nmap                            # where a command lives on disk\ngrep -r \"password\" /etc/ 2&gt;/dev/null  # search file CONTENTS recursively</code></pre></div>\n<p><code>find</code> and <code>grep -r</code> are how you locate a needle — a leaked credential, a recently changed file, a dangerous permission — in a haystack of thousands of files.</p>\n<h3>5.7 Pipes and redirection — the real power</h3>\n<p>This is the idea that makes the command line powerful: small tools, chained. <code>|</code> sends one command's output into the next; <code>&gt;</code> writes to a file; <code>&gt;&gt;</code> appends; <code>2&gt;</code> redirects errors.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>cat auth.log | grep \"Failed password\" | wc -l     # count failed SSH logins\nnmap -sV 10.13.3.0/24 &gt; scan.txt                   # save output to a file\ncommand 2&gt;/dev/null                                # throw errors away\ncommand &gt; out.txt 2&gt;&amp;1                             # capture output AND errors\ndig TXT example.com | tee dns.txt                  # show on screen AND save</code></pre></div>\n<p>\"Count the failed logins, by source IP, sorted by most frequent\" becomes one line — you'll build exactly that in Module 4.</p>\n<h3>5.8 Text processing — turning data into answers</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>grep -i \"error\" log        # -i ignore case\ngrep -E \"T10[0-9]{2}\" f    # -E extended regex (match ATT&amp;CK IDs like T1046)\ngrep -v \"healthcheck\" log  # -v invert: everything EXCEPT matches\ngrep -c \"fail\" log         # -c count matching lines\ncut -d',' -f1,3 data.csv   # pull columns 1 and 3 from a CSV\nsort file | uniq -c | sort -rn   # count duplicates, most-frequent first\nawk '{print $1}' access.log | sort | uniq -c   # top source IPs from a log\nsed 's/old/new/g' file     # stream-edit: replace text\nwc -l file                 # count lines</code></pre></div>\n<p>The pattern <code>sort | uniq -c | sort -rn</code> — \"what are the most common values?\" — is one of the most useful lines in all of security analysis. Memorise it.</p>\n<h3>5.9 Permissions and ownership</h3>\n<p>Every file has an owner, a group, and three permission sets — for the <strong>owner</strong>, the <strong>group</strong>, and <strong>everyone else</strong> — each granting read (<code>r</code>), write (<code>w</code>) and execute (<code>x</code>).</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>ls -l script.sh\n# -rwxr-xr--  1  kali  kali  ...  script.sh\n#  │└┬┘└┬┘└┬┘\n#  │ │  │  └ others: read only\n#  │ │  └─── group: read + execute\n#  │ └────── owner: read + write + execute\n#  └──────── type: - file, d directory, l link</code></pre></div>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>chmod +x labctl        # make a file executable\nchmod 640 secret.txt   # owner rw, group r, others none  (4=r 2=w 1=x)\nchmod 600 id_rsa       # private keys MUST be owner-only, or SSH refuses them\nchown kali:kali file   # change owner and group (usually needs sudo)\numask                  # the default permissions mask for new files</code></pre></div>\n<p>Permissions are a security control in their own right. A world-readable <code>config.php</code> with a database password in it — which you'll find in Module 4 — is a permissions failure.</p>\n<h3>5.10 Users, privilege and sudo</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>sudo &lt;command&gt;     # run one command as root (you'll be asked for your password)\nsudo -l            # what am I allowed to run as root? (attackers check this)\nsu - username      # switch to another user\ncat /etc/passwd    # the list of accounts on the system\nwho ; last         # who is logged in now; login history</code></pre></div>\n<p>Root (uid 0) can do anything. Use <code>sudo</code> deliberately, never habitually. Over-use of root is how a small mistake becomes a catastrophe.</p>\n<h3>5.11 Processes and services</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>ps aux                 # every running process (a = all, u = detailed, x = incl. daemons)\nps aux | grep ssh      # is sshd running?\ntop        (or htop)   # live process/resource monitor (q to quit)\nkill 1234              # stop process id 1234 politely\nkill -9 1234           # force-kill (last resort)\njobs ; fg ; bg         # manage jobs you backgrounded with &amp;\nnohup long-task &amp;      # keep a task running after you log out\nsystemctl status docker # the state of a system service\nsudo systemctl start docker</code></pre></div>\n<p>In incident response, <code>ps aux</code> is often your first look at <em>what is actually running</em> on a suspect machine — including the thing that should not be.</p>\n<h3>5.12 Networking from the terminal</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>ip a                  # your network interfaces and IP addresses (modern)\nip r                  # the routing table\nping -c 4 10.13.3.10  # is a host reachable? (4 packets)\nss -tulpn             # listening TCP/UDP ports and the processes behind them\ndig example.com MX    # query DNS (Modules 1 &amp; 5)\nhost example.com      # quick DNS lookup\nwhois example.com     # domain registration details\ncurl -I https://site  # fetch just the HTTP response headers\ncurl -s https://site/api | less   # fetch a page/API quietly\nwget https://site/file           # download a file\nnc -lvnp 4444         # netcat: listen on a port (the Swiss-army knife of networking)</code></pre></div>\n<p><code>ss -tulpn</code> answers \"what is this machine exposing to the network?\" — the single most important question when you harden a server. You'll use <code>dig</code>, <code>whois</code> and <code>curl</code> directly in the labs.</p>\n<h3>5.13 Packages — installing tools</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>sudo apt update                 # refresh the package list\nsudo apt install -y wireshark   # install a tool\napt search forensic             # find packages\ndpkg -l | grep nmap             # is it already installed?</code></pre></div>\n<h3>5.14 Archives, transfer and integrity</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>tar -czf case.tar.gz case/      # create a compressed archive\ntar -xzf case.tar.gz            # extract one\nzip -r out.zip folder/ ; unzip out.zip\nbase64 -d artifact.b64          # decode Base64 (Module 6)\nsha256sum evidence.img          # fingerprint a file — proof of integrity\nsha256sum -c evidence.sha256    # verify it hasn't changed</code></pre></div>\n<p><code>sha256sum</code> is the backbone of chain of custody in Module 6. A hash proves, with mathematics, that evidence was not altered.</p>\n<h3>5.15 System and disk</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>df -h          # disk space per filesystem, human-readable\ndu -sh *       # size of each item in the current directory\nfree -h        # memory usage\nuptime         # how long the system's been up, and load\nlsblk          # block devices / disks (useful before imaging in forensics)</code></pre></div>\n<h3>5.16 History, shortcuts and speed</h3>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>history          # your command history\n!!               # repeat the last command (e.g. sudo !!)\n!$               # the last argument of the previous command</code></pre></div>\n<p>Learn these keystrokes — they pay off every single day:</p>\n<ul>\n<li><strong>Tab</strong> — auto-complete commands and paths (use it constantly).</li>\n<li><strong>Ctrl‑R</strong> — reverse-search your history (type a few letters of an old command).</li>\n<li><strong>Ctrl‑C</strong> — cancel the running command.</li>\n<li><strong>Ctrl‑L</strong> — clear the screen (same as <code>clear</code>).</li>\n<li><strong>Ctrl‑A / Ctrl‑E</strong> — jump to the start / end of the line.</li>\n<li><strong>Ctrl‑D</strong> — end of input / log out.</li>\n<li><strong>↑ / ↓</strong> — previous / next command.</li>\n</ul>\n<p>Environment and the <code>$PATH</code> (where the shell looks for commands):</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal</span></div><pre><code>echo $PATH                 # the directories searched for commands\nexport TARGET=10.13.3.10    # set a variable for this session\necho $TARGET</code></pre></div>\n<hr>\n<h2>6. Hands-on: your first fifteen minutes</h2>\n<p>Do this now, in a terminal, to lock it in:</p>\n<ol>\n<li>Find out who and where you are: <code>whoami</code>, <code>id</code>, <code>pwd</code>, <code>uname -a</code>.</li>\n<li>Make a working folder and enter it: <code>mkdir -p ~/work/day1 &amp;&amp; cd ~/work/day1</code>.</li>\n<li>Create and read a file: <code>echo \"CAIC day 1\" &gt; note.txt &amp;&amp; cat note.txt</code>.</li>\n<li>List in detail and read the permissions: <code>ls -l</code>.</li>\n<li>Pipe something together: <code>cat /etc/passwd | grep -v nologin | cut -d: -f1 | sort</code> — the login-capable accounts on this box, sorted. Read each stage of the pipe.</li>\n<li>Check what's listening on the network: <code>ss -tulpn</code>.</li>\n<li>Open a manual and search it: <code>man ls</code>, then type <code>/sort</code> and press Enter.</li>\n<li>Confirm the course is ready: <code>labctl doctor</code>.</li>\n</ol>\n<p>If every one of those worked and made sense, you are ready for Module 1.</p>\n<h2>7. Safety recap</h2>\n<ul>\n<li>Only <code>10.13.x.x</code> lab targets. Nothing else. Ever.</li>\n<li>Work on <strong>copies</strong> of evidence; never the original.</li>\n<li>Think before <code>rm -rf</code> and before <code>sudo</code>.</li>\n<li>When in doubt about authorisation, the answer is <strong>stop and ask</strong>.</li>\n</ul>\n<h2>Key takeaways</h2>\n<ul>\n<li>The terminal is where security work actually happens — fluency is the foundation everything else is built on.</li>\n<li><strong>Pipes</strong> (<code>|</code>) chain small tools into powerful one-liners; <code>sort | uniq -c | sort -rn</code> answers \"what's most common?\".</li>\n<li>Know your identity and host at all times (<code>whoami</code>, <code>id</code>, <code>hostname</code>).</li>\n<li><code>find</code>, <code>grep -r</code>, <code>file</code>, <code>strings</code>, <code>ss -tulpn</code>, <code>ps aux</code> and <code>sha256sum</code> are the workhorses you'll reach for again and again.</li>\n<li><strong>Authorisation is the law and the ethic.</strong> Lab targets only.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>You need the five most frequent source IPs in a web log's first column. Write the one-liner.</strong> → <code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -5</code>.</li>\n</ol>\n<ol>\n<li><strong><code>ls -l</code> shows <code>-rw-------</code> on <code>id_rsa</code>. Good or bad, and why?</strong> → Good — a private key must be readable only by its owner (<code>600</code>). SSH will refuse a key that others can read.</li>\n</ol>\n<ol>\n<li><strong>What does <code>ss -tulpn</code> tell you, and when is it your first command?</strong> → The listening TCP/UDP ports and the processes behind them — your first command when assessing what a machine exposes to the network.</li>\n</ol>\n<ol>\n<li><strong>Why do forensic examiners run <code>sha256sum</code> before and after handling evidence?</strong> → To prove mathematically that the evidence was not altered — the foundation of chain of custody.</li>\n</ol>\n<ol>\n<li><strong>A colleague asks you to \"just quickly scan\" a partner company's website to check it's secure. Your response?</strong> → No — not without that company's written authorisation. Scanning a third party is an offence under Act 1038, regardless of good intentions.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Shell</strong> — the program that interprets your commands (Bash/Zsh).</li>\n<li><strong>Path (absolute/relative)</strong> — a file's location from <code>/</code> or from where you are.</li>\n<li><strong>Pipe <code>|</code></strong> — send one command's output as the next command's input.</li>\n<li><strong>Redirection <code>&gt;</code> <code>&gt;&gt;</code> <code>2&gt;</code></strong> — send output/errors to a file.</li>\n<li><strong>Permissions (rwx)</strong> — read/write/execute for owner, group, others.</li>\n<li><strong>sudo / root</strong> — run as the all-powerful administrator (uid 0).</li>\n<li><strong>PATH</strong> — the directories the shell searches for commands.</li>\n<li><strong>Hash (sha256)</strong> — a file's unique fingerprint, used to prove integrity.</li>\n</ul>", "sheets": []}, "m1": {"day": 1, "title": "Module 1 — Threat Landscape & Cyber Threat Intelligence", "lesson": "<h1>Module 1 — Threat Landscape &amp; Cyber Threat Intelligence</h1>\n<p><strong>Day 1 · Morning Session · ~4.5 hours · Hands-on lab: <code>labctl start m1</code></strong></p>\n<p>This module is the intellectual foundation on which the entire five-day programme rests. Everything that follows — network defence, vulnerability management, incident response, digital forensics — depends on an analyst's ability to think clearly about adversaries: who they are, how they operate, what intelligence about them looks like, and how that intelligence should shape decisions. A defender who cannot characterise a threat cannot prioritise controls, cannot write a credible risk register, and cannot brief a board.</p>\n<p>The module operates across two registers simultaneously. The first is <strong>conceptual</strong>: the frameworks, vocabularies and analytic disciplines that distinguish professional threat intelligence from alarmist headlines. The second is <strong>practical</strong>: the terminal commands and investigative workflows that let you gather and verify intelligence about an organisation in real time. Both are treated with equal rigour.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Define cyber threat intelligence and distinguish it from raw data, information and alarm.</li>\n<li>Map any attack behaviour onto the <strong>Cyber Kill Chain, MITRE ATT&amp;CK, the Diamond Model and the Pyramid of Pain</strong> simultaneously, and explain the value each provides.</li>\n<li>Classify threat actors by motivation, capability and targeting, and assess which category poses the highest realistic risk to a given Ghanaian organisation.</li>\n<li>Apply the four-level intelligence hierarchy (strategic, operational, tactical, technical) and tailor a written product to each audience.</li>\n<li>Evaluate source reliability and information credibility, and express assessments with explicit confidence levels.</li>\n<li>Conduct a full passive-reconnaissance profile of a domain: DNS, WHOIS, email authentication, certificate transparency and OSINT harvesting.</li>\n<li>Read and interpret <strong>SPF, DKIM and DMARC</strong> records and identify a domain's spoofing exposure.</li>\n<li>Map reconnaissance findings to MITRE ATT&amp;CK Reconnaissance tactics (TA0043).</li>\n<li>Produce a structured threat brief with BLUF, verified indicators, confidence-rated assessments, recommended actions and knowledge gaps.</li>\n<li>Situate the Ghana threat landscape within global trends and cite obligations under the Cybersecurity Act 2020 (Act 1038).</li>\n</ol></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:30</td><td>Scene-setting: the intelligence problem and why defenders must think like analysts</td></tr><tr><td>0:30 – 1:15</td><td>Threat-actor taxonomy — deep dive with African case context</td></tr><tr><td>1:15 – 2:00</td><td>The four frameworks: Kill Chain, ATT&amp;CK, Diamond Model, Pyramid of Pain</td></tr><tr><td>2:00 – 2:15</td><td>Break</td></tr><tr><td>2:15 – 2:45</td><td>IOCs vs IOAs; the four intelligence levels; source grading</td></tr><tr><td>2:45 – 3:30</td><td>Passive reconnaissance — theory and live tools (<code>dig</code>, <code>whois</code>, <code>theHarvester</code>)</td></tr><tr><td>3:30 – 4:00</td><td>Email authentication deep dive — SPF, DKIM, DMARC, BIMI</td></tr><tr><td>4:00 – 4:30</td><td>Writing the threat brief — structure, language, common failures</td></tr><tr><td>4:30 – 5:00</td><td>Lab: <code>labctl start m1</code> — guided practicum and debrief</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> scan the last six months of CERT-GH advisories at <code>csa.gov.gh</code>. <strong>Lab requirement:</strong> a Kali terminal (use the built-in <strong>Terminal</strong> tab). <strong>Assessment:</strong> your lab submission (a threat brief) counts toward the Module 1 practical grade.</p></div></div>\n<hr>\n<h2>1 · The Intelligence Problem</h2>\n<h3>1.1 Why intelligence, not information</h3>\n<p>Organisations are drowning in security data. A mid-sized Ghanaian bank with a modern SIEM generates tens of thousands of log events a day. A ministry receives dozens of phishing emails a week. A fintech sees thousands of failed logins a month. The raw quantity is not the problem — the problem is that most of it is noise, and without a disciplined analytic process the signal is lost.</p>\n<p>Intelligence is <strong>not data</strong> and <strong>not information</strong>. It is the product of a deliberate process that transforms raw observations into <em>actionable judgements about adversaries</em>. The distinction has operational consequences: an organisation that mistakes \"we have a lot of data\" for \"we have intelligence\" spends money on the wrong controls, responds to the wrong incidents, and briefs the board on the wrong risks.</p>\n<p>The <strong>intelligence cycle</strong> — the model used by national agencies worldwide and adapted for cyber — has five phases:</p>\n<ol>\n<li><strong>Planning &amp; Direction</strong> — what questions need answering? Who needs the answer, by when?</li>\n<li><strong>Collection</strong> — what sources exist? Which are reliable? What can be gathered without authorisation?</li>\n<li><strong>Processing</strong> — raw data is normalised, translated, made human- or machine-readable.</li>\n<li><strong>Analysis &amp; Production</strong> — processed data is evaluated, correlated, and turned into judgements with confidence levels.</li>\n<li><strong>Dissemination</strong> — the finished product reaches the right audience, in the right format, at the right time.</li>\n</ol>\n<p>The cycle is iterative: dissemination triggers new direction, which restarts collection. A team that runs it well is not reacting to incidents — it is anticipating them.</p>\n<div class='callout callout-quote'><div class='callout-b'><p>\"Intelligence is the ability to reduce uncertainty about an adversary's intent and capability to a level at which decision-makers can act with confidence. It is not the elimination of uncertainty — that is impossible — but its disciplined management.\" — adapted from U.S. Intelligence Community Directive 203</p></div></div>\n<h3>1.2 The three properties of good CTI</h3>\n<p>Useful cyber threat intelligence has three properties. When any one is absent, the product fails its purpose.</p>\n<p><strong>Actionability.</strong> Intelligence that does not change a decision is trivia, however interesting. Before producing or consuming a CTI product, ask: <em>what decision does this inform?</em> — block this IP range; deploy DMARC <code>p=reject</code> before the supplier payment run; require MFA on remote access. The test is the \"so what?\" question. \"Organised cybercrime targets West African banks\" is true but not actionable. \"We assess with high confidence that our payment portal is being profiled using T1598.001; recommend suspending portal access pending MFA\" is actionable.</p>\n<p><strong>Timeliness.</strong> Intelligence delivered after the decision is made is irrelevant. A CERT-GH advisory received three weeks after the attack wave peaked has little operational value. The discipline is to produce rapid, high-confidence statements about the most critical uncertainties first, and complete the broader picture as time allows.</p>\n<p><strong>Accuracy.</strong> Accuracy is not certainty. It means the product accurately represents what is <em>known</em>, what is <em>assessed</em>, and what remains <em>unknown</em>. The most dangerous failure in analytic writing is presenting an assessment as a fact.</p>\n<h3>1.3 The five security properties every analyst must know</h3>\n<p>Before characterising a threat, know what is being threatened. All of information security reduces to five properties (CIAAC):</p>\n<div class='tablewrap'><table><thead><tr><th>Property</th><th>Meaning</th><th>Example breach</th></tr></thead><tbody><tr><td><strong>Confidentiality</strong></td><td>Only authorised parties can read the data</td><td>A customer database is exfiltrated and sold on a dark-web forum</td></tr><tr><td><strong>Integrity</strong></td><td>Data is accurate and untampered</td><td>An account number in a payment instruction is silently changed, redirecting GHS 2.3M</td></tr><tr><td><strong>Availability</strong></td><td>Systems are usable when needed</td><td>A DDoS takes mobile banking offline for six hours on a Monday</td></tr><tr><td><strong>Authenticity</strong></td><td>An entity/message is genuinely what it claims</td><td>A forged email \"from the CEO\" authorises an urgent transfer</td></tr><tr><td><strong>Business continuity</strong></td><td>The organisation can sustain or restore operations</td><td>Ransomware encrypts servers <em>and</em> backups; there is no tested recovery plan</td></tr></tbody></table></div>\n<p>When an incident is reported, the first analytic step — before any other — is to name which property has been violated. That focuses every subsequent decision.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>A single incident can violate several properties at once</div><div class='callout-b'><p>Modern \"double-extortion\" ransomware destroys <strong>availability</strong> (systems encrypted), threatens <strong>confidentiality</strong> (data stolen before encryption), and can violate <strong>integrity</strong> (data corrupted). Always assess all five before classifying an incident.</p></div></div>\n<hr>\n<h2>2 · Know Your Adversary — Threat-Actor Taxonomy</h2>\n<p>The most fundamental principle of intelligence is that <strong>threats come from people</strong> — people with motives, constraints, skills, tools and time. \"The cyber threat is evolving\" is analytically useless. Useful intelligence identifies specific actor categories, characterises their methods, and assesses their relevance to <em>your</em> organisation.</p>\n<h3>2.1 Organised cybercriminal groups</h3>\n<p>Organised cybercrime is the dominant threat to almost every commercial and government institution in West Africa — the consistent finding of INTERPOL Africa, Ghana's CSA and the FBI's IC3. Money is the motive, and MoMo networks, banking systems, payment processors and payroll platforms are high-value targets.</p>\n<p>These are <strong>professional organisations</strong>, not teenagers in hoodies — the largest run affiliate programmes, help desks and \"customer service\" for ransomware victims.</p>\n<ul>\n<li><strong>Motivation:</strong> financial — ransomware, BEC, data theft for sale, fraud-as-a-service.</li>\n<li><strong>Resourcing:</strong> high and professionalised (Conti, LockBit, ALPHV had revenues in the hundreds of millions before disruption).</li>\n<li><strong>Patience:</strong> variable — smash-and-grab phishing, or 30–90 day ransomware dwell.</li>\n<li><strong>Targeting:</strong> opportunistic at recon (scan the internet), selective at monetisation.</li>\n<li><strong>TTPs:</strong> spearphishing for access; credential theft; lateral movement; exfiltration before encryption; Tor-hosted ransom portals.</li>\n</ul>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana in focus</div><div class='callout-b'><p>Ghana's organised-crime threat comes from two directions. First, West African fraud syndicates have professionalised, running BEC and cryptocurrency fraud at scale. Second, international ransomware affiliates have begun targeting Ghanaian financial institutions, drawn by digital-banking growth and limited forensic capability. The 2022 CSSPS disruption and multiple reported BEC incidents against Ghanaian exporters are consistent with both streams.</p>\n<p><strong>Act 1038</strong> requires significant incidents be reported to the CSA within <strong>72 hours</strong> — failure to report is itself an offence. Criminals count on victims staying silent; reporting breaks that calculation and enables sector-wide warnings.</p></div></div>\n<h3>2.2 Nation-state actors and APTs</h3>\n<p>Nation-state actors are the highest-sophistication end of the landscape — funded by intelligence and military budgets, pursuing espionage, economic advantage, political disruption or sabotage over long time horizons. \"APT\" (Advanced Persistent Threat) was coined by the U.S. Air Force in 2006: <strong>A</strong>dvanced (custom malware, zero-days), <strong>P</strong>ersistent (long-term, stealthy access), <strong>T</strong>hreat (deliberate and targeted, not opportunistic).</p>\n<div class='tablewrap'><table><thead><tr><th>Group</th><th>Attributed state</th><th>Objectives</th><th>Notable operations</th></tr></thead><tbody><tr><td>APT28 (Fancy Bear)</td><td>Russia (GRU)</td><td>Political espionage, disinformation</td><td>DNC hack (2016)</td></tr><tr><td>APT29 (Cozy Bear)</td><td>Russia (SVR)</td><td>Long-dwell espionage</td><td>SolarWinds supply-chain compromise</td></tr><tr><td>Lazarus Group</td><td>North Korea (RGB)</td><td>Revenue, sabotage</td><td>Bangladesh Bank SWIFT heist ($81M); WannaCry; Sony</td></tr><tr><td>APT41 (Winnti)</td><td>China (MSS/PLA)</td><td>Espionage + financial</td><td>Software build-system compromises</td></tr><tr><td>APT34 (OilRig)</td><td>Iran (MOIS)</td><td>Regional espionage</td><td>Gulf energy/government spearphishing</td></tr><tr><td>Sandworm</td><td>Russia (GRU 74455)</td><td>Infrastructure sabotage</td><td>Ukraine power grid; NotPetya ($10B+ damage)</td></tr></tbody></table></div>\n<p>The direct nation-state threat to most Ghanaian organisations is lower than to Western institutions, but not zero: pan-African espionage targeting resource-extraction contracts, diplomatic communications and peacekeeping intelligence is documented. <strong>KAIPTC itself</strong> — a peacekeeping training and research centre with wide international relationships — is precisely the kind of institution intelligence services seek to penetrate. The more realistic indirect threat is nation-state <em>tools</em> trickling down to organised crime after seizures or disclosure.</p>\n<h3>2.3 Hacktivists</h3>\n<p>Motivated by ideology or publicity, operating as loose collectives — Anonymous, KillNet (pro-Russia DDoS), Sudan-affiliated groups defacing African government sites. For Ghanaian institutions, hacktivist risk rises around elections, major announcements, or controversies with international resonance.</p>\n<h3>2.4 Insider threats</h3>\n<p>The most underestimated category, especially where organisational culture does not support formal insider-threat programmes. A <strong>malicious</strong> insider acts with intent (theft, sabotage, facilitating external fraud); a <strong>negligent</strong> insider causes equivalent damage without intent (clicks a phish, reuses a password, misconfigures a cloud bucket to public). Indicators — unusual after-hours access, large downloads, access outside job scope, expressed grievances — are never definitive and are culturally sensitive, but warrant examination. Not all threats originate outside the perimeter.</p>\n<h3>2.5 Opportunists and automated scanners</h3>\n<p>\"Script kiddie\" is dismissive; the precise description is <strong>low-sophistication, high-volume, indiscriminate</strong>. The defining characteristic is that they scan the <em>entire internet continuously</em>. Shodan and Censys index every public IP repeatedly; anything you expose receives automated probes within hours.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Key concept</div><div class='callout-b'><p>Opportunists set the <strong>baseline threat level</strong> for every internet-connected organisation, regardless of size, sector or location. The question is never \"are we being scanned?\" — you are, always — but \"does our exposed surface give a scanner anything to act on?\" Common targets: unpatched VPN appliances, exposed RDP (3389), default-credential routers/cameras, open database ports (3306, 5432, 6379), web apps with known CVEs.</p></div></div>\n<hr>\n<h2>3 · The Four Frameworks Professionals Use</h2>\n<p>A framework is a shared vocabulary that lets practitioners communicate precisely. Without them, two analysts describing the same attack produce incompatible reports. These four are the lingua franca of global cybersecurity — you will meet them in every vendor report, CERT advisory and job interview.</p>\n<h3>3.1 The Cyber Kill Chain (Lockheed Martin, 2011)</h3>\n<p>Models an intrusion as seven sequential stages. The core insight is defensive: the adversary must complete every stage to succeed, so disrupting <em>any</em> stage breaks the chain — and the earlier, the cheaper.</p>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>Description &amp; defensive implication</th></tr></thead><tbody><tr><td>1. Reconnaissance</td><td>Gather target info — staff, tech, ranges, emails. Passive and equally available to the defender. <em>Run it on yourself first.</em></td></tr><tr><td>2. Weaponization</td><td>Build the weapon (malicious doc, exploit, phishing page). Not directly observable.</td></tr><tr><td>3. Delivery</td><td>The weapon reaches the target (email, link, USB, drive-by). Richest detection signal.</td></tr><tr><td>4. Exploitation</td><td>The weapon executes (macro runs, credential submitted). Patching, allow-listing, training.</td></tr><tr><td>5. Installation</td><td>Persistence established (backdoor, scheduled task, run key). EDR, file-integrity monitoring.</td></tr><tr><td>6. Command &amp; Control</td><td>The implant calls home. DNS filtering, proxy inspection, IDS/IPS.</td></tr><tr><td>7. Actions on Objectives</td><td>The mission: exfiltration, ransomware, fraud, sabotage. Cost rises fast — earlier detection is always cheaper.</td></tr></tbody></table></div>\n<p>Limitations: it models intrusions as linear; sophisticated actors restart, pivot, or run parallel chains, and it suits perimeter intrusions better than insider threats or cloud misconfigurations. Use it as a lens, not a template.</p>\n<h3>3.2 MITRE ATT&amp;CK</h3>\n<p>The most comprehensive, widely-adopted catalogue of <em>observed</em> adversary behaviour. Organised as <strong>Tactics</strong> (the \"why\", <code>TA####</code>) and <strong>Techniques</strong> (the \"how\", <code>T####</code>, often with sub-techniques).</p>\n<p>The Reconnaissance tactic (<strong>TA0043</strong>), most relevant here:</p>\n<div class='tablewrap'><table><thead><tr><th>Technique</th><th>Covers</th></tr></thead><tbody><tr><td>T1589 Gather Victim Identity Information</td><td>Names, emails, credentials, employee lists</td></tr><tr><td>T1590 Gather Victim Network Information</td><td>DNS records, IP ranges, topology</td></tr><tr><td>T1591 Gather Victim Org Information</td><td>Business relationships, supply chain, leadership</td></tr><tr><td>T1593 Search Open Websites/Domains</td><td>LinkedIn, social media, job posts, news</td></tr><tr><td>T1596 Search Open Technical Databases</td><td>Shodan, Certificate Transparency, WHOIS, RIRs</td></tr><tr><td>T1597 Search Closed Sources</td><td>Dark-web forums, breach databases</td></tr><tr><td>T1598 Phishing for Information</td><td>Active bait to elicit creds/info (gathering, not malware delivery)</td></tr></tbody></table></div>\n<p>When a report says \"the actor used T1055 Process Injection\", every analyst knows exactly what was done, what it achieves and what detects it. ATT&amp;CK notation is not optional for a practitioner.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Key concept</div><div class='callout-b'><p>The <strong>ATT&amp;CK Navigator</strong> (attack.mitre.org) lets you highlight techniques, compare actor profiles and build coverage heat maps. Use it to ask: which techniques does APT29 use? Which do we detect? The gap is your priority list.</p></div></div>\n<h3>3.3 The Diamond Model (Caltagirone, Pendergast &amp; Betz, 2013)</h3>\n<p>Frames every intrusion event as four linked vertices. Its power is <em>pivoting</em>: from one known vertex you reason toward the others.</p>\n<ul>\n<li><strong>Adversary</strong> — who is behind this? Motive? Other operations? (usually the goal of the investigation)</li>\n<li><strong>Capability</strong> — the tool/technique/malware/CVE used.</li>\n<li><strong>Infrastructure</strong> — domains, IPs, C2, VPN exits. Often reused across operations — the most fertile pivot point.</li>\n<li><strong>Victim</strong> — who was targeted, and why? Who else fits the profile?</li>\n</ul>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Diamond Model in practice</div><div class='callout-b'><p>A phishing email to a Ghanaian bank links to a credential page on a domain registered three days earlier (<strong>Capability</strong>). WHOIS shows the registrant email also registered six similar domains (<strong>Infrastructure</strong>), previously used against other West African banks. You now have a hypothesis about the <strong>Adversary</strong> (a financially-motivated actor targeting West African banks) and can warn profile-matching <strong>Victims</strong> proactively — before the current attack resolves.</p></div></div>\n<h3>3.4 The Pyramid of Pain (David Bianco, 2013)</h3>\n<p>Ranks indicators by one criterion: how much does blocking it <em>hurt</em> the adversary?</p>\n<div class='tablewrap'><table><thead><tr><th>Indicator (bottom → top)</th><th>Pain to adversary</th></tr></thead><tbody><tr><td>Hash values</td><td>Trivial — one byte changes the hash. Catches the already-seen, not the new.</td></tr><tr><td>IP addresses</td><td>Easy — rotated constantly; a 15-minute change.</td></tr><tr><td>Domain names</td><td>Moderate — minutes to change, but reputation is stickier; DGAs defeat it.</td></tr><tr><td>Network/host artefacts</td><td>Painful — strings, registry keys, mutexes; changing them means rewriting code.</td></tr><tr><td>Tools</td><td>Very painful — abandoning Cobalt Strike for a replacement is months of work.</td></tr><tr><td>TTPs</td><td>Maximum — changing methodology means retraining teams and rebuilding playbooks. This is where ATT&amp;CK operates.</td></tr></tbody></table></div>\n<p>The consequence: build detection as high up the pyramid as you can. A SOC that blocks IPs all day is losing; a SOC that detects \"credential dumping via LSASS access followed by lateral movement with stolen hashes\" catches the adversary across campaigns and tools.</p>\n<hr>\n<h2>4 · Indicators, Intelligence Levels &amp; Source Grading</h2>\n<h3>4.1 IOCs vs IOAs</h3>\n<p><strong>Indicators of Compromise (IOCs)</strong> are forensic evidence that something bad has happened or is happening — file hashes, C2 IPs, persistence registry keys, phishing domains. <strong>Indicators of Attack (IOAs)</strong> describe <em>behaviour</em> independent of tools — \"a process spawned a child that injected code into a system process which opened an outbound connection on a non-standard port.\"</p>\n<div class='tablewrap'><table><thead><tr><th></th><th>IOC</th><th>IOA</th></tr></thead><tbody><tr><td>Focus</td><td>What was found (artefact)</td><td>What is happening (behaviour)</td></tr><tr><td>Timing</td><td>Backward-looking</td><td>Real-time</td></tr><tr><td>Shelf life</td><td>Short — rotated</td><td>Durable</td></tr><tr><td>Pyramid level</td><td>Low (hashes, IPs, domains)</td><td>High (TTPs)</td></tr><tr><td>Coverage</td><td>Known threats only</td><td>Novel variants, zero-days</td></tr></tbody></table></div>\n<p>Use both: IOCs for automated blocking of known-bad at scale; IOAs for behavioural detection that survives when the adversary changes tools.</p>\n<h3>4.2 The four levels of threat intelligence</h3>\n<p>The commonest production failure is writing to the wrong audience.</p>\n<ul>\n<li><strong>Strategic</strong> (board, C-suite): trends, geopolitical context, long-term risk, legal obligations, financial/reputational impact. No jargon. Months–years.</li>\n<li><strong>Operational</strong> (CISO, IR lead): who is targeting your sector now, likely attack sequence, detection gaps, urgent controls. Weeks–months.</li>\n<li><strong>Tactical</strong> (detection engineers, hunters): specific TTPs to hunt, signatures to build, rules to tune. Days–weeks.</li>\n<li><strong>Technical</strong> (SOC, firewalls, TIP): specific indicators — IPs, domains, hashes, YARA/Sigma rules. Hours–days; often machine-consumed.</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Traffic Light Protocol (TLP)</div><div class='callout-b'><p>Every intelligence product carries a sharing marking. <strong>TLP:RED</strong> — named recipients only. <strong>TLP:AMBER</strong> — your organisation and partners. <strong>TLP:GREEN</strong> — your community/sector ISAC. <strong>TLP:CLEAR</strong> (formerly WHITE) — public.</p></div></div>\n<h3>4.3 Source grading — reliability vs credibility</h3>\n<p>Two products can contradict each other. Structured grading separates two questions that are often confused: how reliable is the <em>source</em>, and how credible is this specific <em>information</em>? The <strong>Admiralty (NATO)</strong> system grades them separately — source <code>A</code>–<code>F</code> (reliable → cannot be judged) and information <code>1</code>–<code>6</code> (confirmed → cannot be judged). A reliable source (A/B) can still pass on a rumour (4/5); an unreliable source can occasionally report something confirmed (1/2). In practice this is simplified to <strong>High / Medium / Low</strong> confidence — with the rule that every rating is justified in the text.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>The two deadliest analytic failures</div><div class='callout-b'><p><strong>Mirror-imaging</strong> — assuming the adversary thinks and acts the way you would. Actors in different cultural, organisational and economic contexts make decisions you would not. <strong>Crying wolf</strong> — issuing high-confidence assessments that prove wrong; one or two destroy a team's credibility for months. When confidence is medium or low, <em>say so</em> — it protects your credibility and calibrates the reader.</p></div></div>\n<hr>\n<h2>5 · Passive Reconnaissance — Theory and Practice</h2>\n<h3>5.1 The legal and ethical boundary</h3>\n<p><strong>Passive</strong> reconnaissance gathers information from public sources without touching the target's systems — legal, ethical, and available to attacker and defender alike. <strong>Active</strong> reconnaissance interacts with the target's systems (port scans) and, without written authorisation, is a criminal offence under <strong>Act 1038</strong> and its equivalents everywhere. In this module you run active tools <em>only</em> against the isolated <code>labctl</code> range.</p>\n<p>The rule: if your tool sends a packet to the target's own IP range, it is active. DNS queries to public resolvers are passive; WHOIS queries are passive; port scans are always active.</p>\n<h3>5.2 The DNS deep dive</h3>\n<p>DNS is the internet's address book — and for the analyst, far more: it reveals an organisation's infrastructure, email architecture and security posture, free, in seconds, without touching their systems.</p>\n<div class='tablewrap'><table><thead><tr><th>Record</th><th>Function</th><th>Intelligence value</th></tr></thead><tbody><tr><td>A / AAAA</td><td>Domain → IPv4 / IPv6</td><td>The IP infrastructure; pivot to co-hosted domains</td></tr><tr><td>MX</td><td>Mail servers</td><td>Reveals the email provider (Google, M365, on-prem)</td></tr><tr><td>TXT</td><td>Free-text strings</td><td>Holds SPF, DMARC pointers, DKIM selectors, verification tokens</td></tr><tr><td>NS</td><td>Authoritative name servers</td><td>The DNS hosting provider</td></tr><tr><td>CNAME</td><td>Alias</td><td>Reveals CDNs, SaaS, vendor relationships</td></tr><tr><td>SOA</td><td>Zone admin info</td><td>The admin contact email — a phishing target</td></tr><tr><td>CAA</td><td>Which CAs may issue certs</td><td>A missing CAA means any CA can issue</td></tr><tr><td>PTR</td><td>Reverse DNS (IP → name)</td><td>IP-to-domain relationships</td></tr></tbody></table></div>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — DNS intelligence series (lab)</span></div><pre><code>$ dig lab-corp.com.gh A +short            # IPv4 address\n$ dig lab-corp.com.gh MX +short           # mail servers + priority\n$ dig lab-corp.com.gh NS +short           # authoritative name servers\n$ dig lab-corp.com.gh TXT +short          # SPF + DMARC pointers\n$ dig _dmarc.lab-corp.com.gh TXT +short   # DMARC policy\n$ dig default._domainkey.lab-corp.com.gh TXT  # DKIM public key\n$ dig lab-corp.com.gh SOA +short          # zone admin contact\n$ dig lab-corp.com.gh CAA +short          # certificate authorisation</code></pre></div>\n<p><strong>Reading the output — the interpretation layer.</strong> Document every finding as a verified indicator (record type, value, date, assessment), then interpret:</p>\n<ul>\n<li><code>MX → aspmx.l.google.com</code> → the target uses Google Workspace → phishing pages should mimic Google login.</li>\n<li><code>SPF ends in ~all</code> (soft fail) → forged mail is still delivered → DMARC is the critical control.</li>\n<li><strong>No <code>_dmarc</code> record</strong> → no policy → the domain is effectively spoofable regardless of SPF.</li>\n<li><code>NS → aws</code> → DNS on Route53 → AWS credential compromise could allow DNS hijacking.</li>\n<li><code>SOA email</code> → the DNS administrator's direct contact is now a spearphishing target.</li>\n</ul>\n<h3>5.3 WHOIS intelligence</h3>\n<p>WHOIS is the registration database of the internet — registrant, organisation, registration/expiry dates, registrar, name servers. Privacy law redacts much personal data now, but corporate and historic registrations often retain it.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — WHOIS investigation</span></div><pre><code>$ whois lab-corp.com.gh                       # full registration record\n$ whois lab-corp.com.gh | grep -Ei 'creat|expir|registr'\n$ whois -h whois.afrinic.net 41.210.15.21     # AFRINIC — the RIR for Africa</code></pre></div>\n<p>Critical data points: a <strong>registration date</strong> of last week on a domain impersonating an established brand is a screaming red flag (domain squatting ahead of a BEC campaign); the <strong>registrant email</strong> is a pivot across other registrations; shared <strong>name servers</strong> link infrastructure.</p>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>GCB Bank BEC — the reconnaissance phase</div><div class='callout-b'><p>The 2021 GCB Bank BEC (GHS 2.3M) began with a recon phase that would have been <em>detectable</em>. Post-incident analysis showed: the attack domain was registered <strong>21 days</strong> before the first fraudulent email; the registrant email had registered four other look-alike domains targeting West African banks that year; and the attack domain's MX pointed to a free email provider — immediately distinguishing it from the legitimate <code>gcb.com.gh</code>. A passive monitoring programme — new-domain-registration alerting plus Certificate Transparency monitoring, both free and passive — would have surfaced the infrastructure <em>weeks</em> before it was used.</p></div></div>\n<h3>5.4 theHarvester — OSINT at scale</h3>\n<p><code>theHarvester</code> automates collection of email addresses, subdomains and IPs about a domain from search engines, Certificate Transparency, Shodan and more.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — theHarvester</span></div><pre><code>$ theHarvester -d lab-corp.com.gh -b all -l 200 -f report\n$ theHarvester -d lab-corp.com.gh -b crtsh      # certificate transparency only\n$ cat report.json | python3 -m json.tool | less</code></pre></div>\n<p>From the attacker's view the output is a targeting list; from the defender's it is an asset list that needs protection — every exposed email is a phishing victim who needs training, every subdomain an attack surface for the inventory.</p>\n<hr>\n<h2>6 · Email Authentication — SPF, DKIM, DMARC &amp; BIMI</h2>\n<p>Email authentication is the single most impactful control available to any organisation for <strong>zero additional cost</strong> — and the most misunderstood area of this module. Most BEC, domain-spoofing phishing and impersonation fraud (the dominant financial-fraud vector in West Africa) depends on the target having failed to deploy these three DNS-based controls.</p>\n<h3>6.1 Why email is fundamentally broken</h3>\n<p>Email was designed in 1971 for a world with no adversaries. SMTP, which still underlies all email, was built with complete trust: a server could claim to send from any domain and the receiver had no way to verify it — like posting a letter with a fake return address. The <code>From:</code> header the recipient sees can be set to any value. Without authentication, nothing stops an attacker setting <code>From: ceo@yourbank.com</code> and sending from a server anywhere.</p>\n<h3>6.2 SPF — Sender Policy Framework</h3>\n<p>A TXT record listing which servers may send for the domain, ending in a qualifier: <code>-all</code> (<strong>hard fail</strong> — reject everything else), <code>~all</code> (<strong>soft fail</strong> — \"probably forged, deliver anyway\"), <code>?all</code> (neutral — worthless).</p>\n<p><code>v=spf1 ip4:41.210.15.21 include:_spf.google.com -all</code></p>\n<p>SPF's weakness: it validates the <em>envelope</em> sender (Return-Path), not the visible <code>From:</code> header — so SPF alone does not stop display-domain spoofing.</p>\n<h3>6.3 DKIM — DomainKeys Identified Mail</h3>\n<p>The sending server signs the message with a private key; the public key is published in DNS at a <em>selector</em> (<code>selector._domainkey.domain</code>). The receiver verifies the signature — proving the message was genuinely sent by the domain and not altered in transit. DKIM survives forwarding where SPF often breaks.</p>\n<h3>6.4 DMARC — the policy layer that ties it together</h3>\n<p>Published at <code>_dmarc.domain</code>: <code>v=DMARC1; p=reject; rua=mailto:dmarc@domain; pct=100</code></p>\n<p>Two things make DMARC decisive:</p>\n<ul>\n<li><strong>Policy (<code>p</code>)</strong> — <code>none</code> (monitor only — <em>no protection</em>), <code>quarantine</code> (spam folder), or <code>reject</code> (refuse outright).</li>\n<li><strong>Alignment</strong> — DMARC requires the SPF/DKIM-validated domain to <em>match the visible <code>From:</code> domain</em>. This is what finally stops display-domain spoofing, which SPF and DKIM alone do not.</li>\n</ul>\n<p>The <code>rua</code> address receives aggregate reports — invaluable for seeing who is sending as you. <strong>No DMARC record, or <code>p=none</code>, means the domain is effectively spoofable.</strong> Publishing <code>p=reject</code> is free and is the single highest-value anti-phishing control for your own brand.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>The exact combination to look for</div><div class='callout-b'><p>A domain with <strong>SPF <code>~all</code></strong> <em>and</em> <strong>no DMARC</strong> is wide open. The soft-fail delivers forged mail, and with no policy there is nothing to reject it and no alignment check. This is the precise exposure you will confirm in the lab — and the exact gap behind most Ghanaian BEC.</p></div></div>\n<h3>6.5 BIMI — the incentive layer</h3>\n<p>Brand Indicators for Message Identification lets a domain publish its logo (via a <code>default._bimi</code> TXT record and a verified mark certificate) to display beside authenticated mail in supporting clients. BIMI <strong>requires DMARC at enforcement (<code>quarantine</code>/<code>reject</code>)</strong> — so it is both a brand-trust feature and a business incentive to finally deploy DMARC properly.</p>\n<hr>\n<h2>7 · Writing the Threat Brief</h2>\n<p>Findings are worthless until a decision-maker can act on them. A professional brief is <strong>BLUF-first</strong> (Bottom Line Up Front):</p>\n<ol>\n<li><strong>BLUF</strong> — the key judgement and recommended action, in the first two sentences.</li>\n<li><strong>Verified indicators (facts)</strong> — each with its source and the date retrieved.</li>\n<li><strong>Assessment (hypotheses)</strong> — each labelled with a confidence level and its basis.</li>\n<li><strong>Recommended actions</strong> — specific, prioritised, owned.</li>\n<li><strong>Knowledge gaps</strong> — an honest statement of what you do <em>not</em> yet know.</li>\n</ol>\n<p>Write to the audience level (§4.2). The three failures that destroy a brief: <strong>presenting an assessment as a fact</strong>; <strong>burying the decision</strong> at the bottom; and <strong>omitting confidence levels</strong> so the reader cannot calibrate.</p>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Worked BLUF</div><div class='callout-b'><p>\"We assess with <strong>medium confidence</strong> that our supplier-payment domain is being prepared for a spoofing campaign, based on a look-alike domain registered on 2026-10-01 and the absence of a DMARC policy on our own domain (both verified below). <strong>Recommended action:</strong> publish DMARC <code>p=reject</code> this week and brief the finance team on callback verification before the next payment run.\"</p></div></div>\n<hr>\n<h2>8 · The Lab &amp; Assessment</h2>\n<p><code>labctl start m1</code> brings up an isolated authoritative DNS server for a fictional organisation plus a captured OSINT report. Your practicum, mirroring §5–§7:</p>\n<ol>\n<li>Enumerate the zone with <code>dig</code> — A, MX, NS, TXT, SOA, CAA, and the DKIM selector.</li>\n<li>Read the <strong>SPF</strong> record and identify its qualifier; check for a <strong>DMARC</strong> policy.</li>\n<li>Investigate the domain's registration via the provided WHOIS record.</li>\n<li>Read the OSINT report for exposed staff and subdomains.</li>\n<li>Map every finding to a MITRE ATT&amp;CK Reconnaissance technique.</li>\n<li>Submit your findings with <code>labctl verify m1</code>, then assemble the one-page threat brief (<code>labctl worksheet m1</code>).</li>\n</ol>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Note</div><div class='callout-b'><p>Everything runs on this machine. Use the built-in <strong>Terminal</strong> tab, or your own Kali terminal. Only ever query the lab targets — the rules of engagement in the Day-1 orientation (<code>labctl learn m0</code>) apply.</p></div></div>\n<hr>\n<h2>Key takeaways</h2>\n<ul>\n<li>CTI is <strong>actionable, timely, accurate</strong> intelligence — the product of a cycle, not a pile of data.</li>\n<li>Speak in frameworks: <strong>Kill Chain</strong> (where in the intrusion), <strong>ATT&amp;CK</strong> (which technique), <strong>Diamond</strong> (how to pivot), <strong>Pyramid of Pain</strong> (how durable the indicator).</li>\n<li><strong>IOC = what happened; IOA = behaviour now.</strong> Push detection up the pyramid, toward TTPs.</li>\n<li>Write to the right <strong>level</strong> and tag <strong>confidence</strong>; keep fact separate from assessment.</li>\n<li><strong>No DMARC / <code>p=none</code> = spoofable.</strong> <code>-all</code> + DKIM + DMARC <code>p=reject</code> (with alignment) is the goal.</li>\n<li>Recon techniques: <strong>T1589 / T1590 / T1598</strong>, under tactic <strong>TA0043</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>A domain publishes <code>v=spf1 include:_spf.google.com ~all</code> and has no <code>_dmarc</code> record. How exposed is it, and why?</strong> → Highly exposed. <code>~all</code> only soft-fails forged mail (still delivered), and with no DMARC there is no policy to reject it and no alignment check — an attacker can send mail that appears to come from the domain and it will land.</li>\n</ol>\n<ol>\n<li><strong>Rank by the Pyramid of Pain: blocking a file hash, a C2 IP, or forcing a change of techniques.</strong> → TTPs (most pain) &gt; C2 IP &gt; file hash (least — trivially recompiled). Aim defence as high as possible.</li>\n</ol>\n<ol>\n<li><strong>Give an IOC and an IOA for a brute-force login.</strong> → IOC: a known-bad source IP in the logs. IOA: \"many failed authentications from one source followed by a success.\"</li>\n</ol>\n<ol>\n<li><strong>Which is passive: <code>nmap -sV target</code> or <code>dig target MX</code>? Why does it matter legally?</strong> → <code>dig</code> — it reads public DNS, never touching the target. <code>nmap -sV</code> actively probes the target, which without written authorisation is an offence under Act 1038.</li>\n</ol>\n<ol>\n<li><strong>What makes \"we assess with medium confidence that our supplier domain is being prepared for spoofing\" a professional statement rather than alarmism?</strong> → It is labelled an <em>assessment</em> (not a fact) and carries an explicit <em>confidence level</em>, followed by the verified facts and a recommended action.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>CTI</strong> — cyber threat intelligence: evidence-led understanding of adversaries.</li>\n<li><strong>Intelligence cycle</strong> — Planning → Collection → Processing → Analysis → Dissemination.</li>\n<li><strong>Cyber Kill Chain</strong> — the 7-stage model of an intrusion.</li>\n<li><strong>MITRE ATT&amp;CK</strong> — catalogue of tactics (<code>TA…</code>) and techniques (<code>T…</code>).</li>\n<li><strong>Diamond Model</strong> — adversary · capability · infrastructure · victim.</li>\n<li><strong>Pyramid of Pain</strong> — indicators ranked by how much blocking them hurts the attacker.</li>\n<li><strong>IOC / IOA</strong> — indicator of compromise / of attack.</li>\n<li><strong>SPF / DKIM / DMARC / BIMI</strong> — authorised-sender list / signature / enforcement policy with alignment / brand-logo incentive layer.</li>\n<li><strong>TLP</strong> — Traffic Light Protocol for controlling intelligence sharing.</li>\n<li><strong>Admiralty grading</strong> — grading source reliability and information credibility separately.</li>\n<li><strong>CERT-GH / CSA</strong> — Ghana's national incident-response team / Cyber Security Authority.</li>\n</ul>\n<h2>Further reading</h2>\n<ul>\n<li>MITRE ATT&amp;CK — attack.mitre.org (and the ATT&amp;CK Navigator)</li>\n<li>Lockheed Martin — <em>Intelligence-Driven Computer Network Defense</em> (the Kill Chain paper)</li>\n<li>Caltagirone, Pendergast &amp; Betz — <em>The Diamond Model of Intrusion Analysis</em></li>\n<li>David Bianco — <em>The Pyramid of Pain</em></li>\n<li>Ghana Cyber Security Authority — csa.gov.gh (CERT-GH advisory archive)</li>\n<li>M3AAWG / dmarc.org — SPF, DKIM and DMARC deployment guidance</li>\n</ul>", "sheets": [{"name": "m1-threat-intelligence-brief.md", "html": "<h1>Threat Intelligence Brief — Module 1 Deliverable</h1>\n<p><strong>Prepared by:</strong> [your name]  <strong>Date/time:</strong> [YYYY-MM-DD HH:MM] <strong>Subject:</strong> [e.g. Exposure assessment of lab-corp.com.gh] <strong>Classification:</strong> [internal / restricted]</p>\n<blockquote>A good brief separates <strong>fact</strong> from <strong>assessment</strong>, and every assessment</blockquote>\n<blockquote>carries a <strong>confidence level</strong> (low / medium / high). Never state a hypothesis</blockquote>\n<blockquote>as a fact. See <code>labctl learn m1</code>.</blockquote>\n<h2>1. Bottom line up front (BLUF) — 2–3 sentences</h2>\n<p>[What a decision-maker must know first: the key finding and the recommended immediate action.]</p>\n<h2>2. Verified indicators (facts)</h2>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Indicator</th><th>Source / how verified</th><th>ATT&amp;CK (if any)</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> No DMARC record published for the domain</td><td><code>dig TXT _dmarc.&lt;domain&gt;</code> → NXDOMAIN</td><td>T1590</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td></tr></tbody></table></div>\n<h2>3. Assessment (hypotheses — label confidence)</h2>\n<ul>\n<li>[Finding] → <em>We assess …</em> <strong>[confidence: low/med/high]</strong> because [reasoning].</li>\n<li>[FILL IN]</li>\n</ul>\n<h2>4. Attacker's likely next step</h2>\n<p>[Given the exposure, what would an attacker do? e.g. spoof the domain to phish the finance team, since SPF is weak and DMARC absent.]</p>\n<h2>5. Recommended immediate actions</h2>\n<ol>\n<li>[e.g. Publish a DMARC record with p=reject — free, blocks domain spoofing]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>6. What we do NOT yet know</h2>\n<p>[Be explicit about gaps — this is what separates intelligence from guessing.]</p>"}]}, "m2": {"day": 1, "title": "Module 2 — Institutional Cyber Risk & Digital Resilience", "lesson": "<h1>Module 2 — Institutional Cyber Risk &amp; Digital Resilience</h1>\n<p><strong>Day 1 · Afternoon · Leadership module (no Kali lab — you build a risk register)</strong></p>\n<p>Cyber risk is not an IT problem that occasionally bothers the business. It <em>is</em> business risk — operational, financial, legal, safety and reputational, all at once — that happens to travel through computers. This module gives you the discipline to measure it, rank it, own it, and decide what to do about it, using the same frameworks a regulator or an auditor will expect to see.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>express a technical threat as a board-ready business-risk statement;</li>\n<li>assess risk using a structured method (likelihood × impact, inherent vs residual) and know where quantitative methods like FAIR fit;</li>\n<li>place controls against the six NIST CSF 2.0 functions and set RTO/RPO per service;</li>\n<li>build a risk register that drives decisions, with named owners and review dates.</li>\n</ul>\n<hr>\n<h2>1. The big picture: risk is a decision tool, not a feeling</h2>\n<p>A <strong>risk</strong> is the combination of how <em>likely</em> a harmful event is and how <em>badly</em> it would hurt. The purpose of assessing it is singular: <strong>to decide where to spend finite money and attention first.</strong> You cannot fix everything, so you rank.</p>\n<p>Write every risk as a sentence a non-technical director understands:</p>\n<blockquote>IF <em>[a threat]</em> exploits <em>[a vulnerability]</em>, THEN the institution suffers</blockquote>\n<blockquote><em>[a business consequence]</em>.</blockquote>\n<p><em>IF an attacker exploits our unpatched internet-facing VPN, THEN citizen records are stolen and we face DPC penalties, breach-notification costs and loss of public trust.</em> Notice the consequence is money, law and trust — not \"a box gets owned\". Boards fund consequences they can see.</p>\n<p>The vocabulary auditors expect you to use precisely:</p>\n<ul>\n<li><strong>Threat</strong> (the actor/event), <strong>vulnerability</strong> (the weakness), <strong>likelihood</strong>, <strong>impact</strong>.</li>\n<li><strong>Inherent risk</strong> — the exposure with <em>no</em> controls. <strong>Residual risk</strong> — what remains <em>after</em> your controls. The gap is the value your controls deliver.</li>\n<li><strong>Risk appetite</strong> — how much risk the organisation is <em>willing</em> to take to pursue its goals; <strong>risk tolerance</strong> — the acceptable variation around that.</li>\n<li><strong>Risk owner</strong> — the single named person accountable for a risk.</li>\n</ul>\n<h2>2. How risk assessment actually works</h2>\n<p>The common method is <strong>qualitative</strong>: score likelihood and impact (say 1–5), multiply or plot on a 5×5 heat map, and rank. It is fast and communicates well to a board. Its weakness is false precision — \"a 15\" feels exact but is a judgement. Tie every score to <strong>evidence</strong>: a scan result, a past incident, a missing control, a threat-intel report (Module 1).</p>\n<p>Where decisions are large (a multi-million-cedi control, cyber-insurance limits), professionals add <strong>quantitative</strong> analysis. <strong>FAIR</strong> (Factor Analysis of Information Risk) decomposes risk into loss-event <em>frequency</em> and <em>magnitude</em> and expresses it in money with ranges — e.g. \"annual loss exposure: GHS 0.4M–3.1M, most likely 1.2M\". That lets a board compare a security spend against the loss it avoids, like any other investment. The structured public standards behind all of this are <strong>NIST SP 800-30</strong> (risk assessment), <strong>ISO/IEC 27005</strong> (risk management) and <strong>ISO 31000</strong> (enterprise risk).</p>\n<p>Four <strong>treatments</strong> — memorise them, because an auditor will ask which you chose and why:</p>\n<ul>\n<li><strong>Mitigate</strong> — add controls to cut likelihood or impact (patch, MFA, backups).</li>\n<li><strong>Transfer</strong> — shift the cost (cyber insurance, a contractual indemnity).</li>\n<li><strong>Avoid</strong> — stop the risky activity (decommission the exposed service).</li>\n<li><strong>Accept</strong> — knowingly live with it — <strong>only</strong> with a named owner and a review date. <em>Acceptance without accountability is negligence.</em></li>\n</ul>\n<h2>3. NIST CSF 2.0 — the control map boards now answer to</h2>\n<p>Controls are organised against six functions. CSF 2.0 (2024) added <strong>GOVERN</strong> at the centre, and that is the headline: cybersecurity is now explicitly a <strong>board-level accountability</strong>, not a task delegated to \"the IT person\".</p>\n<div class='tablewrap'><table><thead><tr><th>Function</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Accountability, strategy, policy, risk appetite</td><td>Board approves the cyber-risk policy and budget</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Know your assets, data, dependencies and risks</td><td>A current asset inventory exists</td></tr><tr><td><strong>PROTECT</strong></td><td>Deploy safeguards</td><td>MFA everywhere; patching; staff trained</td></tr><tr><td><strong>DETECT</strong></td><td>Notice when something's wrong</td><td>SIEM alerts reviewed daily</td></tr><tr><td><strong>RESPOND</strong></td><td>Act on an incident</td><td>A tested plan; who calls whom</td></tr><tr><td><strong>RECOVER</strong></td><td>Restore and learn</td><td>Backups tested monthly; lessons applied</td></tr></tbody></table></div>\n<p>Resilience — the \"Recover\" discipline — is set per critical service by two numbers business owners agree in advance: <strong>RTO</strong> (Recovery Time Objective — the longest acceptable downtime) and <strong>RPO</strong> (Recovery Point Objective — the most data you can afford to lose). These are business decisions, not IT guesses.</p>\n<h2>4. An analogy</h2>\n<p>Insuring a building against fire: you don't buy a sprinkler for every cupboard on day one. You ask how likely a fire is and how bad it would be. A paper archive (high impact) beside an old fuse box (high likelihood) jumps to the top. Then you choose: sprinklers (<strong>mitigate</strong>), insurance (<strong>transfer</strong>), stop storing paper there (<strong>avoid</strong>), or decide it's small enough to live with — and write that down with a name against it (<strong>accept</strong>). Cyber-risk treatment is exactly these four choices, applied with evidence.</p>\n<h2>5. Scenarios — risk owned, and risk ignored</h2>\n<h3>Local (Ghana)</h3>\n<ul>\n<li><strong>CSSPS disruption, 2022 (~500,000 students affected).</strong> As institutional risk: the <em>likelihood</em> of a targeted attack on a high-visibility national system was real and knowable; the <em>impact</em> — half a million families unable to confirm placements — was severe across availability, reputation and public trust. The governing questions were owed <em>before</em> the event: Who owned this risk? Was there an RTO for the service? Was recovery tested? A risk register forces those answers in advance.</li>\n<li>Under <strong>Act 1038</strong>, the CSA can request your risk documentation. A current, owned register is not just good practice — it is something a regulator may demand to see.</li>\n</ul>\n<h3>International (well-documented)</h3>\n<ul>\n<li><strong>Equifax, 2017 (147M+ people).</strong> A <em>known</em> vulnerability in Apache Struts (CVE-2017-5638) had a patch available for months. The risk was identifiable and treatable — and effectively <em>accepted by inaction</em>, with no owner. This is what \"acceptance without accountability\" looks like at scale.</li>\n<li><strong>Maersk / NotPetya, 2017 (~US$300M loss).</strong> A destructive worm halted the world's largest shipping line. The decisive factor in survival was <em>resilience</em> — one surviving domain-controller backup in Ghana (by chance) let them rebuild. The lesson boards remember: tested recovery (RTO/RPO) is not optional.</li>\n</ul>\n<p>The pattern: organisations rarely fail because a risk was <em>unknown</em>. They fail because a known risk had <strong>no owner and no treatment</strong>.</p>\n<h2>6. Why it matters</h2>\n<ul>\n<li>A ranked register tells leadership exactly where the next cedi of security budget should go — and lets them defend that choice.</li>\n<li>Named owners convert a wish list into accountability.</li>\n<li>RTO/RPO agreed in advance prevent the paralysing \"how long until we're back?\" argument <em>during</em> an outage.</li>\n</ul>\n<h2>7. Common mistakes</h2>\n<ul>\n<li><strong>A register with no owners</strong> — a wish list, not a risk register.</li>\n<li><strong>Scoring by gut</strong> — every score needs evidence behind it.</li>\n<li><strong>Treating all risks equally</strong> — the entire point is to rank and triage.</li>\n<li><strong>Silent acceptance</strong> — every accepted risk needs a name and a revi
