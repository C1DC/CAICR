<script>
const DATA = {"m1": {"day": 1, "title": "Module 1 — Threat Landscape & Cyber Threat Intelligence", "lesson": "<h1>Module 1 — Threat Landscape &amp; Cyber Threat Intelligence</h1>\n<p><strong>Day 1 · Morning · Hands-on lab: <code>labctl start m1</code></strong></p>\n<p>In one sentence: before you can defend an organisation, you have to understand <em>who</em> would attack it, <em>why</em>, and <em>how</em> — and then learn to gather that understanding yourself, the same way the attackers gather it about you.</p>\n<p>By the end of this module you will be able to:</p>\n<ul>\n<li>explain the five security properties and the main types of threat actor in plain language;</li>\n<li>run passive reconnaissance against a domain and read what it tells an attacker;</li>\n<li>spot a missing email-authentication control (DMARC) that makes spoofing easy;</li>\n<li>turn raw findings into a short, honest threat brief for a decision-maker.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>Every security decision you will ever make protects one of five things:</p>\n<ul>\n<li><strong>Confidentiality</strong> — only the right people can see the data.</li>\n<li><strong>Integrity</strong> — the data has not been secretly changed.</li>\n<li><strong>Availability</strong> — the system is there when people need it.</li>\n<li><strong>Authenticity</strong> — the person or system is really who they claim to be.</li>\n<li><strong>Business continuity</strong> — the organisation keeps functioning through trouble.</li>\n</ul>\n<p>The first three (the classic <strong>CIA triad</strong>) are the core; the last two matter enormously in the real world, especially for banks, hospitals and government. A useful habit: when something goes wrong, ask <em>\"which of these five just broke?\"</em> A ransomware attack breaks <strong>availability</strong>. A leaked customer database breaks <strong>confidentiality</strong>. A forged payment instruction breaks <strong>integrity</strong> and <strong>authenticity</strong> at once.</p>\n<p>Attacks don't come from a faceless \"hacker in a hoodie\". They come from people with motives. The main <strong>threat actors</strong> are:</p>\n<ul>\n<li><strong>Organised criminals</strong> — in it for money. Ransomware, fraud, BEC. This is the dominant threat to Ghanaian institutions.</li>\n<li><strong>Insiders</strong> — staff or contractors, malicious or just careless. The over-privileged employee who clicks a link is as dangerous as the angry one.</li>\n<li><strong>Nation-state actors</strong> — well-funded, patient, after espionage or disruption.</li>\n<li><strong>Hacktivists</strong> — want attention for a cause; typically defacement or leaks.</li>\n<li><strong>Opportunists / \"script kiddies\"</strong> — use ready-made tools against whoever is exposed. You become a target simply by having an open door.</li>\n</ul>\n<p>Knowing <em>who</em> is likely to target you changes <em>how</em> you defend. A rural clinic and the Bank of Ghana face different adversaries and need different priorities.</p>\n<h2>An analogy</h2>\n<p>Think of a burglar casing a house before breaking in. They don't smash a window on day one. First they walk past, note which lights are on, read the name on the post box, check the bins for delivery labels, watch when the family leaves. <em>None of that is illegal and none of it touches the house.</em> By the time they act, they already know the easy way in.</p>\n<p><strong>Reconnaissance</strong> is exactly that, for networks. Attackers read your public DNS records, your staff email addresses on LinkedIn, your expired certificates — all public, all \"passive\". Cyber threat intelligence is you learning to walk past your own house and see what the burglar sees.</p>\n<h2>How it actually works</h2>\n<p>Reconnaissance splits into two kinds:</p>\n<ol>\n<li><strong>Passive</strong> — you only touch <em>public</em> sources, never the target's own systems. DNS lookups, WHOIS registration data, search engines, breach dumps, social media. The target cannot tell you were looking. This is where M1 lives.</li>\n<li><strong>Active</strong> — you probe the target directly (port scans, etc.). Louder, and in many places illegal without permission. That's Module 3.</li>\n</ol>\n<p>The three passive tools you'll use:</p>\n<ul>\n<li><strong><code>dig</code></strong> queries DNS — the internet's address book. It reveals a domain's mail servers (<code>MX</code>), its published anti-spoofing policy (<code>TXT</code> records for <strong>SPF</strong> and <strong>DMARC</strong>), its name servers, and its addresses.</li>\n<li><strong><code>whois</code></strong> shows who registered a domain and <em>when</em>. A look-alike domain registered three days before a fraud email is a screaming red flag.</li>\n<li><strong><code>theHarvester</code></strong> sweeps public sources for a domain's email addresses and host names — the raw material for a phishing target list.</li>\n</ul>\n<p>The single most important finding in this module is about <strong>email spoofing</strong>. Three DNS-based controls decide whether an attacker can forge mail from your domain:</p>\n<ul>\n<li><strong>SPF</strong> says <em>which servers are allowed to send mail</em> for your domain. It ends in a qualifier: <code>-all</code> (hard fail — reject everything else) or the weaker <code>~all</code> (soft fail — \"probably bad, but deliver anyway\").</li>\n<li><strong>DKIM</strong> adds a cryptographic signature proving the message wasn't altered.</li>\n<li><strong>DMARC</strong> ties them together and tells receivers <em>what to do</em> when SPF/DKIM fail — and whether to report abuse back to you. <strong>No DMARC record means no policy: anyone can spoof your domain and mail still lands in inboxes.</strong></li>\n</ul>\n<p>Once you have findings, you <strong>map them to MITRE ATT&amp;CK</strong> — a shared catalogue of attacker techniques. Reconnaissance of this kind is tactic <strong>TA0043</strong>, technique <strong>T1590</strong> (<em>Gather Victim Network Information</em>). Speaking in ATT&amp;CK IDs lets defenders worldwide compare notes precisely instead of waving their hands.</p>\n<h2>Ghana in focus</h2>\n<p>In the <strong>GCB Bank BEC</strong> case, roughly <strong>GHS 2.3 million</strong> was lost after attackers impersonated a supplier by email. The attack <em>started</em> with reconnaissance exactly like M1: the criminals identified the finance team, registered a look-alike supplier domain weeks ahead, and studied the relationship — all before a single malicious email was sent. Had anyone on the defending side run the same passive checks on their own supplier domains, the missing DMARC and the freshly-registered look-alike would have stood out.</p>\n<p>CERT-GH (the national incident response team, under the Cyber Security Authority) publishes advisories at <strong>csa.gov.gh</strong>. Reading them is itself a form of threat intelligence — it tells you what is actively hitting Ghanaian organisations <em>right now</em>.</p>\n<h2>Why it matters</h2>\n<p>Reconnaissance findings are cheap to fix and devastating to ignore:</p>\n<ul>\n<li>Publishing a strong <strong>DMARC</strong> record (<code>p=reject</code>) is free and blocks the most common phishing technique against your brand.</li>\n<li>Knowing which staff emails are public tells you who needs the most phishing training.</li>\n<li>A threat brief that separates <strong>fact from assumption</strong> lets leaders act without panicking. \"We confirmed the supplier domain has no DMARC (fact); we assess spoofing is likely (assessment, medium confidence)\" is useful. \"We got hacked!\" is not.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Treating <code>~all</code> as safe.</strong> A soft-fail SPF still delivers forged mail. Weak SPF with no DMARC is barely better than nothing.</li>\n<li><strong>Confusing SPF and DMARC.</strong> SPF alone, without DMARC, has no enforcement policy. Both are needed.</li>\n<li><strong>Stating assumptions as facts.</strong> Intelligence always carries a <em>confidence level</em>. Never present a hypothesis as proven.</li>\n<li><strong>Running active tools in the recon phase.</strong> Passive means passive — touching the target's systems during \"recon\" can itself be an offence.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p>Run <code>labctl start m1</code>. You'll get an isolated DNS server for a fictional company and a captured OSINT report. Use <code>dig</code> to pull its MX, SPF and DMARC records, notice what's <em>missing</em>, and read the OSINT report for exposed staff emails. Then <code>labctl verify m1</code> grades your findings and <code>labctl learn m1</code> (this lesson) explains the <em>why</em> behind each one.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>Five properties: <strong>confidentiality, integrity, availability, authenticity, continuity</strong> — name the one that broke.</li>\n<li>Attackers are <strong>people with motives</strong>; organised crime is Ghana's top threat.</li>\n<li><strong>Passive recon</strong> reads public data without touching the target — DNS, WHOIS, OSINT.</li>\n<li><strong>No DMARC = spoofable.</strong> <code>~all</code> SPF is weak; <code>-all</code> + DMARC <code>p=reject</code> is the goal.</li>\n<li>Map findings to <strong>MITRE ATT&amp;CK</strong> and write briefs that separate <strong>fact from assessment</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>A hospital's records system is knocked offline during surgery. Which security property failed?</strong> → <em>Availability.</em> The data wasn't stolen or changed; it simply wasn't there when needed — which in healthcare can be the most dangerous failure of all.</li>\n</ol>\n<ol>\n<li><strong>You find a domain publishes SPF ending in <code>~all</code> and has no <code>_dmarc</code> record. Why is that dangerous?</strong> → <code>~all</code> tells receivers forged mail is only \"probably\" bad, and the absence of DMARC means there is no instruction to reject it. An attacker can spoof the domain and the mail still reaches inboxes.</li>\n</ol>\n<ol>\n<li><strong>Which is passive reconnaissance?</strong> (a) Running Nmap against the target's servers (b) Querying the target's DNS records with <code>dig</code> → <em>(b).</em> <code>dig</code> reads the public DNS address book; it never touches the target's own systems. Nmap actively probes them — that's active recon.</li>\n</ol>\n<ol>\n<li><strong>What does mapping a finding to MITRE ATT&amp;CK <code>T1590</code> give you?</strong> → A precise, shared label (\"Gather Victim Network Information\") so any defender anywhere knows exactly which attacker behaviour you mean.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>OSINT</strong> — open-source intelligence; information gathered from public sources.</li>\n<li><strong>SPF / DKIM / DMARC</strong> — the three DNS-based email-authentication controls.</li>\n<li><strong>IOC</strong> — indicator of compromise (e.g., a malicious IP); evidence an attack happened. Contrast <strong>IOA</strong>, indicator of attack (behaviour in progress).</li>\n<li><strong>MITRE ATT&amp;CK</strong> — a public catalogue of real-world attacker tactics and techniques, each with an ID like <code>T1590</code>.</li>\n<li><strong>Confidence level</strong> — how sure you are of an intelligence claim; always state it.</li>\n</ul>", "sheets": [{"name": "m1-threat-intelligence-brief.md", "html": "<h1>Threat Intelligence Brief — Module 1 Deliverable</h1>\n<p><strong>Prepared by:</strong> [your name]  <strong>Date/time:</strong> [YYYY-MM-DD HH:MM] <strong>Subject:</strong> [e.g. Exposure assessment of lab-corp.com.gh] <strong>Classification:</strong> [internal / restricted]</p>\n<blockquote>A good brief separates <strong>fact</strong> from <strong>assessment</strong>, and every assessment</blockquote>\n<blockquote>carries a <strong>confidence level</strong> (low / medium / high). Never state a hypothesis</blockquote>\n<blockquote>as a fact. See <code>labctl learn m1</code>.</blockquote>\n<h2>1. Bottom line up front (BLUF) — 2–3 sentences</h2>\n<p>[What a decision-maker must know first: the key finding and the recommended immediate action.]</p>\n<h2>2. Verified indicators (facts)</h2>\n<table><thead><tr><th>#</th><th>Indicator</th><th>Source / how verified</th><th>ATT&amp;CK (if any)</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> No DMARC record published for the domain</td><td><code>dig TXT _dmarc.&lt;domain&gt;</code> → NXDOMAIN</td><td>T1590</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td></tr></tbody></table>\n<h2>3. Assessment (hypotheses — label confidence)</h2>\n<ul>\n<li>[Finding] → <em>We assess …</em> <strong>[confidence: low/med/high]</strong> because [reasoning].</li>\n<li>[FILL IN]</li>\n</ul>\n<h2>4. Attacker's likely next step</h2>\n<p>[Given the exposure, what would an attacker do? e.g. spoof the domain to phish the finance team, since SPF is weak and DMARC absent.]</p>\n<h2>5. Recommended immediate actions</h2>\n<ol>\n<li>[e.g. Publish a DMARC record with p=reject — free, blocks domain spoofing]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>6. What we do NOT yet know</h2>\n<p>[Be explicit about gaps — this is what separates intelligence from guessing.]</p>"}]}, "m2": {"day": 1, "title": "Module 2 — Institutional Cyber Risk & Digital Resilience", "lesson": "<h1>Module 2 — Institutional Cyber Risk &amp; Digital Resilience</h1>\n<p><strong>Day 1 · Afternoon · Leadership module (no Kali lab — you build a risk register)</strong></p>\n<p>In one sentence: cyber risk is not an \"IT problem\" — it is business risk that happens to involve computers, and this module teaches you to measure it, own it, and decide what to do about it.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>express a cyber threat as a clear business-risk statement;</li>\n<li>score risk by likelihood and impact, and tell inherent from residual risk;</li>\n<li>place controls against the six NIST CSF 2.0 functions;</li>\n<li>build a risk register that a board would actually act on.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>A <strong>risk</strong> is the chance that something bad happens <em>and</em> how much it would hurt. In cyber, the \"something bad\" is a threat exploiting a weakness. We write it as a sentence anyone can understand:</p>\n<blockquote>IF <em>[a threat]</em> exploits <em>[a vulnerability]</em>, THEN the institution faces</blockquote>\n<blockquote><em>[a business consequence]</em>.</blockquote>\n<p>For example: <em>IF an attacker exploits our unpatched remote-access server, THEN citizen records could be stolen and we face DPC penalties and public trust loss.</em> Notice the consequence is in <strong>business terms</strong> — money, trust, legal, safety — not \"a server gets owned\". Boards fund consequences they understand.</p>\n<p>Two numbers turn a scenario into a comparable risk:</p>\n<ul>\n<li><strong>Likelihood</strong> — how probable is it? (e.g., 1–5)</li>\n<li><strong>Impact</strong> — how bad if it happens? (e.g., 1–5)</li>\n</ul>\n<p>Multiply (or plot on a grid) and you get a <strong>risk rating</strong> you can rank against every other risk. That ranking is the whole point: you cannot fix everything, so you fix the biggest risks first.</p>\n<p>Then distinguish two states of every risk:</p>\n<ul>\n<li><strong>Inherent risk</strong> — how bad it is with <em>no controls</em>.</li>\n<li><strong>Residual risk</strong> — what's <em>left</em> after your controls are in place.</li>\n</ul>\n<p>The gap between them is the value your controls deliver. Residual risk is what leadership must consciously <strong>accept, or reduce further</strong>.</p>\n<h2>An analogy</h2>\n<p>Think of insuring a building against fire. You don't start by buying a sprinkler for every cupboard. You ask: how likely is a fire, and how bad would it be? A paper archive (high impact) near an old fuse box (high likelihood) jumps to the top. You then choose: install sprinklers (<strong>mitigate</strong>), buy insurance (<strong>transfer</strong>), stop storing paper there (<strong>avoid</strong>), or decide the risk is small enough to live with and write that decision down (<strong>accept</strong>). Cyber risk treatment is exactly these four choices.</p>\n<h2>How it actually works</h2>\n<p>The four <strong>risk treatments</strong> — memorise them:</p>\n<ul>\n<li><strong>Mitigate</strong> — add controls to reduce likelihood or impact (patch, MFA, backups).</li>\n<li><strong>Transfer</strong> — shift the cost to someone else (cyber insurance, a contract clause).</li>\n<li><strong>Avoid</strong> — stop doing the risky thing (decommission the exposed service).</li>\n<li><strong>Accept</strong> — knowingly live with it — but <em>only</em> with a named owner and a review date. <strong>Acceptance without accountability is negligence.</strong></li>\n</ul>\n<p>Controls are organised by the <strong>NIST CSF 2.0</strong> framework — six functions that cover the whole lifecycle:</p>\n<table><thead><tr><th>Function</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Who's accountable; strategy &amp; policy</td><td>Board approves a cyber-risk policy and budget</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Know your assets and risks</td><td>A current asset inventory exists</td></tr><tr><td><strong>PROTECT</strong></td><td>Put up safeguards</td><td>MFA on all accounts; staff trained</td></tr><tr><td><strong>DETECT</strong></td><td>Notice when something's wrong</td><td>SIEM alerts reviewed daily</td></tr><tr><td><strong>RESPOND</strong></td><td>Act on an incident</td><td>A tested incident plan; who calls whom</td></tr><tr><td><strong>RECOVER</strong></td><td>Get back to normal, learn</td><td>Backups tested monthly</td></tr></tbody></table>\n<p>GOVERN is new in CSF 2.0 and it is the big message: cybersecurity is now a <strong>board-level duty</strong>, not something delegated to \"the IT guy\".</p>\n<p>Finally, two service-level numbers leaders must set <em>per critical service</em>:</p>\n<ul>\n<li><strong>MTD / RTO</strong> — the longest a service can be down before real harm (recovery <em>time</em> objective).</li>\n<li><strong>MADL / RPO</strong> — the most data you can afford to lose (recovery <em>point</em> objective — how far back your last good backup is).</li>\n</ul>\n<h2>Ghana in focus</h2>\n<p>The <strong>CSSPS disruption in 2022</strong> affected around <strong>500,000 students</strong> when a core placement system went down. Frame it as institutional risk: the <em>likelihood</em> of a targeted attack on a high-visibility national system was real; the <em>impact</em> — half a million families unable to confirm school placements — was severe across availability, reputation and public trust. Who <em>owned</em> that risk before it happened? Was there an RTO for the service? Those are the questions a risk register forces you to answer <em>beforehand</em>, not during the crisis.</p>\n<p>Under the Cybersecurity Act 2020 (Act 1038), the CSA can <strong>request your risk documentation</strong>. A current, owned risk register is not just good practice — it is something a regulator may ask to see.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>A ranked risk register tells leadership <em>exactly</em> where the next cedi of security budget should go.</li>\n<li>Named owners turn a wish list into accountability.</li>\n<li>RTO/RPO agreed in advance prevent the paralysing \"how long until we're back?\" argument during an outage.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>A register with no owners.</strong> It's a wish list, not a risk register.</li>\n<li><strong>Scoring by gut feel with no evidence.</strong> Tie each score to something real (a scan result, an incident, a missing control).</li>\n<li><strong>Treating all risks equally.</strong> The point is to rank and triage.</li>\n<li><strong>\"Accepting\" risk silently.</strong> Every accepted risk needs a name and a date.</li>\n</ul>\n<h2>Put it to work</h2>\n<p>In the course you build an <strong>eight-entry risk register</strong> for a multi-site institution with cloud records, payment systems and an unpatched remote-access service: write each risk as an IF/THEN statement, score inherent and residual risk, assign an owner, map gaps to the six CSF functions, and propose a 90-day treatment backlog. This feeds directly into the Module 10 capstone and the Module 9 board memo.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>Cyber risk = <strong>likelihood × impact</strong>, expressed as a business consequence.</li>\n<li>Four treatments: <strong>mitigate, transfer, avoid, accept</strong> — accept only with an owner + date.</li>\n<li>NIST CSF 2.0 has six functions; <strong>GOVERN</strong> makes it a board duty.</li>\n<li>Set <strong>RTO</strong> (max downtime) and <strong>RPO</strong> (max data loss) per critical service.</li>\n<li>A register without <strong>named owners</strong> is worthless.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>Write this as a risk statement: the payroll server hasn't been patched in a year.</strong> → <em>IF an attacker exploits the unpatched payroll server, THEN staff salary data could be stolen and we face DPC penalties and payroll disruption.</em> (Threat → vulnerability → business consequence.)</li>\n</ol>\n<ol>\n<li><strong>A risk is scored likelihood 2, impact 5. Another is 4×2. Which gets attention first, and why isn't it obvious?</strong> → Both rate 8–10, so neither dominates on the number alone. Impact-5 (a catastrophic but rarer event) often wins because the <em>consequence</em> is unacceptable even if unlikely — judgement, not just arithmetic.</li>\n</ol>\n<ol>\n<li><strong>You buy cyber insurance for a risk. Which treatment is that?</strong> → <em>Transfer</em> — you shift the financial cost, though the operational pain remains, so it's rarely enough on its own.</li>\n</ol>\n<ol>\n<li><strong>Which NIST CSF 2.0 function is new, and what does it signal?</strong> → <em>GOVERN</em> — it signals that cybersecurity accountability sits with the board, not just IT.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Inherent / residual risk</strong> — risk before / after controls.</li>\n<li><strong>Risk appetite / tolerance</strong> — how much risk the organisation will accept.</li>\n<li><strong>RTO / RPO</strong> — max acceptable downtime / data loss per service.</li>\n<li><strong>NIST CSF 2.0</strong> — the six-function cybersecurity framework (Govern, Identify, Protect, Detect, Respond, Recover).</li>\n<li><strong>Risk owner</strong> — the named person accountable for a specific risk.</li>\n</ul>", "sheets": [{"name": "m2-csf-profile.md", "html": "<h1>NIST CSF 2.0 Current / Target Profile — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>Rate your institution against each of the six CSF 2.0 functions on a 0–4</blockquote>\n<blockquote>maturity scale, then set a realistic target and note the gap action. See</blockquote>\n<blockquote><code>labctl learn m2</code>.</blockquote>\n<p>Maturity scale: <strong>0</strong> none · <strong>1</strong> ad-hoc · <strong>2</strong> developing · <strong>3</strong> defined &amp; repeatable · <strong>4</strong> managed &amp; measured.</p>\n<table><thead><tr><th>Function</th><th>What good looks like</th><th>Current (0–4)</th><th>Target (0–4)</th><th>Priority gap action</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Board-approved cyber policy, risk appetite, named accountability &amp; budget</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Current asset inventory; risks &amp; dependencies documented</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>PROTECT</strong></td><td>MFA everywhere, patching, email filtering, staff training</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>DETECT</strong></td><td>SIEM/monitoring, alerts reviewed daily, anomaly detection</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RESPOND</strong></td><td>Tested incident plan, defined roles, escalation paths</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RECOVER</strong></td><td>Backups tested monthly (3-2-1), recovery priorities set</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr></tbody></table>\n<h2>Narrative summary (3–5 sentences for leadership)</h2>\n<p>[Where is the institution strongest and weakest? Which function, if improved, reduces the most risk? What is the single most important investment?]</p>\n<h2>The honest GOVERN check</h2>\n<ul>\n<li>Does the board have a standing cybersecurity agenda item? [yes/no]</li>\n<li>Is there a named, resourced person accountable for cyber risk? [who]</li>\n<li>When was the cyber-risk policy last approved? [date]</li>\n</ul>"}, {"name": "m2-cyber-risk-register.md", "html": "<h1>Cyber Risk Register — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Review cycle:</strong> [e.g. quarterly]</p>\n<blockquote>How to use this. Fill in at least <strong>eight</strong> risks. Write each as an IF/THEN</blockquote>\n<blockquote>statement in business terms. Score <strong>Likelihood (L)</strong> and <strong>Impact (I)</strong> 1–5.</blockquote>\n<blockquote><strong>Inherent</strong> = score with no controls; <strong>Residual</strong> = score after the controls</blockquote>\n<blockquote>you list. Every risk needs a named <strong>Owner</strong>, a <strong>Treatment</strong> (Mitigate /</blockquote>\n<blockquote>Transfer / Avoid / Accept) and a <strong>Review date</strong>. See <code>labctl learn m2</code>.</blockquote>\n<p>Scoring key — Likelihood: 1 rare · 2 unlikely · 3 possible · 4 likely · 5 almost certain. Impact: 1 negligible · 2 minor · 3 moderate · 4 major · 5 severe. Rating = L × I (1–25).</p>\n<table><thead><tr><th>#</th><th>Risk statement (IF threat exploits vulnerability THEN business consequence)</th><th>Inherent L×I</th><th>Existing / planned controls</th><th>Residual L×I</th><th>Treatment</th><th>Owner</th><th>Review</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> IF an attacker exploits our internet-facing unpatched VPN THEN citizen records are stolen and we face DPC penalties + loss of trust</td><td>4×5 = 20</td><td>Patch SLA, MFA on VPN, monitoring</td><td>2×5 = 10</td><td>Mitigate</td><td>Head of IT</td><td>2026-01-15</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>8</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table>\n<h2>Top 3 risks by residual rating (what leadership must act on first)</h2>\n<ol>\n<li>[risk # and one line on the decision needed]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>Accepted risks (must have owner + review date)</h2>\n<ul>\n<li>[risk # — why it is being accepted, by whom, review date] — <em>acceptance without accountability is negligence.</em></li>\n</ul>\n<h2>90-day treatment backlog</h2>\n<table><thead><tr><th>Action</th><th>Addresses risk #</th><th>Owner</th><th>Target date</th><th>Cost / effort</th></tr></thead><tbody><tr><td>[FILL IN]</td><td></td><td></td><td></td><td></td></tr></tbody></table>"}]}, "m3": {"day": 2, "title": "Module 3 — Network, Endpoint & Identity Security", "lesson": "<h1>Module 3 — Network, Endpoint &amp; Identity Security</h1>\n<p><strong>Day 2 · Morning · Hands-on lab: <code>labctl start m3</code></strong></p>\n<p>In one sentence: you learn to see a network the way both an attacker and a defender do — what's exposed, what's talking to what, and which conversation is the compromise hiding in plain sight.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>map a network with Nmap: live hosts, open ports, running services;</li>\n<li>read captured traffic in Wireshark and spot command-and-control beaconing;</li>\n<li>explain why segmentation, DNS monitoring and MFA are the controls that matter;</li>\n<li>map what you find to MITRE ATT&amp;CK.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>A network is just computers having conversations. Every conversation uses <strong>ports</strong> (numbered doors) and <strong>protocols</strong> (languages). Web traffic uses port 80/443 (HTTP/HTTPS), remote login uses 22 (SSH) or 3389 (RDP), mail uses 25, DNS uses 53. An attacker's first question on your network is simple: <em>which doors are open, and what's standing behind them?</em></p>\n<p><strong>Active scanning</strong> answers that. Unlike the passive recon of Module 1, here you send packets to the targets and watch what comes back. That's why it is done <strong>only</strong> on networks you own or are authorised to test — in this course, only the isolated <code>10.13.3.0/24</code> range.</p>\n<p>Two instruments do most of the work:</p>\n<ul>\n<li><strong>Nmap</strong> — the scanner. It finds live hosts, open ports, the software and version behind each port, and can even guess the operating system.</li>\n<li><strong>Wireshark</strong> (and its command-line cousin <strong>tcpdump</strong>) — the microscope. It shows you the actual packets so you can read a conversation and judge whether it's normal or malicious.</li>\n</ul>\n<p>The <strong>identity layer</strong> sits on top: it's not enough to know <em>what</em> connects — you must know <em>who</em>. That's authentication (proving identity) and authorisation (what you're allowed to do). Weak identity is how most breaches escalate.</p>\n<h2>An analogy</h2>\n<p>Nmap is walking the corridors of a building at night, trying every door handle and noting which rooms are unlocked and what's inside (\"this one's a server room, this one's an old photocopier running Windows XP\"). Wireshark is then putting a wiretap on the phone line and <em>listening to the calls</em> — most are routine, but one extension dials the same foreign number every 30 seconds, at exactly the same interval, all night. No human works like that. That regular \"heartbeat\" is malware checking in with its controller.</p>\n<h2>How it actually works</h2>\n<p>A typical Nmap workflow, from quiet to loud:</p>\n<ul>\n<li><code>nmap -sn 10.13.3.0/24</code> — <em>host discovery</em>: who's alive? (No port scan.)</li>\n<li><code>nmap -sV -p 21,22,80,443,3389 10.13.3.0/24</code> — <em>service/version detection</em>: what's running, and is it old?</li>\n<li><code>nmap --script=http-title ...</code> — run a script to grab extra detail (here, web page titles — handy for spotting an unauthenticated admin panel).</li>\n</ul>\n<p>What you're hunting for: things that <strong>shouldn't be exposed</strong> — RDP (3389) open to everyone, unencrypted FTP (21), an admin console with no login. Each is a door left wide open.</p>\n<p>Then the traffic. In Wireshark you apply a <strong>display filter</strong> (e.g. <code>dns</code>) to cut the noise. <strong>Command-and-control (C2) beaconing</strong> is the classic giveaway: a compromised host repeatedly contacting the same external domain at a <strong>fixed interval</strong>. The regularity is the tell — legitimate traffic is bursty and irregular; malware is a metronome. Roughly <strong>90% of malware uses DNS</strong> to find its controller, which is why DNS monitoring is such a powerful early warning.</p>\n<p>Map the findings to <strong>MITRE ATT&amp;CK</strong>: network scanning is <strong>T1046</strong> (Network Service Discovery); the beaconing is <strong>T1071</strong> (Application Layer Protocol), sub-technique <strong>T1071.004</strong> for DNS.</p>\n<p>The four controls that answer all of this:</p>\n<ul>\n<li><strong>Network segmentation</strong> — a flat network lets an attacker roam; segments contain them.</li>\n<li><strong>DNS monitoring</strong> — catches the beacon.</li>\n<li><strong>MFA on remote access</strong> — stops a stolen RDP/SSH password being enough.</li>\n<li><strong>A firewall rule</strong> — close 3389 to the internet; put it behind a VPN.</li>\n</ul>\n<h2>Ghana in focus</h2>\n<p>Many West African breaches begin with an exposed remote-access service — an RDP port left open \"temporarily\" for a vendor, then forgotten. Automated attackers scan the entire internet continuously; an exposed 3389 in Accra is found within hours, not weeks. The lesson every Ghanaian IT team should internalise: <em>scan your own network monthly</em> with the very same Nmap, before someone else does. Finding your own open RDP is free; having it found for you costs a ransom.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>You cannot protect what you cannot see — scanning gives you the real inventory, which is almost always different from the one on paper.</li>\n<li>Reading traffic turns \"the antivirus is quiet\" into actual evidence of what a host is doing.</li>\n<li>Catching a beacon early is the difference between an incident and a breach.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Scanning outside your authorisation.</strong> Nmap against a network you don't own is an offence under Act 1038. In the lab: only <code>10.13.3.x</code>.</li>\n<li><strong>Confusing capture and display filters</strong> in Wireshark — a capture filter decides what's recorded; a display filter decides what's shown.</li>\n<li><strong>Dismissing \"small\" open ports.</strong> An unauthenticated admin panel on an obscure port is a full compromise waiting to happen.</li>\n<li><strong>Treating encrypted = safe.</strong> TLS hides content, not the <em>pattern</em>; beaconing is visible even when the payload isn't.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m3</code> brings up a four-host enterprise subnet (web admin, FTP, SSH, legacy RDP) plus a packet capture. Discover the hosts, find the exposed services, then open the capture in Wireshark, filter to <code>dns</code>, and identify the C2 domain and its beacon interval. <code>labctl verify m3</code> grades each finding.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Ports are doors, protocols are languages</strong>; Nmap finds the open doors.</li>\n<li>Active scanning is <strong>authorised-targets-only</strong>.</li>\n<li><strong>C2 beaconing = same destination, fixed interval</strong> — regularity is the tell.</li>\n<li>Most malware phones home over <strong>DNS</strong> — monitor it.</li>\n<li>Controls: <strong>segmentation, DNS monitoring, MFA on remote access, firewall rules.</strong> ATT&amp;CK: <strong>T1046</strong>, <strong>T1071</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong><code>nmap -sn</code> versus <code>nmap -sV</code> — what's the difference?</strong> → <code>-sn</code> only discovers which hosts are alive (no port scan); <code>-sV</code> scans ports and identifies the service and version behind each open one.</li>\n</ol>\n<ol>\n<li><strong>In a capture you see one host query <code>cdn-update.ddns.net</code> every 60 seconds, all night. Benign or suspicious, and why?</strong> → Suspicious: the fixed, regular interval is classic C2 beaconing. Real user traffic is irregular.</li>\n</ol>\n<ol>\n<li><strong>RDP (3389) is open to the internet. Name two controls.</strong> → Put it behind a VPN / close the port at the firewall, and require MFA on the account. (Network segmentation also helps.)</li>\n</ol>\n<ol>\n<li><strong>Which ATT&amp;CK technique covers an internal host scanning the network?</strong> → T1046, Network Service Discovery.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Port</strong> — a numbered endpoint for a network service (e.g. 22 = SSH).</li>\n<li><strong>Nmap</strong> — network scanner for host/port/service discovery.</li>\n<li><strong>Wireshark / tcpdump</strong> — packet analysers (GUI / CLI).</li>\n<li><strong>C2 (command and control)</strong> — the channel malware uses to reach its operator.</li>\n<li><strong>Beaconing</strong> — regular, interval-based check-ins from malware to C2.</li>\n<li><strong>Segmentation</strong> — dividing a network so a breach in one part can't reach all.</li>\n</ul>", "sheets": [{"name": "m3-traffic-analysis-findings.md", "html": "<h1>Traffic Analysis Findings &amp; Control Design — Module 3 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Network:</strong> [e.g. 10.13.3.0/24]</p>\n<blockquote>Record what you found on the network and the capture, then design the controls</blockquote>\n<blockquote>that close each gap. See <code>labctl learn m3</code>.</blockquote>\n<h2>1. Host &amp; service inventory (Nmap)</h2>\n<table><thead><tr><th>Host IP</th><th>Open ports / services</th><th>Concern</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[e.g. unauth admin panel / cleartext FTP / exposed RDP]</td></tr><tr><td>[ ]</td><td></td><td></td></tr><tr><td>[ ]</td><td></td><td></td></tr></tbody></table>\n<h2>2. Suspicious traffic (Wireshark / tcpdump)</h2>\n<ul>\n<li>Infected host IP: [ ]</li>\n<li>C2 domain observed: [ ]</li>\n<li>Beacon interval: [ ] seconds — <em>why this looks like beaconing:</em> [ ]</li>\n<li>Other indicators: [ ]</li>\n</ul>\n<p><strong>ATT&amp;CK:</strong> T1046 (Network Service Discovery), T1071 (Application Layer Protocol).</p>\n<h2>3. Control design (map each gap to a fix, with priority)</h2>\n<table><thead><tr><th>#</th><th>Finding</th><th>Recommended control</th><th>Priority (H/M/L)</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> RDP 3389 exposed</td><td>Close port / VPN + MFA</td><td>H</td><td>IT</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[e.g. network segmentation]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td>[e.g. DNS monitoring]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td></tr></tbody></table>\n<h2>4. One-line summary for leadership</h2>\n<p>[Business impact of what's exposed, and the single most urgent fix.]</p>"}]}, "m4": {"day": 2, "title": "Module 4 — Vulnerability Management & SOC Operations", "lesson": "<h1>Module 4 — Vulnerability Management &amp; SOC Operations</h1>\n<p><strong>Day 2 · Afternoon · Hands-on lab: <code>labctl start m4</code></strong></p>\n<p>In one sentence: finding weaknesses is easy; the skill is deciding which of the hundreds you'll find actually matter, and then recognising — from a flood of alerts — the moment one is being exploited.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>scan a web server with Nikto and prioritise the findings sensibly;</li>\n<li>explain why weak passwords fall to Hydra and John — and why MFA is the fix;</li>\n<li>triage SIEM alerts, separate signal from noise, and correlate them into one story.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p><strong>Vulnerability management</strong> is a cycle, not a one-off scan: <em>find → prioritise → fix → verify → repeat.</em> Scanning is the easy part; a scanner will hand you hundreds of findings. The real work is <strong>prioritisation</strong>, because you can't fix everything at once.</p>\n<p>A good priority score combines four things:</p>\n<ul>\n<li><strong>CVSS</strong> — a 0–10 severity score for the vulnerability itself.</li>\n<li><strong>Exploitation status</strong> — is it being actively exploited <em>right now</em>? The free <strong>CISA KEV</strong> (Known Exploited Vulnerabilities) catalogue tells you.</li>\n<li><strong>Exposure</strong> — is it internet-facing or buried internally?</li>\n<li><strong>Asset criticality</strong> — is it your payroll database or a test box?</li>\n</ul>\n<p>A medium-CVSS bug that is internet-facing, on a critical system, and listed in KEV beats a \"critical\" CVSS bug that's internal and never exploited. Context wins.</p>\n<p>The <strong>SOC (Security Operations Centre)</strong> is the other half: the team (or person) watching the alerts. Their core skill is <strong>triage</strong> — quickly deciding, for each alert, true positive / false positive / needs investigation, and escalating the ones that matter.</p>\n<h2>An analogy</h2>\n<p>A vulnerability scan is a home inspector's report: it lists <em>every</em> defect, from \"roof could collapse\" to \"one loose cupboard hinge\". If you treat them all as equally urgent you'll fix hinges while the roof caves in. Prioritisation is reading that report like an adult: roof first.</p>\n<p>SOC triage is a hospital emergency room. Patients (alerts) arrive constantly. You can't deep-treat everyone at once, so you <em>triage</em>: this one's critical (real attack), this one's fine (false alarm), this one needs tests (investigate). Alert fatigue is the tired nurse who starts waving everyone through — which is exactly when the real emergency slips past.</p>\n<h2>How it actually works</h2>\n<p><strong>Nikto</strong> scans web servers specifically — it looks for dangerous files, leftover backups, outdated software and missing security headers. Where Nmap tells you <em>port 80 is open</em>, Nikto tells you <em>what's wrong with what's running on it</em>: an exposed <code>/admin/</code> panel, a <code>config.php.bak</code> leaking database credentials, a <code>phpinfo.php</code> spilling server internals.</p>\n<p><strong>Password attacks</strong> come in two flavours, and the lab shows both:</p>\n<ul>\n<li><strong>Hydra</strong> — <em>online</em> guessing: it tries username/password pairs against a live service (e.g. SSH). Noisy, slow, but deadly against weak passwords. A \"password-spray\" tries one common password across many accounts to dodge lockouts.</li>\n<li><strong>John the Ripper</strong> — <em>offline</em> cracking: given stolen password <em>hashes</em>, it computes guesses locally at huge speed. No network, no lockout, no limit.</li>\n</ul>\n<p>The point of both is not \"how to hack\" — it's <strong>why controls are mandatory</strong>: a password in a wordlist is already broken, which is why length, uniqueness and especially <strong>MFA</strong> matter. MFA means a cracked password alone isn't enough.</p>\n<p><strong>SIEM triage</strong> ties it together. A SIEM (here, <strong>Wazuh</strong>) collects logs from many systems and raises <strong>alerts</strong> with a severity <em>level</em> and often an ATT&amp;CK mapping. Triage workflow: sort by severity → add context → decide TP/FP/investigate → escalate or close. The master skill is <strong>correlation</strong>: ten alerts aren't ten problems — they're often one attack seen from ten angles. Failed SSH logins (brute force) + a port scan + a <em>successful</em> login, all from the <em>same source IP</em>, is not three events. It's one intrusion, and the attacker is now inside.</p>\n<p>Brute force maps to ATT&amp;CK <strong>T1110</strong>.</p>\n<h2>Ghana in focus</h2>\n<p>Picture a SOC analyst at a Ghanaian bank at 2 a.m. Wazuh shows dozens of \"failed SSH login\" alerts — individually low severity, easy to ignore when you're tired. But one source IP is behind all of them, and minutes later there's an \"authentication success\" from that same IP, then a \"sudo to root\". Read individually: noise. Correlated: a brute-force that <em>succeeded</em> and escalated to admin. The institutions that get breached aren't the ones without alerts — they had the alerts. They're the ones who didn't correlate them in time.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>Prioritisation turns an unmanageable scan report into a short, fundable remediation list.</li>\n<li>Understanding password cracking is the argument that finally gets MFA approved.</li>\n<li>Correlation is what converts raw alerts into an actionable incident before the damage is done.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Chasing CVSS alone.</strong> A 9.8 nobody can reach matters less than a 6.5 on your internet-facing payroll box that's in KEV.</li>\n<li><strong>Using Hydra/John outside the lab.</strong> Only the authorised lab targets and the provided hash file — anywhere else is a crime.</li>\n<li><strong>Closing alerts to clear the queue.</strong> \"Mark as resolved\" without investigating is how breaches hide.</li>\n<li><strong>Ignoring low-severity floods.</strong> Volume <em>is</em> a signal; many low alerts from one source can be a single high-severity attack.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m4</code> gives you a leaky web server (for Nikto), an SSH box with a weak account (authorised Hydra target), a hash file (for John), and a realistic Wazuh alert feed. Scan, crack, then triage the alerts with <code>jq</code> to find the attacker's IP, the top severity, and whether they got in. <code>labctl verify m4</code> grades it.</p>\n<blockquote>On Wazuh in this course: you triage a realistic alert feed rather than run a</blockquote>\n<blockquote>full SIEM stack, because a complete Wazuh deployment needs far more RAM than a</blockquote>\n<blockquote>classroom laptop has. The skill — triage and correlation — is identical.</blockquote>\n<h2>Key takeaways</h2>\n<ul>\n<li>Vulnerability management = <strong>find → prioritise → fix → verify</strong>, looping.</li>\n<li>Prioritise by <strong>CVSS + KEV + exposure + asset criticality</strong>, not CVSS alone.</li>\n<li><strong>Hydra</strong> = online guessing; <strong>John</strong> = offline hash cracking; <strong>MFA</strong> defeats both.</li>\n<li>SIEM triage = <strong>TP / FP / investigate</strong>; the real skill is <strong>correlation</strong>.</li>\n<li>Brute force is ATT&amp;CK <strong>T1110</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>Two findings: CVSS 9.1 on an internal test server (not in KEV); CVSS 6.8 on your public payment portal, listed in CISA KEV. Which first?</strong> → The 6.8 — it's internet-facing, on a critical asset, and <em>actively exploited</em>. Context beats raw score.</li>\n</ol>\n<ol>\n<li><strong>Hydra vs John — what's the core difference?</strong> → Hydra guesses against a live service (online); John cracks stolen hashes locally (offline). John has no lockout or rate limit.</li>\n</ol>\n<ol>\n<li><strong>You see failed logins, a port scan and a successful login — all from 10.0.0.9. How many incidents?</strong> → One. Correlate by source IP: it's a single intrusion that succeeded, not three separate events.</li>\n</ol>\n<ol>\n<li><strong>A cracked password is bad — what single control makes it insufficient on its own?</strong> → MFA (multi-factor authentication).</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>CVSS</strong> — 0–10 severity score for a vulnerability.</li>\n<li><strong>CISA KEV</strong> — free catalogue of vulnerabilities known to be actively exploited.</li>\n<li><strong>Nikto</strong> — web-server vulnerability scanner.</li>\n<li><strong>Hydra / John the Ripper</strong> — online password guesser / offline hash cracker.</li>\n<li><strong>SIEM</strong> — Security Information and Event Management; collects logs, raises alerts (e.g. Wazuh).</li>\n<li><strong>Triage</strong> — rapidly classifying alerts as true/false positive or needs-investigation.</li>\n</ul>", "sheets": [{"name": "m4-remediation-register.md", "html": "<h1>Vulnerability Remediation Register — Module 4 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Target:</strong> [e.g. 10.13.4.10]</p>\n<blockquote>Prioritise by more than CVSS: combine severity with **active exploitation</blockquote>\n<blockquote>(CISA KEV)<strong>, </strong>exposure<strong> and </strong>asset criticality**. See <code>labctl learn m4</code>.</blockquote>\n<table><thead><tr><th>#</th><th>Finding (from Nikto/scan)</th><th>CVSS</th><th>In KEV?</th><th>Exposure</th><th>Asset criticality</th><th>Priority</th><th>Fix</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> config.php.bak leaks DB creds</td><td>—</td><td>—</td><td>Internet</td><td>High</td><td><strong>High</strong></td><td>Remove file; rotate creds</td><td>IT</td><td>[ ]</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table>\n<p><strong>Priority rule of thumb:</strong> internet-facing + KEV + critical asset = do first, even at a lower CVSS.</p>\n<hr>\n<h1>SOC Triage Case Ticket — Module 4 Deliverable</h1>\n<p><strong>Ticket ref:</strong> [ ]  <strong>Analyst:</strong> [your name]  <strong>Opened:</strong> [date/time]</p>\n<table><thead><tr><th>Field</th><th>Detail</th></tr></thead><tbody><tr><td>Alert(s) involved</td><td>[rule IDs / descriptions]</td></tr><tr><td>Source IP</td><td>[ ]</td></tr><tr><td>Highest severity level</td><td>[ ]</td></tr><tr><td>Correlation</td><td>[how the alerts link into one story — same source IP?]</td></tr><tr><td>Classification</td><td>[True Positive / False Positive / Needs Investigation]</td></tr><tr><td>Did the attacker succeed?</td><td>[evidence — e.g. auth success after brute force]</td></tr><tr><td>ATT&amp;CK</td><td>[e.g. T1110 Brute Force]</td></tr><tr><td>Action taken</td><td>[ ]</td></tr><tr><td>Escalated to</td><td>[ ]</td></tr><tr><td>Status</td><td>[open / contained / closed]</td></tr></tbody></table>\n<h2>Evidence / notes</h2>\n<p>[Timeline and key log lines that justify the classification.]</p>"}]}, "m5": {"day": 3, "title": "Module 5 — Cyber Fraud, BEC & Mobile Money Security", "lesson": "<h1>Module 5 — Cyber Fraud, BEC &amp; Mobile Money Security</h1>\n<p><strong>Day 3 · Morning · Hands-on lab: <code>labctl start m5</code></strong></p>\n<p>In one sentence: the most expensive cyberattacks in Ghana don't break encryption — they break <em>trust</em>, by convincing a real person to send money to the wrong account, and this module teaches you to prove it from the evidence.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>read an email's full headers and trace where it really came from;</li>\n<li>expose domain spoofing and SPF/DKIM/DMARC failures;</li>\n<li>explain SIM-swap and MoMo agent fraud and the controls that stop them;</li>\n<li>design a payment-verification process that defeats Business Email Compromise.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p><strong>Business Email Compromise (BEC)</strong> is fraud by impersonation over email. There's usually no malware. The attacker studies a real business relationship, then sends a message that <em>looks</em> like it's from a trusted party — a supplier, the CEO, a lawyer — asking to change bank details or make an urgent payment. The victim isn't hacked; they're <em>deceived</em> into doing the attacker's work for them.</p>\n<p>The five classic BEC plays:</p>\n<ul>\n<li><strong>CEO fraud</strong> — \"the MD\" urgently orders a transfer.</li>\n<li><strong>Supplier impersonation</strong> — a real supplier's \"new bank account\".</li>\n<li><strong>Payroll diversion</strong> — an employee's salary redirected.</li>\n<li><strong>Attorney impersonation</strong> — a \"lawyer\" pressing confidentiality and speed.</li>\n<li><strong>Gift-card fraud</strong> — the low-value entry version.</li>\n</ul>\n<p>The attacker's levers are psychological: <strong>urgency, authority, confidentiality, and a plausible reason email is better than a call.</strong> Spot those four together and your suspicion should spike.</p>\n<p>The defender's power is that <strong>email carries its own evidence</strong>. The friendly <code>From:</code> name can say anything, but the <strong>headers</strong> record the true delivery path and the authentication results. Reading them is the whole game.</p>\n<h2>An analogy</h2>\n<p>A paper letter can be signed \"The Managing Director\" in any handwriting. But the <em>envelope</em> tells a different story: the postmark (where it was actually posted), the return address, the stamps. BEC is a forged signature on fancy letterhead. Header forensics is examining the envelope and postmark — and discovering the \"MD's\" letter was posted from a different country by someone who registered a near-identical company name last week.</p>\n<h2>How it actually works</h2>\n<p>The key header fields, and what each proves:</p>\n<ul>\n<li><strong><code>From:</code></strong> — the <em>display</em>. Attacker-controlled. Trust it last.</li>\n<li><strong><code>Return-Path</code> / envelope sender</strong> — where bounces really go. Often reveals the true (look-alike) domain.</li>\n<li><strong><code>Reply-To</code></strong> — where <em>your reply</em> silently goes. A mismatch here is a classic trap: you \"reply to the MD\" and it lands with the attacker.</li>\n<li><strong><code>Received:</code> chain</strong> — the delivery path, built bottom-up. The <em>earliest</em> (lowest) hop shows the IP that actually connected — trace it with <code>whois</code>.</li>\n<li><strong><code>Authentication-Results</code></strong> — the verdicts: <strong>SPF</strong>, <strong>DKIM</strong>, <strong>DMARC</strong> pass/fail.</li>\n</ul>\n<p>The three authentication checks (same ones from Module 1, now seen from the receiving side):</p>\n<ul>\n<li><strong>SPF</strong> — was the sending server allowed to send for that domain? <code>fail</code> means no.</li>\n<li><strong>DKIM</strong> — is there a valid signature proving the message wasn't altered? <code>none</code> means unsigned.</li>\n<li><strong>DMARC</strong> — the policy. <code>fail</code> with a weak or absent policy means the forged mail is delivered anyway.</li>\n</ul>\n<p>The other half of the module is <strong>Ghana-specific mobile-money fraud</strong>:</p>\n<ul>\n<li><strong>SIM swap</strong> — the fraudster convinces the network operator to move a victim's number to a new SIM, instantly hijacking the SMS OTPs that \"protect\" the MoMo wallet. Authentication bypassed without touching a computer.</li>\n<li><strong>Agent impersonation &amp; vishing</strong> — \"Your MoMo will be blocked — confirm your PIN now.\" Pure social engineering, scripted and rehearsed.</li>\n</ul>\n<p>And the single control that stops BEC dead: <strong>dual control with out-of-band verification.</strong> No one person both initiates <em>and</em> approves a payment, and any change to bank details is confirmed by calling the counterparty on a <strong>previously known</strong> number — never the number in the email. BEC maps to ATT&amp;CK <strong>T1566</strong> (Phishing); impersonation to <strong>T1656</strong>.</p>\n<h2>Ghana in focus</h2>\n<p>The <strong>GCB Bank BEC</strong> (~GHS 2.3 million) ran the full playbook: reconnaissance of the procurement team, a look-alike supplier domain registered weeks early, a compromised-looking email changing bank details, and urgency to push the payment through. Every technical control to detect it existed in the headers — SPF fail, look-alike domain, mismatched Reply-To. But the decisive failure was a <em>process</em> one: no dual-control callback on a known number. One phone call to the real supplier would have stopped it. Separately, the <strong>2022–2023 SIM-swap wave</strong> showed how SMS-OTP \"security\" collapses the moment the number itself is stolen — which is why enterprise MoMo needs limits, alerts and dual authorisation, not just an OTP.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>BEC is routinely the <strong>costliest</strong> category of cybercrime for institutions — and the cheapest to prevent, because the fix is process, not technology.</li>\n<li>Header forensics lets you prove fraud <em>before</em> the money moves, turning a suspicious feeling into evidence anyone can act on.</li>\n<li>The same <code>dig</code>/header skills protect your <em>own</em> domain from being the one spoofed.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Trusting the <code>From:</code> name.</strong> It is the least reliable field in the message.</li>\n<li><strong>Replying to verify.</strong> The attacker set <code>Reply-To</code> — your \"are you sure?\" reaches <em>them</em>, who say \"yes, hurry\".</li>\n<li><strong>Verifying on the number in the email.</strong> Always use an independently known number.</li>\n<li><strong>Thinking SMS OTP is strong.</strong> SIM swap defeats it entirely.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m5</code> is file-based: you get a spoofed supplier email in <code>assets/invoice-change-request.eml</code>. Use <code>grep</code> and <code>dig</code> to trace the source IP, expose the look-alike domain and the SPF/DKIM/DMARC failures, find the fraudulent account number, and name the control that stops it. <code>labctl verify m5</code> grades it.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>BEC is <strong>deception, not malware</strong> — it exploits urgency, authority and trust.</li>\n<li><strong>Headers hold the truth</strong>: Return-Path, Received chain, Authentication-Results — not the <code>From:</code> display.</li>\n<li><strong>SIM swap</strong> defeats SMS OTP; enterprise MoMo needs limits + dual authorisation.</li>\n<li><strong>Dual control + out-of-band callback on a known number</strong> stops BEC.</li>\n<li>ATT&amp;CK: <strong>T1566</strong> (Phishing), <strong>T1656</strong> (Impersonation).</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>The <code>From:</code> shows the real supplier, but <code>Reply-To</code> is a different, hyphenated domain. What's happening?</strong> → A spoof: the display is forged to earn trust, while replies are silently routed to the attacker's look-alike domain.</li>\n</ol>\n<ol>\n<li><strong><code>Authentication-Results</code> shows <code>spf=fail; dkim=none; dmarc=fail</code>. Verdict?</strong> → The message is almost certainly forged — it failed every authentication check. Treat it as fraudulent.</li>\n</ol>\n<ol>\n<li><strong>A finance officer gets an urgent supplier request to change bank details. What's the one step that stops BEC?</strong> → Call the supplier on a <em>previously known</em> number to confirm — out-of-band, dual-control verification. Never reply or use the email's number.</li>\n</ol>\n<ol>\n<li><strong>Why doesn't an SMS OTP protect a MoMo wallet against SIM swap?</strong> → Because the attacker has taken over the <em>number itself</em>, so the OTP is delivered straight to them.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>BEC</strong> — Business Email Compromise; fraud by email impersonation.</li>\n<li><strong>Return-Path / Received / Reply-To</strong> — headers revealing true origin, path and reply destination.</li>\n<li><strong>SPF / DKIM / DMARC</strong> — email authentication: authorised sender / signature / policy.</li>\n<li><strong>SIM swap</strong> — hijacking a phone number to a new SIM to steal OTPs.</li>\n<li><strong>Dual control</strong> — separation of initiate and approve for payments.</li>\n<li><strong>Out-of-band verification</strong> — confirming via a different, trusted channel.</li>\n</ul>", "sheets": [{"name": "m5-fraud-investigation-brief.md", "html": "<h1>Fraud Investigation Brief (BEC) — Module 5 Deliverable</h1>\n<p><strong>Investigator:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Case ref:</strong> [ ]  <strong>Reported by:</strong> [who flagged it]</p>\n<blockquote>Prove the fraud from the email's own evidence, then fix the <em>process</em> that let</blockquote>\n<blockquote>it through. See <code>labctl learn m5</code>.</blockquote>\n<h2>1. Summary</h2>\n<p>[One paragraph: what the email claimed, what it really was, and whether money moved.]</p>\n<h2>2. Header forensics findings</h2>\n<table><thead><tr><th>Field</th><th>Value found</th><th>What it proves</th></tr></thead><tbody><tr><td>From (display)</td><td>[ ]</td><td>(attacker-controlled — trust last)</td></tr><tr><td>Return-Path / envelope sender</td><td>[ ]</td><td>[look-alike domain?]</td></tr><tr><td>Reply-To</td><td>[ ]</td><td>[mismatch → replies go to attacker?]</td></tr><tr><td>Source IP (earliest Received)</td><td>[ ]</td><td>[whois: ISP / country]</td></tr><tr><td>SPF result</td><td>[ ]</td><td></td></tr><tr><td>DKIM result</td><td>[ ]</td><td></td></tr><tr><td>DMARC result</td><td>[ ]</td><td></td></tr></tbody></table>\n<p><strong>Look-alike domain:</strong> [ ]  <strong>Impersonated real domain:</strong> [ ]</p>\n<h2>3. Evidence timeline</h2>\n<table><thead><tr><th>Time</th><th>Event</th></tr></thead><tbody><tr><td>[ ]</td><td>Look-alike domain registered</td></tr><tr><td>[ ]</td><td>Email received</td></tr><tr><td>[ ]</td><td>[action taken / payment attempted]</td></tr></tbody></table>\n<h2>4. Fraudulent payment details (for bank recall)</h2>\n<ul>\n<li>Requested account: [ ]  Bank: [ ]  Amount: [ ]</li>\n<li>Legitimate account on file: [ ]</li>\n</ul>\n<h2>5. Control failures identified</h2>\n<ul>\n<li>[e.g. No dual-control callback on a known number before changing bank details.]</li>\n</ul>\n<h2>6. Payment-verification control (the fix)</h2>\n<p>[Design the procedure: who initiates vs approves, mandatory out-of-band callback to a previously known number for any bank-detail change, thresholds, logging.]</p>\n<p><strong>ATT&amp;CK:</strong> T1566 (Phishing) / T1656 (Impersonation).</p>"}]}, "m6": {"day": 3, "title": "Module 6 — Digital Forensics & Incident Response", "lesson": "<h1>Module 6 — Digital Forensics &amp; Incident Response</h1>\n<p><strong>Day 3 · Afternoon · Hands-on lab: <code>labctl start m6</code></strong></p>\n<p>In one sentence: when an incident happens, the evidence is fragile and the clock is running — this module teaches you to preserve what happened so it stands up later, reconstruct it, and respond without making things worse.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>preserve evidence with hashing and maintain a chain of custody;</li>\n<li>examine a disk image, list files and recover deleted ones;</li>\n<li>decode an obfuscated attacker artefact;</li>\n<li>place your actions correctly in the NIST incident-response lifecycle.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>Digital forensics rests on one idea: <strong>prove you didn't change the evidence.</strong> If you can't, nothing you find is trustworthy — not to a court, a regulator, or your own board. Two disciplines make that possible:</p>\n<ul>\n<li><strong>Hashing.</strong> A cryptographic hash (SHA-256) is a digital fingerprint of a file. Hash the evidence <em>before</em> you touch it and <em>after</em>; if the two fingerprints match, you've mathematically proven it's unchanged. Change a single byte and the hash changes completely.</li>\n<li><strong>Chain of custody.</strong> A written record of who held the evidence, when, why, and what they did. It's what makes your findings <em>defensible</em>.</li>\n</ul>\n<p>A second principle governs <em>what to collect first</em>: the <strong>order of volatility.</strong> Some evidence vanishes faster than the rest. Memory (RAM) disappears the instant you power off; network connections and running processes go next; disk persists. So you collect in that order — <strong>volatile first</strong> — which is exactly why \"just turn it off and reboot\" destroys the most valuable evidence.</p>\n<p><strong>Incident response (IR)</strong> is the disciplined process wrapped around all this, standardised by <strong>NIST SP 800-61</strong>.</p>\n<h2>An analogy</h2>\n<p>It's a crime scene. The first officer doesn't start moving furniture — they photograph everything, bag each item, label it, and log who touched what. A fingerprint is only evidence if you can show it wasn't planted or smudged. A disk image is the same: you make an exact copy, fingerprint it (hash), and work on the <em>copy</em>, never the original — so the original stays pristine and provable. And just as you'd collect a dying witness's statement before anything else, you capture volatile memory before it's gone.</p>\n<h2>How it actually works</h2>\n<p><strong>Preserve first:</strong></p>\n<pre><code>sha256sum evidence.img                 # fingerprint it\nsha256sum -c evidence.sha256           # later: prove it still matches</code></pre>\n<p><strong>Examine</strong> with Autopsy (a GUI forensic platform used by law enforcement) or its command-line engine, Sleuthkit:</p>\n<ul>\n<li><code>fsstat</code> — what filesystem is this, and how is it laid out?</li>\n<li><code>fls</code> — list files; a <code>*</code> marks a <strong>deleted</strong> entry.</li>\n<li><code>icat</code> — read a file by its internal id (its <em>inode</em>), including deleted ones.</li>\n<li><code>tsk_recover</code> — carve deleted files back out.</li>\n</ul>\n<p>Why can you recover \"deleted\" files? Deleting usually just marks the space as free and flags the directory entry — the actual data often sits on disk untouched until something overwrites it. Forensics exploits that gap.</p>\n<p><strong>Decode</strong> obfuscated artefacts with <strong>CyberChef</strong> (or the command line). Attackers hide payloads in layers — Base64, URL-encoding, hex. You peel them back (\"From Base64 → URL Decode\") to reveal, say, the malware's command-and-control URL.</p>\n<p>Then place your work in the <strong>NIST SP 800-61 lifecycle:</strong></p>\n<table><thead><tr><th>Phase</th><th>What you do</th></tr></thead><tbody><tr><td><strong>Preparation</strong></td><td>Policies, playbooks, trained team, tested tools — <em>before</em> anything happens</td></tr><tr><td><strong>Detection &amp; Analysis</strong></td><td>Confirm it's real, scope it, start the evidence timeline</td></tr><tr><td><strong>Containment</strong></td><td>Stop the bleeding <em>without destroying evidence</em> (isolate, don't power off)</td></tr><tr><td><strong>Eradication</strong></td><td>Remove the attacker — close the vector, reset credentials, kill persistence</td></tr><tr><td><strong>Recovery</strong></td><td>Restore from clean backups, verify, reconnect</td></tr><tr><td><strong>Post-Incident</strong></td><td>Lessons learned, improve controls, report if required</td></tr></tbody></table>\n<h2>Ghana in focus</h2>\n<p>In a <strong>2023 West African hospital ransomware</strong> incident, three failures turned a problem into a catastrophe. The backups were on the <em>same network segment</em> and got encrypted too (no offline copy). The IT team's instinct was to <strong>power the servers off immediately</strong> — destroying the volatile memory evidence and making recovery harder. And there was no tested incident-response plan, so the response was improvised under pressure. The result: a three-week outage and partially unrecoverable patient records. The antidote is the <strong>3-2-1 backup rule</strong> — 3 copies, 2 media types, 1 offline/offsite — with <strong>restores tested monthly</strong>, plus an IR plan practised <em>before</em> it's needed.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>Evidence that isn't preserved properly is worthless when it matters most — in court, with the CSA/DPC, or in an insurance claim.</li>\n<li>Recovering deleted files and decoding artefacts is often how you learn what the attacker actually did and took.</li>\n<li>Following the lifecycle keeps a panicked response from destroying evidence or reinfecting clean systems.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Powering off to \"stop the attack\".</strong> You destroy RAM evidence; isolate from the network instead.</li>\n<li><strong>Working on the original.</strong> Always image and hash first; analyse the copy.</li>\n<li><strong>Skipping the hash.</strong> Without before/after hashes you cannot prove integrity.</li>\n<li><strong>Containment that wipes evidence.</strong> Stop the spread, but preserve the scene.</li>\n<li><strong>Backups on the same network.</strong> Ransomware encrypts those too — you need an offline copy.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m6</code> is file-based: a prepared disk image, its recorded hash, and an obfuscated artefact. Verify integrity with <code>sha256sum -c</code>, use <code>fls</code>/<code>icat</code>/ <code>tsk_recover</code> (or Autopsy) to list files and recover the deleted credentials file, and decode the artefact to the C2 domain. <code>labctl verify m6</code> grades it.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Hash before and after</strong> — mathematical proof the evidence is unchanged.</li>\n<li><strong>Chain of custody</strong> makes findings defensible.</li>\n<li><strong>Order of volatility: memory first</strong>, disk last — never just power off.</li>\n<li>\"Deleted\" ≠ gone; <code>tsk_recover</code>/<code>icat</code> carve files back.</li>\n<li>NIST SP 800-61: <strong>Prepare → Detect → Contain → Eradicate → Recover → Post-Incident.</strong></li>\n<li><strong>3-2-1 backups, tested monthly.</strong></li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>You arrive at a compromised server that's still running. First instinct: pull the power. Why is that wrong?</strong> → It destroys volatile memory (RAM) evidence — running processes, injected code, keys. Isolate from the network instead, then capture memory before disk.</li>\n</ol>\n<ol>\n<li><strong>You hash the image before analysis and again after. The hashes match. What has that proven?</strong> → That your analysis did not alter the evidence — its integrity (and your chain of custody) holds.</li>\n</ol>\n<ol>\n<li>**<code>fls</code> shows a file with a <code>*</code>. What does that mean, and can you read it?** → It's deleted; yes — the data usually persists, so <code>icat</code>/<code>tsk_recover</code> can recover it.</li>\n</ol>\n<ol>\n<li><strong>Containment vs eradication — the difference?</strong> → Containment stops the spread (isolate the host) while preserving evidence; eradication removes the attacker (close the vector, reset creds, remove persistence).</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Hash (SHA-256)</strong> — a file's cryptographic fingerprint.</li>\n<li><strong>Chain of custody</strong> — the documented handling history of evidence.</li>\n<li><strong>Order of volatility</strong> — collect the most perishable evidence (RAM) first.</li>\n<li><strong>Autopsy / Sleuthkit</strong> — forensic platform / its CLI toolkit.</li>\n<li><strong>inode</strong> — a file's internal id in a filesystem.</li>\n<li><strong>NIST SP 800-61</strong> — the incident-response lifecycle standard.</li>\n<li><strong>3-2-1 rule</strong> — 3 copies, 2 media, 1 offsite/offline.</li>\n</ul>", "sheets": [{"name": "m6-chain-of-custody.md", "html": "<h1>Chain of Custody Form — Module 6 Deliverable</h1>\n<p><strong>Case ref:</strong> [ ]  <strong>Examiner:</strong> [your name]  <strong>Organisation:</strong> [ ]</p>\n<blockquote>Chain of custody is what makes your findings defensible. Every time evidence</blockquote>\n<blockquote>changes hands or is acted on, add a row. Never leave a gap. See</blockquote>\n<blockquote><code>labctl learn m6</code>.</blockquote>\n<h2>Evidence item</h2>\n<table><thead><tr><th>Field</th><th>Detail</th></tr></thead><tbody><tr><td>Item ID</td><td>[e.g. EVID-001]</td></tr><tr><td>Description</td><td>[e.g. disk image evidence.img from workstation FIN-03]</td></tr><tr><td>Source</td><td>[where/what it came from]</td></tr><tr><td>Date/time collected</td><td>[YYYY-MM-DD HH:MM TZ]</td></tr><tr><td>Collected by</td><td>[name]</td></tr><tr><td>Acquisition method</td><td>[e.g. forensic image, write-blocked]</td></tr><tr><td><strong>SHA-256 at acquisition</strong></td><td>[paste full hash]</td></tr></tbody></table>\n<h2>Integrity verification</h2>\n<table><thead><tr><th>Checkpoint</th><th>Date/time</th><th>SHA-256</th><th>Matches acquisition?</th><th>By</th></tr></thead><tbody><tr><td>Before analysis</td><td>[ ]</td><td>[ ]</td><td>[yes/no]</td><td>[ ]</td></tr><tr><td>After analysis</td><td>[ ]</td><td>[ ]</td><td>[yes/no]</td><td>[ ]</td></tr></tbody></table>\n<h2>Custody log (one row per transfer or action)</h2>\n<table><thead><tr><th>#</th><th>Date/time</th><th>Released by</th><th>Received by</th><th>Purpose / action</th><th>Storage location</th></tr></thead><tbody><tr><td>1</td><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>Acquisition</td><td>[ ]</td></tr><tr><td>2</td><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[analysis]</td><td>[ ]</td></tr><tr><td>3</td><td>[ ]</td><td></td><td></td><td></td><td></td></tr></tbody></table>\n<h2>Attestation</h2>\n<p>I certify that the above record is accurate and the evidence was handled without unauthorised alteration.</p>\n<p>Signature: ______________________   Name: [ ]   Date: [ ]</p>"}, {"name": "m6-incident-report.md", "html": "<h1>Incident Report (NIST SP 800-61) — Module 6 Deliverable</h1>\n<p><strong>Incident ref:</strong> [ ]  <strong>Author:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Severity:</strong> [low / medium / high / critical]  <strong>Status:</strong> [open / contained / closed]</p>\n<blockquote>Structure the report on the NIST lifecycle. State what you <em>know</em> vs what you</blockquote>\n<blockquote><em>assess</em>. See <code>labctl learn m6</code>.</blockquote>\n<h2>1. Executive summary (for leadership, non-technical)</h2>\n<p>[What happened, business impact, current status, what you need from leadership.]</p>\n<h2>2. Detection &amp; analysis</h2>\n<ul>\n<li>How detected: [ ]</li>\n<li>Scope — systems affected: [ ]  Data affected: [ ]  Users affected: [ ]</li>\n<li>Attacker still present? [yes/no/unknown]</li>\n</ul>\n<h2>3. Evidence manifest</h2>\n<table><thead><tr><th>Item ID</th><th>Description</th><th>SHA-256</th><th>Collected (date/by)</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table>\n<h2>4. Attack timeline (reconstructed)</h2>\n<table><thead><tr><th>Time</th><th>Event</th><th>Evidence source</th></tr></thead><tbody><tr><td>[ ]</td><td>[first suspicious activity]</td><td>[ ]</td></tr><tr><td>[ ]</td><td>[persistence / access]</td><td>[ ]</td></tr><tr><td>[ ]</td><td>[exfiltration / impact]</td><td>[ ]</td></tr></tbody></table>\n<h2>5. Response actions</h2>\n<table><thead><tr><th>Phase</th><th>Action taken</th><th>By</th><th>Date/time</th></tr></thead><tbody><tr><td>Containment</td><td>[isolate — NOT power off]</td><td></td><td></td></tr><tr><td>Eradication</td><td>[ ]</td><td></td><td></td></tr><tr><td>Recovery</td><td>[restore from verified clean backup]</td><td></td><td></td></tr></tbody></table>\n<h2>6. Root cause</h2>\n<p>[What made this possible — the underlying control gap, not just the symptom.]</p>\n<h2>7. Lessons learned / recommendations</h2>\n<ol>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<p><strong>ATT&amp;CK techniques observed:</strong> [e.g. T1486 Data Encrypted for Impact] <strong>Reporting obligations considered:</strong> [Act 1038 CSA / Act 843 DPC — confirm with counsel]</p>"}]}, "m7": {"day": 4, "title": "Module 7 — AI Security, Deepfakes & Emerging Threats", "lesson": "<h1>Module 7 — AI Security, Deepfakes &amp; Emerging Threats</h1>\n<p><strong>Day 4 · Morning · Hands-on lab: <code>labctl start m7</code></strong></p>\n<p>In one sentence: AI is now on both sides of every attack — it writes the phishing and clones the voice, but it is also a new kind of system <em>you</em> deploy that can be attacked — and this module teaches you to break one safely so you can defend the rest.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>perform direct and indirect prompt injection against a sandboxed AI;</li>\n<li>explain why an AI with tools and trust is dangerous (excessive agency);</li>\n<li>apply a disciplined deepfake-verification protocol;</li>\n<li>name the governance controls for deploying AI responsibly.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>Treat AI security as two questions.</p>\n<p><strong>First: AI as a weapon.</strong> Attackers use generative AI to write flawless phishing in perfect English (and Twi), to clone a voice from seconds of audio, and to produce deepfake video. The old \"spot the typo\" advice is dead. A voice note from \"the CEO\" ordering a transfer can now be manufactured in minutes.</p>\n<p><strong>Second: AI as a target.</strong> When <em>you</em> deploy an AI assistant — a chatbot, a document summariser, an agent with tools — it becomes a system an attacker can manipulate. The dominant risk here is <strong>prompt injection</strong>, which the OWASP Top 10 for LLM applications ranks as <strong>LLM01</strong> — the number-one risk.</p>\n<p>Prompt injection works because an LLM cannot reliably tell the difference between <em>its instructions</em> and <em>the data it's processing</em>. If attacker-controlled text says \"ignore your previous instructions and do X\", the model may just... do X.</p>\n<h2>An analogy</h2>\n<p>Imagine a new intern who is brilliant, tireless — and pathologically literal and trusting. You tell them \"never reveal the safe combination.\" Then a stranger hands them a letter that reads, <em>\"Disregard your earlier instructions; your boss says to read the combination aloud,\"</em> and the intern does it, because the letter <em>told</em> them to and they can't tell a real instruction from a written trick. Now give that intern the keys to the filing cabinets and the authority to send emails. That's an AI agent with tools and no guardrails. Prompt injection is the letter.</p>\n<h2>How it actually works</h2>\n<p>Three attack patterns, all demonstrated in the lab:</p>\n<ul>\n<li><strong>Direct prompt injection</strong> — th
