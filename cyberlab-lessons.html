</strong> are the threads that tie the injects together.</li>\n<li><strong>Place each event on the Kill Chain</strong> (where in the intrusion) and tag its <strong>ATT&amp;CK</strong> technique (what). The <em>gaps</em> then reveal the stages you haven't found yet — \"I have delivery and C2 but no persistence; go look for it.\"</li>\n<li><strong>Pivot with the Diamond Model</strong> — from the C2 infrastructure to the adversary's other capability and victims.</li>\n<li><strong>Rank indicators on the Pyramid of Pain</strong> — block the <strong>TTP</strong> (dynamic-DNS beaconing), not just today's IP.</li>\n<li><strong>Default to one adversary.</strong> Treat simultaneous events as a single campaign until the evidence forces them apart — coincidence is rare at 09:00 on a Tuesday.</li>\n</ol>\n<hr>\n<h2>5 · Running the Investigation</h2>\n<p>The injects reward the exact tools you drilled. A representative command per front:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — work the fronts in parallel</span></div><pre><code># BEC email (M5): expose the look-alike domain and the mule account\ngrep -iE '^(From|Return-Path|Reply-To)' assets/payment-change.eml\n\n# The bank's AI assistant (M7): does its poisoned KB serve the SAME account?\ncurl -s 10.13.10.40:8080/ask -d '{\"question\":\"supplier bank account\"}' | jq\n\n# Correlate the alert feed (M4): which internal IP is the foothold?\njq -r '.[].data.srcip // empty' assets/capstone-alerts.json | sort | uniq -c | sort -rn\njq '[.[].rule.level] | max' assets/capstone-alerts.json        # highest severity\n\n# The network capture (M3): the C2 beacon and the exfil burst\nwireshark assets/capstone-capture.pcap      # filter: dns  (C2);  then the large outbound\n\n# The finance portal (M4): the exposed backup and a crackable admin hash\ngobuster dir -u http://10.13.10.10 -w /usr/share/wordlists/dirb/common.txt</code></pre></div>\n<p>As you collect, keep tying findings back to the <strong>foothold IP</strong> — it is the through-line that connects the privileged login, the internal scan and the exfiltration into one intrusion.</p>\n<hr>\n<h2>6 · Running the Response (by the playbook)</h2>\n<p>Investigation without decisions is a report nobody acted on. Drive the response exactly as the week taught:</p>\n<ul>\n<li>**Contain the foothold — isolate, do <em>not</em> power off** (M6): network-isolate <code>10.13.10.66</code> to stop the bleeding while preserving volatile memory evidence.</li>\n<li><strong>Refuse-and-verify the voice-note transfer</strong> (M7): the synthetic \"executive\" wire order is actioned only after an <strong>out-of-band callback on a known number</strong>. The urgency is the manipulation.</li>\n<li><strong>Declare severity</strong> and stand up the cells; start the <strong>decision log</strong>.</li>\n<li><strong>Eradicate</strong> — close the vector, reset the cracked/stolen credentials, remove persistence, quarantine the poisoned AI knowledge base.</li>\n<li><strong>Recover by priority</strong> (M9): set <strong>RTO/RPO</strong>, restore the ransomed database from a <strong>verified-clean, offline</strong> backup (M6's 3-2-1), validate, reconnect.</li>\n<li><strong>Report</strong> (M8): work the Act 1038 (CSA) and Act 843 (DPC) notification questions with counsel.</li>\n</ul>\n<p>The climax techniques to name: <strong>T1041</strong> (Exfiltration Over C2 Channel) and <strong>T1486</strong> (Data Encrypted for Impact).</p>\n<hr>\n<h2>7 · Crisis Communications</h2>\n<p>A multi-vector incident is also a <strong>communications crisis</strong> — and trust is won or lost in how you speak. Map every stakeholder and prepare what each one hears:</p>\n<div class='tablewrap'><table><thead><tr><th>Audience</th><th>Message</th><th>Via</th></tr></thead><tbody><tr><td><strong>Board / executives</strong></td><td>severity, business impact, the decision asked</td><td>the IC, directly</td></tr><tr><td><strong>Staff</strong></td><td>what to do / not do (don't action payment requests; preserve evidence)</td><td>internal, calm, clear</td></tr><tr><td><strong>Customers</strong></td><td>honest, prompt — but only confirmed facts</td><td>counsel-approved (M8)</td></tr><tr><td><strong>Regulators</strong> (CSA/CERT-GH, DPC)</td><td>the required notifications, on their timelines</td><td>legal/comms cell</td></tr><tr><td><strong>Bank / receiving institution</strong></td><td>freeze &amp; recall — <em>immediately</em></td><td>fraud/finance cell (M5 golden hour)</td></tr><tr><td><strong>Press / public</strong></td><td>a holding statement, one spokesperson</td><td>never speculation</td></tr></tbody></table></div>\n<p><strong>Cadence:</strong> brief early, brief regularly, and never let silence or spin fill the gap. One voice, one consistent message — a confident early statement that later proves false does more damage than the breach (M8: <em>counsel before any external communication</em>).</p>\n<hr>\n<h2>8 · The After-Action Review</h2>\n<p>The incident is not over when the systems are back — it is over after the <strong>after-action review (AAR, or \"hotwash\")</strong>, held within days while memory is fresh. It is where a bad day becomes a stronger institution:</p>\n<ul>\n<li><strong>Reconstruct the timeline</strong> from the decision log and the evidence.</li>\n<li><strong>What went well, what didn't</strong> — <em>blameless</em>: the goal is better systems, not scapegoats; people hide mistakes you punish.</li>\n<li><strong>Find the true root cause</strong> — ask \"why\" five times past the symptom: <em>the exposed service? → no monthly self-scan → no asset owner → no board mandate for one.</em> The real fix is usually governance, not the symptom.</li>\n<li><strong>Turn every lesson into an owned action</strong> — each becomes a new <strong>control</strong> (the M2 register), a <strong>detection</strong> (an M4 rule), a <strong>playbook</strong> step, or a <strong>governance</strong> item (M9), with an owner and a date.</li>\n</ul>\n<p>That list <em>is</em> your <strong>90-day resilience roadmap</strong> — the capstone deliverable, and the loop closing all the way back to Day 1.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>An incident you don&#x27;t learn from, you will repeat</div><div class='callout-b'><p>The teams that improve aren't the ones that never get hit — they are the ones whose every incident ends in a blameless AAR that changes a control, a detection or a governance gap. The roadmap is how this week's crisis makes next year's smaller.</p></div></div>\n<hr>\n<h2>9 · Scenarios — Because This Is How Real Attacks Arrive</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana &amp; West Africa</div><div class='callout-b'><p>Every inject is drawn from a pattern you studied this week in a Ghanaian context — the GCB-style <strong>BEC</strong>, <strong>SIM/MoMo</strong> and <strong>deepfake-voice</strong> fraud, the hospital <strong>ransomware</strong> with its backup-and-power-off failures, the exposed-service <strong>foothold</strong>. Real regional campaigns deliberately <em>combine</em> fraud, intrusion and social engineering to maximise damage and confusion — and increasingly they corrupt the victim's own AI tools so the fraud validates itself.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Fused campaigns, worldwide</div><div class='callout-b'><p>The <strong>2016 Bangladesh Bank</strong> heist (~US$81M) fused a long intrusion with SWIFT fraud and careful timing across time zones. <strong>NotPetya (2017)</strong> fused worm propagation with destructive impact at ~US$10bn global cost. <strong>Arup (2024, ~US$25M)</strong> fused a deepfake video call with a finance-process failure. Different decades, same lesson: resilience is the ability to <strong>keep thinking clearly while all of it happens at once</strong> — which is exactly what this capstone rehearses.</p></div></div>\n<hr>\n<h2>10 · The Worked Investigation (what the lab asks of you)</h2>\n<p><code>labctl start m10</code> brings up the live range — a finance portal, a records host and the internal AI assistant — plus the evidence package (an 8-inject Wazuh feed, the BEC email, a network capture). Work the full picture:</p>\n<ol>\n<li><strong>T+00</strong> — from <code>payment-change.eml</code>, the <strong>look-alike domain</strong> and the <strong>mule account</strong>.</li>\n<li><strong>T+160 cross-check</strong> — ask the AI assistant; confirm its poisoned KB returns the <strong>same account</strong> → one campaign.</li>\n<li><strong>T+20/40</strong> — the <strong>foothold IP</strong> behind the privileged login and the scan.</li>\n<li><strong>Portal</strong> — the exposed <strong><code>db_dump.sql</code></strong> and the cracked <strong>admin password</strong>.</li>\n<li><strong>Capture</strong> — the <strong>C2 domain</strong> and the <strong>exfiltration IP</strong>; the highest <strong>alert severity</strong>.</li>\n<li><strong>Decisions</strong> — the <strong>deepfake</strong> verification step, the <strong>first containment</strong> action, and the ATT&amp;CK IDs for <strong>exfiltration</strong> and <strong>ransomware</strong>.</li>\n</ol>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Your values are unique</div><div class='callout-b'><p>The mule account, the look-alike domain, the C2 domain and the admin password are <strong>randomised per student</strong> — and the lab deliberately makes the BEC account and the AI's poisoned account <strong>identical</strong>, so you can prove the correlation. The examples elsewhere in the course are illustrative; report <em>your</em> values. <code>labctl verify m10</code> grades the full picture, and this is your <code>labctl progress</code> finale.</p></div></div>\n<p>Then assemble the <strong>Incident Dossier &amp; 90-Day Roadmap</strong> (<code>labctl worksheet m10</code>): the executive summary, the correlated attack story, the decision log, the NIST response summary, the reporting-obligations note, and the CSF-mapped roadmap.</p>\n<hr>\n<h2>Common mistakes</h2>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>What trips teams up</div><div class='callout-b'><ul>\n<li><strong>Treating injects in isolation.</strong> The whole point is that they are one campaign — correlate by shared indicators (the foothold IP, the shared account).</li>\n<li><strong>Powering off the foothold</strong> to \"stop it\" — isolate instead, to preserve evidence.</li>\n<li><strong>Actioning the voice-note transfer</strong> because it sounds urgent and real — verify out-of-band on a known number.</li>\n<li><strong>Trusting the AI's answer</strong> because \"the system said so\" — it was poisoned; that is the trap.</li>\n<li><strong>No decision log.</strong> In the debrief you must show <em>what you decided, when, and why.</em></li>\n</ul></div></div>\n<hr>\n<h2>Key takeaways</h2>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Carry these out of the capstone</div><div class='callout-b'><ul>\n<li>A real attack is <strong>multi-vector and simultaneous</strong> — run it under an <strong>Incident Commander</strong>, with a common operating picture and a battle rhythm, cycling the <strong>OODA loop</strong> faster and more accurately than the attacker.</li>\n<li><strong>Decide on incomplete information</strong>; beware tunnel vision, confirmation bias and premature closure; <strong>assume the injects are connected until proven otherwise.</strong></li>\n<li>The master skill is <strong>correlation</strong> — a repeatable method (shared-indicator pivot · Kill Chain · ATT&amp;CK · Diamond) that turns scattered alerts into <strong>one campaign</strong>. \"The system said so\" is not verification when the system is poisoned.</li>\n<li>Respond by the playbook: <strong>isolate (don't power off), verify out-of-band, declare severity, set RTO/RPO, log every decision</strong> — and run honest <strong>crisis comms</strong>.</li>\n<li>Close the loop with a <strong>blameless after-action review</strong> → the <strong>90-day roadmap</strong>.</li>\n<li>Climax techniques: <strong>T1041</strong> (exfiltration), <strong>T1486</strong> (ransomware).</li>\n</ul></div></div>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>The BEC email, a privileged login, an internal scan and an exfiltration all involve one IP. What does that tell you?</strong> → They are one campaign, not four incidents — the shared IP is the foothold tying the attack together. Correlate; don't triage separately.</li>\n</ol>\n<ol>\n<li><strong>You ask the bank's AI assistant for the supplier account and it returns the exact number the BEC email demanded. What have you just proven?</strong> → That the phishing and the AI compromise are the <strong>same campaign</strong> — the knowledge base was poisoned to make the fraud validate itself. \"The system said so\" is not verification.</li>\n</ol>\n<ol>\n<li><strong>A voice note \"from the CEO\" demands an urgent transfer mid-incident. Action it?</strong> → No — verify out-of-band on a known number first. It is a likely deepfake; the urgency is the manipulation.</li>\n</ol>\n<ol>\n<li><strong>You contain the foothold host — isolate or power off?</strong> → <strong>Isolate</strong> from the network; powering off destroys volatile memory evidence.</li>\n</ol>\n<ol>\n<li><strong>Name the ATT&amp;CK techniques for the exfiltration and the ransomware.</strong> → <strong>T1041</strong> (Exfiltration Over C2 Channel) and <strong>T1486</strong> (Data Encrypted for Impact).</li>\n</ol>\n<ol>\n<li><strong>Mid-incident you have only partial, partly-contradictory information. Name two cognitive traps to guard against, and the discipline that keeps you moving.</strong> → Any two of: <strong>tunnel vision / first-story bias, confirmation bias, premature closure, normalisation of deviance</strong>. The discipline: <strong>prioritise by impact and reversibility</strong> and act on good-enough information — waiting for certainty is itself a (bad) decision.</li>\n</ol>\n<ol>\n<li><strong>The systems are restored and the attacker is out. Is the incident over? What happens next, and what does it produce?</strong> → Not yet — you hold a <strong>blameless after-action review</strong>: reconstruct the timeline, find the true root cause (five whys), and turn each lesson into an owned control / detection / governance action. That list is the <strong>90-day resilience roadmap</strong>.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Multi-vector attack</strong> — one campaign using several techniques at once.</li>\n<li><strong>Inject</strong> — a scripted event introduced during an exercise.</li>\n<li><strong>Incident Commander (IC)</strong> — the person who owns the response, keeps the picture whole and decides.</li>\n<li><strong>Common operating picture (COP)</strong> — one shared view of known/assumed/unknown and who is doing what.</li>\n<li><strong>Battle rhythm</strong> — the regular sync cadence the IC runs to keep the cells aligned.</li>\n<li><strong>OODA loop</strong> — Observe → Orient → Decide → Act, cycled fast under pressure.</li>\n<li><strong>Correlation</strong> — linking separate events via shared indicators into one story.</li>\n<li><strong>Foothold</strong> — the attacker's established position inside the network.</li>\n<li><strong>Operational cell</strong> — a focused response team (leadership, technical, fraud, legal/comms).</li>\n<li><strong>Decision log</strong> — timestamped record of crisis decisions and rationale.</li>\n<li><strong>Crisis communications</strong> — honest, coordinated, one-voice messaging to every stakeholder.</li>\n<li><strong>After-action review (hotwash)</strong> — the blameless post-incident retro that produces the lessons/roadmap.</li>\n<li><strong>RTO / RPO</strong> — recovery time / recovery point objectives (Module 9).</li>\n<li><strong>Kill Chain / ATT&amp;CK</strong> — where in the intrusion / which specific technique.</li>\n<li><strong>T1041 / T1486</strong> — exfiltration over C2 / data encrypted for impact.</li>\n</ul>", "sheets": [{"name": "m10-incident-dossier.md", "html": "<h1>Incident Dossier &amp; 90-Day Roadmap — Module 10 Capstone Deliverable</h1>\n<p><strong>Team / name:</strong> [ ]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Exercise:</strong> Operation Cyber Resilience</p>\n<blockquote>The capstone deliverable pulls the whole week together: prove the attack story</blockquote>\n<blockquote>from evidence, show the decisions you made, and set the recovery path. See</blockquote>\n<blockquote><code>labctl learn m10</code>.</blockquote>\n<h2>1. Executive summary (for leadership)</h2>\n<p>[What happened, business impact, current status — 4–5 sentences.]</p>\n<h2>2. The attack story (correlation)</h2>\n<p>[Narrative tying the eight injects into ONE campaign. Name the shared indicator (e.g. the foothold IP) that links them.]</p>\n<div class='tablewrap'><table><thead><tr><th>Inject</th><th>Time</th><th>Event</th><th>Evidence</th><th>ATT&amp;CK</th></tr></thead><tbody><tr><td>T+00</td><td>09:00</td><td>Supplier payment-change email</td><td>payment-change.eml</td><td>T1566</td></tr><tr><td>T+20</td><td>09:20</td><td>Privileged login, unusual IP</td><td>Wazuh alerts</td><td>T1078</td></tr><tr><td>T+40</td><td>09:40</td><td>Internal host scanning</td><td>Wazuh / Nmap</td><td>T1046</td></tr><tr><td>T+65</td><td>10:05</td><td>Vendor bank details changed 48h ago</td><td>email / finance</td><td>T1565</td></tr><tr><td>T+90</td><td>10:30</td><td>Synthetic executive voice transfer order</td><td>—</td><td>T1656</td></tr><tr><td>T+120</td><td>11:00</td><td>Data exfiltration to unknown IP</td><td>pcap / Wazuh</td><td>T1041</td></tr><tr><td>T+145</td><td>11:25</td><td>Critical database offline (ransomware)</td><td>Wazuh</td><td>T1486</td></tr><tr><td>T+160</td><td>11:40</td><td>AI assistant leaks data via injected doc</td><td>—</td><td>—</td></tr></tbody></table></div>\n<p>Key indicators — Foothold IP: [ ]  C2 domain: [ ]  Exfil destination IP: [ ] Look-alike domain: [ ]  Highest alert severity: [ ]</p>\n<h2>3. Decision log (your crisis audit trail)</h2>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Decision</th><th>Made by</th><th>Rationale</th></tr></thead><tbody><tr><td>[ ]</td><td>[e.g. isolate foothold host — NOT power off]</td><td>[IC]</td><td>preserve evidence</td></tr><tr><td>[ ]</td><td>[refuse &amp; verify voice-note transfer via callback]</td><td></td><td>likely deepfake</td></tr><tr><td>[ ]</td><td>[declare severity: ___]</td><td></td><td></td></tr></tbody></table></div>\n<h2>4. Response summary (NIST lifecycle)</h2>\n<ul>\n<li>Containment: [ ]</li>\n<li>Eradication: [ ]</li>\n<li>Recovery priorities (RTO/RPO): [ ]</li>\n</ul>\n<h2>5. Reporting obligations &amp; crisis communications</h2>\n<ul>\n<li><strong>Reporting:</strong> [Act 1038 CSA/CERT-GH · Act 843 DPC — questions for counsel]</li>\n<li><strong>Stakeholders briefed:</strong> [board · staff · customers · regulator · bank · press]</li>\n<li><strong>Holding statement / spokesperson:</strong> [one voice, confirmed facts only]</li>\n</ul>\n<h2>5b. After-action review (hotwash)</h2>\n<ul>\n<li><strong>What went well:</strong> [ ]</li>\n<li><strong>What didn't:</strong> [ ] <em>(blameless — systems, not scapegoats)</em></li>\n<li><strong>True root cause (five whys past the symptom):</strong> [ ]</li>\n</ul>\n<h2>6. 90-Day resilience roadmap</h2>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Action</th><th>Addresses</th><th>Owner</th><th>Target</th><th>CSF function</th></tr></thead><tbody><tr><td>1</td><td>[FILL IN]</td><td>[inject/root cause]</td><td></td><td></td><td>[Govern/Identify/Protect/Detect/Respond/Recover]</td></tr><tr><td>2</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>7. Three lessons for the board</h2>\n<ol>\n<li>[ ]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<hr>\n<h2>Self-check before you submit</h2>\n<ul>\n<li>[ ] §2 tells <strong>one</strong> campaign story, not eight separate incidents.</li>\n<li>[ ] I proved the <strong>signature correlation</strong>: the BEC mule account == the AI's poisoned answer == tied to the foothold IP.</li>\n<li>[ ] My decision log shows <strong>isolate (not power off)</strong> and <strong>callback-verify</strong> the voice order.</li>\n<li>[ ] Every roadmap item maps to a <strong>root cause</strong> and a <strong>CSF function</strong>.</li>\n<li>[ ] I only touched 10.13.10.0/24.</li>\n</ul>\n<h2>Grading rubric (100 pts)</h2>\n<div class='tablewrap'><table><thead><tr><th>Band</th><th>Attack story &amp; correlation (40)</th><th>Decisions &amp; evidence (25)</th><th>Response &amp; obligations (15)</th><th>Roadmap &amp; board lessons (20)</th></tr></thead><tbody><tr><td>Excellent (full)</td><td>All injects correlated into one campaign; signature link proven</td><td>Sound, timestamped, evidence-backed decisions</td><td>Correct NIST phases + Act 1038/843 considered</td><td>Prioritised, root-cause-linked, CSF-mapped</td></tr><tr><td>Adequate (~60%)</td><td>Most injects linked, signature link missed</td><td>Decisions made, thin rationale</td><td>Generic response</td><td>Generic actions</td></tr><tr><td>Weak (&lt;40%)</td><td>Injects listed separately</td><td>Ad-hoc decisions, no log</td><td>Power-off / action the transfer</td><td>No roadmap</td></tr></tbody></table></div>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<p><em>Illustrative values — yours are randomised.</em></p>\n<p><strong>The story:</strong> one adversary. A look-alike <strong>zennith-supplies.com</strong> email (T+00) demanded payment to mule account <strong>0123456789</strong>; the bank's <strong>AI assistant</strong>, asked about the supplier, returned the <strong>same 0123456789</strong> — its knowledge base was <strong>poisoned</strong> (T+160). Meanwhile foothold <strong>10.13.10.66</strong> logged in with privilege (T+20), scanned internally (T+40), beaconed to a dynamic-DNS C2, and exfiltrated to <strong>185.220.101.44</strong> (T+120) before ransomware took the database (T+145). <strong>The same account appearing in the email and the AI proves it is one campaign.</strong></p>\n<p><strong>Decisions (logged):</strong> 11:02 <strong>isolate</strong> 10.13.10.66 (not power off) — preserve RAM; 10:31 <strong>refuse &amp; callback-verify</strong> the T+90 voice order on the MD's known number (deepfake); 11:05 declare <strong>High</strong> severity; quarantine the poisoned AI KB.</p>\n<p><strong>Response:</strong> eradicate (reset cracked admin creds, remove persistence, clean KB); recover ransomed DB from <strong>offline</strong> backup (RPO ≤ 24h, RTO ≤ 8h); assess CSA/DPC notification. <strong>Roadmap:</strong> MFA everywhere (Protect) · DNS monitoring (Detect) · dual-control payments + callback (Protect/Govern) · AI KB change-control + least- privilege tools (Govern) · monthly restore test (Recover).</p>\n<p><strong>Board lessons:</strong> (1) one callback would have stopped the fraud; (2) our own AI was turned against us — govern it; (3) tested offline backups are what got us back.</p>"}]}};
const DAYS={1:"Day 1",2:"Day 2",3:"Day 3",4:"Day 4",5:"Day 5"};
function buildNav(){
  const order=Object.keys(DATA);
  let lastDay=null,h="";
  for(const mid of order){
    const d=DATA[mid];
    if(d.day!==lastDay){h+=`<div class="day-h">${DAYS[d.day]||("Day "+d.day)}</div>`;lastDay=d.day;}
    const label=d.title.replace(/^Module\s+\d+\s*[—-]\s*/,"");
    h+=`<a data-mid="${mid}" onclick="show('${mid}')"><span class="mid">${mid.toUpperCase()}</span>${label}</a>`;
  }
  document.getElementById('navlist').innerHTML=h;
}
function show(mid){
  const d=DATA[mid]; if(!d) return;
  let h=d.lesson;
  if(d.sheets&&d.sheets.length){
    for(const s of d.sheets){
      h+=`<details><summary>📝 Deliverable template — ${s.name}</summary><div class="body">${s.html}</div></details>`;
    }
  }
  document.getElementById('content').innerHTML=h;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.mid===mid));
  window.scrollTo(0,0);
  try{localStorage.setItem('caic_last',mid);}catch(e){}
  if(location.hash!=='#'+mid) history.replaceState(null,'','#'+mid);
}
function filter(q){
  q=q.toLowerCase();
  document.querySelectorAll('nav a').forEach(a=>{
    const d=DATA[a.dataset.mid];
    const hay=(d.title+' '+d.lesson).toLowerCase();
    a.style.display=hay.includes(q)?'block':'none';
  });
}
function toggleTheme(){
  const r=document.documentElement;
  const t=r.getAttribute('data-theme')==='light'?'dark':'light';
  r.setAttribute('data-theme',t);
  try{localStorage.setItem('caic_theme',t);}catch(e){}
}
(function init(){
  try{const t=localStorage.getItem('caic_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  buildNav();
  let start=(location.hash||'').replace('#','');
  if(!DATA[start]){try{start=localStorage.getItem('caic_last');}catch(e){}}
  if(!DATA[start]) start=Object.keys(DATA)[0];
  show(start);
})();
</script>
