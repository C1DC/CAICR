o launch. <strong>Assessment:</strong> your lab submission — the <em>Fraud Investigation Brief</em> (<code>labctl worksheet m5</code>) — counts toward the Module 5 practical grade.</p></div></div>\n<hr>\n<h2>1 · Fraud Is Deception, Not Malware</h2>\n<p><strong>Business Email Compromise (BEC)</strong> is impersonation fraud conducted over email. There is usually <strong>no malware and no exploit</strong>. The attacker studies a genuine business relationship — often for weeks — then sends a message that <em>looks</em> like it comes from a trusted party (a supplier, the Managing Director, a lawyer) asking to change bank details or make an urgent payment. The victim is not hacked. They are <strong>deceived</strong> into doing the attacker's work with their own hands and their own authority.</p>\n<p>Five classic plays recur:</p>\n<ul>\n<li><strong>CEO fraud</strong> — \"the MD\" orders an urgent, confidential transfer.</li>\n<li><strong>Supplier impersonation</strong> — a real supplier announces a \"new bank account\" mid-relationship.</li>\n<li><strong>Payroll diversion</strong> — an \"employee\" asks HR to redirect their salary.</li>\n<li><strong>Attorney impersonation</strong> — a \"lawyer\" invokes confidentiality and a deadline.</li>\n<li><strong>Gift-card fraud</strong> — the low-value entry version, used to test a target.</li>\n</ul>\n<hr>\n<h2>2 · Why It Works — The Psychology, Named</h2>\n<p>Fraud is engineered against human decision-making, and two frameworks explain it precisely.</p>\n<p><strong>The Fraud Triangle</strong> — fraud needs three things: <em>pressure</em>, <em>opportunity</em> and <em>rationalisation</em>. BEC manufactures all three at once: <strong>urgency</strong> supplies the pressure, a <strong>weak approval process</strong> supplies the opportunity, and a <strong>plausible story</strong> (\"the MD is in a board meeting and needs this done now\") supplies the rationalisation.</p>\n<p><strong>Cialdini's principles of influence</strong> — attackers weaponise <strong>authority</strong> (\"this is the MD\"), <strong>urgency/scarcity</strong> (\"the deadline is today\"), <strong>social proof</strong>, <strong>liking</strong> and <strong>reciprocity</strong>.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The BEC signature</div><div class='callout-b'><p>When one message combines <strong>authority + confidentiality + urgency + a nudge away from phone contact</strong> (\"just email me, I'm in meetings\"), your suspicion should spike immediately. Those four together are the fingerprint of BEC — they exist to switch off the victim's instinct to verify.</p></div></div>\n<p>The defender's structural advantage is this: <strong>email carries its own evidence.</strong> The friendly <code>From:</code> name can say anything, but the headers record the true delivery path and the authentication verdicts, and an attached document records who made it and when. Reading that evidence is the whole craft.</p>\n<hr>\n<h2>3 · Email Header Forensics</h2>\n<p>The headers are read from the <strong>bottom up</strong> — the earliest <code>Received</code> line is the first server that handled the message. Learn which field proves what:</p>\n<div class='tablewrap'><table><thead><tr><th>Header</th><th>What it proves</th></tr></thead><tbody><tr><td><code>From:</code></td><td>The <em>display</em> — attacker-controlled. <strong>Trust it last.</strong></td></tr><tr><td><code>Return-Path</code> / envelope sender</td><td>Where bounces really go — often the true look-alike domain.</td></tr><tr><td><code>Reply-To</code></td><td>Where <em>your reply</em> silently goes. A mismatch here is the classic trap.</td></tr><tr><td><code>Received:</code> chain</td><td>The delivery path, bottom-up; the earliest hop shows the connecting IP — trace it with <code>whois</code>.</td></tr><tr><td><code>Authentication-Results</code></td><td>The verdicts: SPF, DKIM, DMARC pass/fail.</td></tr></tbody></table></div>\n<p>The three authentication checks — the <em>receiving</em> side of the email-security story you met in Module 1:</p>\n<ul>\n<li><strong>SPF</strong> — was the sending server authorised to send for that domain? <code>fail</code> = no.</li>\n<li><strong>DKIM</strong> — is there a valid cryptographic signature proving the message was not altered? <code>none</code> = unsigned.</li>\n<li><strong>DMARC</strong> — the domain's published policy, and crucially <strong>alignment</strong>: does the authenticated domain match the visible <code>From:</code>? Alignment is what actually catches display-name spoofing.</li>\n</ul>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 680 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"m5-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L5,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"11\">\n    <rect x=\"40\" y=\"16\" width=\"150\" height=\"34\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/>\n    <text x=\"115\" y=\"37\" fill=\"currentColor\">Incoming message</text>\n    <rect x=\"40\" y=\"74\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"115\" y=\"91\" fill=\"currentColor\" font-weight=\"bold\">SPF</text><text x=\"115\" y=\"105\" fill=\"currentColor\" font-size=\"8.5\">server authorised?</text>\n    <rect x=\"40\" y=\"138\" width=\"150\" height=\"40\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"115\" y=\"155\" fill=\"currentColor\" font-weight=\"bold\">DKIM</text><text x=\"115\" y=\"169\" fill=\"currentColor\" font-size=\"8.5\">signature valid?</text>\n    <rect x=\"300\" y=\"100\" width=\"170\" height=\"52\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"385\" y=\"120\" fill=\"currentColor\" font-weight=\"bold\">DMARC</text><text x=\"385\" y=\"135\" fill=\"currentColor\" font-size=\"8.5\">policy + alignment</text><text x=\"385\" y=\"146\" fill=\"currentColor\" font-size=\"8.5\">(From matches authenticated?)</text>\n    <rect x=\"540\" y=\"92\" width=\"120\" height=\"34\" rx=\"6\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <text x=\"600\" y=\"113\" fill=\"currentColor\" font-weight=\"bold\">DELIVER</text>\n    <rect x=\"540\" y=\"150\" width=\"120\" height=\"48\" rx=\"6\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"600\" y=\"170\" fill=\"currentColor\" font-weight=\"bold\">QUARANTINE</text><text x=\"600\" y=\"186\" fill=\"currentColor\">/ REJECT</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"115\" y1=\"50\"  x2=\"115\" y2=\"72\"  marker-end=\"url(#m5-a)\"/>\n    <line x1=\"115\" y1=\"114\" x2=\"115\" y2=\"136\" marker-end=\"url(#m5-a)\"/>\n    <path d=\"M190,94 C250,94 250,120 298,124\" marker-end=\"url(#m5-a)\"/>\n    <path d=\"M190,158 C250,158 250,132 298,130\" marker-end=\"url(#m5-a)\"/>\n    <path d=\"M470,118 L538,110\" marker-end=\"url(#m5-a)\"/>\n    <path d=\"M470,140 C505,150 510,168 538,172\" marker-end=\"url(#m5-a)\"/>\n  </g>\n  <g font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">\n    <text x=\"196\" y=\"90\" fill=\"var(--red,#ff6b7a)\">fail</text>\n    <text x=\"196\" y=\"154\" fill=\"var(--red,#ff6b7a)\">none/fail</text>\n    <text x=\"500\" y=\"106\" fill=\"var(--green,#4cae74)\">aligned</text>\n    <text x=\"498\" y=\"158\" fill=\"var(--red,#ff6b7a)\">fails</text>\n  </g>\n</svg></div><figcaption>How a receiver authenticates an email (SPF → DKIM → DMARC)</figcaption></figure>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — trace a spoof from its own headers</span></div><pre><code># Pull the headers that matter\ngrep -iE '^(From|Return-Path|Reply-To|Received|Authentication)' invoice-change-request.eml\n\n# Check the sending domain's SPF record, and who owns the connecting server\ndig TXT zenith-supplies.com +short        # the look-alike domain's SPF\nwhois 45.137.112.63                        # ISP / country of the source IP</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The genuine-vs-spoof contrast is the proof</div><div class='callout-b'><p>This lab gives you <strong>two</strong> messages: the earlier <em>genuine</em> quote and the later <em>spoofed</em> reply. On their own, a single \"SPF fail\" can have innocent causes. But when the genuine email shows <strong>SPF pass</strong> from the real domain and the spoof shows <strong>SPF fail</strong> from a hyphenated look-alike with a mismatched <code>Reply-To</code>, the contrast is courtroom-grade. Always compare against a known-good baseline when you have one.</p></div></div>\n<p>Watch for the <strong>thread hijack</strong>: a competent attacker reuses the real purchase- order number and quotes the genuine email, so the fraud arrives inside what looks like an ongoing, trusted conversation.</p>\n<h3>3.1 Reading the <code>Received</code> chain, line by line</h3>\n<p>The <code>Received:</code> headers are a stack: each mail server that handles the message <strong>prepends</strong> its own line to the top. So you read them <strong>bottom-up</strong> — the <em>lowest</em> line is the <em>first</em> hop, where the message entered the mail system, and that line's <code>from ... ([IP])</code> is the <strong>originating server</strong>.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a Received chain, annotated (read bottom to top)</span></div><pre><code>Received: from mx.yourbank.com.gh by imap.yourbank.com.gh ...     ← (3) your mailbox\nReceived: from mail.zenith-supplies.com (mail.zenith-supplies.com\n          [45.137.112.63]) by mx.yourbank.com.gh ...              ← (2) your gateway accepted it\nReceived: from [192.168.8.14] (unknown [45.137.112.63])\n          by mail.zenith-supplies.com ...                         ← (1) ORIGIN: whois this IP\nMessage-ID: &lt;a93f@zenith-supplies.com&gt;                            ← domain should match the sender\nX-Mailer: PHPMailer 6.9                                           ← bulk-mail tooling, not Outlook</code></pre></div>\n<p>Three analyst moves on that block:</p>\n<ul>\n<li><strong>Trust from your boundary inward.</strong> An attacker can <em>forge</em> <code>Received</code> lines below the point your own infrastructure took over, but not the ones your servers added. So the first <em>trustworthy</em> hop is where your gateway (<code>mx.yourbank.com.gh</code>) received it — and the IP it received <em>from</em> is the real origin. <code>whois</code> it.</li>\n<li><strong>Message-ID</strong> domain should match the sending domain; a mismatch (or a Gmail Message-ID on a \"supplier\" mail) is a tell.</li>\n<li><strong>X-headers</strong> leak tooling: <code>X-Mailer: PHPMailer</code>, <code>X-Originating-IP</code>, or a consumer webmail stamp on a \"corporate\" message are all signals.</li>\n</ul>\n<h3>3.2 Reading <code>Authentication-Results</code> properly</h3>\n<p>Don't just note pass/fail — read the fields, because they name <em>which domain</em> was checked:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — one Authentication-Results header, decoded</span></div><pre><code>Authentication-Results: mx.yourbank.com.gh;\n  spf=fail (sender IP is not permitted) smtp.mailfrom=zenith-supplies.com;\n  dkim=none;\n  dmarc=fail (p=none) header.from=zenithsupplies.com.gh</code></pre></div>\n<ul>\n<li><code>smtp.mailfrom</code> is the <strong>envelope</strong> domain (the <code>Return-Path</code>); <code>header.from</code> is the <strong>visible</strong> <code>From:</code>. <strong>DMARC alignment</strong> requires the authenticated domain to <em>match</em> <code>header.from</code> — <em>relaxed</em> allows the same organisational domain, <em>strict</em> demands an exact match.</li>\n<li>Here SPF was checked against the look-alike <code>zenith-supplies.com</code> while the visible From is the real <code>zenithsupplies.com.gh</code> — they don't align, so <strong>DMARC fails</strong>. That misalignment is exactly how display-name spoofing is caught.</li>\n<li>But note <code>(p=none)</code> — the real domain publishes a <em>monitor-only</em> policy, so the forged mail was <strong>delivered anyway</strong>. Which is the perfect segue to the other half of the job: making sure <em>your</em> domain isn't the one being abused.</li>\n</ul>\n<hr>\n<h2>4 · Hardening Your Own Email — So You're Not the One Spoofed</h2>\n<p>Everything so far is the <em>receiver's</em> investigation. The flip side is the duty you owe your own customers and partners: publish records so that <strong>nobody can successfully spoof your domain</strong>. Three DNS records do it (you met them from the receiving side in Module 1):</p>\n<ul>\n<li><strong>SPF</strong> — a TXT record listing the servers allowed to send as you, ending in <strong><code>-all</code></strong> (hard fail). A softfail <code>~all</code> tells receivers \"probably not us, but deliver anyway\" — publish <code>-all</code> once you know all your senders.</li>\n<li><strong>DKIM</strong> — sign every outbound message with a private key; publish the public key at a <em>selector</em> so receivers can verify nothing was altered.</li>\n<li><strong>DMARC</strong> — a <code>_dmarc</code> TXT record that ties SPF+DKIM to your visible <code>From:</code> and tells receivers what to do with failures — and asks them to send you <strong>aggregate reports</strong> (<code>rua=</code>).</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the records, and how to check them (tie-in to Module 1&#x27;s dig)</span></div><pre><code>dig TXT yourbank.com.gh           +short   # v=spf1 include:_spf.provider ... -all\ndig TXT sel._domainkey.yourbank.com.gh +short   # v=DKIM1; k=rsa; p=MIGf...\ndig TXT _dmarc.yourbank.com.gh    +short   # v=DMARC1; p=reject; rua=mailto:dmarc@yourbank.com.gh</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>p=none protects no one — the goal is p=reject</div><div class='callout-b'><p>Roll DMARC out in stages: <strong><code>p=none</code></strong> (monitor only — read the aggregate reports to find your legitimate senders), then <strong><code>p=quarantine</code></strong> (fails go to spam), then <strong><code>p=reject</code></strong> (fails are refused outright). Most organisations stall at <code>p=none</code> and wonder why criminals still spoof them — <em>none</em> only watches. The GCB-style BEC works partly because the impersonated supplier sat at <code>p=none</code>. Reaching <strong><code>p=reject</code></strong> is the single highest-impact control to stop your brand being weaponised against your own customers.</p></div></div>\n<hr>\n<h2>5 · Attachment &amp; Document Forensics</h2>\n<p>Attackers are meticulous about the email and careless about the file. Office documents and PDFs silently record <strong>metadata</strong> — who authored them, in what application, and <em>when</em> — and that metadata is often the attacker's undoing. <strong>exiftool</strong> reads it from almost any file type; <strong>pdfinfo</strong> is a quick PDF-only alternative.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — exiftool exposes the attacker behind the attachment</span></div><pre><code>exiftool remittance-advice.pdf</code></pre></div>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the fields that matter (illustrative; yours differ)</span></div><pre><code>Author          : k1ngpin\nCreator         : Microsoft® Word\nCreate Date     : 2026:09:28 23:41:07+07:00\nModify Date     : 2026:09:28 23:42:10+07:00\nProducer        : Microsoft® Word\nTitle           : Remittance Advice</code></pre></div>\n<p>Three findings leap out, each independently damaging:</p>\n<ul>\n<li><strong>Author</strong> — not \"Zenith Supplies Finance\" but a handle like <code>k1ngpin</code>. A genuine supplier's document does not carry a street-handle author name.</li>\n<li><strong>Timezone</strong> — the <code>Create Date</code> ends in a <strong>UTC offset</strong> (e.g. <code>+07:00</code>) that is inconsistent with a Ghanaian supplier (Ghana is <strong>+00:00</strong>). The author sat in a very different part of the world.</li>\n<li><strong>Create Date vs send date</strong> — this is the knockout.</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Metadata proves premeditation</div><div class='callout-b'><p>If the attachment's <strong>Create Date (e.g. 2026-09-28)</strong> is <em>days before</em> the email was <strong>sent (e.g. 2026-10-06)</strong>, the fraud was <strong>prepared in advance</strong> — it was not an impulsive error or a genuine mistake, but a planned operation. \"Created before sent\" turns a civil dispute into evidence of deliberate, premeditated fraud. Check this on every malicious document you handle.</p></div></div>\n<p>The defensive lesson cuts both ways: scrub metadata from documents <em>your</em> organisation publishes (author names, internal paths and software versions are reconnaissance gifts), and read it closely on anything suspicious you receive.</p>\n<h3>5.1 Beyond PDFs — Office documents and macros</h3>\n<p><code>exiftool</code> reads <strong>Office</strong> files too (<code>.docx/.xlsx</code> are ZIP containers of XML — <code>docProps/core.xml</code> holds author, <code>lastModifiedBy</code>, created/modified timestamps, and a <em>revision count</em> that betrays a hastily cloned template). When the attachment is a <strong>macro-enabled</strong> Office file (<code>.docm</code>, <code>.xlsm</code>) — the classic malware lure of Module 6 — you triage the macro <em>without opening it</em> using <code>oletools</code>:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — triage a macro-enabled document safely (never open it)</span></div><pre><code>exiftool suspicious.docx                 # author, lastModifiedBy, timestamps\nolevba suspicious.docm                   # dump VBA macros + flag auto-run/shell/download</code></pre></div>\n<p><code>olevba</code> flags the dangerous verbs — <code>AutoOpen</code>, <code>Shell</code>, <code>powershell</code>, <code>URLDownloadToFile</code> — that turn a document into a dropper. In this module the lure is a PDF, but the instinct is universal: <strong>read the file's metadata and code before you trust its contents.</strong></p>\n<hr>\n<h2>6 · Mobile Money — Ghana's Fraud Battleground</h2>\n<p>Mobile money is how most Ghanaians bank, which makes it the country's busiest fraud surface. The scams are overwhelmingly <strong>social-engineering</strong>, not hacking — the same deception-not-malware principle as BEC, aimed at individuals and agents.</p>\n<p><strong>The MoMo fraud taxonomy:</strong></p>\n<ul>\n<li><strong>SIM swap.</strong> The fraudster persuades (or bribes) a mobile operator to port a victim's number to a new SIM, hijacking every SMS one-time code that \"protects\" the wallet — authentication bypassed <strong>without touching a computer</strong>.</li>\n<li><strong>Vishing / \"your wallet will be blocked\".</strong> A scripted call (\"I'm from MoMo support, confirm your PIN / approve the prompt I just sent to reactivate your account\"). The victim approves the attacker's own transaction.</li>\n<li><strong>Prompt-approval fatigue.</strong> The fraudster triggers a real \"approve payment\" prompt and talks the victim into accepting it.</li>\n<li><strong>Erroneous-transfer / reversal scam.</strong> \"I sent you money by mistake — please send it back.\" The original \"credit\" was itself fraudulent or reversed.</li>\n<li><strong>Phishing portals &amp; fake agents.</strong> Links to a cloned MoMo page, or a complicit agent processing unauthorised cash-outs.</li>\n</ul>\n<p><strong>The ecosystem and why it's exposed.</strong> Ghana's mobile money runs under the <strong>Bank of Ghana</strong> and the <strong>Payment Systems and Services Act 2019 (Act 987)</strong>, cleared through <strong>GhIPSS</strong>, across the telcos (MTN MoMo, Telecel, AT). Fraud is enabled at the seams: weak <strong>agent KYC</strong>, SIM-registration gaps, and — technically — the legacy telecom signalling protocol <strong>SS7</strong>, which has well-documented weaknesses that let a motivated attacker intercept SMS OTPs across networks. That is the deeper reason <strong>SMS OTP is fundamentally weak</strong>.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The controls that actually hold</div><div class='callout-b'><p>For individuals: a strong unique PIN, device/SIM <strong>binding</strong>, and treating any unsolicited call or prompt as hostile. For institutions and agents: <strong>transaction and daily limits</strong>, <strong>velocity/anomaly detection</strong> (a sudden large transfer, a new device, an odd location, rapid dispersal), <strong>in-app out-of-band approval</strong> rather than SMS, and — on a business wallet — <strong>dual authorisation</strong>. Never trust a single SMS OTP: SIM swap and SS7 defeat it entirely.</p></div></div>\n<hr>\n<h2>7 · Follow the Money — Mules, Cash-Out and the Golden Hour</h2>\n<p>Catching the fraud is only half the job; the other half is a <strong>race to the money</strong>. The moment a payment leaves, the funds enter the <strong>layering</strong> phase — split across <strong>money-mule</strong> accounts (often people recruited through \"work-from-home\" or romance scams), moved fast, and <strong>cashed out</strong> via MoMo agents, prepaid cards or crypto, then consolidated to the organiser. Every hop makes recovery harder.</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 660 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"mm-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L5,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"10\">\n    <rect x=\"16\"  y=\"30\" width=\"96\" height=\"40\" rx=\"6\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/><text x=\"64\" y=\"47\" fill=\"currentColor\" font-weight=\"bold\">VICTIM</text><text x=\"64\" y=\"61\" fill=\"currentColor\" font-size=\"8.5\">pays the mule</text>\n    <rect x=\"170\" y=\"14\" width=\"110\" height=\"36\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/><text x=\"225\" y=\"36\" fill=\"currentColor\">mule account A</text>\n    <rect x=\"170\" y=\"74\" width=\"110\" height=\"36\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/><text x=\"225\" y=\"96\" fill=\"currentColor\">mule account B</text>\n    <rect x=\"336\" y=\"14\" width=\"130\" height=\"36\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/><text x=\"401\" y=\"36\" fill=\"currentColor\">MoMo agent cash-out</text>\n    <rect x=\"336\" y=\"74\" width=\"130\" height=\"36\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/><text x=\"401\" y=\"96\" fill=\"currentColor\">crypto / prepaid</text>\n    <rect x=\"520\" y=\"44\" width=\"124\" height=\"38\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.10\" stroke=\"currentColor\"/><text x=\"582\" y=\"62\" fill=\"currentColor\" font-weight=\"bold\">kingpin</text><text x=\"582\" y=\"75\" fill=\"currentColor\" font-size=\"8.5\">consolidated</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"112\" y1=\"48\" x2=\"168\" y2=\"34\" marker-end=\"url(#mm-a)\"/>\n    <line x1=\"112\" y1=\"52\" x2=\"168\" y2=\"90\" marker-end=\"url(#mm-a)\"/>\n    <line x1=\"280\" y1=\"32\" x2=\"334\" y2=\"32\" marker-end=\"url(#mm-a)\"/>\n    <line x1=\"280\" y1=\"92\" x2=\"334\" y2=\"92\" marker-end=\"url(#mm-a)\"/>\n    <line x1=\"466\" y1=\"32\" x2=\"518\" y2=\"56\" marker-end=\"url(#mm-a)\"/>\n    <line x1=\"466\" y1=\"92\" x2=\"518\" y2=\"70\" marker-end=\"url(#mm-a)\"/>\n  </g>\n  <rect x=\"40\" y=\"150\" width=\"580\" height=\"40\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n  <text x=\"330\" y=\"167\" text-anchor=\"middle\" font-size=\"10\" fill=\"currentColor\" font-weight=\"bold\">THE GOLDEN HOUR</text>\n  <text x=\"330\" y=\"182\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\">call the bank fraud desk to FREEZE / recall before the funds are cashed out — recovery collapses within hours</text>\n</svg></div><figcaption>Follow the money — and where you can still stop it</figcaption></figure>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Speed is the control once money moves</div><div class='callout-b'><p>Recovery probability falls off a cliff within <strong>hours</strong>. The instant fraud is suspected: (1) call <strong>your bank's fraud desk</strong> to freeze and attempt recall; (2) have them contact the <strong>receiving bank or telco</strong> to freeze that account/wallet; (3) for international wires, your bank raises a <strong>SWIFT recall</strong>. Preserve the evidence you gathered (the emails with full headers, the attachment, your brief) — it is what the investigators and the receiving institution act on.</p></div></div>\n<p><strong>The Ghana reporting chain</strong> — in order, and in parallel where you can:</p>\n<ol>\n<li><strong>Your bank's fraud desk</strong> — immediately, to freeze and recall.</li>\n<li><strong>The receiving bank / telco</strong> — to freeze the mule account or wallet.</li>\n<li><strong>The Cyber Security Authority / CERT-GH</strong> — incident reporting under the <strong>Cybersecurity Act 2020 (Act 1038)</strong>.</li>\n<li><strong>Bank of Ghana</strong> — for a regulated institution's reporting obligations.</li>\n<li><strong>Law enforcement</strong> — the <strong>Ghana Police Cybercrime Unit</strong> and/or the <strong>Economic and Organised Crime Office (EOCO)</strong> for criminal investigation.</li>\n</ol>\n<p>On the defender's side, banks catch mule activity with <strong>velocity and anomaly rules</strong> — a dormant account suddenly receiving a large inflow and dispersing it in minutes is the mule signature, and a good fraud-ops team alerts on exactly that.</p>\n<hr>\n<h2>8 · The Control That Stops BEC</h2>\n<p>One process defeats the <em>entire</em> category, and it costs nothing but discipline:</p>\n<p><strong>Dual control with out-of-band verification.</strong> No single person both initiates <em>and</em> approves a payment, and <strong>any change to bank details is confirmed by calling the counterparty on a previously known number</strong> — never the number in the email, and never by replying to the email (the attacker set <code>Reply-To</code>). One phone call, to a number you already had on file, stops BEC dead.</p>\n<p>BEC maps to MITRE ATT&amp;CK <strong>T1566</strong> (Phishing); the impersonation element maps to <strong>T1656</strong> (Impersonation).</p>\n<hr>\n<h2>9 · Scenarios — The Costliest Con in the World</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana &amp; West Africa</div><div class='callout-b'><p>A <strong>GCB Bank BEC (~GHS 2.3M)</strong> ran the full playbook: reconnaissance of the procurement team, a look-alike supplier domain registered weeks in advance, a bank-detail-change email, and manufactured urgency to push it through. Every technical signal was in the headers — SPF fail, look-alike domain, mismatched <code>Reply-To</code> — but the decisive failure was <strong>process</strong>: no dual-control callback on a known number. <strong>One phone call would have stopped it.</strong> The 2022–2023 SIM-swap wave separately showed how SMS-OTP \"security\" collapses the moment the number itself is stolen.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Google &amp; Facebook, 2013–2015 — ~US$100 million</div><div class='callout-b'><p>Evaldas Rimašauskas impersonated a real hardware supplier (Quanta) with look-alike invoices, contracts and emails. Two of the most technically sophisticated companies on earth paid, because the <strong>process</strong> failed, not the technology. If Google and Facebook can be taken for US$100M by a man with forged invoices, no organisation is \"too technical\" to fall — and the fix is process, not spend.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Ubiquiti (2015, ~US$46.7M) and Bangladesh Bank (2016, ~US$81M)</div><div class='callout-b'><p>Ubiquiti's finance staff were deceived by CEO-fraud emails into wiring funds to attacker accounts. Bangladesh Bank lost US$81M to fraudulent SWIFT transfers after a long intrusion — fraud at the scale of a nation's reserves. Different scales, identical lesson: <strong>BEC beats technology because it targets process and people.</strong></p></div></div>\n<hr>\n<h2>10 · The Worked Investigation (what the lab asks of you)</h2>\n<p><code>labctl start m5</code> is a <strong>file-based</strong> lab. In the lab's <code>assets/</code> you have the earlier <strong>genuine</strong> supplier quote, the later <strong>spoofed</strong> reply, and the malicious <strong>PDF attachment</strong>. Work the evidence:</p>\n<ol>\n<li><strong>Headers.</strong> In the spoof, find the <strong>envelope sender</strong> (<code>Return-Path</code>), the true <strong>source IP</strong> of the sending server, and the <strong>SPF result</strong> — then contrast it with the genuine email's <strong>SPF pass</strong>. Identify the <strong>look-alike domain</strong> and the <strong>real supplier domain</strong> it impersonates, the reused <strong>PO number</strong> (the thread hijack), and the <strong>fraudulent account number</strong> in the body.</li>\n<li><strong>Attachment.</strong> Run <strong>exiftool</strong> on the PDF to recover the <strong>author handle</strong>, the inconsistent <strong>timezone offset</strong>, and whether it was <strong>created before the email was sent</strong> (premeditation).</li>\n<li><strong>Conclude.</strong> Name the <strong>payment control</strong> that stops it and the <strong>ATT&amp;CK</strong> technique.</li>\n</ol>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Your values are unique</div><div class='callout-b'><p>The source IP, the look-alike domain, the fraudulent account number, the PDF author handle and its timezone offset are <strong>randomised per student</strong>. The examples in this lesson (<code>zenith-supplies.com</code>, <code>k1ngpin</code>, <code>+07:00</code>) are illustrative — read <em>your</em> evidence. <code>labctl verify m5</code> grades against your personal answer key.</p></div></div>\n<p>Then write the <strong>Fraud Investigation Brief</strong> (<code>labctl worksheet m5</code>): the summary, the header findings, the evidence timeline, the fraudulent payment details for a bank recall, the control failures, and the process fix.</p>\n<hr>\n<h2>Common mistakes</h2>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>What trips students up</div><div class='callout-b'><ul>\n<li><strong>Trusting the <code>From:</code> display name</strong> — the single least reliable field in the message.</li>\n<li><strong>Replying to verify.</strong> The attacker set <code>Reply-To</code>; your \"are you sure?\" reaches <em>them</em>, and they reply \"yes, hurry\".</li>\n<li><strong>Verifying on the number in the email.</strong> Always use an independently known number.</li>\n<li><strong>Believing SMS OTP is strong.</strong> SIM swap defeats it entirely.</li>\n<li><strong>Ignoring the attachment.</strong> The email may be careful; the file's metadata is often the confession — especially the create-date-before-send.</li>\n<li><strong>Reporting the spoof alone.</strong> The genuine-vs-spoof <em>contrast</em> is what makes your finding unarguable.</li>\n</ul></div></div>\n<hr>\n<h2>Key takeaways</h2>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Carry these out of Module 5</div><div class='callout-b'><ul>\n<li>BEC is <strong>deception, not malware</strong> — it weaponises the <strong>Fraud Triangle</strong> and <strong>Cialdini's</strong> authority + urgency + confidentiality.</li>\n<li><strong>Headers hold the truth</strong>: <code>Return-Path</code>, the <code>Received</code> chain, <code>Authentication-Results</code> — never the <code>From:</code> display. Compare against a known-good baseline when you have one.</li>\n<li><strong>Read the <code>Received</code> chain bottom-up</strong> to the originating IP, and <code>Authentication-Results</code> by field (<code>smtp.mailfrom</code> vs <code>header.from</code> = DMARC alignment).</li>\n<li><strong>Harden your own domain:</strong> SPF <code>-all</code>, DKIM, and DMARC to <strong><code>p=reject</code></strong> — <code>p=none</code> protects no one.</li>\n<li><strong>Attachment metadata (exiftool)</strong> exposes the author, the timezone and — decisively — <strong>premeditation</strong> when the file predates the email; <code>olevba</code> triages macros without opening them.</li>\n<li><strong>Mobile money</strong> fraud is social-engineering: <strong>SIM swap and SS7 defeat SMS OTP</strong>; hold the line with limits, velocity/anomaly detection, in-app OOB approval and dual authorisation.</li>\n<li><strong>Follow the money fast</strong> — the <strong>golden hour</strong>: freeze/recall before cash-out and work the reporting chain (bank → receiving bank/telco → CSA/CERT-GH → BoG → Police Cybercrime/EOCO).</li>\n<li><strong>Dual control + out-of-band callback on a known number</strong> stops BEC. ATT&amp;CK: <strong>T1566 / T1656</strong>.</li>\n</ul></div></div>\n<h2>Check yourself</h2>\n<ol>\n<li><strong><code>From:</code> shows the real supplier, but <code>Reply-To</code> is a different, hyphenated domain. What's happening?</strong> → A spoof — the display is forged to earn trust while replies route silently to the attacker's look-alike domain.</li>\n</ol>\n<ol>\n<li><strong>The genuine email shows <code>spf=pass</code>; the new \"supplier\" email shows <code>spf=fail; dkim=none; dmarc=fail</code>. Verdict, and why is the pair so powerful?</strong> → The second is forged. The <em>contrast</em> with a known-good baseline removes any innocent explanation — it is courtroom-grade proof.</li>\n</ol>\n<ol>\n<li><strong>exiftool shows the attachment's Create Date is 8 days before the email was sent, with a <code>+07:00</code> timezone. What two things does this prove?</strong> → <strong>Premeditation</strong> (prepared in advance, not an accident) and a <strong>foreign author</strong> (a Ghanaian supplier is +00:00).</li>\n</ol>\n<ol>\n<li><strong>A finance officer gets an urgent supplier request to change bank details. The single step that stops BEC?</strong> → Call the supplier on a <em>previously known</em> number (out-of-band, dual control) — never reply, never use the email's number.</li>\n</ol>\n<ol>\n<li><strong>Google and Facebook lost ~US$100M to BEC. What does that prove about the defence?</strong> → The weakness is <strong>process and people</strong>, not technology, so the fix is a process control (dual control + callback), not more software.</li>\n</ol>\n<ol>\n<li><strong>Your own domain sits at DMARC <code>p=none</code>. Are your customers protected from being phished in your name? What do you change?</strong> → No — <code>p=none</code> only <em>monitors</em>; forged mail is still delivered. Read the aggregate reports to confirm your legitimate senders, then move to <code>p=quarantine</code> and finally <strong><code>p=reject</code></strong>.</li>\n</ol>\n<ol>\n<li><strong>A finance officer realises an hour ago they paid a fraudulent \"supplier\" account. First three actions, in order?</strong> → (1) Call <strong>your bank's fraud desk</strong> to freeze/recall; (2) have them contact the <strong>receiving bank/telco</strong> to freeze that account; (3) report to <strong>CSA/CERT-GH</strong> (and preserve the emails/headers). It's the <strong>golden hour</strong> — speed decides recovery.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>BEC</strong> — Business Email Compromise; fraud by email impersonation.</li>\n<li><strong>Fraud Triangle</strong> — pressure + opportunity + rationalisation.</li>\n<li><strong>Cialdini's principles</strong> — authority, urgency/scarcity, social proof, liking, reciprocity.</li>\n<li><strong>Return-Path / Received / Reply-To</strong> — headers revealing true origin, path and reply destination.</li>\n<li><strong>Received chain</strong> — the stack of handling servers; read bottom-up to the originating IP.</li>\n<li><strong>Authentication-Results / smtp.mailfrom / header.from</strong> — the verdicts header / the envelope domain / the visible From; DMARC alignment compares them.</li>\n<li><strong>SPF / DKIM / DMARC / alignment</strong> — authorised sender / signature / policy / From-domain match.</li>\n<li><strong>DMARC policy (p=none/quarantine/reject)</strong> — monitor only / send fails to spam / refuse fails outright.</li>\n<li><strong>exiftool / pdfinfo / olevba</strong> — read file metadata / PDF info / dump &amp; flag Office macros.</li>\n<li><strong>Metadata / premeditation</strong> — data about the file (author, dates, timezone) / proof the fraud was prepared in advance.</li>\n<li><strong>Thread hijack</strong> — reusing a real PO number / quoting a genuine email to ride an existing trust.</li>\n<li><strong>SIM swap / SS7</strong> — number hijack / the legacy telecom signalling it abuses.</li>\n<li><strong>Money mule / layering / golden hour</strong> — an account used to move stolen funds / splitting funds to obscure them / the brief window to freeze before cash-out.</li>\n<li><strong>GhIPSS / Act 987 / CERT-GH / EOCO</strong> — Ghana's payments switch / the Payment Systems Act / the national CERT / the Economic &amp; Organised Crime Office.</li>\n<li><strong>Dual control / out-of-band</strong> — split initiate-and-approve / verify on a separate trusted channel.</li>\n</ul>", "sheets": [{"name": "m5-fraud-investigation-brief.md", "html": "<h1>Fraud Investigation Brief (BEC) — Module 5 Deliverable</h1>\n<p><strong>Investigator:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Case ref:</strong> [ ]  <strong>Reported by:</strong> [who flagged it]</p>\n<blockquote>Prove the fraud from the email's <em>and the attachment's</em> own evidence, then fix</blockquote>\n<blockquote>the <strong>process</strong> that let it through. See <code>labctl learn m5</code>.</blockquote>\n<h2>1. Summary (BLUF)</h2>\n<p>[One paragraph: what the email claimed, what it really was, whether money moved, and the single most urgent action.]</p>\n<h2>2. Header forensics findings</h2>\n<div class='tablewrap'><table><thead><tr><th>Field</th><th>Value found</th><th>What it proves</th></tr></thead><tbody><tr><td>From (display)</td><td>[ ]</td><td>(attacker-controlled — trust last)</td></tr><tr><td>Return-Path / envelope sender</td><td>[ ]</td><td>[look-alike domain?]</td></tr><tr><td>Reply-To</td><td>[ ]</td><td>[mismatch → replies go to attacker?]</td></tr><tr><td>Source IP (earliest Received)</td><td>[ ]</td><td>[whois: ISP / country]</td></tr><tr><td>SPF — spoof</td><td>[ ]</td><td></td></tr><tr><td>SPF — genuine email (baseline)</td><td>[ ]</td><td>[the contrast is the proof]</td></tr><tr><td>DKIM / DMARC</td><td>[ ]</td><td></td></tr></tbody></table></div>\n<p><strong>Look-alike domain:</strong> [ ]  <strong>Impersonated real domain:</strong> [ ] <strong>Reused PO number (thread hijack):</strong> [ ]</p>\n<h2>3. Attachment forensics (exiftool / pdfinfo)</h2>\n<div class='tablewrap'><table><thead><tr><th>Metadata field</th><th>Value</th><th>What it proves</th></tr></thead><tbody><tr><td>Author</td><td>[ ]</td><td>[handle, not a supplier name?]</td></tr><tr><td>Create Date (+ timezone offset)</td><td>[ ]</td><td>[offset inconsistent with Ghana +00:00?]</td></tr><tr><td>Email send date</td><td>[ ]</td><td></td></tr><tr><td>Created <strong>before</strong> sent?</td><td>[ yes / no ]</td><td>[yes → <strong>premeditation</strong>]</td></tr></tbody></table></div>\n<h2>4. Evidence timeline</h2>\n<div class='tablewrap'><table><thead><tr><th>Date / time</th><th>Event</th></tr></thead><tbody><tr><td>[ ]</td><td>Attachment created (PDF metadata)</td></tr><tr><td>[ ]</td><td>Look-alike domain registered (whois)</td></tr><tr><td>[ ]</td><td>Spoofed email sent/received</td></tr><tr><td>[ ]</td><td>[action taken / payment attempted]</td></tr></tbody></table></div>\n<h2>5. Fraudulent payment details (for bank recall)</h2>\n<ul>\n<li>Requested account: [ ]  Bank: [ ]  Amount: [ ]</li>\n<li>Legitimate account on file: [ ]</li>\n</ul>\n<h2>6. Control failures &amp; the fix</h2>\n<ul>\n<li><strong>Failures:</strong> [e.g. no dual-control callback on a known number before a bank-detail change]</li>\n<li><strong>Process fix:</strong> [who initiates vs approves; mandatory out-of-band callback to a previously known number for any bank-detail change; thresholds; logging]</li>\n<li><strong>Harden our own domain:</strong> our current DMARC policy is [none/quarantine/reject]; target [p=reject] by [date] so our brand can't be spoofed at a counterparty.</li>\n</ul>\n<h2>6b. Recall &amp; report (if money moved — the golden hour)</h2>\n<p><em>In order, and in parallel where possible:</em></p>\n<ul>\n<li>[ ] Called <strong>our bank's fraud desk</strong> to freeze/recall — time: [ ]</li>\n<li>[ ] <strong>Receiving bank / telco</strong> asked to freeze the account/wallet — ref: [ ]</li>\n<li>[ ] Reported to <strong>CSA / CERT-GH</strong> (Act 1038) — ref: [ ]</li>\n<li>[ ] <strong>Bank of Ghana</strong> notified (if a regulated obligation) — [ ]</li>\n<li>[ ] <strong>Police Cybercrime Unit / EOCO</strong> — case ref: [ ]</li>\n<li>[ ] Evidence preserved (emails with full headers, attachment, this brief)</li>\n</ul>\n<p><strong>ATT&amp;CK:</strong> T1566 (Phishing) / T1656 (Impersonation).</p>\n<hr>\n<h2>Self-check before you submit</h2>\n<ul>\n<li>[ ] Every value is <strong>my own</strong> (randomised per student).</li>\n<li>[ ] I used the <strong>genuine email as a baseline</strong> and stated the SPF contrast.</li>\n<li>[ ] I ran exiftool and stated whether the file was <strong>created before it was sent</strong>.</li>\n<li>[ ] My fix is a <strong>process</strong> control (dual control + callback), not just \"be careful\".</li>\n<li>[ ] Payment details are precise enough for a <strong>bank recall</strong>.</li>\n</ul>\n<h2>Grading rubric (100 pts)</h2>\n<div class='tablewrap'><table><thead><tr><th>Band</th><th>Headers &amp; origin (30)</th><th>Attachment &amp; premeditation (25)</th><th>Timeline &amp; recall detail (20)</th><th>Process fix &amp; ATT&amp;CK (25)</th></tr></thead><tbody><tr><td>Excellent (full)</td><td>True origin traced; SPF contrast used as proof</td><td>Author + timezone + premeditation proven</td><td>Clear dated timeline; precise recall details</td><td>Dual-control callback specified; correct ATT&amp;CK</td></tr><tr><td>Adequate (~60%)</td><td>Spoof identified, baseline not used</td><td>Metadata read, premeditation missed</td><td>Partial timeline</td><td>\"Verify payments\" — vague</td></tr><tr><td>Weak (&lt;40%)</td><td>Trusts From:, no trace</td><td>Attachment ignored</td><td>No timeline</td><td>No process control</td></tr></tbody></table></div>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<p><em>Illustrative values — yours are randomised.</em></p>\n<p><strong>Summary:</strong> A \"supplier\" email asked to redirect a ZS-20418 invoice payment to a new account. It was a spoof; payment was halted before release.</p>\n<p><strong>Headers:</strong> <code>From:</code> showed <em>Zenith Supplies</em> but <code>Return-Path</code>/<code>Reply-To</code> used <strong>zenith-supplies.com</strong> (look-alike of the real <strong>zenithsupplies.com.gh</strong>); source IP <strong>45.137.112.63</strong> (whois: offshore hosting). Spoof <strong>SPF fail / DKIM none / DMARC fail</strong>; the earlier genuine quote was <strong>SPF pass</strong> — the contrast is the proof. Reused PO <strong>ZS-20418</strong> = thread hijack.</p>\n<p><strong>Attachment:</strong> <code>remittance-advice.pdf</code> → Author <strong>k1ngpin</strong>, Create Date <strong>2026-09-28 +07:00</strong>, email sent <strong>2026-10-06</strong>. Created <strong>8 days before</strong> it was sent, from a <strong>+07:00</strong> timezone → <strong>premeditated fraud by a foreign author</strong>.</p>\n<p><strong>Recall:</strong> fraudulent account 13-digit number at [bank]; legitimate account on file differs — flagged to the bank's fraud desk.</p>\n<p><strong>Fix:</strong> dual control (initiator ≠ approver) + <strong>mandatory callback to the supplier's known number</strong> for any bank-detail change; alert over GHS 10,000. <strong>ATT&amp;CK:</strong> T1566.002 / T1656. <strong>BLUF:</strong> <em>\"A premeditated supplier-impersonation fraud; one callback on our known number stops this and every future instance.\"</em></p>"}]}, "m6": {"day": 3, "title": "Module 6 — Digital Forensics & Incident Response", "lesson": "<h1>Module 6 — Digital Forensics &amp; Incident Response</h1>\n<p><strong>Day 3 · Afternoon Session · ~4 hours · Hands-on lab: <code>labctl start m6</code></strong></p>\n<p>When an incident happens the evidence is fragile and the clock is running. A disk can be overwritten, a running process can be killed, and — most urgently — the contents of memory vanish the instant someone \"just reboots it to be safe\". This module teaches you the disciplines that separate a professional incident responder from someone who turns a bad day into a catastrophe: preserve what happened so it stands up later (in court, to a regulator, to your own board), reconstruct the attack across <em>disk, memory and logs</em>, and respond without destroying the very evidence you need.</p>\n<p>The two registers run throughout. The <strong>conceptual</strong> half gives you the principles (Locard, hashing, chain of custody), the collection order that saves the perishable evidence first, and the NIST incident-response lifecycle that keeps a panicked response disciplined. The <strong>practical</strong> half makes you work a complete evidence package: prove integrity by hashing, recover a <em>deleted</em> credentials file from a disk image, carve a malware command line, C2 address, in-memory credential and exfiltration address out of a <strong>RAM dump</strong>, decode an obfuscated dropper, reconstruct the timeline from the authentication log — and then <strong>correlate it all</strong> into one provable story.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Explain <strong>Locard's principle</strong>, cryptographic <strong>hashing</strong> and <strong>chain of custody</strong>, and why they make findings defensible.</li>\n<li><strong>Acquire</strong> evidence correctly — write-blocking, <code>dd</code>/<code>dc3dd</code>, raw vs <strong>E01</strong> — and verify the image hash matches the source.</li>\n<li>Apply the <strong>order of volatility (RFC 3227)</strong> and run the <strong>NIST SP 800-61 / PICERL</strong> lifecycle without destroying evidence.</li>\n<li>Examine a disk image with <strong>Sleuthkit/Autopsy</strong>, recover deleted files, explain <strong>slack/unallocated</strong> space and <strong>file carving</strong>, and catch a <strong>timestomp</strong> via MACB.</li>\n<li>Decode a layered, obfuscated attacker artefact with <strong>CyberChef</strong> or the CLI.</li>\n<li>Perform <strong>memory forensics</strong> — triage with <code>strings</code>/<code>bulk_extractor</code> and run the professional <strong>Volatility</strong> workflow (<code>pstree</code>/<code>netscan</code>/<code>cmdline</code>/<code>malfind</code>).</li>\n<li>Know <strong>where the evidence lives on Windows</strong> — Event Logs (4624/4625/4688), Sysmon, prefetch, amcache, Run keys, scheduled tasks, <code>$MFT</code>.</li>\n<li>Reconstruct a <strong>super-timeline</strong> (plaso/log2timeline) and <strong>correlate</strong> disk + memory + logs into one narrative.</li>\n<li><strong>Run the response</strong> — containment, eradication of <em>every</em> foothold, validated recovery — and execute a <strong>ransomware playbook</strong> (identify, don't pay, check for exfiltration, restore).</li>\n<li>Recognise and detect <strong>anti-forensics</strong> (timestomping, log clearing), and map the chain to <strong>MITRE ATT&amp;CK</strong>.</li>\n</ol></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:25</td><td>Foundation: Locard, hashing, chain of custody; acquisition &amp; write-blocking</td></tr><tr><td>0:25 – 0:50</td><td>Order of volatility and the IR lifecycle (NIST 800-61 / PICERL)</td></tr><tr><td>0:50 – 1:35</td><td>Disk forensics: imaging, deletion &amp; slack, carving, MACB &amp; timestomping</td></tr><tr><td>1:35 – 1:50</td><td>Break</td></tr><tr><td>1:50 – 2:25</td><td>Memory forensics: <code>strings</code>/<code>bulk_extractor</code> triage + the Volatility workflow</td></tr><tr><td>2:25 – 2:55</td><td>Windows DFIR artefacts; decoding; the super-timeline</td></tr><tr><td>2:55 – 3:25</td><td>Running the response: containment/eradication/recovery + the ransomware playbook</td></tr><tr><td>3:25 – 4:15</td><td>Lab: <code>labctl start m6</code> — the full evidence package; chain-of-custody + report</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> skim RFC 3227 (order of volatility) and the NIST SP 800-61 phase list. <strong>Lab requirement:</strong> a Kali terminal with <code>sha256sum</code>, Sleuthkit (<code>fsstat</code>/<code>fls</code>/<code>icat</code>/<code>tsk_recover</code>), <code>strings</code>, <code>bulk_extractor</code>, <code>grep</code>, and a browser for CyberChef (or <code>base64</code>). <strong>File-based</strong> — evidence is in the lab's <code>assets/</code>. <strong>Assessment:</strong> your lab submission — the <em>Chain-of-Custody form</em> and <em>Incident Report</em> (<code>labctl worksheet m6</code>) — counts toward the Module 6 practical grade.</p></div></div>\n<hr>\n<h2>1 · The Forensic Foundation — Prove You Didn't Change the Evidence</h2>\n<p>All of forensics rests on one idea: <strong>you can prove, mathematically, that the evidence is unaltered.</strong> If you cannot, nothing you find is trustworthy. Three things underpin everything that follows.</p>\n<ul>\n<li><strong>Locard's exchange principle</strong> — <em>every contact leaves a trace</em>. The attacker touched the system; artefacts exist; your job is to find and preserve them.</li>\n<li><strong>Hashing</strong> — a cryptographic hash (SHA-256) is a file's fingerprint. Hash the evidence <em>before</em> you touch it and <em>after</em>; matching hashes prove it is unchanged. Change a single byte and the hash changes completely.</li>\n<li><strong>Chain of custody</strong> — a documented record of who held the evidence, when, why, and what they did with it. It is what makes your findings <em>defensible</em> to a court, a regulator (CSA/DPC) or an insurer.</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — preserve first, always</span></div><pre><code>sha256sum evidence.img                 # fingerprint the evidence now\nsha256sum -c evidence.sha256           # later: prove it STILL matches</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Image and hash before you touch anything</div><div class='callout-b'><p>You never work on the original. You make an exact <strong>image</strong> (bit-for-bit copy), hash it, and analyse the <em>copy</em> — so the original stays pristine and provable. The first thing <code>labctl verify m6</code> checks is exactly this: that <code>sha256sum -c</code> still passes.</p></div></div>\n<h3>1.1 Acquiring the evidence — write-blockers and image formats</h3>\n<p><em>How</em> you make that image matters as much as that you made it. Two rules:</p>\n<ul>\n<li><strong>Write-block the source.</strong> A <strong>write-blocker</strong> — hardware (a device between the disk and your workstation) or software — guarantees read-only access, so the mere act of imaging cannot alter the original. Without it, plugging a disk into a live OS updates timestamps and can destroy evidence before you start.</li>\n<li><strong>Hash as you acquire, verify after.</strong> The image's hash must equal the source's; record both in the acquisition log.</li>\n</ul>\n<p>Imaging tools and formats:</p>\n<ul>\n<li><strong><code>dd</code></strong> writes a <strong>raw</strong> image (exact bytes, no metadata). <strong><code>dc3dd</code>/<code>dcfldd</code></strong> are <code>dd</code> plus built-in hashing and logging. GUI tools (<strong>FTK Imager</strong>, <strong>Guymager</strong>) do the same and can write <strong>E01 / EWF</strong> (Expert Witness Format) — compressed, with the acquisition <strong>hash, examiner and case notes embedded</strong> in the file. E01 is the courtroom standard; raw <code>dd</code> is fine for lab work.</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — acquire a disk read-only, hashing as you go</span></div><pre><code>dc3dd if=/dev/sdb of=evidence.img hash=sha256 log=acquire.log   # (behind a write-blocker)\nsha256sum evidence.img          # must match the source hash recorded in acquire.log</code></pre></div>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"fp-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"10.5\">\n    <rect x=\"16\"  y=\"30\" width=\"128\" height=\"44\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"80\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">ACQUIRE</text><text x=\"80\" y=\"65\" fill=\"currentColor\" font-size=\"8.5\">write-blocked image</text>\n    <rect x=\"176\" y=\"30\" width=\"128\" height=\"44\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"240\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">VERIFY</text><text x=\"240\" y=\"65\" fill=\"currentColor\" font-size=\"8.5\">image hash == source</text>\n    <rect x=\"336\" y=\"30\" width=\"128\" height=\"44\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"400\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">ANALYSE</text><text x=\"400\" y=\"65\" fill=\"currentColor\" font-size=\"8.5\">on the COPY only</text>\n    <rect x=\"496\" y=\"30\" width=\"128\" height=\"44\" rx=\"6\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <text x=\"560\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">REPORT</text><text x=\"560\" y=\"65\" fill=\"currentColor\" font-size=\"8.5\">hashes + custody</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"144\" y1=\"52\" x2=\"174\" y2=\"52\" marker-end=\"url(#fp-a)\"/>\n    <line x1=\"304\" y1=\"52\" x2=\"334\" y2=\"52\" marker-end=\"url(#fp-a)\"/>\n    <line x1=\"464\" y1=\"52\" x2=\"494\" y2=\"52\" marker-end=\"url(#fp-a)\"/>\n  </g>\n  <line x1=\"80\" y1=\"74\" x2=\"80\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"0.6\" marker-end=\"url(#fp-a)\"/>\n  <rect x=\"16\" y=\"122\" width=\"300\" height=\"34\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/>\n  <text x=\"166\" y=\"143\" text-anchor=\"middle\" font-size=\"9.5\" fill=\"currentColor\">the ORIGINAL is bagged, sealed, never touched again</text>\n</svg></div><figcaption>The forensic process — the original is sealed; you work the copy</figcaption></figure>\n<hr>\n<h2>2 · Order of Volatility — Collect the Perishable First</h2>\n<p>Some evidence vanishes faster than the rest, and <strong>RFC 3227</strong> codifies the order you must collect in:</p>\n<p><strong>Memory (RAM) → network state &amp; running processes → disk → archival media.</strong></p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 620 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"vol-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <line x1=\"30\" y1=\"24\" x2=\"30\" y2=\"196\" stroke=\"currentColor\" stroke-width=\"1.5\" marker-end=\"url(#vol-a)\"/>\n  <text x=\"18\" y=\"18\" font-size=\"9\" fill=\"currentColor\">MOST volatile — collect FIRST</text>\n  <text x=\"18\" y=\"212\" font-size=\"9\" fill=\"currentColor\">LEAST volatile — collect LAST</text>\n  <g font-size=\"11\">\n    <rect x=\"60\" y=\"20\"  width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--red,#ff6b7a)\"  fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <rect x=\"60\" y=\"66\"  width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <rect x=\"60\" y=\"112\" width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <rect x=\"60\" y=\"158\" width=\"540\" height=\"38\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <g fill=\"currentColor\">\n      <text x=\"74\" y=\"38\" font-weight=\"bold\">1 · Memory (RAM)</text>  <text x=\"74\" y=\"52\" font-size=\"9\" opacity=\"0.85\">running malware, keys, plaintext creds — gone on power-off</text>\n      <text x=\"74\" y=\"84\" font-weight=\"bold\">2 · Network state</text>  <text x=\"74\" y=\"98\" font-size=\"9\" opacity=\"0.85\">live connections, routing, ARP cache</text>\n      <text x=\"74\" y=\"130\" font-weight=\"bold\">3 · Disk</text>          <text x=\"74\" y=\"144\" font-size=\"9\" opacity=\"0.85\">files, deleted data, slack space</text>\n      <text x=\"74\" y=\"176\" font-weight=\"bold\">4 · Archival / backups</text><text x=\"74\" y=\"190\" font-size=\"9\" opacity=\"0.85\">least volatile — collect last</text>\n    </g>\n  </g>\n</svg></div><figcaption>Order of volatility (RFC 3227) — collect the most perishable first</figcaption></figure>\n<p>RAM disappears the instant the machine powers off — taking with it the running malware, injected code, decryption keys and plaintext credentials that <em>never touch disk</em>.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Never &quot;just power it off&quot;</div><div class='callout-b'><p>The instinct to reboot or pull the power to \"stop the attack\" is one of the most damaging mistakes in incident response — it destroys the single most valuable evidence there is. You <strong>isolate</strong> a compromised host from the network; you do <strong>not</strong> power it off. Capture memory first, then disk.</p></div></div>\n<hr>\n<h2>3 · The Incident-Response Lifecycle</h2>\n<p>The standard is <strong>NIST SP 800-61</strong>; the SANS mnemonic is <strong>PICERL</strong>. The phases are a discipline that stops a frightened team from destroying evidence or reinfecting clean systems.</p>\n<div class='tablewrap'><table><thead><tr><th>Phase</th><th>What you do</th></tr></thead><tbody><tr><td><strong>Preparation</strong></td><td>Policies, playbooks, a trained team, tested tools — <em>before</em> anything happens</td></tr><tr><td><strong>Detection &amp; Analysis</strong></td><td>Confirm it is real, scope it, start the evidence timeline</td></tr><tr><td><strong>Containment</strong></td><td>Stop the spread <em>without destroying evidence</em> (isolate, don't power off)</td></tr><tr><td><strong>Eradication</strong></td><td>Remove the attacker — close the vector, reset credentials, kill persistence</td></tr><tr><td><strong>Recovery</strong></td><td>Restore from verified-clean backups, validate, reconnect</td></tr><tr><td><strong>Post-Incident</strong></td><td>Lessons learned, improve controls, report where required</td></tr></tbody></table></div>\n<hr>\n<h2>4 · Disk Forensics</h2>\n<p>With the image preserved and hashed, examine it. <strong>Autopsy</strong> is the GUI platform used by law enforcement worldwide; <strong>Sleuthkit</strong> is its command-line engine.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — examine a disk image with Sleuthkit</span></div><pre><code>fsstat evidence.img                    # filesystem type + layout (e.g. FAT16)\nfls evidence.img                       # list files; a '*' marks a DELETED entry\nicat evidence.img 6                    # read a file by its inode (incl. deleted)\ntsk_recover evidence.img ./recovered   # carve deleted files back out in bulk</code></pre></div>\n<p>Why can \"deleted\" files be recovered? Deleting a file usually just flags its directory entry and marks its space free — the <strong>data itself sits on disk untouched</strong> until something overwrites it. Forensics lives in that gap. In this lab, <code>fls</code> reveals the macro-enabled spreadsheet the user was lured into opening (<code>q3invoic.xls</code>), and <code>icat</code> on the deleted inode recovers a <strong>credentials file containing a VPN password</strong> — remember that password; it reappears in memory.</p>\n<h3>4.1 How deletion really works — and slack space</h3>\n<p>Every filesystem \"deletes\" by updating <em>metadata</em>, not by erasing data:</p>\n<ul>\n<li><strong>FAT</strong> flags the directory entry (first byte → <code>0xE5</code>) and frees the cluster chain.</li>\n<li><strong>NTFS</strong> marks the file's <strong><code>$MFT</code></strong> record unused and clears its bit in the bitmap.</li>\n<li><strong>ext (Linux)</strong> marks the <strong>inode</strong> free.</li>\n</ul>\n<p>In every case the bytes remain until reused — which is why carving works. Two more places evidence hides: <strong>slack space</strong> (a file smaller than its cluster leaves old data in the leftover bytes) and <strong>unallocated space</strong> (freed clusters not yet overwritten). Both routinely hold fragments of deleted documents and credentials.</p>\n<h3>4.2 File carving — recovery without the filesystem</h3>\n<p>When the metadata is gone (a formatted or damaged disk), you recover by <strong>file signature</strong> instead — the magic bytes that begin and end each file type — ignoring the filesystem entirely:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — carve files by signature</span></div><pre><code>foremost -t pdf,jpg,doc,xls -i evidence.img -o carved/   # by header/footer\nphotorec evidence.img                                     # interactive, many types</code></pre></div>\n<h3>4.3 MACB timestamps and timestomping</h3>\n<p>Every file carries timestamps — <strong>MACB</strong>: <strong>M</strong>odified, <strong>A</strong>ccessed, metadata- <strong>C</strong>hanged, <strong>B</strong>orn (created). They are the raw material of a timeline. But attackers <strong>timestomp</strong> — backdating a malicious file so it blends in.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>How to catch a timestomp</div><div class='callout-b'><p>On NTFS, the <code>$MFT</code> stores <strong>two</strong> timestamp sets: <code>$STANDARD_INFORMATION</code> (what the OS shows, and what timestomping tools change) and <code>$FILE_NAME</code> (updated by the kernel, usually left untouched). When the two disagree — or a file claims it was \"created 2009\" inside a folder built in 2026, or a create time <em>later</em> than the modify time — you are looking at a stomp. The anomaly itself is evidence of intent.</p></div></div>\n<hr>\n<h2>5 · Decoding Attacker Artefacts</h2>\n<p>Attackers rarely leave a payload in the clear. They wrap it in layers — Base64, URL-encoding, hex — to slip past filters and tired eyes. <strong>CyberChef</strong> (the \"cyber Swiss-army knife\", usable fully offline) lets you build a decode \"recipe\" by dragging operations; the CLI does the same one layer at a time.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — peel the layers off a dropper</span></div><pre><code># CyberChef recipe: From Base64 -&gt; URL Decode  (reveals the C2 URL)\nbase64 -d suspicious_artifact.txt      # one layer; chain more as needed</code></pre></div>\n<p>The decoded artefact reveals the <strong>command-and-control (C2) domain</strong> the dropper calls home to — and, critically, it should be the <em>same</em> C2 host you independently find in memory. Agreement between two sources is proof.</p>\n<hr>\n<h2>6 · Memory Forensics — The Reward for Not Powering Off</h2>\n<p>A RAM capture holds what the disk never saw. Full-featured analysis uses <strong>Volatility</strong>, but a great deal of value falls out of two simpler tools that are perfect for triage: <strong><code>strings</code></strong> (extract human-readable text) and <strong><code>bulk_extractor</code></strong> (scan a blob and auto-carve URLs, emails, IPs and more into tidy files).</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — triage a RAM dump with strings and bulk_extractor</span></div><pre><code># What malicious process is running? (note the masquerade: svch0st, not svchost)\nstrings memory.raw | grep -iE 'svch0st|\\\\temp\\\\'\n\n# Auto-carve indicators into categorised files\nbulk_extractor -o be_out memory.raw\ncat be_out/url.txt        # the C2 host the PowerShell stager calls\ncat be_out/email.txt      # the exfiltration address\n\n# Plaintext credential living in memory\nstrings memory.raw | grep -i vpnadmin\n\n# Persistence the malware set up\nstrings memory.raw | grep -i schtasks</code></pre></div>\n<p>From one RAM dump you recover: the <strong>malware</strong> (<code>svch0st.exe</code> — a masquerade of <code>svchost.exe</code>, ATT&amp;CK T1036 from Module 3), the <strong>C2 host</strong>, a <strong>plaintext VPN credential</strong>, the <strong>exfiltration email</strong>, and the <strong>persistence</strong> mechanism (a scheduled task, <code>schtasks</code> / ATT&amp;CK T1053). None of this survives a reboot — which is the entire reason RFC 3227 puts memory first.</p>\n<h3>6.1 The professional workflow — Volatility</h3>\n<p><code>strings</code> and <code>bulk_extractor</code> are <em>triage</em>; the DFIR standard for structured memory analysis is <strong>Volatility</strong> (now <strong>Volatility 3</strong>), which understands the operating system's structures and answers precise questions:</p>\n<div class='tablewrap'><table><thead><tr><th>Plugin (Windows)</th><th>Answers</th></tr></thead><tbody><tr><td><code>windows.pstree</code> / <code>pslist</code></td><td>the process tree — spot the odd child (Word → PowerShell)</td></tr><tr><td><code>windows.psscan</code></td><td>processes <code>pslist</code> can't see — finds <strong>hidden/terminated</strong> ones</td></tr><tr><td><code>windows.netscan</code></td><td>live network connections — the C2 socket</td></tr><tr><td><code>windows.cmdline</code></td><td>the <strong>command line</strong> each process was launched with</td></tr><tr><td><code>windows.malfind</code></td><td>injected / hidden executable code regions</td></tr><tr><td><code>windows.dlllist</code> / <code>handles</code></td><td>loaded DLLs / open files and keys</td></tr></tbody></table></div>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the Volatility 3 memory workflow</span></div><pre><code>vol -f memory.raw windows.pstree     # which process spawned the stager?\nvol -f memory.raw windows.netscan    # the live C2 connection\nvol -f memory.raw windows.cmdline    # the PowerShell one-liner, in full\nvol -f memory.raw windows.malfind    # code injected into a trusted process</code></pre></div>\n<p>This lab ships a generic RAM blob you triage with <code>strings</code>/<code>bulk_extractor</code> (no OS profile needed, works anywhere) — but on a real Windows capture, <code>pstree</code> + <code>netscan</code> + <code>cmdline</code> is the sequence that turns \"something's wrong\" into \"<code>winword</code> spawned <code>powershell</code> which opened a socket to the C2 — here's the exact command\".</p>\n<hr>\n<h2>7 · Where the Evidence Lives — Windows DFIR Artefacts</h2>\n<p>Most incidents you will work are on <strong>Windows</strong>, where the record of what happened is spread across a known set of artefacts. Knowing <em>where to look</em> is half the job:</p>\n<div class='tablewrap'><table><thead><tr><th>Artefact</th><th>Where</th><th>What it proves</th></tr></thead><tbody><tr><td><strong>Security Event Log</strong></td><td><code>…\\winevt\\Logs\\Security.evtx</code></td><td>logons — <strong>4624</strong> success, <strong>4625</strong> failure; <strong>4688</strong> process creation</td></tr><tr><td><strong>Sysmon</strong> (if deployed)</td><td>its own event log</td><td>process creation (<strong>1</strong>), network (<strong>3</strong>), image loads — the gold standard</td></tr><tr><td><strong>Prefetch</strong></td><td><code>C:\\Windows\\Prefetch</code></td><td>that a program <strong>executed</strong>, when, and how many times</td></tr><tr><td><strong>Amcache / Shimcache</strong></td><td>registry hives</td><td>evidence of execution + full path + (Amcache) a SHA-1</td></tr><tr><td><strong>Registry Run keys</strong></td><td><code>…\\CurrentVersion\\Run</code></td><td>autostart <strong>persistence</strong></td></tr><tr><td><strong>Scheduled Tasks</strong></td><td><code>C:\\Windows\\System32\\Tasks</code></td><td>persistence — exactly our <code>schtasks</code> implant</td></tr><tr><td><strong><code>$MFT</code> / USN journal</strong></td><td>NTFS metadata</td><td>file create / delete / rename history</td></tr><tr><td><strong>LNK files / Jump Lists</strong></td><td>recent-items</td><td>which documents the user opened</td></tr></tbody></table></div>\n<p>Map that onto this lab's story: the <strong>4625</strong> failures then a <strong>4624</strong> success are the brute force that got in; <strong>prefetch</strong> and <strong>4688</strong> show the macro lure and the PowerShell stager <em>executing</em>; the <strong>Scheduled Tasks</strong> folder holds the persistence.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>You can only read artefacts you kept</div><div class='callout-b'><p>Default Windows logging is thin and rolls over fast. <strong>Sysmon plus centralised, off-box log collection</strong> is what turns \"we think PowerShell ran\" into \"here is the 4688 event with the full command line, shipped to the SIEM before the attacker could clear it.\" Deploy it <em>before</em> the incident — it is preparation (Module 4's detection engineering meets this module's forensics).</p></div></div>\n<hr>\n<h2>8 · Timeline Reconstruction &amp; Correlation</h2>\n<p>Individual artefacts are leads; a <strong>timeline</strong> is a case. Logs give you the clock. In this lab the authentication log (<code>auth.log</code>) shows the intrusion's spine:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — reconstruct the login timeline from auth.log</span></div><pre><code>grep -E 'Failed|Accepted' auth.log     # failures (brute force) then the success</code></pre></div>\n<p>Dozens of <code>Failed password</code> lines from one <strong>source IP</strong> (a brute force), then an <code>Accepted password</code> from that <em>same</em> IP for a specific account — that is the moment the attacker got in, with a timestamp.</p>\n<h3>8.1 The super-timeline</h3>\n<p>One log is a single thread; a <strong>super-timeline</strong> weaves <em>every</em> timestamped artefact — filesystem MACB, Event Logs, prefetch, registry, browser history — into one chronological view. The standard tool is <strong>plaso / log2timeline</strong>:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — build and read a super-timeline</span></div><pre><code>log2timeline.py timeline.plaso evidence.img          # ingest every artefact\npsort.py -o l2tcsv timeline.plaso &gt; timeline.csv     # one sorted timeline</code></pre></div>\n<p>You then <strong>pivot on the incident window</strong> — zoom to the minutes around a known event (the macro open) and read what happened immediately before and after: the document opened, <code>powershell</code> executed, a file was written to <code>\\Temp</code>, a scheduled task was created. The super-timeline is how scattered artefacts become a minute-by- minute narrative.</p>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Correlation is what makes it unarguable</div><div class='callout-b'><p>The VPN password you recovered from the <strong>deleted file on disk</strong> is the <em>same</em> password sitting in the <strong>RAM dump</strong> — and the brute-force <strong>source IP</strong> in <code>auth.log</code> is the same one you met in the Module 4 SOC feed. When disk, memory and logs independently point to the same facts, you no longer have a theory; you have proof. A responder who correlates writes a report that survives a courtroom; one who reports a single tool's output writes a guess.</p></div></div>\n<hr>\n<h2>9 · Running the Response — Containment, Eradication, Recovery</h2>\n<p>The lifecycle table (§3) names the phases; here is how you actually execute the back half under pressure.</p>\n<p><strong>Containment — stop the spread, keep the evidence.</strong> Prefer <strong>network isolation</strong> (disable the switch port, move to a quarantine VLAN, or use your EDR's host-isolate) over pulling the cable — and <strong>capture memory first</strong>, because isolation shouldn't cost you the volatile evidence. The goal is to stop lateral movement and the C2 channel while the host stays alive for analysis.</p>\n<p>**Eradication — remove <em>every</em> foothold.<strong> Miss one and they are back by morning. Hunt down and remove the scheduled task, the Run key, any service or web shell; </strong>reset every credential that touched the box** (here, the harvested VPN password); and close the entry vector (patch, disable macros, fix the exposed service).</p>\n<p><strong>Recovery — rebuild, restore, validate.</strong> For anything deeply compromised, <strong>reimage</strong> beats \"clean\" — you can never fully trust a box an attacker had root on. Restore data from <strong>verified-clean, offline</strong> backups, validate it works, monitor closely, <em>then</em> reconnect. Ask the hard question out loud: <em>\"are we certain we are not still compromised?\"</em></p>\n<p><strong>Roles.</strong> A real response has an <strong>Incident Commander</strong> (decides, owns comms), a <strong>scribe</strong> (logs every action with a timestamp — that log <em>is</em> your chain of custody), technical leads, and legal/comms. Deciding and recording under pressure is the skill the capstone (Module 10) tests.</p>\n<h3>9.1 The ransomware playbook (this lab's scenario)</h3>\n<ol>\n<li><strong>Isolate — do not power off.</strong> RAM may hold the encryption key or the running process; capture it first.</li>\n<li><strong>Identify the strain</strong> — the ransom note, file extension, or a service like ID Ransomware. A <em>known</em> strain may have a free decryptor; a novel one will not.</li>\n<li><strong>Scope it — and check for exfiltration.</strong> Modern ransomware is <strong>double extortion</strong>: data is <em>stolen before</em> it is encrypted. Look for the large outbound transfer that preceded the encryption — if data left, this is also a <strong>breach</strong>.</li>\n<li><strong>Do not pay.</strong> Payment funds crime, carries no guarantee of a working key, marks you as a payer, and may breach sanctions. It is a last-resort <em>business</em> decision taken with counsel — never a technical fix.</li>\n<li><strong>Recover</strong> from offline <strong>3-2-1</strong> backups; rebuild compromised hosts.</li>\n<li><strong>Report if data was exfiltrated</strong> — notification obligations under Act 843 (DPC) and Act 1038 (CSA) follow (Module 8).</li>\n</ol>\n<h3>9.2 Anti-forensics — and catching it</h3>\n<p>Attackers try to erase their tracks: <strong>timestomping</strong> (§4.3), <strong>clearing logs</strong>, encryption and secure-wiping. The tells and the defences:</p>\n<ul>\n<li>A cleared Windows Security log leaves <strong>Event ID 1102</strong> (\"audit log was cleared\") — the act of hiding is itself a loud signal.</li>\n<li><strong>Ship logs off-box</strong> to a SIEM so clearing them locally erases nothing that matters; use <strong>immutable/append-only</strong> storage for evidence.</li>\n<li>Gaps in an otherwise continuous timeline, or a <code>$STANDARD_INFORMATION</code> / <code>$FILE_NAME</code> mismatch, point straight at tampering.</li>\n</ul>\n<hr>\n<h2>10 · Mapping the Chain to MITRE ATT&amp;CK</h2>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>What happened</th><th>ATT&amp;CK technique</th></tr></thead><tbody><tr><td>Initial Access</td><td>User opened a macro-enabled lure spreadsheet</td><td>T1566.001 / T1204.002 User Execution</td></tr><tr><td>Execution</td><td>Macro launched a PowerShell stager</td><td><strong>T1059.001</strong> Command/Scripting: PowerShell</td></tr><tr><td>Defense Evasion</td><td>Implant named <code>svch0st.exe</code></td><td>T1036 Masquerading</td></tr><tr><td>Credential Access</td><td>VPN password harvested into memory</td><td>T1555 Credentials from stores</td></tr><tr><td>Persistence</td><td>Scheduled task created</td><td><strong>T1053</strong> Scheduled Task/Job</td></tr><tr><td>Exfiltration</td><td>Data staged to an external mail drop</td><td>T1048 Exfiltration over alternative protocol</td></tr></tbody></table></div>\n<hr>\n<h2>11 · Scenarios — When Response Makes It Better, or Worse</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana &amp; West Africa</div><div class='callout-b'><p>A <strong>2023 West African hospital ransomware</strong> incident became a catastrophe through three avoidable failures: backups sat on the <em>same network segment</em> and were encrypted too (no offline copy); the IT team <strong>powered the servers off immediately</strong>,
