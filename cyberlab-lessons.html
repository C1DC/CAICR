ata, <em>why</em>, <em>where</em> it lives, <em>who</em> it's shared with, <em>how long</em> you keep it — is the foundation of everything else. A <strong>DPIA (Data Protection Impact Assessment)</strong> is required <strong>before</strong> high-risk processing: large-scale sensitive data, systematic monitoring, or new technology (including <strong>AI</strong>, Module 7). It forces you to weigh the risk to individuals and design mitigations <em>before</em> you build. Skipping a required DPIA — as Akoma did with its sensitive health data — is itself a breach of the Act.</p>\n<h3>3.3 Cross-border transfers and data residency</h3>\n<p>Sending personal data abroad — a foreign cloud region, an overseas processor, a foreign <strong>AI API</strong> (Module 7) — needs a <strong>lawful transfer mechanism</strong> and attention to where the data physically lives. Ghana's regime and sector rules (for example <strong>Bank of Ghana</strong> directives on financial data) may require certain data to remain <strong>in-country</strong>. Before you adopt any foreign service, answer: <em>where does our data go, and are we allowed to send it there?</em></p>\n<hr>\n<h2>4 · The Global Benchmark — GDPR</h2>\n<p>Even when it does not directly bind you, the EU <strong>GDPR</strong> sets the expectations that clients, partners and regulators increasingly assume:</p>\n<ul>\n<li>a <strong>72-hour</strong> breach-notification norm (to the regulator, once aware);</li>\n<li><strong>data-subject rights</strong>: access, rectification, erasure (\"right to be forgotten\"), portability;</li>\n<li><strong>Data Protection Impact Assessments (DPIAs)</strong> for high-risk processing;</li>\n<li>privacy <strong>by design and by default</strong>;</li>\n<li>fines up to <strong>4% of global turnover</strong>.</li>\n</ul>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>GDPR enforcement shows the stakes</div><div class='callout-b'><p><strong>British Airways</strong> and <strong>Marriott</strong> drew multi-million-pound penalties after breaches of customer data — the fines turned on <em>inadequate protection</em>, independent of how sophisticated the attacker was. Regulators now punish the failure to protect, not merely the fact of being attacked.</p></div></div>\n<p>Knowing GDPR tells you where the regulatory world is heading — and where Ghanaian practice is expected to meet it.</p>\n<hr>\n<h2>5 · The First 72 Hours of a Breach</h2>\n<p>A disciplined order, aligned with Module 6's forensics:</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 720 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"b72-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g font-size=\"11\" text-anchor=\"middle\">\n    <rect x=\"16\"  y=\"30\" width=\"150\" height=\"48\" rx=\"6\" fill=\"var(--red,#ff6b7a)\"  fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"91\"  y=\"50\" fill=\"currentColor\" font-weight=\"bold\">1 · CONTAIN</text><text x=\"91\" y=\"66\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">isolate, don't power off</text>\n    <rect x=\"192\" y=\"30\" width=\"150\" height=\"48\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"267\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">2 · SCOPE</text><text x=\"267\" y=\"66\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">what data / systems / people?</text>\n    <rect x=\"368\" y=\"30\" width=\"150\" height=\"48\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"443\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">3 · TRIAGE</text><text x=\"443\" y=\"66\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">scope + sensitivity → duty?</text>\n    <rect x=\"544\" y=\"30\" width=\"160\" height=\"48\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"624\" y=\"50\" fill=\"currentColor\" font-weight=\"bold\">4 · COUNSEL</text><text x=\"624\" y=\"66\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">before any public statement</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.5\">\n    <line x1=\"166\" y1=\"54\" x2=\"190\" y2=\"54\" marker-end=\"url(#b72-a)\"/>\n    <line x1=\"342\" y1=\"54\" x2=\"366\" y2=\"54\" marker-end=\"url(#b72-a)\"/>\n    <line x1=\"518\" y1=\"54\" x2=\"542\" y2=\"54\" marker-end=\"url(#b72-a)\"/>\n  </g>\n  <text x=\"360\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-style=\"italic\" opacity=\"0.8\">…then notify the DPC / affected people only if the triage and counsel say you must</text>\n</svg></div><figcaption>The first 72 hours — a disciplined order of operations</figcaption></figure>\n<ol>\n<li><strong>Contain first, investigate second</strong> — stop active access (while preserving evidence: <em>isolate, don't power off</em>).</li>\n<li><strong>Scope it</strong> — what data, which systems, how many people, is the attacker still present?</li>\n<li><strong>Triage notification</strong> — scope and data sensitivity drive the obligation.</li>\n<li><strong>Engage legal counsel</strong> <em>before</em> any external communication.</li>\n</ol>\n<p>Notification differs by breach type — a working mental grid:</p>\n<div class='tablewrap'><table><thead><tr><th>Breach type</th><th>Immediate action</th><th>Notification question</th></tr></thead><tbody><tr><td>Ransomware, systems encrypted only</td><td>Isolate, preserve, restore from clean backup</td><td>Was data <em>exfiltrated</em>? If yes, notification may apply</td></tr><tr><td>Ransomware + confirmed data theft</td><td>Isolate, preserve, engage counsel now</td><td>Notification likely — scope &amp; timing need legal advice</td></tr><tr><td>Phishing / credential compromise</td><td>Reset creds, revoke sessions, investigate</td><td>What could that account reach?</td></tr><tr><td>BEC / financial fraud</td><td>Preserve email evidence, contact bank to recall</td><td>Financial recovery first; data exposure may be secondary</td></tr><tr><td>Cloud misconfiguration exposing data</td><td>Remove public access, then scope duration</td><td>Duration + sensitivity drive the obligation</td></tr></tbody></table></div>\n<p>The notification decision itself follows a tree — risk to <em>individuals</em> is what escalates it:</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 560 290\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"dt-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"10\">\n    <rect x=\"150\" y=\"12\" width=\"200\" height=\"34\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/>\n    <text x=\"250\" y=\"33\" fill=\"currentColor\">Personal-data breach?</text>\n    <rect x=\"380\" y=\"14\" width=\"170\" height=\"30\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"465\" y=\"33\" fill=\"currentColor\" font-size=\"9\">no → log internally; done</text>\n    <rect x=\"150\" y=\"78\" width=\"200\" height=\"34\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/>\n    <text x=\"250\" y=\"99\" fill=\"currentColor\">Risk to individuals?</text>\n    <rect x=\"380\" y=\"80\" width=\"170\" height=\"30\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"465\" y=\"99\" fill=\"currentColor\" font-size=\"9\">low → record; no notice</text>\n    <rect x=\"130\" y=\"144\" width=\"240\" height=\"34\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <text x=\"250\" y=\"165\" fill=\"currentColor\" font-weight=\"bold\">NOTIFY THE REGULATOR (DPC)</text>\n    <rect x=\"150\" y=\"208\" width=\"200\" height=\"34\" rx=\"6\" fill=\"currentColor\" fill-opacity=\"0.08\" stroke=\"currentColor\"/>\n    <text x=\"250\" y=\"229\" fill=\"currentColor\">HIGH risk to individuals?</text>\n    <rect x=\"130\" y=\"256\" width=\"300\" height=\"28\" rx=\"6\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <text x=\"280\" y=\"274\" fill=\"currentColor\" font-weight=\"bold\">yes → also notify the affected people</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"250\" y1=\"46\" x2=\"250\" y2=\"76\" marker-end=\"url(#dt-a)\"/>\n    <line x1=\"350\" y1=\"29\" x2=\"378\" y2=\"29\" marker-end=\"url(#dt-a)\"/>\n    <line x1=\"250\" y1=\"112\" x2=\"250\" y2=\"142\" marker-end=\"url(#dt-a)\"/>\n    <line x1=\"350\" y1=\"95\" x2=\"378\" y2=\"95\" marker-end=\"url(#dt-a)\"/>\n    <line x1=\"250\" y1=\"178\" x2=\"250\" y2=\"206\" marker-end=\"url(#dt-a)\"/>\n    <line x1=\"250\" y1=\"242\" x2=\"250\" y2=\"254\" marker-end=\"url(#dt-a)\"/>\n  </g>\n  <g font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.8\">\n    <text x=\"258\" y=\"64\">yes</text><text x=\"258\" y=\"130\">likely</text>\n  </g>\n</svg></div><figcaption>The breach-notification decision tree</figcaption></figure>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Do not communicate before counsel</div><div class='callout-b'><p>The most damaging early move is a public statement that later proves wrong. Brief qualified legal counsel before notifying regulators, customers or the press — and confirm the <em>current</em> Act 843 notification obligations with them, because the rules can change.</p></div></div>\n<hr>\n<h2>6 · CII and Mandatory Reporting (Act 1038)</h2>\n<p>Certain sectors are designated <strong>Critical Information Infrastructure</strong>. For CII operators, Act 1038 imposes <strong>mandatory incident reporting</strong> to the CSA/CERT-GH, with timelines and formats that a professional confirms against current CSA directives rather than guessing. Reporting is also a <em>defensive</em> act: it lets the CSA issue sector-wide warnings — which is exactly what organised-crime groups are counting on you <em>not</em> to do.</p>\n<hr>\n<h2>7 · Building the Compliance Programme</h2>\n<p>Compliance is a <strong>programme</strong>, not a one-off document. A credible one rests on a few pillars a regulator (and your board) will expect to see:</p>\n<ul>\n<li><strong>An accountable role</strong> — a <strong>DPO</strong> / data-protection supervisor with authority and direct access to the board (bridges to Module 9's governance).</li>\n<li><strong>DPC registration</strong>, kept <strong>current</strong> — not lapsed, as Akoma's was.</li>\n<li><strong>A record of processing + a retention schedule</strong> — know what you hold, and delete on time (the storage-limitation principle made operational).</li>\n<li><strong>The core policies</strong> — privacy notice, data-protection policy, retention policy, a <strong>breach-response plan</strong>, and an acceptable-use policy.</li>\n<li><strong>A DPA with every processor</strong>, and a register of processors/sub-processors.</li>\n<li><strong>Training and awareness</strong> — staff are the front line (Module 5), so this is a control, not a formality.</li>\n<li><strong>DPIAs</strong> for every new high-risk processing activity.</li>\n<li><strong>Audit and a compliance calendar</strong> — scheduled reviews of registration, retention runs, training and DPIAs, tested by internal audit (the three-lines model, Module 9).</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>A breach is a governance event, not just a technical one</div><div class='callout-b'><p>Regulatory settlements, consumer redress and executive departures follow a serious breach — so the <strong>board</strong>, not just the SOC, answers for it. That is why the compliance programme is board-owned, and why this module hands straight to Module 9's governance.</p></div></div>\n<hr>\n<h2>8 · Scenario — Exposure and Consequence</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Healthcare data exposure</div><div class='callout-b'><p>A Ghanaian hospital discovers a cloud repository of patient records left publicly accessible, with logs showing external downloads. Act 843 is squarely engaged: the data is <em>sensitive</em> (health); the hospital is the <em>controller</em> even though a vendor ran the cloud; and the download logs mean this is probable <em>exfiltration</em>, not mere exposure. The immediate steps — remove public access, preserve the logs, scope the exposure, and get counsel on DPC notification — are the fusion of Module 6's forensics and this module's law. This is the exact scenario behind your breach-assessment deliverable.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Equifax aftermath</div><div class='callout-b'><p>Beyond the technical failure, the aftermath — regulatory settlements, consumer redress, executive departures — showed that a breach is a <em>legal and governance</em> event, not only a technical one. The board, not just the SOC, answers for it.</p></div></div>\n<hr>\n<h2>9 · Do It — the Akoma Health Case</h2>\n<p>This module has a <strong>hands-on, graded case lab</strong>. You are the <strong>Data Protection Officer</strong> at <strong>Akoma Health Network</strong>, which has just discovered that a cloud export of patient records was left public and downloaded. You must classify the breach, fix controller/processor accountability, scope the data and the people affected, decide the notification obligations, and catch the compliance failures (retention, invalid consent, the missing DPIA, the missing DPA, the lapsed registration) — then write it up.</p>\n<figure class='fig'><pre class='fig-ascii'>  labctl start m8   →   read casefile.md (the breach + compliance review)\n                    →   labctl verify m8   (16 graded checks)\n                    →   labctl worksheet m8   (breach assessment + compliance-gap register)</pre><figcaption>How to run the M8 case lab</figcaption></figure>\n<p>Your case figures are <strong>randomised to you</strong>. Launch it from the <strong>Labs</strong> view, or:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the Module 8 practical</span></div><pre><code>labctl start m8        # personalises your case pack (file-based — nothing to boot)\nlabctl verify m8       # grade your breach &amp; compliance analysis\nlabctl worksheet m8    # the two board deliverables</code></pre></div>\n<p>The two deliverables:</p>\n<ul>\n<li><strong>Breach assessment</strong> — classify the breach, determine controller/processor status, scope the exposure, and work the notification decision tree.</li>\n<li><strong>Compliance-gap register</strong> — map real practice against Act 843 and Act 1038, each gap with a named owner and a target date.</li>\n</ul>\n<hr>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Act 843</strong> = personal data (DPC); <strong>Act 1038</strong> = cybersecurity (CSA, CII, reporting). <strong>GDPR</strong> is the global benchmark.</li>\n<li>Every use of personal data needs a <strong>lawful basis</strong> and must honour the <strong>principles</strong> — minimisation, storage limitation, accountability. <strong>Consent</strong> is often the weakest choice.</li>\n<li>You are almost certainly a <strong>data controller</strong> — register, and sign a <strong>DPA</strong> with every processor. <strong>Outsourcing the task never outsources the accountability</strong> (the misconfigured cloud bucket is always your fault).</li>\n<li>Honour <strong>data-subject rights</strong> (the <strong>DSAR</strong>); run a <strong>DPIA</strong> and keep a <strong>data map</strong> for high-risk processing; watch <strong>cross-border transfers</strong>.</li>\n<li>First 72 hours: <strong>contain → scope → triage → counsel</strong>, then the <strong>notification decision tree</strong> (regulator; and data subjects if high risk).</li>\n<li>Compliance is a <strong>programme</strong> — DPO, DPC registration, retention schedule, DPAs, training, audit — and a <strong>breach is a governance event the board answers for.</strong></li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>A cloud vendor misconfigures storage and leaks your customers' data. Who is accountable under Act 843?</strong> → You — the data controller. The vendor is a processor; accountability does not transfer with the task.</li>\n</ol>\n<ol>\n<li><strong>Ransomware encrypts your systems but you find no evidence of data theft. Is the notification question the same as a confirmed-exfiltration breach?</strong> → No — the key question is whether data left your control. Encryption-only vs confirmed exfiltration differ; confirm specifics with counsel.</li>\n</ol>\n<ol>\n<li><strong>First action in the first 72 hours — investigate or contain?</strong> → Contain (stop active access) first — while preserving evidence — then investigate.</li>\n</ol>\n<ol>\n<li><strong>What is the GDPR breach-notification norm, and why should a Ghanaian institution care?</strong> → Notify the regulator within 72 hours of becoming aware; it is the expectation partners, clients and regulators increasingly assume.</li>\n</ol>\n<ol>\n<li><strong>Which Ghanaian body oversees personal data, and which oversees cybersecurity?</strong> → The Data Protection Commission (Act 843) and the Cyber Security Authority (Act 1038).</li>\n</ol>\n<ol>\n<li><strong>A hospital recorded \"consent\" for its patient data, bundled into a mandatory intake form patients couldn't decline. Is that a valid lawful basis? Why?</strong> → No — consent must be <strong>freely given</strong>, specific and unambiguous; bundled or forced consent is invalid. A contract or legal-obligation basis would likely fit better.</li>\n</ol>\n<ol>\n<li><strong>Before launching an AI that profiles customers from their health records, what assessment is legally required, and what must you keep to even run it?</strong> → A <strong>DPIA</strong> (the processing is high-risk, sensitive and uses new tech), and a <strong>record of processing / data map</strong>. Skipping a required DPIA is itself a breach.</li>\n</ol>\n<ol>\n<li>**A likely personal-data breach poses <em>high</em> risk to the individuals affected. Who must you notify?<strong> → </strong>Both<strong> — the regulator (DPC) within the deadline, </strong>and** the affected data subjects directly, because the risk to them is high.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Act 843</strong> — Ghana Data Protection Act 2012 (personal data; DPC).</li>\n<li><strong>Act 1038</strong> — Ghana Cybersecurity Act 2020 (CSA, CII, reporting).</li>\n<li><strong>GDPR</strong> — the EU data-protection regulation; the global benchmark.</li>\n<li><strong>Data controller / processor</strong> — decides how data is used / processes it for the controller.</li>\n<li><strong>Lawful basis</strong> — consent, contract, legal obligation, vital interests, public task, legitimate interests.</li>\n<li><strong>DPA (data processing agreement)</strong> — the written controller–processor contract the law requires.</li>\n<li><strong>DSAR</strong> — Data Subject Access Request: \"send me a copy of everything you hold on me.\"</li>\n<li><strong>Data-subject rights</strong> — access, rectification, erasure, restriction, portability, objection, automated-decision rights.</li>\n<li><strong>DPIA</strong> — Data Protection Impact Assessment, required before high-risk processing.</li>\n<li><strong>Record of processing / data map</strong> — the inventory of what personal data you hold, why, where and for how long.</li>\n<li><strong>Cross-border transfer / data residency</strong> — sending personal data abroad / rules on where it may physically live.</li>\n<li><strong>CII</strong> — Critical Information Infrastructure, designated under Act 1038.</li>\n<li><strong>Data minimisation / storage limitation</strong> — collect only what's needed / keep only as long as needed.</li>\n<li><strong>DPO</strong> — Data Protection Officer: the accountable role for the compliance programme.</li>\n<li><strong>CERT-GH</strong> — national incident-response team under the CSA.</li>\n</ul>\n<h2>Further reading</h2>\n<ul>\n<li>Ghana Data Protection Act, 2012 (Act 843) and the Data Protection Commission — dataprotection.org.gh</li>\n<li>Ghana Cybersecurity Act, 2020 (Act 1038) and the CSA — csa.gov.gh</li>\n<li>EU GDPR — gdpr.eu (notification, DPIA, data-subject rights)</li>\n<li>ENISA and ICO breach-notification guidance</li>\n</ul>", "sheets": [{"name": "m8-breach-assessment.md", "html": "<h1>Data Breach Assessment — Module 8 Deliverable</h1>\n<p><strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Incident ref:</strong> [ ]</p>\n<blockquote>Work the first-72-hours order: **contain → scope → triage notification →</blockquote>\n<blockquote>counsel.** This assessment informs — it does not replace — legal advice. See</blockquote>\n<blockquote><code>labctl learn m8</code>.</blockquote>\n<h2>1. What happened</h2>\n<p>[Plain description of the breach.]</p>\n<h2>2. Classification</h2>\n<ul>\n<li>Breach type: [ransomware / phishing / BEC / cloud misconfiguration / other]</li>\n<li>Data involved: [ ]  <strong>Sensitive?</strong> [health / biometric / financial / criminal — yes/no]</li>\n<li>Volume: [approx. number of records / individuals]</li>\n<li>Was data <strong>exfiltrated</strong> (left your control), or only exposed/encrypted? [ ]</li>\n</ul>\n<h2>3. Our role under Act 843</h2>\n<ul>\n<li>Are we the <strong>data controller</strong> or <strong>processor</strong> for this data? [ ]</li>\n<li>(Remember: using a cloud vendor does <strong>not</strong> transfer your accountability.)</li>\n</ul>\n<h2>4. Containment &amp; scoping actions taken</h2>\n<div class='tablewrap'><table><thead><tr><th>Action</th><th>Date/time</th><th>By</th></tr></thead><tbody><tr><td>[e.g. removed public access / isolated host]</td><td></td><td></td></tr><tr><td>[preserved logs &amp; evidence]</td><td></td><td></td></tr></tbody></table></div>\n<h2>5. Notification triage</h2>\n<div class='tablewrap'><table><thead><tr><th>Question</th><th>Answer / status</th></tr></thead><tbody><tr><td>Did personal data leave our control?</td><td>[ ]</td></tr><tr><td>Is the data sensitive?</td><td>[ ]</td></tr><tr><td>Are we (or is this) CII under Act 1038?</td><td>[ ]</td></tr><tr><td>Does this likely trigger DPC notification?</td><td>[confirm with counsel]</td></tr><tr><td>Do affected individuals likely need to be told?</td><td>[confirm with counsel]</td></tr></tbody></table></div>\n<h2>5b. Underlying compliance failures that enabled this</h2>\n<p><em>A breach usually exposes pre-existing gaps. Tick any that apply and feed them to the compliance-gap register.</em></p>\n<ul>\n<li>[ ] <strong>Lawful basis</strong> invalid or missing (e.g. bundled/forced \"consent\")</li>\n<li>[ ] <strong>Retention</strong> — data kept past the documented need (storage-limitation breach)</li>\n<li>[ ] <strong>DPIA</strong> not done for high-risk / sensitive processing</li>\n<li>[ ] <strong>DPA</strong> missing with the processor/cloud vendor</li>\n<li>[ ] <strong>DPC registration</strong> lapsed or absent</li>\n<li>[ ] Data not <strong>minimised / encrypted / access-controlled</strong></li>\n</ul>\n<h2>6. Questions for legal counsel (before any external communication)</h2>\n<ol>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>7. Immediate remediation</h2>\n<p>[What stops this recurring — the control gap to close.]</p>\n<hr>\n<h2>Worked example (reference — fictional hospital cloud exposure)</h2>\n<ul>\n<li><strong>What happened:</strong> a cloud repository of patient records was left publicly readable; access logs show 3 external downloads over 9 days.</li>\n<li><strong>Classification:</strong> cloud misconfiguration → <strong>confirmed exfiltration</strong> (downloads observed). Data = <strong>sensitive</strong> (health). ~4,200 individuals.</li>\n<li><strong>Our role:</strong> <strong>data controller</strong> (the vendor who ran the cloud is our processor — accountability stays with us).</li>\n<li><strong>Containment taken:</strong> public access removed 11:20; access logs and bucket config preserved; snapshot hashed.</li>\n<li><strong>Notification triage:</strong> personal + sensitive data left our control → DPC notification <strong>likely required</strong>; affected individuals <strong>likely must be told</strong> — <em>confirm timing/wording with counsel</em>.</li>\n<li><strong>Questions for counsel:</strong> 1) Does the 9-day exposure + downloads trigger mandatory DPC notification now? 2) Individual-notification wording? 3) Any CII reporting duty to the CSA?</li>\n<li><strong>Immediate remediation:</strong> enforce \"private by default\" bucket policy; add cloud-config monitoring; DPIA for the patient-records system.</li>\n</ul>"}, {"name": "m8-compliance-gap-register.md", "html": "<h1>Compliance Gap Register — Module 8 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>Map your real practice against Act 843 (data protection) and Act 1038</blockquote>\n<blockquote>(cybersecurity). For each requirement: are you compliant, and if not, who owns</blockquote>\n<blockquote>closing the gap and by when? See <code>labctl learn m8</code>.</blockquote>\n<h2>Act 843 — Data Protection</h2>\n<div class='tablewrap'><table><thead><tr><th>Requirement</th><th>Compliant? (Y/P/N)</th><th>Evidence / gap</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>Registered with the Data Protection Commission</td><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Lawful basis &amp; purpose documented</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Data minimisation (collect only what's needed)</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Retention limits defined &amp; enforced</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Security safeguards for personal data</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Sensitive data given heightened protection</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Processor contracts with data-protection clauses</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Data-subject request process exists</td><td>[ ]</td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Act 1038 — Cybersecurity</h2>\n<div class='tablewrap'><table><thead><tr><th>Requirement</th><th>Compliant? (Y/P/N)</th><th>Evidence / gap</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>Know whether we are designated CII</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Incident reporting process to CSA/CERT-GH</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Using licensed cybersecurity providers where required</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Current, owned cyber-risk documentation (CSA may request)</td><td>[ ]</td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Top 3 compliance gaps to close first</h2>\n<ol>\n<li>[requirement — why it's highest priority]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<p>(Y = compliant · P = partial · N = not compliant)</p>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<div class='tablewrap'><table><thead><tr><th>Requirement</th><th>Compliant?</th><th>Evidence / gap</th><th>Owner</th><th>Target</th></tr></thead><tbody><tr><td>Registered with the DPC</td><td>N</td><td>Not yet registered</td><td>Compliance</td><td>2026-01-20</td></tr><tr><td>Data minimisation &amp; retention</td><td>P</td><td>Retention policy drafted, not enforced in systems</td><td>Ops</td><td>2026-02-28</td></tr><tr><td>Security safeguards for personal data</td><td>P</td><td>MFA missing on remote access</td><td>Head of IT</td><td>2026-01-31</td></tr><tr><td>Processor contracts with DP clauses</td><td>N</td><td>Cloud vendor contract lacks data-protection terms</td><td>Legal</td><td>2026-02-15</td></tr><tr><td>Act 1038 incident-reporting process</td><td>N</td><td>No defined 72-hour CSA reporting workflow</td><td>CISO</td><td>2026-02-10</td></tr><tr><td>Current, owned cyber-risk documentation</td><td>P</td><td>Register exists (M2) but owners not all assigned</td><td>CISO</td><td>2026-01-25</td></tr></tbody></table></div>\n<p><strong>Top 3 gaps:</strong> DPC registration (legal exposure) · processor contract clauses (vendor data leak = our liability) · incident-reporting workflow (72-hour duty). (Y=compliant · P=partial · N=not compliant)</p>"}]}, "m9": {"day": 5, "title": "Module 9 — Cyber Governance & Business Continuity", "lesson": "<h1>Module 9 — Cyber Governance &amp; Business Continuity</h1>\n<p><strong>Day 5 · Morning Session · ~1.5 hours · Hands-on case lab: <code>labctl start m9</code> · Deliverables: <code>labctl worksheet m9</code></strong></p>\n<p>Everything from the week only creates value if leadership can <em>govern</em> it — set direction, demand assurance, measure what matters, and keep the institution running through a crisis. This module turns five days of technical work into the language of the board: the governance operating model, the metrics that actually inform a decision, the business-continuity discipline (BIA, RTO/RPO, tested recovery), crisis command and communications, and the modern frame of operational resilience — the capabilities that decide whether an incident is a bad day or an existential one.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Distinguish <strong>governance</strong> from <strong>management</strong>, place accountability with the <strong>three-lines model</strong>, and site the CISO role and risk appetite.</li>\n<li>Order the <strong>policy hierarchy</strong> (Policy → Standard → Procedure → Guideline).</li>\n<li>Choose <strong>decision-useful</strong> board metrics and reject <strong>vanity</strong> ones.</li>\n<li>Run a <strong>BIA</strong>, set <strong>RTO/RPO</strong> per service, choose a <strong>BC/DR strategy</strong>, and <em>test</em> it (ISO 22301).</li>\n<li>Direct a <strong>crisis-command</strong> structure with a decision log and sound <strong>crisis communications</strong>.</li>\n<li>Frame the programme as <strong>operational resilience</strong> — impact tolerances and severe-but-plausible scenarios.</li>\n<li>Produce an executive <strong>cyber-risk memo</strong> and a <strong>recovery-priority table</strong> (the Volta Pension Trust case lab + worksheets).</li>\n</ol></div></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Prerequisites &amp; deliverables</div><div class='callout-b'><p>This module consumes the risk register (M2), the compliance posture (M8) and the incident experience (M6/M10). There is a <strong>hands-on, graded case lab</strong> — <code>labctl start m9</code> (the <strong>Volta Pension Trust</strong> governance &amp; continuity review) — and two deliverables: an <strong>executive cyber-risk memo</strong> and a <strong>service recovery-priority table</strong> (<code>labctl worksheet m9</code>).</p></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:20</td><td>Governance vs management; the three-lines model; the CISO &amp; risk appetite</td></tr><tr><td>0:20 – 0:35</td><td>Policy hierarchy; decision-useful vs vanity metrics</td></tr><tr><td>0:35 – 1:00</td><td>BIA, RTO/RPO, BC/DR strategy &amp; testing; crisis command &amp; comms; resilience</td></tr><tr><td>1:00 – 1:30</td><td>Lab: the Volta Pension Trust review (<code>labctl start m9</code>) + the deliverables</td></tr></tbody></table></div>\n<hr>\n<h2>1 · Governance Is Direction and Assurance</h2>\n<p><strong>Governance is not management.</strong> Governance <em>sets direction and demands assurance</em> — the board decides risk appetite, approves policy and budget, and asks \"are we actually protected?\" Management <em>does the work</em> — the CISO and teams implement, operate and report. Confusing the two is the classic failure: when security is \"IT's problem\", no one at the top owns the risk — and <strong>Act 1038</strong> now makes that a legal problem, not merely a bad habit.</p>\n<p><strong>NIST CSF 2.0's GOVERN function</strong> and <strong>ISO/IEC 27001</strong> (the information-security management-system standard) both exist to make this accountability explicit and auditable.</p>\n<p>The <strong>three lines model</strong> places accountability cleanly:</p>\n<ul>\n<li><strong>First line</strong> — operations <em>own and run</em> the risk day to day.</li>\n<li><strong>Second line</strong> — risk and compliance <em>oversee and challenge</em>.</li>\n<li><strong>Third line</strong> — internal audit provides <em>independent assurance</em>.</li>\n</ul>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 700 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <rect x=\"20\" y=\"14\" width=\"660\" height=\"40\" rx=\"6\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n  <text x=\"350\" y=\"33\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" fill=\"currentColor\">BOARD / governing body</text>\n  <text x=\"350\" y=\"47\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">sets direction · demands assurance · owns accountability (Act 1038)</text>\n  <g font-size=\"11\" text-anchor=\"middle\">\n    <rect x=\"20\"  y=\"86\" width=\"200\" height=\"86\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"120\" y=\"108\" fill=\"currentColor\" font-weight=\"bold\">1st LINE</text>\n    <text x=\"120\" y=\"126\" fill=\"currentColor\" font-size=\"10\">Operations / IT</text>\n    <text x=\"120\" y=\"146\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">own &amp; run the risk</text>\n    <text x=\"120\" y=\"158\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">day to day</text>\n    <rect x=\"250\" y=\"86\" width=\"200\" height=\"86\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"350\" y=\"108\" fill=\"currentColor\" font-weight=\"bold\">2nd LINE</text>\n    <text x=\"350\" y=\"126\" fill=\"currentColor\" font-size=\"10\">Risk &amp; Compliance</text>\n    <text x=\"350\" y=\"146\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">oversee &amp; challenge</text>\n    <text x=\"350\" y=\"158\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">set policy &amp; limits</text>\n    <rect x=\"480\" y=\"86\" width=\"200\" height=\"86\" rx=\"6\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.15\" stroke=\"currentColor\"/>\n    <text x=\"580\" y=\"108\" fill=\"currentColor\" font-weight=\"bold\">3rd LINE</text>\n    <text x=\"580\" y=\"126\" fill=\"currentColor\" font-size=\"10\">Internal Audit</text>\n    <text x=\"580\" y=\"146\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">independent</text>\n    <text x=\"580\" y=\"158\" fill=\"currentColor\" font-size=\"9\" opacity=\"0.85\">assurance</text>\n  </g>\n  <g stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"0.6\">\n    <line x1=\"120\" y1=\"54\" x2=\"120\" y2=\"84\"/><line x1=\"350\" y1=\"54\" x2=\"350\" y2=\"84\"/><line x1=\"580\" y1=\"54\" x2=\"580\" y2=\"84\"/>\n  </g>\n</svg></div><figcaption>The three lines model — who owns, who oversees, who assures</figcaption></figure>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The governance failure Act 1038 targets</div><div class='callout-b'><p>\"Cybersecurity is the IT department's problem.\" Under Act 1038 it is a board accountability. A board with no standing cyber agenda item, no named accountable executive, and no approved policy is in a governance gap a regulator can act on.</p></div></div>\n<h3>1.1 The CISO and the risk appetite</h3>\n<p>Good governance needs <strong>a named, accountable executive</strong> — a <strong>CISO</strong> (or, in a smaller institution, a designated security lead) with the authority and the budget to act, and <strong>direct access to the board</strong>. The reporting line matters: a CISO buried three levels under the people whose systems they must challenge cannot do the job. The board's own instrument is a <strong>risk-appetite statement</strong> — a plain sentence of how much risk the institution will accept to pursue its goals (for example, <em>\"we will not accept any risk to the confidentiality of member financial data, and no more than four hours' downtime on benefit payments\"</em>). Appetite set at the top is what lets everyone below prioritise consistently. (<strong>COBIT</strong> is the IT-governance framework that formalises this operating model.)</p>\n<hr>\n<h2>2 · The Policy Hierarchy</h2>\n<p>From general to specific — each layer gives effect to the one above:</p>\n<ul>\n<li><strong>Policy</strong> — \"we protect personal and institutional data\" (what &amp; why, board-approved).</li>\n<li><strong>Standard</strong> — \"AES-256 encryption; MFA on all remote access\" (mandatory specifics).</li>\n<li><strong>Procedure</strong> — \"here are the exact steps to enrol MFA\" (how).</li>\n<li><strong>Guideline</strong> — \"advice on choosing a strong passphrase\" (recommended, not mandatory).</li>\n</ul>\n<p>A control that lives only in someone's head is not governance. It must trace up to an approved policy and down to a repeatable procedure.</p>\n<hr>\n<h2>3 · Metrics That Matter to a Board</h2>\n<p>Boards drown in technical detail and starve for meaning. Translate security into business risk with a small, honest set:</p>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>What it measures</th><th>Why the board cares</th></tr></thead><tbody><tr><td>Patch compliance rate</td><td>% of critical fixes applied within SLA</td><td>Unpatched = open doors</td></tr><tr><td>MFA adoption</td><td>% of accounts with MFA</td><td>The single highest-impact control vs credential theft</td></tr><tr><td>Mean Time to Detect (MTTD)</td><td>Attack start → detection</td><td>Longer = more damage</td></tr><tr><td>Mean Time to Respond (MTTR)</td><td>Detection → containment</td><td>Longer = more cost</td></tr><tr><td>Phishing-sim failure rate</td><td>% of staff who click</td><td>The human firewall; should trend down</td></tr><tr><td>Backup restore test result</td><td>Last <em>verified</em> successful restore</td><td>A failed restore = no disaster recovery</td></tr></tbody></table></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The one metric never to skip</div><div class='callout-b'><p>The <strong>backup restore test</strong>. A backup you have never restored is a hope, not a control. This line belongs in every board pack — and Maersk's near-miss (below) is why.</p></div></div>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Vanity metrics vs decision-useful metrics</div><div class='callout-b'><p>\"<strong>Attacks blocked: 4.2 million</strong>\", \"firewall uptime 99.98%\", \"antivirus on 100% of laptops\" are <strong>vanity metrics</strong> — big numbers that look reassuring and inform <em>no decision</em>. A board metric is useful only if a bad value triggers an action: <em>MTTD rising</em> → invest in detection; <em>patch compliance 60%</em> → fix the patch process; <em>last restore test failed</em> → stop everything. Prefer <strong>leading</strong> indicators (that warn before harm) over <strong>lagging</strong> ones (that only count damage).</p></div></div>\n<hr>\n<h2>4 · The Board-Reporting Discipline</h2>\n<p>Good governance answers \"are we secure?\" with <strong>evidence, not reassurance</strong>: the six metrics above, the top residual risks (from the M2 register), the status of the last incident's lessons, and a clear decision ask. The failures that destroy a board brief: drowning it in jargon and CVE numbers; presenting an assessment as a fact (Module 1); and never surfacing the residual risk the board is implicitly accepting.</p>\n<hr>\n<h2>5 · Business Continuity — Surviving and Recovering</h2>\n<p>Risk treatment reduces harm; <strong>continuity</strong> keeps you running when harm lands.</p>\n<h3>5.1 The Business Impact Analysis (BIA)</h3>\n<p>The BIA is the foundation. For each service you ask, methodically: <em>what does the business lose, per hour and per day, if this is down?</em> — financial, regulatory, safety and reputational — and <em>what else fails downstream</em> (its dependencies). That gives every service a priority and two numbers agreed <strong>with the business</strong>, not guessed by IT:</p>\n<ul>\n<li><strong>RTO (Recovery Time Objective)</strong> — the maximum acceptable <strong>downtime</strong>.</li>\n<li><strong>RPO (Recovery Point Objective)</strong> — the maximum acceptable <strong>data loss</strong>, i.e. how far back your last usable backup may be.</li>\n</ul>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <line x1=\"30\" y1=\"86\" x2=\"610\" y2=\"86\" stroke=\"currentColor\" stroke-width=\"1.5\"/>\n  <circle cx=\"170\" cy=\"86\" r=\"5\" fill=\"var(--teal,#2bb6a8)\" stroke=\"currentColor\"/>\n  <text x=\"320\" y=\"92\" text-anchor=\"middle\" font-size=\"18\" fill=\"var(--red,#ff6b7a)\" font-weight=\"bold\">✦</text>\n  <circle cx=\"470\" cy=\"86\" r=\"5\" fill=\"var(--green,#4cae74)\" stroke=\"currentColor\"/>\n  <g font-size=\"10\" text-anchor=\"middle\" fill=\"currentColor\">\n    <text x=\"170\" y=\"112\">last good backup</text>\n    <text x=\"320\" y=\"116\" fill=\"var(--red,#ff6b7a)\" font-weight=\"bold\">INCIDENT</text>\n    <text x=\"470\" y=\"112\">service restored</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.3\">\n    <line x1=\"170\" y1=\"60\" x2=\"316\" y2=\"60\" marker-end=\"url(#rp-a)\"/>\n    <line x1=\"324\" y1=\"60\" x2=\"470\" y2=\"60\" marker-end=\"url(#rp-a)\"/>\n  </g>\n  <defs><marker id=\"rp-a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"5\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L5,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <text x=\"245\" y=\"50\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--teal,#2bb6a8)\" font-weight=\"bold\">RPO — data loss</text>\n  <text x=\"397\" y=\"50\" text-anchor=\"middle\" font-size=\"10\" fill=\"var(--green,#4cae74)\" font-weight=\"bold\">RTO — downtime</text>\n  <text x=\"245\" y=\"138\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.8\">tighter RPO → back up more often</text>\n  <text x=\"397\" y=\"138\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.8\">tighter RTO → faster failover (costs more)</text>\n</svg></div><figcaption>RTO and RPO — two different clocks around the incident</figcaption></figure>\n<h3>5.2 Choosing a recovery strategy</h3>\n<p>The RTO you promised dictates what you must <em>build</em> — and the cost rises as the RTO shrinks:</p>\n<ul>\n<li><strong>Cold site / restore-from-backup</strong> — cheapest, slowest (days): bare infrastructure, restore everything.</li>\n<li><strong>Warm site</strong> — partial standby (hours): some systems pre-staged.</li>\n<li><strong>Hot site / active-active or cloud DR</strong> — fastest (minutes), most expensive: a running replica you fail over to.</li>\n<li><strong>Manual workaround</strong> — the non-technical fallback (pay pensioners from a pre-agreed list) that buys time while systems recover.</li>\n</ul>\n<p><strong>ISO 22301</strong> is the business-continuity-management standard that formalises all of this; <strong>3-2-1 backups</strong> (Module 6) are the control that makes any of it real.</p>\n<h3>5.3 Test it, or you don't have it</h3>\n<p>A plan that has never been exercised is fiction. Rehearse up a ladder of realism:</p>\n<ol>\n<li><strong>Tabletop</strong> — the team talks through a scenario in a room. Cheapest; finds the obvious gaps.</li>\n<li><strong>Walkthrough / simulation</strong> — actually perform the steps in a test environment.</li>\n<li><strong>Full failover</strong> — cut production over to the recovery site for real.</li>\n</ol>\n<p>Every exercise ends in a <strong>lessons-learned</strong> review that feeds the governance cycle. The restore test is non-negotiable (Maersk, below).</p>\n<hr>\n<h2>6 · Crisis Command</h2>\n<p>Borrow the structure emergency services use (an <strong>Incident Command</strong> model):</p>\n<ul>\n<li>an <strong>Incident Commander</strong> who directs and decides;</li>\n<li>a <strong>Technical</strong> cell (investigate, contain, eradicate, recover);</li>\n<li>a <strong>Communications</strong> cell (staff, customers, regulators, press);</li>\n<li>a <strong>Legal/Privacy</strong> cell (Act 843/1038 obligations, counsel);</li>\n<li>and a <strong>decision log</strong> — every decision with a timestamp, the decision-maker and the rationale. That log is your audit trail and your defence afterwards.</li>\n</ul>\n<h3>6.1 Crisis communications</h3>\n<p>How you <em>speak</em> in a crisis decides whether you keep trust. Prepare <strong>holding statements</strong> in advance; communicate <strong>early, honestly and consistently</strong> across audiences — staff, customers, the <strong>regulator (DPC/CSA)</strong>, partners, and the press — each with the right message. The worst move is a confident early statement that later proves false (Module 8: <em>brief counsel before any external communication</em>). Maersk recovered its <em>reputation</em>, not just its systems, because its crisis comms were prompt and honest. Silence and spin both cost more than the breach.</p>\n<hr>\n<h2>7 · Operational Resilience — the Modern Frame</h2>\n<p>Regulators worldwide (and increasingly Bank of Ghana) are moving past \"business continuity\" to <strong>operational resilience</strong>: not <em>\"can this system recover?\"</em> but <em>\"can the institution keep delivering the services its customers depend on, through disruption, whatever the cause?\"</em> Three ideas define it:</p>\n<ul>\n<li><strong>Important business services</strong> — framed from the <em>customer's</em> view (paying a pensioner), not the system's (the database).</li>\n<li><strong>Impact tolerances</strong> — the maximum disruption to each service the institution (and its regulator) will tolerate — a harder commitment than an internal RTO.</li>\n<li><strong>Severe-but-plausible scenarios</strong> — you test resilience against realistic worst cases (a cloud-region failure, a ransomware wipe, a key-vendor collapse), not just tidy ones.</li>\n</ul>\n<p>It reframes everything above around the outcome the board and the regulator actually care about: <em>the service stays up for the people who rely on it.</em></p>\n<hr>\n<h2>8 · An Analogy</h2>\n<p>A ship. The <strong>board</strong> is the owner, setting the destination and how much rough weather is acceptable (risk appetite). The <strong>captain</strong> (CISO) sails the ship, reports position, and raises the alarm. The owner does not steer — but they <em>insist</em> on knowing whether the lifeboats work, whether the crew has drilled, and whether the last inspection passed. A board that only hears \"all fine, trust me\" and never demands evidence is an owner who discovers the lifeboats leak when the ship is already going down.</p>\n<hr>\n<h2>9 · Scenarios — Governance Decides the Outcome</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>CSSPS — a governance question before it was a technical one</div><div class='callout-b'><p>Whether a national-system outage is a bad day or a disaster is decided by governance questions asked long before: Had the board set an RTO for the service? Was there a tested recovery plan and an owner? Were backups verified? Institutions that answer \"yes\" recover in hours; those that assumed \"IT had it\" recover in weeks and headlines.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Maersk / NotPetya, 2017 — tested recovery, and crisis comms</div><div class='callout-b'><p>Maersk survived a total IT wipe-out largely because one domain-controller backup had been offline during the attack; afterwards it rebuilt resilience deliberately. <strong>Tested recovery is not optional, and luck is not a strategy.</strong> The firms that also recover their <em>reputation</em> are those whose crisis communications were honest, prompt and coordinated — a governance capability, not a technical one.</p></div></div>\n<hr>\n<h2>10 · Do It — the Volta Pension Trust Case</h2>\n<p>This module has a <strong>hands-on, graded case lab</strong>. You brief the board of <strong>Volta Pension Trust</strong>: read its BIA to set recovery priorities, find the RTO gap on the service pensioners depend on, and catch the governance failures (no board owner, a muddled policy hierarchy, vanity metrics, untested backups, no crisis command) — then write the executive memo and the recovery-priority table.</p>\n<figure class='fig'><pre class='fig-ascii'>  labctl start m9   →   read casefile.md (the BIA + the current board pack)\n                    →   labctl verify m9   (16 graded checks)\n                    →   labctl worksheet m9   (executive memo + recovery-priority table)</pre><figcaption>How to run the M9 case lab</figcaption></figure>\n<p>Your case figures are <strong>randomised to you</strong>. Launch it from the <strong>Labs</strong> view, or:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the Module 9 practical</span></div><pre><code>labctl start m9        # personalises your case pack (file-based — nothing to boot)\nlabctl verify m9       # grade your governance &amp; continuity analysis\nlabctl worksheet m9    # the two board deliverables</code></pre></div>\n<p>The two deliverables:</p>\n<ul>\n<li><strong>Executive cyber-risk memo</strong> — one page: the decision required, the situation in business terms, the board metrics, options with a recommendation, and the residual risk of doing nothing.</li>\n<li><strong>Service recovery-priority table</strong> — each critical service with its business impact, RTO, RPO, dependencies and owner, plus a backup/restore-test check.</li>\n</ul>\n<hr>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Governance sets direction and demands assurance; management executes.</strong> Anchored by <strong>CSF 2.0 GOVERN</strong>, <strong>ISO 27001</strong>, a named <strong>CISO</strong> and a <strong>risk-appetite statement</strong>.</li>\n<li><strong>Three lines</strong>: operations own risk, risk/compliance oversee, audit assures.</li>\n<li>Policy hierarchy: <strong>Policy → Standard → Procedure → Guideline.</strong></li>\n<li>Report <strong>decision-useful</strong> metrics (MFA %, MTTD/MTTR, patch rate, restore tests), never <strong>vanity</strong> ones (\"attacks blocked\").</li>\n<li>**BIA → RTO/RPO → a DR strategy you can afford → and <em>test</em> it<strong> (tabletop → failover; </strong>ISO 22301**). A backup never restored is a hope.</li>\n<li>A <strong>decision log</strong> and honest <strong>crisis communications</strong> protect you afterwards; the modern frame is <strong>operational resilience</strong> — the service stays up for the people who rely on it.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>The board asks \"are we secure?\" What kind of answer shows good governance?</strong> → Evidence, not reassurance: the six metrics and the top residual risks, so the board can <em>decide</em> rather than just trust.</li>\n</ol>\n<ol>\n<li><strong>RTO vs RPO?</strong> → RTO = maximum acceptable downtime; RPO = maximum acceptable data loss (how old the last recoverable backup can be).</li>\n</ol>\n<ol>\n<li><strong>Governance or management: approving the cybersecurity budget and risk appetite?</strong> → Governance (the board). Implementing the controls it funds is management.</li>\n</ol>\n<ol>\n<li>**Why is the backup <em>restore test</em> more important than the backup itself?** → A backup you have never restored may not work; only a verified restore proves disaster recovery — as Maersk's near-miss showed.</li>\n</ol>\n<ol>\n<li><strong>In a crisis, why keep a decision log?</strong> → It records what was decided, when and why — the audit trail you need to explain and defend your choices afterwards.</li>\n</ol>\n<ol>\n<li><strong>Your board pack's headline security metric is \"4.2 million attacks blocked.\" Why is that weak, and what would you report instead?</strong> → It is a <strong>vanity metric</strong> — it informs no decision. Report metrics where a bad value triggers an action: <strong>MTTD/MTTR</strong>, patch compliance, MFA adoption, and the last <strong>restore-test</strong> result.</li>\n</ol>\n<ol>\n<li><strong>The board set a 4-hour RTO for benefit payments; the current capability is 48 hours. What two things does that tell you to do?</strong> → There is a <strong>48-vs-4 gap</strong>, so (a) invest in a faster recovery strategy (warm/ hot site or cloud DR) to close it, and (b) <strong>test</strong> it — and meanwhile define a <strong>manual workaround</strong> to bridge the gap.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Governance vs management</strong> — directing and assuring vs executing.</li>\n<li><strong>CISO / risk appetite</strong> — the accountable security executive / how much risk the board will accept.</li>\n<li><strong>NIST CSF GOVERN / ISO 27001 / ISO 22301 / COBIT</strong> — governance function / ISMS standard / BC standard / IT-governance framework.</li>\n<li><strong>Three lines model</strong> — operations / risk &amp; compliance / internal audit.</li>\n<li><strong>Policy hierarchy</strong> — Policy → Standard → Procedure → Guideline.</li>\n<li><strong>Vanity vs decision-useful metric</strong> — a reassuring number that drives no action / one where a bad value triggers one.</li>\n<li><strong>MTTD / MTTR</strong> — mean time to detect / respond.</li>\n<li><strong>BIA / RTO / RPO</strong> — business-impact analysis / max downtime / max data loss.</li>\n<li><strong>DR strategy (cold/warm/hot)</strong> — restore-from-backup / partial standby / running replica; cost rises as RTO shrinks.</li>\n<li><strong>BC testing (tabletop → walkthrough → failover)</strong> — the ladder of exercise realism.</li>\n<li><strong>Operational resilience</strong> — keeping important business services within impact tolerances through severe-but-plausible disruption.</li>\n<li><strong>Incident Commander / decision log / crisis comms</strong> — the crisis director / the timestamped record of decisions / honest, coordinated messaging.</li>\n</ul>\n<h2>Further reading</h2>\n<ul>\n<li>NIST Cybersecurity Framework 2.0 — the GOVERN function</li>\n<li>ISO/IEC 27001 (ISMS) and ISO 22301 (business continuity)</li>\n<li>The IIA — <em>Three Lines Model</em></li>\n<li>NIST SP 800-61 — incident handling (crisis command)</li>\n</ul>", "sheets": [{"name": "m9-executive-risk-memo.md", "html": "<h1>Executive Cyber Risk Memo — Module 9 Deliverable</h1>\n<p><strong>To:</strong> [Board / Executive Committee]  <strong>From:</strong> [your name, role] <strong>Date:</strong> [YYYY-MM-DD]  <strong>Re:</strong> [subject]  <strong>Length target: ONE page.</strong></p>\n<blockquote>Write for decision-makers, not engineers. Lead with the decision you need.</blockquote>\n<blockquote>Use business language and the board metrics — not CVE numbers. See</blockquote>\n<blockquote><code>labctl learn m9</code>.</blockquote>\n<h2>Decision required</h2>\n<p>[State in one or two sentences exactly what you are asking the board to decide, approve or fund.]</p>\n<h2>Situation (3–4 sentences)</h2>\n<p>[What is happening / the risk, in business terms — money, trust, legal, safety, continuity.]</p>\n<h2>Where we stand — the metrics that matter</h2>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>Current</th><th>Target</th><th>Trend</th></tr></thead><tbody><tr><td>MFA adoption (% accounts)</td><td>[ ]</td><td>[ ]</td><td>[↑/↓/→]</td></tr><tr><td>Patch compliance (critical, within SLA)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Mean Time to Detect (MTTD)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Mean Time to Respond (MTTR)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Phishing-sim failure rate</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Last verified backup restore</td><td>[date/result]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<h2>Options &amp; recommendation</h2>\n<div class='tablewrap'><table><thead><tr><th>Option</th><th>Cost / effort</th><th>Risk reduction</th><th>Recommend?</th></tr></thead><tbody><tr><td>[A]</td><td>[ ]</td><td>[ ]</td><td>[✔/—]</td></tr><tr><td>[B]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<p><strong>Recommendation:</strong> [one clear sentence.]</p>\n<h2>If we do nothing</h2>\n<p>[The residual risk the board is choosing to accept — named owner, review date.]</p>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<p><strong>To:</strong> Board Risk Committee <strong>From:</strong> CISO <strong>Re:</strong> Fund MFA + payment-verification before Q1 close</p>\n<p><strong>Decision required:</strong> approve GHS 180,000 to deploy MFA on all remote access and a dual-control payment-verification process this quarter.</p>\n<p><strong>Situation:</strong> BEC against West African microfinance is rising; our VPN has no MFA and payments need no second-person callback. A single compromised credential or spoofed supplier email could cause a six-figure loss and DPC-reportable breach.</p>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>Current</th><th>Target</th></tr></thead><tbody><tr><td>MFA adoption</td><td>22%</td><td>100%</td></tr><tr><td>Last verified backup restore</td><td>none (untested)</td><td>monthly pass</td></tr><tr><td>Phishing-sim failure rate</td><td>31%</td><td>&lt;10%</td></tr></tbody></table></div>\n<p><strong>Recommendation:</strong> approve both controls now — together they address our two highest residual risks (M2 #1 and #2) for &lt; one-tenth of a plausible single-incident loss.</p>\n<p><strong>If we do nothing:</strong> the board accepts a high-likelihood, high-impact fraud/breach risk — owner CFO, review at Q1 close.</p>"}, {"name": "m9-recovery-priority-table.md", "html": "<h1>Service Recovery Priority Table (BIA / RTO / RPO) — Module 9 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>For each critical service, agree how fast it must come back (<strong>RTO</strong>) and how</blockquote>\n<blockquote>much data you can afford to lose (<strong>RPO</strong>), then rank recovery order. These are</blockquote>\n<blockquote>business decisions, agreed with service owners — not IT guesses. See</blockquote>\n<blockquote><code>labctl learn m9</code>.</blockquote>\n<div class='tablewrap'><table><thead><tr><th>Priority</th><th>Critical service</th><th>Business impact if down</th><th>RTO (max downtime)</th><th>RPO (max data loss)</th><th>Depends on</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> Core payment system</td><td>Revenue stops; customer harm; reputational</td><td>1 hour</td><td>5 min</td><td>Database, network</td><td>CFO / Head of IT</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Recovery sequence rationale</h2>\n<p>[Why this order? Note dependencies — a service can't recover before the things it relies on. Explain any trade-offs.]</p>\n<h2>Backup posture check (per critical service)</h2>\n<div class='tablewrap'><table><thead><tr><th>Service</th><th>Backup exists?</th><th>3-2-1 (3 copies/2 media/1 offsite)?</th><th>Last <strong>restore test</strong> (date/result)</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<blockquote>A backup you have never restored is a hope, not a control. The restore-test</blockquote>\n<blockquote>column is the one leadership should check every quarter.</blockquote>\n<h2>RTO gap &amp; strategy (per critical service)</h2>\n<div class='tablewrap'><table><thead><tr><th>Service</th><th>Required RTO</th><th>Current RTO</th><th>Gap?</th><th>Strategy to close it</th><th>Manual workaround</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[yes/no]</td><td>[cold / warm / hot / cloud DR]</td><td>[bridge while recovering]</td></tr></tbody></table></div>\n<h2>Exercise plan</h2>\n<ul>\n<li>Last BC/DR exercise (type + date): [tabletop / walkthrough / failover]</li>\n<li>Next exercise scheduled: [ ]  ·  Severe-but-plausible scenario to test: [ ]</li>\n</ul>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<div class='tablewrap'><table><thead><tr><th>Priority</th><th>Service</th><th>Business impact if down</th><th>RTO</th><th>RPO</th><th>Depends on</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td>Core banking / ledger</td><td>No deposits, withdrawals or MoMo; regulatory + trust</td><td>1 h</td><td>5 min</td><td>Database, network</td><td>CFO / Head of IT</td></tr><tr><td>2</td><td>Member-facing mobile app</td><td>Customers locked out; reputational</td><td>4 h</td><td>15 min</td><td>Core banking, API gateway</td><td>Head of IT</td></tr><tr><td>3</td><td>Email &amp; payment approvals</td><td>Operations and supplier payments stall</td><td>8 h</td><td>1 h</td><td>Identity, internet</td><td>Ops Manager</td></tr><tr><td>4</td><td>Internal reporting / BI</td><td>Delayed MI; low urgency</td><td>72 h</td><td>24 h</td><td>Data warehouse</td><td>Finance</td></tr></tbody></table></div>\n<p><strong>Backup posture:</strong> Core banking — backups exist, 3-2-1 <strong>not</strong> yet met (no offline copy), last restore test <strong>never</strong> → <strong>top remediation</strong>. Recovery sequence follows dependencies: database → core banking → app → email.</p>"}]}, "m10": {"day": 5, "title": "Module 10 — Operation Cyber Resilience (Capstone)", "lesson": "<h1>Module 10 — Operation Cyber Resilience (Capstone)</h1>\n<p><strong>Day 5 · Afternoon Session · ~4.5 hours · Hands-on lab: <code>labctl start m10</code></strong></p>\n<p>A real attack does not arrive as one neat module with a labelled answer. It hits email, network, identity, data and people <strong>at once</strong>, over hours, while the pressure mounts, the phones ring, and the information you have is incomplete and partly contradictory. This capstone is where the whole week comes together. You work a live, multi-vector incident against a fictional Ghanaian institution as <strong>both</strong> the technical investigator <em>and</em> the decision-maker — and the thing being assessed is not whether you can run a tool, but whether you can see the <strong>one adversary</strong> behind the chaos and respond to it with discipline.</p>\n<p>The two registers finally fuse. The <strong>technical</strong> work uses every instrument from the week — Nmap and Wireshark on the live range, header forensics on the BEC email, <code>jq</code> over the alert feed, hash cracking, and probing the bank's own AI assistant. The <strong>leadership</strong> work runs alongside it in real time — declaring severity, containing without destroying evidence, applying the deepfake protocol, setting recovery priorities, and recording defensible decisions on a crisis clock. By the end you will have produced a complete incident dossier and a 90-day resilience roadmap, exactly as a real response team must.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this capstone you will be able to</div><div class='callout-b'><ol>\n<li>Run an incident as <strong>Incident Commander</strong> — the four cells, a common operating picture, a battle rhythm, and the <strong>OODA loop</strong> under pressure.</li>\n<li><strong>Decide on incomplete information</strong> and avoid the cognitive traps (tunnel vision, confirmation bias, premature closure) that sink real responses.</li>\n<li>Investigate a <strong>live, multi-vector attack</strong> with every tool from the week, and <strong>correlate</strong> the injects into one campaign using a repeatable method (Kill Chain · ATT&amp;CK · Diamond · shared-indicator pivot).</li>\n<li>Prove the capstone's heart — that the <strong>BEC mule account, the AI's poisoned answer, and the network foothold are one operation</strong>.</li>\n<li>Drive the <strong>technical response</strong> (isolate, eradicate, recover) without destroying evidence, and run <strong>crisis communications</strong> across every stakeholder.</li>\n<li>Address the <strong>reporting obligations</strong> (Act 1038 CSA / Act 843 DPC) a real incident raises.</li>\n<li>Run an <strong>after-action review</strong> and turn its lessons into an <strong>incident dossier</strong> and a <strong>90-day resilience roadmap</strong> mapped to the NIST CSF.</li>\n</ol></div></div>\n<h3>The exercise timeline (eight injects)</h3>\n<div class='tablewrap'><table><thead><tr><th>Inject</th><th>Event</th><th>Module / Kill Chain</th><th>ATT&amp;CK</th></tr></thead><tbody><tr><td>T+00</td><td>Supplier payment-change email (urgent)</td><td>M5 · Delivery</td><td>T1566</td></tr><tr><td>T+20</td><td>Privileged login, unusual IP, off-hours</td><td>M3/M4 · Exploitation</td><td>T1078</td></tr><tr><td>T+40</td><td>Internal host scanning the network</td><td>M3 · Discovery/Lateral</td><td>T1046</td></tr><tr><td>T+65</td><td>Vendor bank details changed 48h ago; near-miss transfer</td><td>M2/M5 · Actions</td><td>T1565</td></tr><tr><td>T+90</td><td>Synthetic executive <em>voice note</em> orders a wire transfer</td><td>M7 · Delivery</td><td>T1656</td></tr><tr><td>T+120</td><td>Data exfiltration — large outbound to an unknown IP</td><td>M3/M6 · Actions</td><td>T1041</td></tr><tr><td>T+145</td><td>Critical database offline (ransomware)</td><td>M6 · Impact</td><td>T1486</td></tr><tr><td>T+160</td><td>AI assistant serves/leaks data via a poisoned/injected source</td><td>M7 · Execution</td><td>LLM01</td></tr></tbody></table></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:30</td><td>Brief: the orchestra; incident command (IC, cells, COP, OODA, battle rhythm)</td></tr><tr><td>0:30 – 0:50</td><td>Decision-making under pressure; the correlation method</td></tr><tr><td>0:50 – 2:30</td><td>The exercise — work the eight injects live, in cells (investigate + respond)</td></tr><tr><td>2:30 – 2:45</td><td>Break</td></tr><tr><td>2:45 – 3:30</td><td>Continue the exercise; crisis communications; declare, contain, recover</td></tr><tr><td>3:30 – 4:00</td><td><code>labctl verify m10</code>; assemble the incident dossier</td></tr><tr><td>4:00 – 4:30</td><td>The after-action review (hotwash) → the 90-day resilience roadmap</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> re-skim your own Module 5, 6 and 7 notes — the capstone reuses all three. <strong>Lab requirement:</strong> a Kali terminal with the full toolkit (<code>nmap</code>, <code>wireshark</code>/<code>tcpdump</code>, <code>gobuster</code>, <code>hashcat</code>/<code>john</code>, <code>curl</code>, <code>jq</code>), and Docker running. <strong>Assessment:</strong> your submission — the <em>Incident Dossier &amp; 90-Day Roadmap</em> (<code>labctl worksheet m10</code>) — is the capstone practical grade. Work as a team if your facilitator assigns cells. <strong>The rule:</strong> the authorised range is <code>10.13.10.0/24</code> only.</p></div></div>\n<hr>\n<h2>1 · The Orchestra, Not the Instruments</h2>\n<p>Every earlier module taught one instrument. The capstone is the orchestra. The institution is under a <strong>multi-vector attack</strong> that unfolds as the eight injects above over a simulated morning, and you work it from two sides simultaneously — the technical investigation <em>and</em> the crisis leadership. A real response team runs <strong>four operational cells</strong> in parallel, and the lab mirrors this:</p>\n<ul>\n<li><strong>Crisis Leadership</strong> — declares severity, owns decisions, talks to the board.</li>\n<li><strong>Technical Investigation</strong> — scans, captures, triages, correlates.</li>\n<li><strong>Fraud / Finance</strong> — freezes payments, pursues recall, liaises with the bank.</li>\n<li><strong>Legal / Privacy / Comms</strong> — reporting obligations, regulator, customers, staff.</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The working method: Collect → Correlate → Decide → Record</div><div class='callout-b'><p><strong>Collect</strong> every artefact (alerts, the capture, the email, scan results). <strong>Correlate</strong> them by shared indicators into one story. <strong>Decide</strong> — contain, verify, declare, prioritise — fast and on incomplete information. <strong>Record</strong> every decision with a timestamp and a rationale. In the debrief you are judged as much on the <em>decision log</em> as on the findings.</p></div></div>\n<hr>\n<h2>2 · Incident Command — Running It Under Pressure</h2>\n<p>Four cells working in parallel will <strong>diverge</strong> without someone holding the whole picture. That someone is the <strong>Incident Commander (IC)</strong> — not necessarily the best technician, but the person who keeps the picture whole, decides, and shields the responders from noise and executives from panic. A <strong>scribe</strong> keeps the decision log so the IC can think.</p>\n<p>The cells feed a <strong>common operating picture (COP)</strong> — one shared view of what is <em>known</em>, what is <em>assumed</em>, what is <em>unknown</em>, and what each cell is doing right now — and the IC runs a <strong>battle rhythm</strong>: short, regular syncs (every 20–30 minutes) where each cell reports new facts, the COP updates, and priorities re-set. Without that rhythm the cells duplicate work and miss the hand-offs.</p>\n<p>Under pressure you cycle the <strong>OODA loop</strong> — <strong>Observe → Orient → Decide → Act</strong> — fast and repeatedly. The attacker is running their own loop; whoever cycles faster <em>and more accurately</em> wins. <strong>Orient</strong> — making sense of partial, contradictory data — is the hardest step, and it is exactly where correlation lives.</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 620 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"ooda-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"11\">\n    <circle cx=\"70\"  cy=\"56\" r=\"42\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <circle cx=\"230\" cy=\"56\" r=\"42\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.18\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n    <circle cx=\"390\" cy=\"56\" r=\"42\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <circle cx=\"550\" cy=\"56\" r=\"42\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <g fill=\"currentColor\" font-weight=\"bold\"><text x=\"70\" y=\"54\">Observe</text><text x=\"230\" y=\"54\">Orient</text><text x=\"390\" y=\"54\">Decide</text><text x=\"550\" y=\"54\">Act</text></g>\n    <g fill=\"currentColor\" font-size=\"8\" opacity=\"0.85\">\n      <text x=\"70\" y=\"68\">what's happening?</text>\n      <text x=\"230\" y=\"68\">correlate — meaning</text>\n      <text x=\"390\" y=\"68\">what will we do?</text>\n      <text x=\"550\" y=\"68\">do it; log it</text>\n    </g>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.5\">\n    <line x1=\"112\" y1=\"56\" x2=\"186\" y2=\"56\" marker-end=\"url(#ooda-a)\"/>\n    <line x1=\"272\" y1=\"56\" x2=\"346\" y2=\"56\" marker-end=\"url(#ooda-a)\"/>\n    <line x1=\"432\" y1=\"56\" x2=\"506\" y2=\"56\" marker-end=\"url(#ooda-a)\"/>\n    <path d=\"M550,98 C550,140 70,140 70,100\" marker-end=\"url(#ooda-a)\"/>\n  </g>\n  <text x=\"310\" y=\"158\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" font-style=\"italic\" opacity=\"0.8\">Orient is the hardest step — and where a multi-vector campaign is seen as one</text>\n</svg></div><figcaption>The OODA loop — cycle faster and more accurately than the attacker</figcaption></figure>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>The trauma-team picture</div><div class='callout-b'><p>A hospital trauma team when a bus crash arrives: no single doctor owns it — one <strong>commander</strong> triages and directs, specialists work airway, bleeding and fractures <strong>in parallel</strong>, and a scribe <strong>logs</strong> every decision and drug by the minute. The week trained each specialist skill; the capstone is the trauma call where they work <em>together</em>, fast, under a commander, with the clock running.</p></div></div>\n<hr>\n<h2>3 · Decision-Making Under Pressure</h2>\n<p>You will decide on <strong>incomplete and partly wrong</strong> information — and <em>waiting for certainty is itself a decision</em>, usually a bad one. Two disciplines keep you sound:</p>\n<p><strong>Prioritise by impact and reversibility.</strong> Do first the things that are high-impact and hard to undo-if-you-wait — <strong>isolate the foothold, freeze the payment, preserve the evidence</strong>. Defer the low-impact and easily-reversible. A good-enough action now beats a perfect action after the money has gone.</p>\n<p><strong>Beware the cognitive traps</strong> that sink real responses:</p>\n<ul>\n<li><strong>Tunnel vision / first-story bias</strong> — latching onto the first explanation (\"it's just a phishing email\") and missing the wider campaign.</li>\n<li><strong>Confirmation bias</strong> — seeing only the evidence that fits your theory.</li>\n<li><strong>Premature closure</strong> — declaring it over before every foothold is found (M6) — and the attacker walks back in through the one you missed.</li>\n<li><strong>Normalisation of deviance</strong> — \"those alerts are always noise\" (M4) — which is exactly how the real one slips past.</li>\n</ul>\n<p>The counters are built into the command structure: the IC's outside view, the <strong>decision log</strong> (which forces you to <em>state</em> your reasoning), and the capstone's governing assumption — <strong>treat the injects as connected until the evidence proves otherwise.</strong></p>\n<hr>\n<h2>4 · The Signature Correlation — One Campaign, Not Six Problems</h2>\n<p>The single skill the capstone tests is <strong>correlation</strong>, and this scenario is engineered so the proof is unmistakable. Three facts, found in three completely different places, turn out to be the <em>same</em> fact:</p>\n<ul>\n<li>The <strong>mule bank account</strong> demanded by the BEC email (M5 header forensics).</li>\n<li>The account the bank's <strong>own AI assistant</strong> returns when asked about the supplier — because its knowledge base has been <strong>poisoned</strong> (M7 RAG poisoning).</li>\n<li>The internal <strong>foothold IP</strong> that appears in the privileged login, the internal scan <em>and</em> the data exfiltration (M3/M4/M6 correlation).</li>\n</ul>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 700 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"m10-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g font-size=\"10.5\">\n    <rect x=\"16\" y=\"16\"  width=\"230\" height=\"46\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"30\" y=\"36\" fill=\"currentColor\" font-weight=\"bold\">BEC email (M5)</text><text x=\"30\" y=\"52\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.85\">demands \"pay to account ####\"</text>\n    <rect x=\"16\" y=\"82\"  width=\"230\" height=\"46\" rx=\"6\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"30\" y=\"102\" fill=\"currentColor\" font-weight=\"bold\">AI assistant (M7)</text><text x=\"30\" y=\"118\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.85\">poisoned KB returns the SAME ####</text>\n    <rect x=\"16\" y=\"148\" width=\"230\" height=\"46\" rx=\"6\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"30\" y=\"168\" fill=\"currentColor\" font-weight=\"bold\">network foothold (M3/4/6)</text><text x=\"30\" y=\"184\" font-size=\"9\" fill=\"currentColor\" opacity=\"0.85\">one IP: login + scan + exfil</text>\n    <rect x=\"430\" y=\"70\" width=\"250\" height=\"70\" rx=\"8\" fill=\"currentColor\" fill-opacity=\"0.10\" stroke=\"currentColor\" stroke-width=\"1.6\"/>\n    <text x=\"555\" y=\"98\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" fill=\"currentColor\">ONE CAMPAIGN</text>\n    <text x=\"555\" y=\"116\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">email + AI + network =</text>\n    <text x=\"555\" y=\"127\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\" opacity=\"0.85\">the same adversary</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.5\">\n    <path d=\"M246,39  C330,39  360,95  428,100\" marker-end=\"url(#m10-a)\"/>\n    <path d=\"M246,105 L428,105\" marker-end=\"url(#m10-a)\"/>\n    <path d=\"M246,171 C330,171 360,115 428,110\" marker-end=\"url(#m10-a)\"/>\n  </g>\n</svg></div><figcaption>Three sources, one adversary — the capstone&#x27;s signature correlation</figcaption></figure>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>This is the moment the week clicks</div><div class='callout-b'><p>When you ask the AI assistant for the supplier account and it returns the <strong>exact same number</strong> the BEC email demanded, you have proven that the phishing, the network intrusion and the AI compromise are <strong>one coordinated campaign</strong> — a single adversary who corrupted email, network and AI to make the fraud look legitimate from every angle a staff member might check. That is why \"the system said so\" is not verification, and why a human callback on a known number is the only control that survives a multi-vector attack.</p></div></div>\n<h3>4.1 A repeatable method for correlating a campaign</h3>\n<p>Correlation isn't luck; it's a method you can run every time, using the week's frameworks as lenses:</p>\n<ol>\n<li><strong>Pivot on shared indicators.</strong> For every new artefact ask: <em>have I seen this IP, account, domain or hash before?</em> The <strong>foothold IP</strong> and the <strong>mule account
