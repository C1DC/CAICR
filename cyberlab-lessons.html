const DATA = {"m0": {"day": 1, "title": "Day 1 Orientation — Your Kali Workstation & the Linux Command Line", "lesson": "<h1>Day 1 Orientation — Your Kali Workstation &amp; the Linux Command Line</h1>\n<p><strong>Day 1 · Session 0 · Read this before anything else.</strong></p>\n<p>This is a practitioner course. By Friday you will have scanned networks, analysed real packet captures, cracked password hashes, investigated a business email compromise, worked a disk image in a forensic tool, broken an AI assistant, and run a live multi-vector incident — on the same tools used by professionals in the field. None of that works if you are not fluent in the terminal. This session makes you fluent, and sets the rules of engagement.</p>\n<p>By the end of this session you will:</p>\n<ul>\n<li>understand how the course is structured and how to drive it;</li>\n<li>know the CyberRange rules of engagement and the law that governs them;</li>\n<li>be able to navigate, inspect, search and manipulate a Linux system from the command line with confidence;</li>\n<li>recognise the commands that matter most to a security professional, and <em>why</em>.</li>\n</ul>\n<hr>\n<h2>1. How this course works</h2>\n<p>The programme has ten modules across five days. Every module gives you three things, and you move through them in order:</p>\n<ul>\n<li><strong>Learn</strong> — a deep lesson (like this one). In the web app it's the <em>Course</em> view; in the terminal it's <code>labctl learn m1</code>.</li>\n<li><strong>Do</strong> — a hands-on lab against isolated targets on this machine. In the web app, the <em>Labs</em> view (Start / Verify buttons); in the terminal, <code>labctl start m1</code> then <code>labctl verify m1</code>.</li>\n<li><strong>Produce</strong> — a professional deliverable (a risk register, an incident report, a board memo). Get the template with <code>labctl worksheet m1</code>.</li>\n</ul>\n<p>Everything runs <strong>on this machine, offline</strong>. Your progress is saved locally. You can use the browser app (<code>./start.sh</code>) or the terminal (<code>labctl</code>) — they are the same engine, kept in sync.</p>\n<blockquote>Assessment is built on the deliverables and the lab verifications, not on</blockquote>\n<blockquote>memorising slides. Treat every lab as if the evidence were real and your</blockquote>\n<blockquote>report would be read by a regulator or a court. That mindset is the course.</blockquote>\n<h2>2. Rules of engagement — read carefully</h2>\n<p>Every lab target lives on a private network on this computer (addresses in the range <code>10.13.x.x</code>). Those are the <strong>only</strong> systems you are authorised to touch.</p>\n<ul>\n<li><strong>Never</strong> point any tool in this course — Nmap, Nikto, Hydra, anything — at a network, website, phone or system you do not own or have <strong>written</strong> permission to test.</li>\n<li>Scanning or attacking a third party is a criminal offence under the <strong>Ghana Cybersecurity Act 2020 (Act 1038)</strong>, and carries real penalties.</li>\n<li>The techniques here are taught so you can <strong>defend</strong>. A professional's power comes with a professional's restraint. Authorisation is the line between a security engineer and a criminal; it is never optional.</li>\n</ul>\n<p>This is not boilerplate. People lose careers and liberty by forgetting it.</p>\n<h2>3. Your workstation: Kali Linux</h2>\n<p>Kali Linux is a Debian-based operating system maintained by OffSec, pre-loaded with hundreds of security tools. It is the industry-standard platform for penetration testers, incident responders and forensic analysts worldwide. You will learn on exactly what you will use in the field.</p>\n<p>Confirm the environment is ready before Day 1 proper:</p>\n<pre><code>labctl doctor        # checks Docker, the engine, and the installed tools</code></pre>\n<p>Green ticks mean you are ready. If Docker needs attention, <code>doctor</code> tells you the exact command to run.</p>\n<h2>4. The command line, and why it is non-negotiable</h2>\n<p>A graphical interface shows you what someone decided to show you. The command line shows you <em>everything</em>, exactly, and lets you combine small tools into powerful investigations. Security work is about precision and evidence: the terminal gives you both, and it scripts and repeats. Every serious tool in this field is driven from it.</p>\n<p>The shell prompt tells you who and where you are:</p>\n<pre><code>┌──(kali㉿kali)-[~]\n└─$</code></pre>\n<p><code>kali@kali</code> is <em>user@host</em>; <code>~</code> is your current directory (your home folder); <code>$</code> means a normal user (a <code>#</code> would mean root). Read the prompt before you type.</p>\n<hr>\n<h2>5. The Linux command line — the commands that matter</h2>\n<p>Work through these at the terminal. Each block is real; type them, don't just read them. Everything here you will use again in the labs.</p>\n<h3>5.1 Who and where am I?</h3>\n<pre><code>whoami              # your username\nid                  # your user id, groups (shows if you have sudo/root power)\nhostname            # the machine's name\npwd                 # \"print working directory\" — where you are right now\nuname -a            # kernel and architecture — know the system you're on\ndate                # current date/time (matters for evidence timestamps)</code></pre>\n<p>A security professional <em>always</em> knows which account they are using and on which host. Acting as the wrong user, on the wrong box, is how mistakes and incidents happen.</p>\n<h3>5.2 Getting help — the habit that makes you self-sufficient</h3>\n<pre><code>man nmap            # the full manual for a command (press q to quit, / to search)\nnmap --help         # quick option summary\nwhatis grep         # one-line description\napropos password    # find commands related to a keyword</code></pre>\n<p>Nobody memorises every flag. Professionals read the manual fast. <code>man</code> is your first move with any unfamiliar tool.</p>\n<h3>5.3 Moving around the filesystem</h3>\n<p>Linux is a single tree starting at <code>/</code> (root). Everything hangs off it.</p>\n<pre><code>ls                  # list files here\nls -la              # long listing, including hidden files (names starting with .)\nls -lh              # human-readable sizes (K, M, G)\ncd /etc             # change to an absolute path\ncd ..               # up one level\ncd ~                # home;  cd -  returns to the previous directory\ntree -L 2           # a visual tree, two levels deep</code></pre>\n<p>Paths are <strong>absolute</strong> (start with <code>/</code>, e.g. <code>/etc/passwd</code>) or <strong>relative</strong> (from where you are, e.g. <code>../logs</code>). <code>.</code> is here, <code>..</code> is the parent, <code>~</code> is home.</p>\n<h3>5.4 Reading files</h3>\n<pre><code>cat notes.txt               # dump a whole file\nless /var/log/syslog        # page through a big file (q to quit, / to search)\nhead -n 20 file             # first 20 lines\ntail -n 20 file             # last 20 lines\ntail -f /var/log/auth.log   # follow a log live as it grows — vital in IR\nfile evidence.img           # what KIND of file is this, really?\nstrings binary.bin          # pull readable text out of a binary (find URLs, keys)\nxxd capture.bin | head      # raw hex view — forensics bread and butter</code></pre>\n<p><code>file</code>, <code>strings</code> and <code>xxd</code> are the ones beginners skip and professionals live on — they tell you what something actually is when the extension lies.</p>\n<h3>5.5 Creating, copying, moving, deleting</h3>\n<pre><code>mkdir -p cases/2026/incident-07   # make nested directories in one go\ntouch report.md                   # create an empty file / update its timestamp\ncp -r evidence/ evidence-copy/     # copy (work on COPIES, never originals)\nmv draft.md final.md               # move or rename\nrm file.txt                        # delete a file\nrm -rf folder/                     # delete a folder and everything in it</code></pre>\n<blockquote><code>rm -rf</code> is irreversible and asks no questions. There is no recycle bin. Read</blockquote>\n<blockquote>the path twice before you press Enter — especially as root.</blockquote>\n<h3>5.6 Finding things</h3>\n<pre><code>find /home -name \"*.pcap\"             # by name, anywhere under /home\nfind . -type f -mtime -1              # files modified in the last day (IR triage)\nfind / -perm -4000 -type f 2&gt;/dev/null  # setuid binaries — classic priv-esc hunt\nwhich nmap                            # where a command lives on disk\ngrep -r \"password\" /etc/ 2&gt;/dev/null  # search file CONTENTS recursively</code></pre>\n<p><code>find</code> and <code>grep -r</code> are how you locate a needle — a leaked credential, a recently changed file, a dangerous permission — in a haystack of thousands of files.</p>\n<h3>5.7 Pipes and redirection — the real power</h3>\n<p>This is the idea that makes the command line powerful: small tools, chained. <code>|</code> sends one command's output into the next; <code>&gt;</code> writes to a file; <code>&gt;&gt;</code> appends; <code>2&gt;</code> redirects errors.</p>\n<pre><code>cat auth.log | grep \"Failed password\" | wc -l     # count failed SSH logins\nnmap -sV 10.13.3.0/24 &gt; scan.txt                   # save output to a file\ncommand 2&gt;/dev/null                                # throw errors away\ncommand &gt; out.txt 2&gt;&amp;1                             # capture output AND errors\ndig TXT example.com | tee dns.txt                  # show on screen AND save</code></pre>\n<p>\"Count the failed logins, by source IP, sorted by most frequent\" becomes one line — you'll build exactly that in Module 4.</p>\n<h3>5.8 Text processing — turning data into answers</h3>\n<pre><code>grep -i \"error\" log        # -i ignore case\ngrep -E \"T10[0-9]{2}\" f    # -E extended regex (match ATT&amp;CK IDs like T1046)\ngrep -v \"healthcheck\" log  # -v invert: everything EXCEPT matches\ngrep -c \"fail\" log         # -c count matching lines\ncut -d',' -f1,3 data.csv   # pull columns 1 and 3 from a CSV\nsort file | uniq -c | sort -rn   # count duplicates, most-frequent first\nawk '{print $1}' access.log | sort | uniq -c   # top source IPs from a log\nsed 's/old/new/g' file     # stream-edit: replace text\nwc -l file                 # count lines</code></pre>\n<p>The pattern <code>sort | uniq -c | sort -rn</code> — \"what are the most common values?\" — is one of the most useful lines in all of security analysis. Memorise it.</p>\n<h3>5.9 Permissions and ownership</h3>\n<p>Every file has an owner, a group, and three permission sets — for the <strong>owner</strong>, the <strong>group</strong>, and <strong>everyone else</strong> — each granting read (<code>r</code>), write (<code>w</code>) and execute (<code>x</code>).</p>\n<pre><code>ls -l script.sh\n# -rwxr-xr--  1  kali  kali  ...  script.sh\n#  │└┬┘└┬┘└┬┘\n#  │ │  │  └ others: read only\n#  │ │  └─── group: read + execute\n#  │ └────── owner: read + write + execute\n#  └──────── type: - file, d directory, l link</code></pre>\n<pre><code>chmod +x labctl        # make a file executable\nchmod 640 secret.txt   # owner rw, group r, others none  (4=r 2=w 1=x)\nchmod 600 id_rsa       # private keys MUST be owner-only, or SSH refuses them\nchown kali:kali file   # change owner and group (usually needs sudo)\numask                  # the default permissions mask for new files</code></pre>\n<p>Permissions are a security control in their own right. A world-readable <code>config.php</code> with a database password in it — which you'll find in Module 4 — is a permissions failure.</p>\n<h3>5.10 Users, privilege and sudo</h3>\n<pre><code>sudo &lt;command&gt;     # run one command as root (you'll be asked for your password)\nsudo -l            # what am I allowed to run as root? (attackers check this)\nsu - username      # switch to another user\ncat /etc/passwd    # the list of accounts on the system\nwho ; last         # who is logged in now; login history</code></pre>\n<p>Root (uid 0) can do anything. Use <code>sudo</code> deliberately, never habitually. Over-use of root is how a small mistake becomes a catastrophe.</p>\n<h3>5.11 Processes and services</h3>\n<pre><code>ps aux                 # every running process (a = all, u = detailed, x = incl. daemons)\nps aux | grep ssh      # is sshd running?\ntop        (or htop)   # live process/resource monitor (q to quit)\nkill 1234              # stop process id 1234 politely\nkill -9 1234           # force-kill (last resort)\njobs ; fg ; bg         # manage jobs you backgrounded with &amp;\nnohup long-task &amp;      # keep a task running after you log out\nsystemctl status docker # the state of a system service\nsudo systemctl start docker</code></pre>\n<p>In incident response, <code>ps aux</code> is often your first look at <em>what is actually running</em> on a suspect machine — including the thing that should not be.</p>\n<h3>5.12 Networking from the terminal</h3>\n<pre><code>ip a                  # your network interfaces and IP addresses (modern)\nip r                  # the routing table\nping -c 4 10.13.3.10  # is a host reachable? (4 packets)\nss -tulpn             # listening TCP/UDP ports and the processes behind them\ndig example.com MX    # query DNS (Modules 1 &amp; 5)\nhost example.com      # quick DNS lookup\nwhois example.com     # domain registration details\ncurl -I https://site  # fetch just the HTTP response headers\ncurl -s https://site/api | less   # fetch a page/API quietly\nwget https://site/file           # download a file\nnc -lvnp 4444         # netcat: listen on a port (the Swiss-army knife of networking)</code></pre>\n<p><code>ss -tulpn</code> answers \"what is this machine exposing to the network?\" — the single most important question when you harden a server. You'll use <code>dig</code>, <code>whois</code> and <code>curl</code> directly in the labs.</p>\n<h3>5.13 Packages — installing tools</h3>\n<pre><code>sudo apt update                 # refresh the package list\nsudo apt install -y wireshark   # install a tool\napt search forensic             # find packages\ndpkg -l | grep nmap             # is it already installed?</code></pre>\n<h3>5.14 Archives, transfer and integrity</h3>\n<pre><code>tar -czf case.tar.gz case/      # create a compressed archive\ntar -xzf case.tar.gz            # extract one\nzip -r out.zip folder/ ; unzip out.zip\nbase64 -d artifact.b64          # decode Base64 (Module 6)\nsha256sum evidence.img          # fingerprint a file — proof of integrity\nsha256sum -c evidence.sha256    # verify it hasn't changed</code></pre>\n<p><code>sha256sum</code> is the backbone of chain of custody in Module 6. A hash proves, with mathematics, that evidence was not altered.</p>\n<h3>5.15 System and disk</h3>\n<pre><code>df -h          # disk space per filesystem, human-readable\ndu -sh *       # size of each item in the current directory\nfree -h        # memory usage\nuptime         # how long the system's been up, and load\nlsblk          # block devices / disks (useful before imaging in forensics)</code></pre>\n<h3>5.16 History, shortcuts and speed</h3>\n<pre><code>history          # your command history\n!!               # repeat the last command (e.g. sudo !!)\n!$               # the last argument of the previous command</code></pre>\n<p>Learn these keystrokes — they pay off every single day:</p>\n<ul>\n<li><strong>Tab</strong> — auto-complete commands and paths (use it constantly).</li>\n<li><strong>Ctrl‑R</strong> — reverse-search your history (type a few letters of an old command).</li>\n<li><strong>Ctrl‑C</strong> — cancel the running command.</li>\n<li><strong>Ctrl‑L</strong> — clear the screen (same as <code>clear</code>).</li>\n<li><strong>Ctrl‑A / Ctrl‑E</strong> — jump to the start / end of the line.</li>\n<li><strong>Ctrl‑D</strong> — end of input / log out.</li>\n<li><strong>↑ / ↓</strong> — previous / next command.</li>\n</ul>\n<p>Environment and the <code>$PATH</code> (where the shell looks for commands):</p>\n<pre><code>echo $PATH                 # the directories searched for commands\nexport TARGET=10.13.3.10    # set a variable for this session\necho $TARGET</code></pre>\n<hr>\n<h2>6. Hands-on: your first fifteen minutes</h2>\n<p>Do this now, in a terminal, to lock it in:</p>\n<ol>\n<li>Find out who and where you are: <code>whoami</code>, <code>id</code>, <code>pwd</code>, <code>uname -a</code>.</li>\n<li>Make a working folder and enter it: <code>mkdir -p ~/work/day1 &amp;&amp; cd ~/work/day1</code>.</li>\n<li>Create and read a file: <code>echo \"CAIC day 1\" &gt; note.txt &amp;&amp; cat note.txt</code>.</li>\n<li>List in detail and read the permissions: <code>ls -l</code>.</li>\n<li>Pipe something together: <code>cat /etc/passwd | grep -v nologin | cut -d: -f1 | sort</code> — the login-capable accounts on this box, sorted. Read each stage of the pipe.</li>\n<li>Check what's listening on the network: <code>ss -tulpn</code>.</li>\n<li>Open a manual and search it: <code>man ls</code>, then type <code>/sort</code> and press Enter.</li>\n<li>Confirm the course is ready: <code>labctl doctor</code>.</li>\n</ol>\n<p>If every one of those worked and made sense, you are ready for Module 1.</p>\n<h2>7. Safety recap</h2>\n<ul>\n<li>Only <code>10.13.x.x</code> lab targets. Nothing else. Ever.</li>\n<li>Work on <strong>copies</strong> of evidence; never the original.</li>\n<li>Think before <code>rm -rf</code> and before <code>sudo</code>.</li>\n<li>When in doubt about authorisation, the answer is <strong>stop and ask</strong>.</li>\n</ul>\n<h2>Key takeaways</h2>\n<ul>\n<li>The terminal is where security work actually happens — fluency is the foundation everything else is built on.</li>\n<li><strong>Pipes</strong> (<code>|</code>) chain small tools into powerful one-liners; <code>sort | uniq -c | sort -rn</code> answers \"what's most common?\".</li>\n<li>Know your identity and host at all times (<code>whoami</code>, <code>id</code>, <code>hostname</code>).</li>\n<li><code>find</code>, <code>grep -r</code>, <code>file</code>, <code>strings</code>, <code>ss -tulpn</code>, <code>ps aux</code> and <code>sha256sum</code> are the workhorses you'll reach for again and again.</li>\n<li><strong>Authorisation is the law and the ethic.</strong> Lab targets only.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>You need the five most frequent source IPs in a web log's first column. Write the one-liner.</strong> → <code>awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -5</code>.</li>\n</ol>\n<ol>\n<li><strong><code>ls -l</code> shows <code>-rw-------</code> on <code>id_rsa</code>. Good or bad, and why?</strong> → Good — a private key must be readable only by its owner (<code>600</code>). SSH will refuse a key that others can read.</li>\n</ol>\n<ol>\n<li><strong>What does <code>ss -tulpn</code> tell you, and when is it your first command?</strong> → The listening TCP/UDP ports and the processes behind them — your first command when assessing what a machine exposes to the network.</li>\n</ol>\n<ol>\n<li><strong>Why do forensic examiners run <code>sha256sum</code> before and after handling evidence?</strong> → To prove mathematically that the evidence was not altered — the foundation of chain of custody.</li>\n</ol>\n<ol>\n<li><strong>A colleague asks you to \"just quickly scan\" a partner company's website to check it's secure. Your response?</strong> → No — not without that company's written authorisation. Scanning a third party is an offence under Act 1038, regardless of good intentions.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Shell</strong> — the program that interprets your commands (Bash/Zsh).</li>\n<li><strong>Path (absolute/relative)</strong> — a file's location from <code>/</code> or from where you are.</li>\n<li><strong>Pipe <code>|</code></strong> — send one command's output as the next command's input.</li>\n<li><strong>Redirection <code>&gt;</code> <code>&gt;&gt;</code> <code>2&gt;</code></strong> — send output/errors to a file.</li>\n<li><strong>Permissions (rwx)</strong> — read/write/execute for owner, group, others.</li>\n<li><strong>sudo / root</strong> — run as the all-powerful administrator (uid 0).</li>\n<li><strong>PATH</strong> — the directories the shell searches for commands.</li>\n<li><strong>Hash (sha256)</strong> — a file's unique fingerprint, used to prove integrity.</li>\n</ul>", "sheets": []}, "m1": {"day": 1, "title": "Module 1 — Threat Landscape & Cyber Threat Intelligence", "lesson": "<h1>Module 1 — Threat Landscape &amp; Cyber Threat Intelligence</h1>\n<p><strong>Day 1 · Morning · Hands-on lab: <code>labctl start m1</code></strong></p>\n<p>Before you defend an organisation you have to answer three questions the way an intelligence analyst does: <strong>who</strong> would attack it, <strong>why</strong>, and <strong>how</strong> — and then you learn to gather that understanding first-hand, using the same public sources and tools an attacker uses against you. This module takes you from the theory of threat intelligence to a terminal running real reconnaissance, in one morning.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>place any attack on the Cyber Kill Chain and map its behaviour to MITRE ATT&amp;CK;</li>\n<li>distinguish the four levels of threat intelligence and write to the right one;</li>\n<li>grade a source and a claim, and separate fact from assessment with a stated confidence level;</li>\n<li>run passive DNS and OSINT reconnaissance, read email-authentication records, and turn findings into a defensible threat brief.</li>\n</ul>\n<hr>\n<h2>1. The big picture: intelligence, not alarmism</h2>\n<p>Most organisations react to cyber threats emotionally — a headline appears, a panic follows, money is spent on the wrong thing. <strong>Cyber threat intelligence (CTI)</strong> replaces that with discipline: evidence-led understanding of adversaries, expressed with confidence levels, aimed at a decision.</p>\n<p>Good CTI has three properties. It is <strong>actionable</strong> (it changes a decision), <strong>timely</strong> (it arrives while the decision is still open), and <strong>accurate</strong> (it separates what is known from what is believed). An intelligence product that does not change what someone does is trivia, however interesting.</p>\n<p>Everything you protect reduces to five security properties — <strong>Confidentiality, Integrity, Availability, Authenticity</strong> and <strong>business Continuity</strong>. When an incident lands, the first analytic move is to name which of the five just broke: ransomware breaks <em>availability</em>; a leaked database breaks <em>confidentiality</em>; a forged payment instruction breaks <em>integrity</em> and <em>authenticity</em> at once. Naming the property focuses the response.</p>\n<h2>2. Know your adversary: the threat-actor taxonomy</h2>\n<p>Attacks come from people with motives, resources and patience that differ wildly. Defending a rural clinic and defending the Bank of Ghana are different problems because the adversaries are different.</p>\n<table><thead><tr><th>Actor</th><th>Motivation</th><th>Typical resourcing</th><th>What they do</th></tr></thead><tbody><tr><td>Organised cybercrime</td><td>Money</td><td>High, professionalised</td><td>Ransomware, BEC, fraud, data theft-for-sale</td></tr><tr><td>Nation-state / APT</td><td>Espionage, disruption, strategic advantage</td><td>Very high, patient (months–years)</td><td>Long-dwell intrusions, supply-chain, sabotage</td></tr><tr><td>Hacktivists</td><td>Ideology, publicity</td><td>Low–medium</td><td>Defacement, data leaks, DDoS</td></tr><tr><td>Insiders</td><td>Grievance, greed, or simple carelessness</td><td>Native access already</td><td>Data exfiltration, sabotage, accidental exposure</td></tr><tr><td>Opportunists (\"script kiddies\")</td><td>Curiosity, notoriety</td><td>Low, using others' tools</td><td>Mass-scan the internet and hit whatever is exposed</td></tr></tbody></table>\n<p>Two sobering truths. First, <strong>organised crime is the dominant threat to West African institutions</strong> — the money is in fraud and ransomware, not espionage. Second, you become a target simply by being reachable: opportunists scan the entire IPv4 internet continuously, so an exposed service in Accra is found in hours, by someone who never heard of you and does not care who you are.</p>\n<h2>3. The frameworks professionals actually use</h2>\n<p>Analysts do not improvise vocabulary. Four models give the whole field a shared, precise language. Learn them; you will use them all week.</p>\n<p><strong>The Cyber Kill Chain (Lockheed Martin)</strong> describes an intrusion as seven stages: <em>Reconnaissance → Weaponization → Delivery → Exploitation → Installation → Command &amp; Control → Actions on Objectives.</em> Its value is defensive: the earlier in the chain you detect and break it, the cheaper the incident. Reconnaissance — this module — is stage one, and the only stage that happens entirely outside your walls.</p>\n<p><strong>MITRE ATT&amp;CK</strong> is the modern, granular catalogue of real-world adversary behaviour, organised as <em>tactics</em> (the goal, e.g. <code>TA0043 Reconnaissance</code>) and <em>techniques</em> (the method, e.g. <code>T1590 Gather Victim Network Information</code>). When you write \"the actor used <code>T1566</code> (Phishing) for initial access\", any defender on earth knows exactly what you mean. ATT&amp;CK is the lingua franca of CTI.</p>\n<p><strong>The Diamond Model</strong> frames every intrusion event as four linked vertices — <strong>Adversary, Capability, Infrastructure, Victim</strong>. It is how you pivot: from a malicious <em>infrastructure</em> (a domain, an IP) you reason toward the <em>adversary</em> and their other <em>capabilities</em>.</p>\n<p><strong>The Pyramid of Pain (David Bianco)</strong> ranks indicators by how much it <em>hurts the attacker</em> when you block them. From easiest-to-change (least pain) to hardest: <em>hash values → IP addresses → domain names → host/network artefacts → tools → TTPs.</em> Blocking a file hash is trivial for the attacker to evade (recompile); forcing them to abandon their <em>techniques</em> is agony. Good intelligence pushes your defence up the pyramid — away from brittle indicators, toward behaviour.</p>\n<h2>4. IOCs vs IOAs, and the four levels of intelligence</h2>\n<p>An <strong>Indicator of Compromise (IOC)</strong> is forensic evidence that something <em>has happened</em> — a known-bad IP, a file hash, a C2 domain. An <strong>Indicator of Attack (IOA)</strong> describes behaviour <em>as it unfolds</em> — \"a process spawned PowerShell which opened a network connection\". IOCs are backward-looking and brittle (bottom of the pyramid); IOAs are behavioural and durable (top). Mature detection leans on IOAs.</p>\n<p>Intelligence is also written for four different audiences, and the commonest failure is pitching it to the wrong one:</p>\n<ul>\n<li><strong>Strategic</strong> — for the board: trends, risk, business impact. No jargon.</li>\n<li><strong>Operational</strong> — for security leadership: who is targeting our sector, and how.</li>\n<li><strong>Tactical</strong> — for defenders: the TTPs to hunt and the controls to deploy.</li>\n<li><strong>Technical</strong> — for the SOC/tooling: the specific IOCs to block.</li>\n</ul>\n<h2>5. Grade your sources and your claims — never state a hypothesis as fact</h2>\n<p>Professionals attach confidence to every claim. A lightweight version of the <strong>Admiralty (NATO) system</strong> grades the <em>source reliability</em> (A reliable … F cannot be judged) and the <em>information credibility</em> (1 confirmed … 6 cannot be judged) separately — because a reliable source can still pass on a rumour. In practice you will at minimum tag each finding <strong>High / Medium / Low</strong> confidence and keep <strong>facts</strong> (\"<code>dig</code> returned no DMARC record\") strictly apart from <strong>assessments</strong> (\"we assess spoofing is likely\"). The discipline of writing <em>\"we assess X (medium confidence) because Y\"</em> is what makes you trustworthy to a decision-maker — and defensible afterwards.</p>\n<p>Intelligence is shared in standard formats — <strong>STIX</strong> (the data model) over <strong>TAXII</strong> (the transport) — so machines can exchange IOCs. In Ghana, the national coordination point is <strong>CERT-GH</strong>, under the <strong>Cyber Security Authority (CSA)</strong>, which publishes advisories at <code>csa.gov.gh</code>. Reading them is itself CTI: it tells you what is hitting Ghanaian organisations <em>right now</em>.</p>\n<h2>6. How reconnaissance actually works</h2>\n<p>Recon splits in two. <strong>Passive</strong> reconnaissance touches only <em>public</em> sources — DNS, WHOIS, certificate-transparency logs, search engines, social media, breach dumps — so the target cannot tell you looked. <strong>Active</strong> reconnaissance probes the target's own systems (port scans); it is louder and, without authorisation, illegal. This module is strictly passive. Module 3 is where you go active, and only against the lab range.</p>\n<p>Three tools carry the lab:</p>\n<p><strong><code>dig</code></strong> queries DNS — the internet's address book — and reveals a domain's mail servers (<code>MX</code>), its published anti-spoofing policy (<code>TXT</code> records for SPF and DMARC), its name servers and its addresses.</p>\n<pre><code>dig example.com A +short          # the IPv4 address(es)\ndig example.com MX +short         # who handles its mail\ndig example.com TXT +short        # SPF lives here (v=spf1 ...)\ndig _dmarc.example.com TXT +short # DMARC policy lives here</code></pre>\n<p><strong><code>whois</code></strong> shows who registered a domain and <em>when</em>. A look-alike domain registered three days before a fraudulent invoice is one of the strongest signals in all of fraud investigation.</p>\n<p><strong><code>theHarvester</code></strong> sweeps public sources for a domain's email addresses and host names — the raw material an attacker uses to build a phishing target list. The same output tells a defender exactly who needs the most awareness training.</p>\n<h3>Reading email authentication — the finding that matters most</h3>\n<p>Three DNS-published controls decide whether anyone can forge mail from a domain. Understand them properly; most phishing and all domain-spoofing BEC turns on them.</p>\n<ul>\n<li><strong>SPF</strong> (Sender Policy Framework) lists which servers may send for the domain, as a TXT record ending in a qualifier. <code>-all</code> is a <strong>hard fail</strong> (reject everything else); <code>~all</code> is a <strong>soft fail</strong> (\"probably forged, but deliver anyway\"); <code>?all</code> is neutral and worthless. Example: <code>v=spf1 ip4:41.210.15.21 include:_spf.google.com -all</code>.</li>\n<li><strong>DKIM</strong> (DomainKeys Identified Mail) attaches a cryptographic signature, published at a <em>selector</em> (<code>selector._domainkey.example.com</code>), proving the message was not altered and genuinely came from the domain.</li>\n<li><strong>DMARC</strong> ties them together and sets the <strong>policy</strong>, published at <code>_dmarc.example.com</code>: <code>v=DMARC1; p=reject; rua=mailto:dmarc@example.com</code>. The policy <code>p</code> is the whole game — <code>none</code> (monitor only, no protection), <code>quarantine</code> (send to spam), or <code>reject</code> (refuse outright). Crucially, DMARC also requires <strong>alignment</strong>: the SPF/DKIM-validated domain must match the visible <code>From:</code> domain, which is what actually stops display-name spoofing.</li>\n</ul>\n<p><strong>No DMARC record, or <code>p=none</code>, means the domain is effectively spoofable</strong> — an attacker can send mail that appears to come from it and inboxes will accept it. Publishing <code>p=reject</code> is free and is the single highest-value anti-phishing control an organisation can deploy for its own brand.</p>\n<p>Finally, map what you find to ATT&amp;CK: DNS/network recon is <strong>T1590</strong> (<em>Gather Victim Network Information</em>); harvesting staff emails is <strong>T1589</strong> (<em>Gather Victim Identity Information</em>); probing by sending bait is <strong>T1598</strong> (<em>Phishing for Information</em>).</p>\n<h2>7. Scenarios — how this plays out in the real world</h2>\n<h3>Local (Ghana)</h3>\n<ul>\n<li><strong>GCB Bank BEC (~GHS 2.3 million).</strong> The attack <em>started</em> as pure Module-1 reconnaissance: the criminals profiled the procurement team, registered a look-alike supplier domain weeks ahead, and studied the relationship before a single email was sent. Had anyone run <code>dig</code>/<code>whois</code> against their supplier domains, the missing DMARC and the freshly-registered look-alike would have stood out before the money moved.</li>\n<li><strong>CSSPS disruption, 2022</strong> — a targeted attack on a national school-placement system affected roughly half a million students. A high-visibility public system is a high-value target; reconnaissance of such systems is constant.</li>\n<li><strong>SIM-swap / MoMo fraud wave, 2022–2023</strong> — systematic recon of victims (numbers, names, routines) fed social-engineering of the mobile operators.</li>\n<li><strong>GRA-themed phishing</strong> — mass credential-harvesting that begins with harvesting taxpayer email addresses — textbook <code>T1589</code>.</li>\n</ul>\n<h3>International (well-documented)</h3>\n<ul>\n<li><strong>Bangladesh Bank heist, 2016 (~US$81 million).</strong> Attackers linked to the Lazarus Group spent <em>months</em> on reconnaissance inside the bank's network before issuing fraudulent SWIFT transfers. The theft was the last act of a long, patient recon-and-intrusion campaign — the Kill Chain in full.</li>\n<li><strong>Colonial Pipeline, 2021.</strong> Ransomware (DarkSide) that shut fuel supply to the US east coast began with a <em>single</em> exposed, reused VPN credential with no MFA — a reconnaissance-and-credentials failure, not an exotic exploit.</li>\n<li><strong>Twitter, July 2020.</strong> Attackers social-engineered employees (vishing) after reconnaissance of staff and internal tools, then hijacked high-profile accounts. Human-layer recon, not a software bug.</li>\n<li><strong>Business Email Compromise globally</strong> — the FBI's IC3 attributes well over US$50 billion in exposed losses to BEC between 2013 and 2023, making it one of the costliest categories of cybercrime on earth. Almost every case opens with the reconnaissance you practise here.</li>\n</ul>\n<p>The through-line: <strong>serious attacks begin with reconnaissance</strong>, and most of that reconnaissance is passive and legal — which means a defender can run exactly the same checks and see exactly what the attacker sees, first.</p>\n<h2>8. Writing the threat brief</h2>\n<p>Findings are worthless until a decision-maker can act on them. Structure a brief <strong>BLUF-first</strong> (Bottom Line Up Front): the key judgement and the recommended action in the first two sentences. Then the verified indicators (facts, with sources), then the assessment (hypotheses, each with a confidence level), then recommended actions, and finally an honest statement of what you do <em>not</em> yet know. Write to the audience level (§4). Never bury the decision at the bottom, and never present an assessment as a fact.</p>\n<h2>Ghana in focus</h2>\n<p>CERT-GH advisories (<code>csa.gov.gh</code>) are the single best free intelligence source for the Ghanaian threat picture — they translate the global trends above into \"what is targeting banks, telcos and ministries here, this month\". Building the habit of reading them, and of running passive checks on your <em>own</em> domains before an attacker does, is the practical heart of this module.</p>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Treating <code>~all</code> as protection.</strong> A soft-fail SPF still delivers forged mail; without DMARC <code>p=reject</code>, the domain is spoofable.</li>\n<li><strong>Confusing SPF with DMARC.</strong> SPF authorises senders; only DMARC sets an enforcement policy and demands alignment. You need all three (SPF, DKIM, DMARC).</li>\n<li><strong>Stating hypotheses as facts.</strong> Every assessment carries a confidence level.</li>\n<li><strong>Chasing brittle indicators.</strong> Blocking one hash or IP is bottom-of-pyramid; durable defence targets TTPs.</li>\n<li><strong>Running active tools during \"recon\".</strong> Passive means passive — touching the target's systems can itself be an offence.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m1</code> gives you an isolated DNS server for a fictional organisation and a captured OSINT report. Use <code>dig</code> to pull its MX, SPF and DMARC records, notice the weak <code>~all</code> and the <em>absent</em> DMARC, read the OSINT report for exposed staff, map it to ATT&amp;CK, and write five verified indicators into a one-page threat brief. <code>labctl verify m1</code> grades your findings.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>CTI is <strong>actionable, timely, accurate</strong> intelligence — discipline, not panic.</li>\n<li>Speak in frameworks: <strong>Kill Chain</strong> (where in the intrusion), <strong>ATT&amp;CK</strong> (which technique), <strong>Diamond</strong> (how to pivot), <strong>Pyramid of Pain</strong> (how durable the indicator).</li>\n<li><strong>IOC = what happened; IOA = behaviour now.</strong> Push defence up the pyramid.</li>\n<li>Write to the right <strong>level</strong> (strategic/operational/tactical/technical) and tag <strong>confidence</strong>; keep fact separate from assessment.</li>\n<li><strong>No DMARC / <code>p=none</code> = spoofable.</strong> SPF <code>-all</code> + DKIM + DMARC <code>p=reject</code> is the goal. Recon techniques: <strong>T1590 / T1589 / T1598.</strong></li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>A domain publishes <code>v=spf1 include:_spf.google.com ~all</code> and has no <code>_dmarc</code> record. How exposed is it to spoofing, and why?</strong> → Highly exposed. <code>~all</code> only soft-fails forged mail (still delivered), and with no DMARC there is no policy to reject it and no alignment check — an attacker can send mail that appears to come from the domain and it will land.</li>\n</ol>\n<ol>\n<li><strong>You can block an attacker's file hash, their C2 IP, or force them to change their techniques. Rank these by the Pyramid of Pain.</strong> → Techniques (most pain — hardest to change) &gt; C2 IP &gt; file hash (least pain — trivially recompiled/rotated). Aim your defence as high as you can.</li>\n</ol>\n<ol>\n<li><strong>An IOC vs an IOA — give one of each for a brute-force login.</strong> → IOC: a known-bad source IP seen in the logs (backward-looking). IOA: \"many failed authentications from one source followed by a success\" (behaviour as it happens).</li>\n</ol>\n<ol>\n<li><strong>Which is passive reconnaissance: <code>nmap -sV target</code>, or <code>dig target MX</code>? Why does the distinction matter legally?</strong> → <code>dig</code> (it only reads public DNS; it never touches the target's systems). <code>nmap -sV</code> actively probes the target — active recon, which without written authorisation is an offence under Act 1038.</li>\n</ol>\n<ol>\n<li><strong>You brief the board that \"we assess, with medium confidence, that our supplier domain is being prepared for a spoofing campaign.\" What two things make this a professional statement rather than alarmism?</strong> → It is labelled an <em>assessment</em> (not a fact) and it carries an explicit <em>confidence level</em> — and it would be followed by the facts and recommended action behind it.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>CTI</strong> — cyber threat intelligence: evidence-led understanding of adversaries.</li>\n<li><strong>Cyber Kill Chain</strong> — the 7-stage model of an intrusion (recon → actions).</li>\n<li><strong>MITRE ATT&amp;CK</strong> — catalogue of adversary tactics (<code>TA…</code>) and techniques (<code>T…</code>).</li>\n<li><strong>Diamond Model</strong> — adversary · capability · infrastructure · victim.</li>\n<li><strong>Pyramid of Pain</strong> — indicators ranked by how much blocking them hurts the attacker.</li>\n<li><strong>IOC / IOA</strong> — indicator of compromise (what happened) / of attack (behaviour).</li>\n<li><strong>SPF / DKIM / DMARC</strong> — authorised-sender list / signature / enforcement policy with alignment.</li>\n<li><strong>STIX / TAXII</strong> — the standard data model / transport for sharing intelligence.</li>\n<li><strong>Admiralty grading</strong> — grading source reliability and information credibility separately.</li>\n<li><strong>CERT-GH / CSA</strong> — Ghana's national incident-response team / Cyber Security Authority.</li>\n</ul>", "sheets": [{"name": "m1-threat-intelligence-brief.md", "html": "<h1>Threat Intelligence Brief — Module 1 Deliverable</h1>\n<p><strong>Prepared by:</strong> [your name]  <strong>Date/time:</strong> [YYYY-MM-DD HH:MM] <strong>Subject:</strong> [e.g. Exposure assessment of lab-corp.com.gh] <strong>Classification:</strong> [internal / restricted]</p>\n<blockquote>A good brief separates <strong>fact</strong> from <strong>assessment</strong>, and every assessment</blockquote>\n<blockquote>carries a <strong>confidence level</strong> (low / medium / high). Never state a hypothesis</blockquote>\n<blockquote>as a fact. See <code>labctl learn m1</code>.</blockquote>\n<h2>1. Bottom line up front (BLUF) — 2–3 sentences</h2>\n<p>[What a decision-maker must know first: the key finding and the recommended immediate action.]</p>\n<h2>2. Verified indicators (facts)</h2>\n<table><thead><tr><th>#</th><th>Indicator</th><th>Source / how verified</th><th>ATT&amp;CK (if any)</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> No DMARC record published for the domain</td><td><code>dig TXT _dmarc.&lt;domain&gt;</code> → NXDOMAIN</td><td>T1590</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td></tr></tbody></table>\n<h2>3. Assessment (hypotheses — label confidence)</h2>\n<ul>\n<li>[Finding] → <em>We assess …</em> <strong>[confidence: low/med/high]</strong> because [reasoning].</li>\n<li>[FILL IN]</li>\n</ul>\n<h2>4. Attacker's likely next step</h2>\n<p>[Given the exposure, what would an attacker do? e.g. spoof the domain to phish the finance team, since SPF is weak and DMARC absent.]</p>\n<h2>5. Recommended immediate actions</h2>\n<ol>\n<li>[e.g. Publish a DMARC record with p=reject — free, blocks domain spoofing]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>6. What we do NOT yet know</h2>\n<p>[Be explicit about gaps — this is what separates intelligence from guessing.]</p>"}]}, "m2": {"day": 1, "title": "Module 2 — Institutional Cyber Risk & Digital Resilience", "lesson": "<h1>Module 2 — Institutional Cyber Risk &amp; Digital Resilience</h1>\n<p><strong>Day 1 · Afternoon · Leadership module (no Kali lab — you build a risk register)</strong></p>\n<p>In one sentence: cyber risk is not an \"IT problem\" — it is business risk that happens to involve computers, and this module teaches you to measure it, own it, and decide what to do about it.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>express a cyber threat as a clear business-risk statement;</li>\n<li>score risk by likelihood and impact, and tell inherent from residual risk;</li>\n<li>place controls against the six NIST CSF 2.0 functions;</li>\n<li>build a risk register that a board would actually act on.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>A <strong>risk</strong> is the chance that something bad happens <em>and</em> how much it would hurt. In cyber, the \"something bad\" is a threat exploiting a weakness. We write it as a sentence anyone can understand:</p>\n<blockquote>IF <em>[a threat]</em> exploits <em>[a vulnerability]</em>, THEN the institution faces</blockquote>\n<blockquote><em>[a business consequence]</em>.</blockquote>\n<p>For example: <em>IF an attacker exploits our unpatched remote-access server, THEN citizen records could be stolen and we face DPC penalties and public trust loss.</em> Notice the consequence is in <strong>business terms</strong> — money, trust, legal, safety — not \"a server gets owned\". Boards fund consequences they understand.</p>\n<p>Two numbers turn a scenario into a comparable risk:</p>\n<ul>\n<li><strong>Likelihood</strong> — how probable is it? (e.g., 1–5)</li>\n<li><strong>Impact</strong> — how bad if it happens? (e.g., 1–5)</li>\n</ul>\n<p>Multiply (or plot on a grid) and you get a <strong>risk rating</strong> you can rank against every other risk. That ranking is the whole point: you cannot fix everything, so you fix the biggest risks first.</p>\n<p>Then distinguish two states of every risk:</p>\n<ul>\n<li><strong>Inherent risk</strong> — how bad it is with <em>no controls</em>.</li>\n<li><strong>Residual risk</strong> — what's <em>left</em> after your controls are in place.</li>\n</ul>\n<p>The gap between them is the value your controls deliver. Residual risk is what leadership must consciously <strong>accept, or reduce further</strong>.</p>\n<h2>An analogy</h2>\n<p>Think of insuring a building against fire. You don't start by buying a sprinkler for every cupboard. You ask: how likely is a fire, and how bad would it be? A paper archive (high impact) near an old fuse box (high likelihood) jumps to the top. You then choose: install sprinklers (<strong>mitigate</strong>), buy insurance (<strong>transfer</strong>), stop storing paper there (<strong>avoid</strong>), or decide the risk is small enough to live with and write that decision down (<strong>accept</strong>). Cyber risk treatment is exactly these four choices.</p>\n<h2>How it actually works</h2>\n<p>The four <strong>risk treatments</strong> — memorise them:</p>\n<ul>\n<li><strong>Mitigate</strong> — add controls to reduce likelihood or impact (patch, MFA, backups).</li>\n<li><strong>Transfer</strong> — shift the cost to someone else (cyber insurance, a contract clause).</li>\n<li><strong>Avoid</strong> — stop doing the risky thing (decommission the exposed service).</li>\n<li><strong>Accept</strong> — knowingly live with it — but <em>only</em> with a named owner and a review date. <strong>Acceptance without accountability is negligence.</strong></li>\n</ul>\n<p>Controls are organised by the <strong>NIST CSF 2.0</strong> framework — six functions that cover the whole lifecycle:</p>\n<table><thead><tr><th>Function</th><th>Plain meaning</th><th>Example</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Who's accountable; strategy &amp; policy</td><td>Board approves a cyber-risk policy and budget</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Know your assets and risks</td><td>A current asset inventory exists</td></tr><tr><td><strong>PROTECT</strong></td><td>Put up safeguards</td><td>MFA on all accounts; staff trained</td></tr><tr><td><strong>DETECT</strong></td><td>Notice when something's wrong</td><td>SIEM alerts reviewed daily</td></tr><tr><td><strong>RESPOND</strong></td><td>Act on an incident</td><td>A tested incident plan; who calls whom</td></tr><tr><td><strong>RECOVER</strong></td><td>Get back to normal, learn</td><td>Backups tested monthly</td></tr></tbody></table>\n<p>GOVERN is new in CSF 2.0 and it is the big message: cybersecurity is now a <strong>board-level duty</strong>, not something delegated to \"the IT guy\".</p>\n<p>Finally, two service-level numbers leaders must set <em>per critical service</em>:</p>\n<ul>\n<li><strong>MTD / RTO</strong> — the longest a service can be down before real harm (recovery <em>time</em> objective).</li>\n<li><strong>MADL / RPO</strong> — the most data you can afford to lose (recovery <em>point</em> objective — how far back your last good backup is).</li>\n</ul>\n<h2>Ghana in focus</h2>\n<p>The <strong>CSSPS disruption in 2022</strong> affected around <strong>500,000 students</strong> when a core placement system went down. Frame it as institutional risk: the <em>likelihood</em> of a targeted attack on a high-visibility national system was real; the <em>impact</em> — half a million families unable to confirm school placements — was severe across availability, reputation and public trust. Who <em>owned</em> that risk before it happened? Was there an RTO for the service? Those are the questions a risk register forces you to answer <em>beforehand</em>, not during the crisis.</p>\n<p>Under the Cybersecurity Act 2020 (Act 1038), the CSA can <strong>request your risk documentation</strong>. A current, owned risk register is not just good practice — it is something a regulator may ask to see.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>A ranked risk register tells leadership <em>exactly</em> where the next cedi of security budget should go.</li>\n<li>Named owners turn a wish list into accountability.</li>\n<li>RTO/RPO agreed in advance prevent the paralysing \"how long until we're back?\" argument during an outage.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>A register with no owners.</strong> It's a wish list, not a risk register.</li>\n<li><strong>Scoring by gut feel with no evidence.</strong> Tie each score to something real (a scan result, an incident, a missing control).</li>\n<li><strong>Treating all risks equally.</strong> The point is to rank and triage.</li>\n<li><strong>\"Accepting\" risk silently.</strong> Every accepted risk needs a name and a date.</li>\n</ul>\n<h2>Put it to work</h2>\n<p>In the course you build an <strong>eight-entry risk register</strong> for a multi-site institution with cloud records, payment systems and an unpatched remote-access service: write each risk as an IF/THEN statement, score inherent and residual risk, assign an owner, map gaps to the six CSF functions, and propose a 90-day treatment backlog. This feeds directly into the Module 10 capstone and the Module 9 board memo.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>Cyber risk = <strong>likelihood × impact</strong>, expressed as a business consequence.</li>\n<li>Four treatments: <strong>mitigate, transfer, avoid, accept</strong> — accept only with an owner + date.</li>\n<li>NIST CSF 2.0 has six functions; <strong>GOVERN</strong> makes it a board duty.</li>\n<li>Set <strong>RTO</strong> (max downtime) and <strong>RPO</strong> (max data loss) per critical service.</li>\n<li>A register without <strong>named owners</strong> is worthless.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>Write this as a risk statement: the payroll server hasn't been patched in a year.</strong> → <em>IF an attacker exploits the unpatched payroll server, THEN staff salary data could be stolen and we face DPC penalties and payroll disruption.</em> (Threat → vulnerability → business consequence.)</li>\n</ol>\n<ol>\n<li><strong>A risk is scored likelihood 2, impact 5. Another is 4×2. Which gets attention first, and why isn't it obvious?</strong> → Both rate 8–10, so neither dominates on the number alone. Impact-5 (a catastrophic but rarer event) often wins because the <em>consequence</em> is unacceptable even if unlikely — judgement, not just arithmetic.</li>\n</ol>\n<ol>\n<li><strong>You buy cyber insurance for a risk. Which treatment is that?</strong> → <em>Transfer</em> — you shift the financial cost, though the operational pain remains, so it's rarely enough on its own.</li>\n</ol>\n<ol>\n<li><strong>Which NIST CSF 2.0 function is new, and what does it signal?</strong> → <em>GOVERN</em> — it signals that cybersecurity accountability sits with the board, not just IT.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Inherent / residual risk</strong> — risk before / after controls.</li>\n<li><strong>Risk appetite / tolerance</strong> — how much risk the organisation will accept.</li>\n<li><strong>RTO / RPO</strong> — max acceptable downtime / data loss per service.</li>\n<li><strong>NIST CSF 2.0</strong> — the six-function cybersecurity framework (Govern, Identify, Protect, Detect, Respond, Recover).</li>\n<li><strong>Risk owner</strong> — the named person accountable for a specific risk.</li>\n</ul>", "sheets": [{"name": "m2-csf-profile.md", "html": "<h1>NIST CSF 2.0 Current / Target Profile — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>Rate your institution against each of the six CSF 2.0 functions on a 0–4</blockquote>\n<blockquote>maturity scale, then set a realistic target and note the gap action. See</blockquote>\n<blockquote><code>labctl learn m2</code>.</blockquote>\n<p>Maturity scale: <strong>0</strong> none · <strong>1</strong> ad-hoc · <strong>2</strong> developing · <strong>3</strong> defined &amp; repeatable · <strong>4</strong> managed &amp; measured.</p>\n<table><thead><tr><th>Function</th><th>What good looks like</th><th>Current (0–4)</th><th>Target (0–4)</th><th>Priority gap action</th></tr></thead><tbody><tr><td><strong>GOVERN</strong></td><td>Board-approved cyber policy, risk appetite, named accountability &amp; budget</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>IDENTIFY</strong></td><td>Current asset inventory; risks &amp; dependencies documented</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>PROTECT</strong></td><td>MFA everywhere, patching, email filtering, staff training</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>DETECT</strong></td><td>SIEM/monitoring, alerts reviewed daily, anomaly detection</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RESPOND</strong></td><td>Tested incident plan, defined roles, escalation paths</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr><tr><td><strong>RECOVER</strong></td><td>Backups tested monthly (3-2-1), recovery priorities set</td><td>[ ]</td><td>[ ]</td><td>[FILL IN]</td></tr></tbody></table>\n<h2>Narrative summary (3–5 sentences for leadership)</h2>\n<p>[Where is the institution strongest and weakest? Which function, if improved, reduces the most risk? What is the single most important investment?]</p>\n<h2>The honest GOVERN check</h2>\n<ul>\n<li>Does the board have a standing cybersecurity agenda item? [yes/no]</li>\n<li>Is there a named, resourced person accountable for cyber risk? [who]</li>\n<li>When was the cyber-risk policy last approved? [date]</li>\n</ul>"}, {"name": "m2-cyber-risk-register.md", "html": "<h1>Cyber Risk Register — Module 2 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD] <strong>Review cycle:</strong> [e.g. quarterly]</p>\n<blockquote>How to use this. Fill in at least <strong>eight</strong> risks. Write each as an IF/THEN</blockquote>\n<blockquote>statement in business terms. Score <strong>Likelihood (L)</strong> and <strong>Impact (I)</strong> 1–5.</blockquote>\n<blockquote><strong>Inherent</strong> = score with no controls; <strong>Residual</strong> = score after the controls</blockquote>\n<blockquote>you list. Every risk needs a named <strong>Owner</strong>, a <strong>Treatment</strong> (Mitigate /</blockquote>\n<blockquote>Transfer / Avoid / Accept) and a <strong>Review date</strong>. See <code>labctl learn m2</code>.</blockquote>\n<p>Scoring key — Likelihood: 1 rare · 2 unlikely · 3 possible · 4 likely · 5 almost certain. Impact: 1 negligible · 2 minor · 3 moderate · 4 major · 5 severe. Rating = L × I (1–25).</p>\n<table><thead><tr><th>#</th><th>Risk statement (IF threat exploits vulnerability THEN business consequence)</th><th>Inherent L×I</th><th>Existing / planned controls</th><th>Residual L×I</th><th>Treatment</th><th>Owner</th><th>Review</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> IF an attacker exploits our internet-facing unpatched VPN THEN citizen records are stolen and we face DPC penalties + loss of trust</td><td>4×5 = 20</td><td>Patch SLA, MFA on VPN, monitoring</td><td>2×5 = 10</td><td>Mitigate</td><td>Head of IT</td><td>2026-01-15</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]×[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>8</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table>\n<h2>Top 3 risks by residual rating (what leadership must act on first)</h2>\n<ol>\n<li>[risk # and one line on the decision needed]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>Accepted risks (must have owner + review date)</h2>\n<ul>\n<li>[risk # — why it is being accepted, by whom, review date] — <em>acceptance without accountability is negligence.</em></li>\n</ul>\n<h2>90-day treatment backlog</h2>\n<table><thead><tr><th>Action</th><th>Addresses risk #</th><th>Owner</th><th>Target date</th><th>Cost / effort</th></tr></thead><tbody><tr><td>[FILL IN]</td><td></td><td></td><td></td><td></td></tr></tbody></table>"}]}, "m3": {"day": 2, "title": "Module 3 — Network, Endpoint & Identity Security", "lesson": "<h1>Module 3 — Network, Endpoint &amp; Identity Security</h1>\n<p><strong>Day 2 · Morning · Hands-on lab: <code>labctl start m3</code></strong></p>\n<p>In one sentence: you learn to see a network the way both an attacker and a defender do — what's exposed, what's talking to what, and which conversation is the compromise hiding in plain sight.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>map a network with Nmap: live hosts, open ports, running services;</li>\n<li>read captured traffic in Wireshark and spot command-and-control beaconing;</li>\n<li>explain why segmentation, DNS monitoring and MFA are the controls that matter;</li>\n<li>map what you find to MITRE ATT&amp;CK.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p>A network is just computers having conversations. Every conversation uses <strong>ports</strong> (numbered doors) and <strong>protocols</strong> (languages). Web traffic uses port 80/443 (HTTP/HTTPS), remote login uses 22 (SSH) or 3389 (RDP), mail uses 25, DNS uses 53. An attacker's first question on your network is simple: <em>which doors are open, and what's standing behind them?</em></p>\n<p><strong>Active scanning</strong> answers that. Unlike the passive recon of Module 1, here you send packets to the targets and watch what comes back. That's why it is done <strong>only</strong> on networks you own or are authorised to test — in this course, only the isolated <code>10.13.3.0/24</code> range.</p>\n<p>Two instruments do most of the work:</p>\n<ul>\n<li><strong>Nmap</strong> — the scanner. It finds live hosts, open ports, the software and version behind each port, and can even guess the operating system.</li>\n<li><strong>Wireshark</strong> (and its command-line cousin <strong>tcpdump</strong>) — the microscope. It shows you the actual packets so you can read a conversation and judge whether it's normal or malicious.</li>\n</ul>\n<p>The <strong>identity layer</strong> sits on top: it's not enough to know <em>what</em> connects — you must know <em>who</em>. That's authentication (proving identity) and authorisation (what you're allowed to do). Weak identity is how most breaches escalate.</p>\n<h2>An analogy</h2>\n<p>Nmap is walking the corridors of a building at night, trying every door handle and noting which rooms are unlocked and what's inside (\"this one's a server room, this one's an old photocopier running Windows XP\"). Wireshark is then putting a wiretap on the phone line and <em>listening to the calls</em> — most are routine, but one extension dials the same foreign number every 30 seconds, at exactly the same interval, all night. No human works like that. That regular \"heartbeat\" is malware checking in with its controller.</p>\n<h2>How it actually works</h2>\n<p>A typical Nmap workflow, from quiet to loud:</p>\n<ul>\n<li><code>nmap -sn 10.13.3.0/24</code> — <em>host discovery</em>: who's alive? (No port scan.)</li>\n<li><code>nmap -sV -p 21,22,80,443,3389 10.13.3.0/24</code> — <em>service/version detection</em>: what's running, and is it old?</li>\n<li><code>nmap --script=http-title ...</code> — run a script to grab extra detail (here, web page titles — handy for spotting an unauthenticated admin panel).</li>\n</ul>\n<p>What you're hunting for: things that <strong>shouldn't be exposed</strong> — RDP (3389) open to everyone, unencrypted FTP (21), an admin console with no login. Each is a door left wide open.</p>\n<p>Then the traffic. In Wireshark you apply a <strong>display filter</strong> (e.g. <code>dns</code>) to cut the noise. <strong>Command-and-control (C2) beaconing</strong> is the classic giveaway: a compromised host repeatedly contacting the same external domain at a <strong>fixed interval</strong>. The regularity is the tell — legitimate traffic is bursty and irregular; malware is a metronome. Roughly <strong>90% of malware uses DNS</strong> to find its controller, which is why DNS monitoring is such a powerful early warning.</p>\n<p>Map the findings to <strong>MITRE ATT&amp;CK</strong>: network scanning is <strong>T1046</strong> (Network Service Discovery); the beaconing is <strong>T1071</strong> (Application Layer Protocol), sub-technique <strong>T1071.004</strong> for DNS.</p>\n<p>The four controls that answer all of this:</p>\n<ul>\n<li><strong>Network segmentation</strong> — a flat network lets an attacker roam; segments contain them.</li>\n<li><strong>DNS monitoring</strong> — catches the beacon.</li>\n<li><strong>MFA on remote access</strong> — stops a stolen RDP/SSH password being enough.</li>\n<li><strong>A firewall rule</strong> — close 3389 to the internet; put it behind a VPN.</li>\n</ul>\n<h2>Ghana in focus</h2>\n<p>Many West African breaches begin with an exposed remote-access service — an RDP port left open \"temporarily\" for a vendor, then forgotten. Automated attackers scan the entire internet continuously; an exposed 3389 in Accra is found within hours, not weeks. The lesson every Ghanaian IT team should internalise: <em>scan your own network monthly</em> with the very same Nmap, before someone else does. Finding your own open RDP is free; having it found for you costs a ransom.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>You cannot protect what you cannot see — scanning gives you the real inventory, which is almost always different from the one on paper.</li>\n<li>Reading traffic turns \"the antivirus is quiet\" into actual evidence of what a host is doing.</li>\n<li>Catching a beacon early is the difference between an incident and a breach.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Scanning outside your authorisation.</strong> Nmap against a network you don't own is an offence under Act 1038. In the lab: only <code>10.13.3.x</code>.</li>\n<li><strong>Confusing capture and display filters</strong> in Wireshark — a capture filter decides what's recorded; a display filter decides what's shown.</li>\n<li><strong>Dismissing \"small\" open ports.</strong> An unauthenticated admin panel on an obscure port is a full compromise waiting to happen.</li>\n<li><strong>Treating encrypted = safe.</strong> TLS hides content, not the <em>pattern</em>; beaconing is visible even when the payload isn't.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m3</code> brings up a four-host enterprise subnet (web admin, FTP, SSH, legacy RDP) plus a packet capture. Discover the hosts, find the exposed services, then open the capture in Wireshark, filter to <code>dns</code>, and identify the C2 domain and its beacon interval. <code>labctl verify m3</code> grades each finding.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Ports are doors, protocols are languages</strong>; Nmap finds the open doors.</li>\n<li>Active scanning is <strong>authorised-targets-only</strong>.</li>\n<li><strong>C2 beaconing = same destination, fixed interval</strong> — regularity is the tell.</li>\n<li>Most malware phones home over <strong>DNS</strong> — monitor it.</li>\n<li>Controls: <strong>segmentation, DNS monitoring, MFA on remote access, firewall rules.</strong> ATT&amp;CK: <strong>T1046</strong>, <strong>T1071</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong><code>nmap -sn</code> versus <code>nmap -sV</code> — what's the difference?</strong> → <code>-sn</code> only discovers which hosts are alive (no port scan); <code>-sV</code> scans ports and identifies the service and version behind each open one.</li>\n</ol>\n<ol>\n<li><strong>In a capture you see one host query <code>cdn-update.ddns.net</code> every 60 seconds, all night. Benign or suspicious, and why?</strong> → Suspicious: the fixed, regular interval is classic C2 beaconing. Real user traffic is irregular.</li>\n</ol>\n<ol>\n<li><strong>RDP (3389) is open to the internet. Name two controls.</strong> → Put it behind a VPN / close the port at the firewall, and require MFA on the account. (Network segmentation also helps.)</li>\n</ol>\n<ol>\n<li><strong>Which ATT&amp;CK technique covers an internal host scanning the network?</strong> → T1046, Network Service Discovery.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Port</strong> — a numbered endpoint for a network service (e.g. 22 = SSH).</li>\n<li><strong>Nmap</strong> — network scanner for host/port/service discovery.</li>\n<li><strong>Wireshark / tcpdump</strong> — packet analysers (GUI / CLI).</li>\n<li><strong>C2 (command and control)</strong> — the channel malware uses to reach its operator.</li>\n<li><strong>Beaconing</strong> — regular, interval-based check-ins from malware to C2.</li>\n<li><strong>Segmentation</strong> — dividing a network so a breach in one part can't reach all.</li>\n</ul>", "sheets": [{"name": "m3-traffic-analysis-findings.md", "html": "<h1>Traffic Analysis Findings &amp; Control Design — Module 3 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Network:</strong> [e.g. 10.13.3.0/24]</p>\n<blockquote>Record what you found on the network and the capture, then design the controls</blockquote>\n<blockquote>that close each gap. See <code>labctl learn m3</code>.</blockquote>\n<h2>1. Host &amp; service inventory (Nmap)</h2>\n<table><thead><tr><th>Host IP</th><th>Open ports / services</th><th>Concern</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[e.g. unauth admin panel / cleartext FTP / exposed RDP]</td></tr><tr><td>[ ]</td><td></td><td></td></tr><tr><td>[ ]</td><td></td><td></td></tr></tbody></table>\n<h2>2. Suspicious traffic (Wireshark / tcpdump)</h2>\n<ul>\n<li>Infected host IP: [ ]</li>\n<li>C2 domain observed: [ ]</li>\n<li>Beacon interval: [ ] seconds — <em>why this looks like beaconing:</em> [ ]</li>\n<li>Other indicators: [ ]</li>\n</ul>\n<p><strong>ATT&amp;CK:</strong> T1046 (Network Service Discovery), T1071 (Application Layer Protocol).</p>\n<h2>3. Control design (map each gap to a fix, with priority)</h2>\n<table><thead><tr><th>#</th><th>Finding</th><th>Recommended control</th><th>Priority (H/M/L)</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> RDP 3389 exposed</td><td>Close port / VPN + MFA</td><td>H</td><td>IT</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[e.g. network segmentation]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td>[e.g. DNS monitoring]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td></tr></tbody></table>\n<h2>4. One-line summary for leadership</h2>\n<p>[Business impact of what's exposed, and the single most urgent fix.]</p>"}]}, "m4": {"day": 2, "title": "Module 4 — Vulnerability Management & SOC Operations", "lesson": "<h1>Module 4 — Vulnerability Management &amp; SOC Operations</h1>\n<p><strong>Day 2 · Afternoon · Hands-on lab: <code>labctl start m4</code></strong></p>\n<p>In one sentence: finding weaknesses is easy; the skill is deciding which of the hundreds you'll find actually matter, and then recognising — from a flood of alerts — the moment one is being exploited.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>scan a web server with Nikto and prioritise the findings sensibly;</li>\n<li>explain why weak passwords fall to Hydra and John — and why MFA is the fix;</li>\n<li>triage SIEM alerts, separate signal from noise, and correlate them into one story.</li>\n</ul>\n<hr>\n<h2>The big picture</h2>\n<p><strong>Vulnerability management</strong> is a cycle, not a one-off scan: <em>find → prioritise → fix → verify → repeat.</em> Scanning is the easy part; a scanner will hand you hundreds of findings. The real work is <strong>prioritisation</strong>, because you can't fix everything at once.</p>\n<p>A good priority score combines four things:</p>\n<ul>\n<li><strong>CVSS</strong> — a 0–10 severity score for the vulnerability itself.</li>\n<li><strong>Exploitation status</strong> — is it being actively exploited <em>right now</em>? The free <strong>CISA KEV</strong> (Known Exploited Vulnerabilities) catalogue tells you.</li>\n<li><strong>Exposure</strong> — is it internet-facing or buried internally?</li>\n<li><strong>Asset criticality</strong> — is it your payroll database or a test box?</li>\n</ul>\n<p>A medium-CVSS bug that is internet-facing, on a critical system, and listed in KEV beats a \"critical\" CVSS bug that's internal and never exploited. Context wins.</p>\n<p>The <strong>SOC (Security Operations Centre)</strong> is the other half: the team (or person) watching the alerts. Their core skill is <strong>triage</strong> — quickly deciding, for each alert, true positive / false positive / needs investigation, and escalating the ones that matter.</p>\n<h2>An analogy</h2>\n<p>A vulnerability scan is a home inspector's report: it lists <em>every</em> defect, from \"roof could collapse\" to \"one loose cupboard hinge\". If you treat them all as equally urgent you'll fix hinges while the roof caves in. Prioritisation is reading that report like an adult: roof first.</p>\n<p>SOC triage is a hospital emergency room. Patients (alerts) arrive constantly. You can't deep-treat everyone at once, so you <em>triage</em>: this one's critical (real attack), this one's fine (false alarm), this one needs tests (investigate). Alert fatigue is the tired nurse who starts waving everyone through — which is exactly when the real emergency slips past.</p>\n<h2>How it actually works</h2>\n<p><strong>Nikto</strong> scans web servers specifically — it looks for dangerous files, leftover backups, outdated software and missing security headers. Where Nmap tells you <em>port 80 is open</em>, Nikto tells you <em>what's wrong with what's running on it</em>: an exposed <code>/admin/</code> panel, a <code>config.php.bak</code> leaking database credentials, a <code>phpinfo.php</code> spilling server internals.</p>\n<p><strong>Password attacks</strong> come in two flavours, and the lab shows both:</p>\n<ul>\n<li><strong>Hydra</strong> — <em>online</em> guessing: it tries username/password pairs against a live service (e.g. SSH). Noisy, slow, but deadly against weak passwords. A \"password-spray\" tries one common password across many accounts to dodge lockouts.</li>\n<li><strong>John the Ripper</strong> — <em>offline</em> cracking: given stolen password <em>hashes</em>, it computes guesses locally at huge speed. No network, no lockout, no limit.</li>\n</ul>\n<p>The point of both is not \"how to hack\" — it's <strong>why controls are mandatory</strong>: a password in a wordlist is already broken, which is why length, uniqueness and especially <strong>MFA</strong> matter. MFA means a cracked password alone isn't enough.</p>\n<p><strong>SIEM triage</strong> ties it together. A SIEM (here, <strong>Wazuh</strong>) collects logs from many systems and raises <strong>alerts</strong> with a severity <em>level</em> and often an ATT&amp;CK mapping. Triage workflow: sort by severity → add context → decide TP/FP/investigate → escalate or close. The master skill is <strong>correlation</strong>: ten alerts aren't ten problems — they're often one attack seen from ten angles. Failed SSH logins (brute force) + a port scan + a <em>successful</em> login, all from the <em>same source IP</em>, is not three events. It's one intrusion, and the attacker is now inside.</p>\n<p>Brute force maps to ATT&amp;CK <strong>T1110</strong>.</p>\n<h2>Ghana in focus</h2>\n<p>Picture a SOC analyst at a Ghanaian bank at 2 a.m. Wazuh shows dozens of \"failed SSH login\" alerts — individually low severity, easy to ignore when you're tired. But one source IP is behind all of them, and minutes later there's an \"authentication success\" from that same IP, then a \"sudo to root\". Read individually: noise. Correlated: a brute-force that <em>succeeded</em> and escalated to admin. The institutions that get breached aren't the ones without alerts — they had the alerts. They're the ones who didn't correlate them in time.</p>\n<h2>Why it matters</h2>\n<ul>\n<li>Prioritisation turns an unmanageable scan report into a short, fundable remediation list.</li>\n<li>Understanding password cracking is the argument that finally gets MFA approved.</li>\n<li>Correlation is what converts raw alerts into an actionable incident before the damage is done.</li>\n</ul>\n<h2>Common mistakes</h2>\n<ul>\n<li><strong>Chasing CVSS alone.</strong> A 9.8 nobody can reach matters less than a 6.5 on your internet-facing payroll box that's in KEV.</li>\n<li><strong>Using Hydra/John outside the lab.</strong> Only the authorised lab targets and the provided hash file — anywhere else is a crime.</li>\n<li><strong>Closing alerts to clear the queue.</strong> \"Mark as resolved\" without investigating is how breaches hide.</li>\n<li><strong>Ignoring low-severity floods.</strong> Volume <em>is</em> a signal; many low alerts from one source can be a single high-severity attack.</li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m4</code> gives you a leaky web server (for Nikto), an SSH box with a weak account (authorised Hydra target), a hash file (for John), and a realistic Wazuh alert feed. Scan, crack, then triage the alerts with <code>jq</code> to find the attacker's IP, the top severity, and whether they got in. <code>labctl verify m4</code> grades it.</p>\n<blockquote>On Wazuh in this course: you triage a realistic alert feed rather than run a</blockquote>\n<blockquote>full SIEM stack, because a complete Wazuh deployment needs far more RAM than a</blockquote>\n<blockquote>classroom laptop has. The skill — triage and correlation — is identical.</blockquote>\n<h2>Key takeaways</h2>\n<ul>\n<li>Vulnerability management = <strong>find → prioritise → fix → verify</strong>, looping.</li>\n<li>Prioritise by <strong>CVSS + KEV + exposure + asset criticality</strong>, not CVSS alone.</li>\n<li><strong>Hydra</strong> = online guessing; <strong>John</strong> = offline hash cracking; <strong>MFA</strong> defeats both.</li>\n<li>SIEM triage = <strong>TP / FP / investigate</strong>; the real skill is <strong>correlation</strong>.</li>\n<li>Brute force is ATT&amp;CK <strong>T1110</strong>.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>Two findings: CVSS 9.1 on an internal test server (not in KEV); CVSS 6.8 on your public payment portal, listed in CISA KEV. Which first?</strong> → The 6.8 — it's internet-facing, on a critical asset, and <em>actively exploited</em>. Context beats raw score.</li>\n</ol>\n<ol>\n<li><strong>Hydra vs John — what's the core difference?</strong> → Hydra guesses against a live service (online); John cracks stolen hashes locally (offline). John has no lockout or rate limit.</li>\n</ol>\n<ol>\n<li><strong>You see failed logins, a port scan and a successful login — all from 10.0.0.9. How many incidents?</strong> → One. Correlate by source IP: it's a single intrusion that succeeded, not three separate events.</li>\n</ol>\n<ol>\n<li><strong>A cracked password is bad — what single control makes it insufficient on its own?</strong> → MFA (multi-factor authentication).</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>CVSS</strong> — 0–10 severity score for a vulnerability.</li>\n<li><strong>CISA KEV</strong> — free catalogue of vulnerabilities known to be actively exploited.</li>\n<li><strong>Nikto</strong> — web-server vulnerability scanner.</li>\n<li><strong>Hydra / John the Ripper</strong> — online password guesser / offline hash cracker.</li>\n<li><strong>SIEM</strong> — Security Information and Event Management; collects logs, raises alerts (e.g. Wazuh).</li>\n<li><strong>Triage</strong> — rapidly classifying alerts as true/false positive or needs-investigation.</li>\n</ul>", "sheets": [{"name": "m4-remediation-register.md", "html": "<h1>Vulnerability Remediation Register — Module 4 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Target:</strong> [e.g. 10.13.4.10]</p>\n<blockquote>Prioritise by more than CVSS: combine severity with **active exploitation</blockquote>\n<blockquote>(CISA KEV)<strong>, </strong>exposure<strong> and </strong>asset criticality**. See <code>labctl learn m4</code>.</blockquote>\n<table><thead><tr><th>#</th><th>Finding (from Nikto/scan)</th><th>CVSS</th><th>In KEV?</th><th>Exposure</th><th>Asset criticality</th><th>Priority</th><th>Fix</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> config.php.bak leaks DB creds</td><td>—</td><td>—</td><td>Internet</td><td>High</td><td><strong>High</strong></td><td>Remove file; rotate creds</td><td>IT</td><td>[ ]</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table>\n<p><strong>Priority rule of thumb:</strong> internet-facing + KEV + critical asset = do first, even at a lower CVSS.</p>\n<hr>\n<h1>SOC Triage Case Ticket — Module 4 Deliverable</h1>\n<p><strong>Ticket ref:</strong> [ ]  <strong>Analyst:</strong> [your name]  <strong>Opened:</strong> [date/time]</p>\n<table><thead><tr><th>Field</th><th>Detail</th></tr></thead><tbody><tr><td>Alert(s) involved</td><td>[rule IDs / descriptions]</td></tr><tr><td>Source IP</td><td>[ ]</td></tr><tr><td>Highest severity level</td><td>[ ]</td></tr><tr><td>Correlation</td><td>[how the alerts link into one story — same source IP?]</td></tr><tr><td>Classification</td><td>[True Positive / False Positive / Needs Investigation]</td></tr><tr><td>Did the attacker succeed?</td><td>[evidence — e.g. auth success after brute force]</td></tr><tr><td>ATT&amp;CK</td><td>[e.g. T1110 Brute Force]</td></tr><tr><td>Action taken</td><td>[ ]</td></tr><tr><td>Escalated to</td><td>[ ]</td></tr><tr><td>Status</td><td>[open / contained / closed]</td></tr></tbody></table>\n<h2>Evidence / notes</h2>\n<p>[Timeline and key log lines that justify the classification.]</p>"}]}, "m5": {"day": 3, "title": "Module 5 — Cyber Fraud, BEC & Mobile Money Security", "lesson": "<h1>Module 5 — Cyber Fraud, BEC &amp; Mobile Money Security</h1>\n
