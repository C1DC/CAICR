"/>\n    <rect x=\"360\" y=\"66\"  width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <rect x=\"360\" y=\"116\" width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--red,#ff6b7a)\"  fill-opacity=\"0.18\" stroke=\"currentColor\"/>\n    <rect x=\"360\" y=\"166\" width=\"200\" height=\"40\" rx=\"6\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <g fill=\"currentColor\">\n      <text x=\"372\" y=\"33\">.10 web-admin</text>      <text x=\"372\" y=\"48\" font-size=\"9\" opacity=\"0.8\">:80 unauthenticated console</text>\n      <text x=\"372\" y=\"83\">.20 fileserver</text>     <text x=\"372\" y=\"98\" font-size=\"9\" opacity=\"0.8\">:21 anonymous FTP, cleartext</text>\n      <text x=\"372\" y=\"133\" font-weight=\"bold\">.30 workstation</text><text x=\"372\" y=\"148\" font-size=\"9\" opacity=\"0.8\">:22 — INFECTED, beaconing to C2</text>\n      <text x=\"372\" y=\"183\">.40 legacy-host</text>    <text x=\"372\" y=\"198\" font-size=\"9\" opacity=\"0.8\">:3389 exposed RDP</text>\n    </g>\n  </g>\n  <g stroke=\"currentColor\" stroke-width=\"1.2\" opacity=\"0.7\">\n    <line x1=\"272\" y1=\"36\"  x2=\"360\" y2=\"36\"/>  <line x1=\"272\" y1=\"86\"  x2=\"360\" y2=\"86\"/>\n    <line x1=\"272\" y1=\"136\" x2=\"360\" y2=\"136\"/> <line x1=\"272\" y1=\"186\" x2=\"360\" y2=\"186\"/>\n  </g>\n  <line x1=\"460\" y1=\"156\" x2=\"610\" y2=\"156\" stroke=\"var(--red,#ff6b7a)\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" marker-end=\"url(#m3-a)\"/>\n  <text x=\"615\" y=\"150\" font-size=\"9\" fill=\"var(--red,#ff6b7a)\">C2</text>\n  <text x=\"615\" y=\"162\" font-size=\"9\" fill=\"var(--red,#ff6b7a)\">beacon</text>\n</svg></div><figcaption>The M3 lab network (10.13.3.0/24) — your authorised scope</figcaption></figure>\n<p>Work the three sources in order and correlate them:</p>\n<ol>\n<li><strong>Scan (Nmap + NSE).</strong> Discover the live targets, fingerprint the services, and name what should not be exposed: the unauthenticated admin panel, the anonymous FTP, the open RDP, the SSH version.</li>\n<li><strong>Capture (Wireshark).</strong> Filter to <code>dns</code> and find the <strong>beacon domain</strong> and its <strong>~30 s interval</strong> and the <strong>source host</strong> (<code>10.13.3.30</code>). Then follow the <strong>FTP TCP stream</strong> and recover the <strong>username and password</strong> sent in the clear.</li>\n<li><strong>Host table (netstat).</strong> In the netstat dump, find the <strong>masquerading process</strong>, the <strong>backdoor port</strong> it listens on, and the <strong>external C2 IP</strong> it holds an established connection to — and confirm that IP is the same infrastructure the DNS beacon points at.</li>\n</ol>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Your values are unique</div><div class='callout-b'><p>The C2 domain, the FTP username and password, the backdoor port and the C2 IP are <strong>randomised per student</strong>. The examples in this lesson (<code>backupsvc</code>, <code>cdn-update.ddns.net</code>, port 4444, <code>203.0.113.47</code>) are illustrative — read <em>your</em> evidence and report <em>your</em> values. <code>labctl verify m3</code> grades against your own randomised answer key, so copying a classmate's numbers will fail.</p></div></div>\n<p>Finally, design the controls: map each proven gap to a fix with a priority and an owner, and write the one-line business summary for leadership. Capture it all in <code>labctl worksheet m3</code>.</p>\n<hr>\n<h2>Common mistakes</h2>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>What trips students up</div><div class='callout-b'><ul>\n<li><strong>Scanning outside the authorised scope.</strong> Nmap against anything other than <code>10.13.3.x</code> here is both wrong and unlawful (Act 1038).</li>\n<li><strong>Confusing capture and display filters.</strong> The first decides what is <em>recorded</em> (and lost if omitted); the second decides what is <em>shown</em>.</li>\n<li><strong>Dismissing a \"small\" open port.</strong> An unauthenticated admin panel or an open 4444 is a full compromise, not a minor note.</li>\n<li><strong>Assuming encrypted = safe.</strong> TLS hides the <em>content</em>, not the <em>pattern</em> — a beacon's timing is visible even when its payload is not.</li>\n<li><strong>Reading <code>svchost</code> where it says <code>svch0st</code>.</strong> Masquerading defeats the hurried. Read process names character by character.</li>\n<li><strong>Reporting one source.</strong> A finding that the scan, the capture <em>and</em> the host table all support is proof; a finding from one tool is a lead.</li>\n</ul></div></div>\n<hr>\n<h2>Key takeaways</h2>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Carry these out of Module 3</div><div class='callout-b'><ul>\n<li><strong>Ports are doors, protocols are languages; name the layer and you name the control.</strong> Nmap finds the open doors, from quiet (<code>-sn</code>) to loud (<code>-A</code>), and NSE turns a scan into a triage.</li>\n<li><strong>Cleartext protocols leak credentials</strong> — follow the TCP stream and they fall out. Replace FTP/Telnet with SFTP/SSH.</li>\n<li><strong>C2 beacon = same destination + fixed interval, around the clock;</strong> most malware beacons over <strong>DNS</strong>, so monitor it.</li>\n<li><strong>netstat tells you who:</strong> an odd <code>LISTEN</code> port is a backdoor, an <code>ESTABLISHED</code> line to a strange IP is the live C2 — and watch for <strong>masquerading</strong> process names.</li>\n<li><strong>Identity is the escalation layer.</strong> A foothold becomes a takeover through <strong>credential theft + lateral movement</strong> (pass-the-hash over SMB/RDP/WinRM); <strong>tiering, unique local-admin passwords (LAPS), PAM and phishing-resistant MFA</strong> are what stop it.</li>\n<li><strong>Correlate the three sources</strong>, and the single most important architectural control is usually <strong>segmentation</strong> backed by <strong>Zero Trust</strong>.</li>\n<li><strong>Engineer detection, don't just investigate:</strong> DNS query logging + an IDS rule catch the beacon; NetFlow catches the exfil; EDR catches the masquerade. <strong>You cannot detect what you do not log.</strong></li>\n<li><strong>ATT&amp;CK:</strong> T1046 (discovery), T1071.004 (DNS C2), T1036 (masquerading), T1003 (cred dumping), T1550.002 (pass-the-hash), T1021 (remote services).</li>\n</ul></div></div>\n<h2>Check yourself</h2>\n<ol>\n<li><strong><code>nmap -sn</code> vs <code>nmap -sV</code> — what does each do?</strong> → <code>-sn</code> only discovers which hosts are alive (no port scan); <code>-sV</code> scans ports <em>and</em> identifies the service and version behind each open one.</li>\n</ol>\n<ol>\n<li><strong>A host queries <code>cdn-update.ddns.net</code> every ~30 seconds all night. Benign or suspicious, and why?</strong> → Suspicious — a fixed, round-the-clock interval to a dynamic-DNS domain is classic C2 beaconing; genuine user traffic is irregular and bursty.</li>\n</ol>\n<ol>\n<li><strong>You see <code>svch0st.exe</code> LISTENING on 4444 and ESTABLISHED to a public IP, same PID. Explain the two behaviours.</strong> → One implant doing two things: the <code>LISTEN</code> on 4444 is a <strong>backdoor</strong> for the operator to return; the <code>ESTABLISHED</code> line is the live <strong>C2</strong> channel. The name is a <strong>masquerade</strong> of <code>svchost</code>.</li>\n</ol>\n<ol>\n<li><strong>Target 2013: entry was a vendor account, but the catastrophe was architectural. What was the failure?</strong> → A <strong>flat network</strong> — the vendor segment could reach the payment systems. Segmentation (and Zero Trust) would have contained it.</li>\n</ol>\n<ol>\n<li><strong>Why is SMS MFA weaker than a FIDO2 security key?</strong> → SMS codes are phishable and defeated by SIM-swap; FIDO2/passkeys are phishing-resistant and cryptographically bound to the legitimate site.</li>\n</ol>\n<ol>\n<li><strong>What single control most often turns a breach back into a contained incident, and why?</strong> → <strong>Segmentation</strong> — it stops a small foothold from reaching high-value systems, which is where the real damage is done.</li>\n</ol>\n<ol>\n<li><strong>An attacker has local admin on one workstation. Explain how that becomes domain-wide control, and name two controls that break the chain.</strong> → They dump credentials from memory and <strong>pass-the-hash</strong> to other hosts over SMB/RDP/WinRM (lateral movement), hunting the domain controller. Break it with <strong>unique local-admin passwords (LAPS)</strong>, <strong>admin-account tiering</strong>, <strong>PAM</strong> and <strong>phishing-resistant MFA</strong> — any of which stops one stolen hash opening every machine.</li>\n</ol>\n<ol>\n<li><strong>Your institution can fund exactly one new log source. Which, and why?</strong> → <strong>DNS query logging</strong> — ~90% of malware beacons over DNS, so it catches the C2 stage cheaply; you cannot detect what you do not log.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Port / protocol</strong> — a numbered service endpoint / the language spoken through it.</li>\n<li><strong>OSI &amp; TCP/IP</strong> — the layer models that locate attacks and controls.</li>\n<li><strong>Nmap / NSE</strong> — the network scanner / its scripting engine for targeted checks.</li>\n<li><strong>Capture filter / display filter</strong> — what is <em>recorded</em> / what is <em>shown</em>.</li>\n<li><strong>Follow TCP Stream</strong> — Wireshark's reassembly of one conversation end to end.</li>\n<li><strong>C2 / beaconing</strong> — malware's control channel / its regular check-ins.</li>\n<li><strong>Jitter</strong> — deliberate random variation in beacon timing, used to evade detection.</li>\n<li><strong>LISTEN / ESTABLISHED</strong> — a socket awaiting connections / an active connection.</li>\n<li><strong>Backdoor</strong> — a hidden listening port an attacker uses to return.</li>\n<li><strong>Masquerading (T1036)</strong> — malware named to impersonate a trusted process.</li>\n<li><strong>Defence in depth / Zero Trust / segmentation</strong> — layered controls / never-trust-always-verify / dividing the network to contain breaches.</li>\n<li><strong>Three-way handshake</strong> — SYN → SYN-ACK → ACK; a SYN scan reads the first reply to learn open/closed/filtered.</li>\n<li><strong>Active Directory / Kerberos</strong> — the enterprise identity directory / its ticket-based authentication; the domain controller is the prize.</li>\n<li><strong>Pass-the-Hash (T1550.002)</strong> — authenticating with a stolen password hash, no plaintext needed.</li>\n<li><strong>Lateral movement</strong> — hopping host to host with stolen credentials (SMB/RDP/WinRM).</li>\n<li><strong>Tiering / LAPS</strong> — separating admin accounts by sensitivity / unique local-admin passwords per machine.</li>\n<li><strong>IDS / Suricata / NetFlow</strong> — intrusion-detection system / an IDS engine with rules / summarised records of network flows (for spotting exfil).</li>\n<li><strong>PAM / MFA</strong> — privileged access management / multi-factor authentication.</li>\n</ul>", "sheets": [{"name": "m3-traffic-analysis-findings.md", "html": "<h1>Traffic Analysis Findings &amp; Control Design — Module 3 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Authorised scope:</strong> 10.13.3.0/24</p>\n<blockquote>You are the on-call analyst at a Ghanaian financial institution. A host is</blockquote>\n<blockquote>suspected of compromise. Work the three evidence sources — the Nmap scan, the</blockquote>\n<blockquote>packet capture and the host's netstat dump — then design the controls that</blockquote>\n<blockquote>close each proven gap. Everything here must be supported by evidence you can</blockquote>\n<blockquote>point to. See <code>labctl learn m3</code>; submit with your findings filled in.</blockquote>\n<hr>\n<h2>1. Host &amp; service inventory (Nmap)</h2>\n<p><em>Scan the range, fingerprint the services, and flag what should not be exposed.</em></p>\n<div class='tablewrap'><table><thead><tr><th>Host IP</th><th>Open ports / services (with version)</th><th>Exposure concern</th></tr></thead><tbody><tr><td>[ ]</td><td></td><td>[e.g. unauthenticated admin panel]</td></tr><tr><td>[ ]</td><td></td><td>[e.g. anonymous + cleartext FTP]</td></tr><tr><td>[ ]</td><td></td><td>[e.g. SSH — note the version]</td></tr><tr><td>[ ]</td><td></td><td>[e.g. exposed legacy RDP]</td></tr></tbody></table></div>\n<p><strong>Commands I ran (evidence):</strong> <code>[e.g. nmap -sn …; nmap -sV -p … ; nmap --script ftp-anon …]</code></p>\n<h2>2. Network behaviour (Wireshark / tcpdump)</h2>\n<div class='tablewrap'><table><thead><tr><th>Finding</th><th>Value (from my evidence)</th><th>How I know</th></tr></thead><tbody><tr><td>Infected / beaconing host IP</td><td>[ ]</td><td>[source IP of the repeated queries]</td></tr><tr><td>C2 domain</td><td>[ ]</td><td>[DNS filter in the capture]</td></tr><tr><td>Beacon interval (seconds)</td><td>[ ]</td><td>[timestamp delta between queries]</td></tr><tr><td>Why this is a beacon, not normal traffic</td><td>[ ]</td><td>[fixed interval, round-the-clock, dynamic-DNS]</td></tr><tr><td>Cleartext credential captured — username</td><td>[ ]</td><td>[Follow TCP Stream on the FTP session]</td></tr><tr><td>Cleartext credential captured — password</td><td>[ ]</td><td>[same stream, after USER]</td></tr></tbody></table></div>\n<h2>3. Endpoint evidence (netstat from the suspect host)</h2>\n<div class='tablewrap'><table><thead><tr><th>Finding</th><th>Value</th><th>How I know</th></tr></thead><tbody><tr><td>Masquerading process name</td><td>[ ]</td><td>[read the spelling carefully vs svchost]</td></tr><tr><td>Backdoor port (LISTEN)</td><td>[ ]</td><td>[the odd high port it listens on]</td></tr><tr><td>External C2 IP (ESTABLISHED)</td><td>[ ]</td><td>[foreign address owned by that process]</td></tr><tr><td>Correlation check: does the C2 IP match the beacon domain's infrastructure?</td><td>[ yes / no ]</td><td>[this is what turns a hunch into proof]</td></tr></tbody></table></div>\n<h2>4. Attack narrative mapped to MITRE ATT&amp;CK</h2>\n<p><em>One or two sentences per stage — tell the story the evidence supports.</em></p>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>What happened here</th><th>ATT&amp;CK ID</th></tr></thead><tbody><tr><td>Reconnaissance</td><td>[ ]</td><td>T1046</td></tr><tr><td>Initial access / credentials</td><td>[ ]</td><td>T1078 / T1040</td></tr><tr><td>Defense evasion</td><td>[ ]</td><td>T1036</td></tr><tr><td>Command &amp; control</td><td>[ ]</td><td>T1071.004</td></tr></tbody></table></div>\n<h2>5. Control design (map each proven gap to a fix, with priority)</h2>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Finding (from §1–§3)</th><th>Recommended control</th><th>Priority (H/M/L)</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td>[e.g. RDP 3389 exposed]</td><td>[e.g. close port / VPN + MFA]</td><td>H</td><td>IT</td></tr><tr><td>2</td><td>[FILL IN]</td><td>[e.g. network segmentation]</td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td>[e.g. DNS monitoring/logging]</td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td>[e.g. replace FTP with SFTP]</td><td></td><td></td></tr></tbody></table></div>\n<h2>5b. Detection design (how you'd catch it next time)</h2>\n<p><em>Prevention fails eventually; detection is how you catch the next attempt in minutes. For each stage, name the log/signal and where it comes from.</em></p>\n<div class='tablewrap'><table><thead><tr><th>Attack stage</th><th>Signal to detect it</th><th>Log source / tool</th></tr></thead><tbody><tr><td>Recon scan</td><td>[e.g. burst of SYNs from one host]</td><td>[IDS / firewall logs]</td></tr><tr><td>C2 beacon</td><td>[e.g. repeated fixed-interval dynamic-DNS lookups]</td><td>[DNS query logging + IDS rule]</td></tr><tr><td>Exfiltration</td><td>[e.g. large sustained outbound to a new IP]</td><td>[NetFlow / Wireshark Conversations]</td></tr></tbody></table></div>\n<p><strong>The one log source I'd fund first, and why:</strong> [ ]</p>\n<h2>6. One-line summary for leadership (BLUF)</h2>\n<blockquote>[Business impact of what's exposed + the single most urgent fix, in plain</blockquote>\n<blockquote>language a non-technical director can act on.]</blockquote>\n<hr>\n<h2>Self-check before you submit</h2>\n<ul>\n<li>[ ] Every value in §2–§3 is <strong>my own</strong> (randomised per student) — not copied.</li>\n<li>[ ] My C2 IP (§3) and C2 domain (§2) are <strong>correlated</strong> — I state whether they match.</li>\n<li>[ ] Each control in §5 traces to a specific finding in §1–§3.</li>\n<li>[ ] I named the <strong>layer</strong> and the <strong>ATT&amp;CK ID</strong> for each stage.</li>\n<li>[ ] I scanned <strong>only</strong> 10.13.3.0/24.</li>\n</ul>\n<h2>Grading rubric (how your facilitator marks this — 100 pts)</h2>\n<div class='tablewrap'><table><thead><tr><th>Band</th><th>Inventory &amp; scan (25)</th><th>Behaviour &amp; creds (25)</th><th>Endpoint &amp; correlation (25)</th><th>Controls &amp; BLUF (25)</th></tr></thead><tbody><tr><td>Excellent (full)</td><td>All hosts + versions, every exposure named</td><td>Beacon + interval + both credentials, reasoned</td><td>Process, port, IP — <strong>and</strong> C2 correlation proven</td><td>Each gap → right control, prioritised; crisp BLUF</td></tr><tr><td>Adequate (~60%)</td><td>Most hosts, exposures partly named</td><td>Beacon found, creds partial</td><td>Process + port, no correlation</td><td>Generic controls, weak prioritisation</td></tr><tr><td>Weak (&lt;40%)</td><td>Hosts only, no versions</td><td>\"Looks suspicious\", no evidence</td><td>Single source, no story</td><td>Controls not tied to findings</td></tr></tbody></table></div>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<p><em>Illustrative values — yours are randomised. This shows the standard expected.</em></p>\n<p><strong>§1 Inventory:</strong> <code>10.20.5.10</code> HTTP 80 — <em>unauthenticated \"Admin Console\"</em>; <code>10.20.5.20</code> FTP 21 — <em>anonymous login allowed (code 230), cleartext</em>; <code>10.20.5.30</code> SSH 22 — <em>OpenSSH 9.7</em>; <code>10.20.5.40</code> RDP 3389 — <em>legacy, internet-reachable</em>.</p>\n<p><strong>§2 Behaviour:</strong> host <code>10.20.5.30</code> resolves <code>cdn-update.ddns.net</code> every <strong>~30 s</strong> all night → <strong>beacon</strong> (fixed interval, dynamic-DNS, round-the-clock). FTP stream yields <code>USER backupsvc</code> / <code>PASS S3rv!ce-2bf9</code> in the clear.</p>\n<p><strong>§3 Endpoint:</strong> process <strong><code>svch0st.exe</code></strong> (zero, not <em>o</em>) PID 3391 — LISTEN on <strong>4444</strong> (backdoor) and ESTABLISHED to <strong>203.0.113.47:443</strong> (C2). The C2 IP matches the address <code>cdn-update.ddns.net</code> resolves to — <strong>correlation proven</strong>.</p>\n<p><strong>§4 Narrative:</strong> scanned (T1046) → anonymous FTP + sniffed credentials (T1078/T1040) → implant masquerading as svchost (T1036) → DNS beacon C2 (T1071.004).</p>\n<p><strong>§5 Controls:</strong> (1) close RDP, move to VPN+MFA — <strong>H</strong>, IT; (2) <strong>segment</strong> the network so finance ≠ general LAN — <strong>H</strong>, IT; (3) <strong>DNS logging + alert</strong> on dynamic-DNS beacons — <strong>H</strong>, SOC; (4) replace FTP with <strong>SFTP</strong>, rotate the leaked credential — <strong>M</strong>, IT.</p>\n<p><strong>§6 BLUF:</strong> <em>\"An internal workstation is actively controlled by an attacker over a hidden channel, and our file server hands out credentials in plain text. Fund network segmentation and DNS monitoring now; the exposure is live.\"</em></p>"}]}, "m4": {"day": 2, "title": "Module 4 — Vulnerability Management & SOC Operations", "lesson": "<h1>Module 4 — Vulnerability Management &amp; SOC Operations</h1>\n<p><strong>Day 2 · Afternoon Session · ~4 hours · Hands-on lab: <code>labctl start m4</code></strong></p>\n<p>Finding weaknesses is the easy part — a scanner hands you hundreds in minutes. The <em>profession</em> is deciding which handful actually matter, fixing those first with a defensible rationale, and then — from a flood of thousands of daily alerts — recognising the exact moment one of those weaknesses is being exploited and acting before it becomes a breach. This module covers both halves of that discipline: <strong>vulnerability management</strong> (the engine that keeps your exposure shrinking) and the <strong>Security Operations Centre</strong> (the eyes that catch the attack in progress).</p>\n<p>As always the module runs on two registers. The <strong>conceptual</strong> half gives you the prioritisation model (CVSS, KEV, EPSS, context), the SOC operating model (tiers, SIEM/SOAR, MTTD/MTTR) and the single skill that separates a real analyst from an alert-clicker: <strong>correlation</strong>. The <strong>practical</strong> half puts the tools in your hands — fingerprinting and scanning a web server, discovering hidden content, looting and cracking a leaked password database, demonstrating why a weak credential falls in seconds, and triaging a realistic alert feed into one coherent attack story. The attacks are taught for one reason only: you cannot defend against, or prioritise, a threat you do not understand.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Run the vulnerability-management <strong>loop</strong> — discover → prioritise → remediate → verify → repeat — as an ongoing process, not a one-off scan.</li>\n<li><strong>Read a CVSS vector</strong> (AV/AC/PR/UI/S/C/I/A), and prioritise using <strong>CVSS + CISA KEV + EPSS + context</strong> — justifying why context can outrank a higher raw score.</li>\n<li>Set <strong>patch SLAs</strong> by severity and deploy a <strong>compensating control</strong> when you cannot patch in time.</li>\n<li>Fingerprint and assess a web server with <strong>nmap / whatweb / Nikto</strong>, and discover hidden content with <strong>gobuster</strong>.</li>\n<li>Recognise insecure credential storage (<strong>unsalted MD5</strong>), and crack hashes with the right <strong>mode and attack</strong> (<code>-m</code>, wordlist/rules/mask) — explaining why salted, slow hashes (bcrypt/argon2) defeat it.</li>\n<li>Distinguish <strong>online</strong> password attacks (<strong>Hydra</strong>) from <strong>offline</strong> cracking (<strong>hashcat / John</strong>), and name the controls that defeat each.</li>\n<li>Describe the SOC operating model — <strong>Tier 1/2/3</strong>, <strong>SIEM/SOAR</strong>, <strong>MTTD/MTTR</strong> — and triage alerts as <strong>TP / FP / needs-investigation</strong>.</li>\n<li><strong>Correlate</strong> multiple alerts by shared indicator into a single intrusion narrative, and tell whether the attacker succeeded.</li>\n<li><strong>Engineer a detection</strong> — write a Sigma/Wazuh rule for the brute-force→success chain, tune out false positives, and automate response with SOAR.</li>\n<li>Map the chain to <strong>MITRE ATT&amp;CK</strong> and produce a <strong>remediation register</strong> and a <strong>SOC case ticket</strong> of professional quality.</li>\n</ol></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:30</td><td>Vulnerability management as a loop; the prioritisation model (CVSS/KEV/EPSS/context)</td></tr><tr><td>0:30 – 1:15</td><td>Web assessment in practice: fingerprint → scan → content discovery → loot</td></tr><tr><td>1:15 – 2:00</td><td>Password attacks and why controls are mandatory: hashing, salting, Hydra vs John/hashcat</td></tr><tr><td>2:00 – 2:15</td><td>Break</td></tr><tr><td>2:15 – 2:40</td><td>The SOC: tiers, SIEM/SOAR, MTTD/MTTR, alert fatigue</td></tr><tr><td>2:40 – 3:05</td><td>Correlation (hands-on <code>jq</code>) + detection engineering (Sigma/Wazuh rules, tuning, SOAR)</td></tr><tr><td>3:05 – 3:30</td><td>Cracking craft: hashcat modes &amp; attacks; why bcrypt wins</td></tr><tr><td>3:30 – 4:15</td><td>Lab: <code>labctl start m4</code> — assess, crack, triage, and write the register + ticket</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> skim the CISA KEV catalogue (<code>cisa.gov/known-exploited-vulnerabilities-catalog</code>) and one EPSS explainer. <strong>Lab requirement:</strong> a Kali terminal with <code>nmap</code>, <code>nikto</code>, <code>gobuster</code>, <code>hashcat</code>/<code>john</code>, <code>hydra</code>, <code>jq</code>, and Docker running. <strong>Assessment:</strong> your lab submission — the <em>Remediation Register</em> and <em>SOC Case Ticket</em> (<code>labctl worksheet m4</code>) — counts toward the Module 4 practical grade. <strong>The rule:</strong> the only authorised targets are <code>10.13.4.10</code> and <code>10.13.4.20</code>, and the only hashes you crack are the ones the lab gives you.</p></div></div>\n<hr>\n<h2>1 · Vulnerability Management Is a Loop</h2>\n<h3>1.1 The cycle, not the scan</h3>\n<p>Amateurs run a scan. Professionals run a <strong>loop</strong>:</p>\n<p><strong>Discover → Prioritise → Remediate → Verify → Repeat.</strong></p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"vm-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\">\n    <circle cx=\"110\" cy=\"70\"  r=\"46\" fill=\"var(--teal,#2bb6a8)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <circle cx=\"320\" cy=\"70\"  r=\"46\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <circle cx=\"530\" cy=\"70\"  r=\"46\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <circle cx=\"320\" cy=\"170\" r=\"46\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <g fill=\"currentColor\" font-size=\"12\" font-weight=\"bold\">\n      <text x=\"110\" y=\"68\">Discover</text>\n      <text x=\"320\" y=\"64\">Prioritise</text>\n      <text x=\"530\" y=\"64\">Remediate</text>\n      <text x=\"320\" y=\"166\">Verify</text>\n    </g>\n    <g fill=\"currentColor\" font-size=\"8.5\" opacity=\"0.8\">\n      <text x=\"110\" y=\"82\">scan the estate</text>\n      <text x=\"320\" y=\"78\">CVSS+KEV+EPSS</text>\n      <text x=\"320\" y=\"88\">+context</text>\n      <text x=\"530\" y=\"78\">patch / MFA</text>\n      <text x=\"530\" y=\"88\">config</text>\n      <text x=\"320\" y=\"180\">did it close?</text>\n      <text x=\"320\" y=\"190\">did it break?</text>\n    </g>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.5\">\n    <line x1=\"156\" y1=\"70\"  x2=\"270\" y2=\"70\"  marker-end=\"url(#vm-a)\"/>\n    <line x1=\"366\" y1=\"70\"  x2=\"480\" y2=\"70\"  marker-end=\"url(#vm-a)\"/>\n    <path d=\"M530,116 C530,150 420,168 368,170\" marker-end=\"url(#vm-a)\"/>\n    <path d=\"M274,170 C150,168 110,150 110,118\" marker-end=\"url(#vm-a)\"/>\n  </g>\n  <text x=\"200\" y=\"205\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-style=\"italic\" opacity=\"0.8\">…then repeat — exposure keeps shrinking</text>\n</svg></div><figcaption>Vulnerability management is a continuous loop</figcaption></figure>\n<p>Scanning (discover) is trivial and mostly automated. <em>Verify</em> — confirming the fix actually closed the hole and did not break something else — is the step beginners skip and auditors pound. But the hard, valuable, career-defining work is <strong>prioritise</strong>, because you can never fix everything at once and pretending otherwise paralyses the team.</p>\n<h3>1.2 Four inputs to a defensible priority</h3>\n<p>A priority you can defend to a CFO combines four things:</p>\n<div class='tablewrap'><table><thead><tr><th>Input</th><th>What it tells you</th><th>Limitation</th></tr></thead><tbody><tr><td><strong>CVSS</strong> (0–10)</td><td>The <em>severity</em> of the flaw in the abstract</td><td>Describes the flaw, not <strong>your</strong> exposure</td></tr><tr><td><strong>CISA KEV</strong></td><td>Whether it is being <strong>actively exploited right now</strong></td><td>Binary; a catalogue, not a score</td></tr><tr><td><strong>EPSS</strong> (0–1)</td><td><em>Probability</em> of exploitation in the next 30 days</td><td>Prediction, for the long tail not yet in KEV</td></tr><tr><td><strong>Context</strong></td><td>Internet-facing? critical asset? actually reachable?</td><td>Only <em>you</em> know this — it is your edge</td></tr></tbody></table></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Context beats the raw number</div><div class='callout-b'><p>A <strong>medium-CVSS</strong> flaw that is <strong>internet-facing</strong>, on a <strong>critical system</strong>, and <strong>listed in KEV</strong> beats a \"critical\" CVSS flaw that is internal, unreachable and never exploited. The scanner ranks by CVSS; the analyst re-ranks by <em>exposure and exploitation</em>. That re-ranking is the job.</p></div></div>\n<h3>1.3 Read the CVSS vector, not just the number</h3>\n<p>\"CVSS 9.8\" is a conclusion; the <strong>vector string</strong> behind it tells you <em>why</em>, and a professional reads it. CVSS v3.1 base score is built from eight metrics:</p>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>Values</th><th>Asks</th></tr></thead><tbody><tr><td><strong>AV</strong> Attack Vector</td><td>Network / Adjacent / Local / Physical</td><td>How close must the attacker be?</td></tr><tr><td><strong>AC</strong> Attack Complexity</td><td>Low / High</td><td>Does it \"just work\", or need special conditions?</td></tr><tr><td><strong>PR</strong> Privileges Required</td><td>None / Low / High</td><td>Do they need an account first?</td></tr><tr><td><strong>UI</strong> User Interaction</td><td>None / Required</td><td>Must a victim click something?</td></tr><tr><td><strong>S</strong> Scope</td><td>Unchanged / Changed</td><td>Can it break out to other components?</td></tr><tr><td><strong>C / I / A</strong></td><td>High / Low / None</td><td>Impact on confidentiality / integrity / availability</td></tr></tbody></table></div>\n<p>So <code>CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H</code> reads: <em>reachable over the <strong>network</strong>, <strong>low</strong> complexity, <strong>no</strong> privileges or user interaction, full impact on all three</em> → <strong>9.8</strong>. That is the profile of every internet-facing unauthenticated RCE (Struts, the VPN appliance) — and it is why those top every list. By contrast an <code>AV:L/PR:H/UI:R</code> flaw needs a local, privileged, tricked user and scores far lower.</p>\n<p>Three layers exist: <strong>Base</strong> (the flaw itself — what scanners report), <strong>Temporal</strong> (is a working exploit public yet? is there a patch?), and <strong>Environmental</strong> (adjust for <em>your</em> deployment). In practice, <strong>KEV answers the temporal question</strong> (it is being exploited <em>now</em>) and <strong>your context answers the environmental one</strong> — which is why the four-input model beats the base number alone.</p>\n<h3>1.4 A worked prioritisation</h3>\n<p>Here is the re-ranking in action. A scan returns these five; the raw CVSS order is <em>not</em> the order you fix them in:</p>\n<div class='tablewrap'><table><thead><tr><th>Finding</th><th>CVSS</th><th>In KEV?</th><th>EPSS</th><th>Exposure</th><th><strong>Do it</strong></th></tr></thead><tbody><tr><td>Struts RCE on the public portal</td><td>9.8</td><td><strong>Yes</strong></td><td>0.97</td><td>Internet + critical</td><td><strong>P1 — now</strong></td></tr><tr><td>Unauth admin panel on the portal (no CVE)</td><td>—</td><td>—</td><td>—</td><td>Internet + critical</td><td><strong>P1 — now</strong></td></tr><tr><td>SMB RCE on an internal file server</td><td>8.1</td><td>Yes</td><td>0.40</td><td>Internal, segmented</td><td>P2 — this week</td></tr><tr><td>Outdated OpenSSL on an internal box</td><td>7.5</td><td>No</td><td>0.05</td><td>Internal, no exploit seen</td><td>P4 — backlog</td></tr><tr><td>Self-XSS on an isolated test box</td><td>6.1</td><td>No</td><td>0.02</td><td>Not reachable</td><td>P5 — accept/defer</td></tr></tbody></table></div>\n<p>Note the two <strong>P1s</strong>: one is a 9.8, the other has <em>no CVSS at all</em> — a configuration gap context alone flags as critical. And a 7.5 sits in the backlog below an 8.1 because it is internal with no active exploitation.</p>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 640 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"pf-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"9.5\">\n    <rect x=\"12\"  y=\"40\" width=\"110\" height=\"70\" rx=\"5\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/>\n    <text x=\"67\" y=\"70\" fill=\"currentColor\" font-weight=\"bold\">scanner</text><text x=\"67\" y=\"84\" fill=\"currentColor\">output</text><text x=\"67\" y=\"100\" fill=\"currentColor\" opacity=\"0.7\">hundreds</text>\n    <rect x=\"166\" y=\"50\" width=\"108\" height=\"50\" rx=\"5\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.13\" stroke=\"currentColor\"/>\n    <text x=\"220\" y=\"70\" fill=\"currentColor\">internet-</text><text x=\"220\" y=\"83\" fill=\"currentColor\">facing? (dozens)</text>\n    <rect x=\"318\" y=\"57\" width=\"108\" height=\"36\" rx=\"5\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"372\" y=\"72\" fill=\"currentColor\">in KEV /</text><text x=\"372\" y=\"84\" fill=\"currentColor\">high EPSS?</text>\n    <rect x=\"470\" y=\"60\" width=\"96\" height=\"30\" rx=\"5\" fill=\"var(--red,#ff6b7a)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"518\" y=\"79\" fill=\"currentColor\">critical asset?</text>\n    <rect x=\"590\" y=\"62\" width=\"40\" height=\"26\" rx=\"5\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.20\" stroke=\"currentColor\"/>\n    <text x=\"610\" y=\"79\" fill=\"currentColor\" font-weight=\"bold\">P1</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"122\" y1=\"75\" x2=\"164\" y2=\"75\" marker-end=\"url(#pf-a)\"/>\n    <line x1=\"274\" y1=\"75\" x2=\"316\" y2=\"75\" marker-end=\"url(#pf-a)\"/>\n    <line x1=\"426\" y1=\"75\" x2=\"468\" y2=\"75\" marker-end=\"url(#pf-a)\"/>\n    <line x1=\"566\" y1=\"75\" x2=\"588\" y2=\"75\" marker-end=\"url(#pf-a)\"/>\n  </g>\n  <text x=\"320\" y=\"140\" text-anchor=\"middle\" font-size=\"9\" fill=\"currentColor\" font-style=\"italic\" opacity=\"0.8\">each filter is a question — what survives all four is what you fund first</text>\n</svg></div><figcaption>Prioritisation funnel — hundreds of findings to a short, fundable list</figcaption></figure>\n<h3>1.5 Remediation that actually ships</h3>\n<p>Prioritising is half the loop; <strong>getting the fix out</strong> is the other. Professionals run <strong>patch SLAs by severity</strong> — e.g. Critical/KEV within <strong>24–72 hours</strong> (an <em>emergency change</em>), High within <strong>7–30 days</strong>, Medium within <strong>90 days</strong>, Low best-effort — applied in agreed <strong>maintenance windows</strong>, with rollback ready.</p>\n<p>When you <em>cannot</em> patch immediately (a legacy app, a vendor appliance, no window), you deploy a <strong>compensating control</strong> to buy time: a <strong>WAF virtual patch</strong>, <strong>segmentation</strong> to cut the attack path, disabling the vulnerable feature, or tighter access control. Then — always — you <strong>verify</strong>: re-scan to confirm the hole is closed and nothing else broke. A fix you didn't verify is a hope.</p>\n<hr>\n<h2>2 · Web Assessment in Practice</h2>\n<p>Most organisations' worst exposure is a web server nobody is watching. The assessment flow moves from <em>what is it</em> to <em>what is wrong with it</em> to <em>what can I take</em>.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — fingerprint, then scan the web server</span></div><pre><code># What software and version? (two ways)\nnmap -sV -p80 10.13.4.10\nwhatweb http://10.13.4.10\n\n# Web-specific vulnerability scan: dangerous files, stale software, headers\nnikto -h http://10.13.4.10</code></pre></div>\n<p>Where Nmap says <em>port 80 is open</em>, <strong>Nikto</strong> says <em>what is wrong with what's running on it</em> — a leftover <code>config.php.bak</code>, an exposed <code>/admin/</code>, a <code>phpinfo.php</code> spilling internals, missing security headers.</p>\n<h3>2.1 Content discovery — finding what isn't linked</h3>\n<p>The most damaging files are the ones no link points to: a forgotten backup, an admin console, a <code>.git</code> folder. <strong>gobuster</strong> brute-forces paths against a wordlist to surface them:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — discover hidden paths and loot a leaked backup</span></div><pre><code>gobuster dir -u http://10.13.4.10 -w /usr/share/wordlists/dirb/common.txt\n\n# directory listing left on → a world-readable database backup\ncurl http://10.13.4.10/backup/\ncurl http://10.13.4.10/backup/db_dump.sql -o db_dump.sql\n\n# a leftover config backup leaks the live DB password in cleartext\ncurl http://10.13.4.10/config.php.bak</code></pre></div>\n<p>A world-readable <code>db_dump.sql</code> and a <code>config.php.bak</code> leaking the database password are not hypothetical — they are among the most common real findings on Ghanaian web estates, usually left by a hurried deployment or a \"temporary\" backup that became permanent.</p>\n<hr>\n<h2>3 · Password Attacks — and Why Controls Are Mandatory</h2>\n<p>Here is the uncomfortable core of the module. We crack passwords <strong>not to teach hacking</strong> but to prove, viscerally, why specific controls are non-negotiable. A password already in a wordlist is already broken; the only question is how fast.</p>\n<h3>3.1 How passwords should (and shouldn't) be stored</h3>\n<p>Systems must never store passwords in plaintext. They store a <strong>hash</strong> — a one-way fingerprint. But not all hashing is equal:</p>\n<ul>\n<li><strong>Unsalted MD5 / SHA1</strong> — fast and identical for identical passwords. Two users with password <code>123456</code> have the <em>same</em> hash, and attackers precompute billions of these. This is <strong>broken</strong>; a 32-hex-character value (<code>-m 0</code> in hashcat) is your tell.</li>\n<li><strong>Salted, slow hashes (bcrypt, scrypt, argon2)</strong> — a unique random <em>salt</em> per password defeats precomputation, and deliberate slowness makes mass cracking uneconomic. This is the standard.</li>\n</ul>\n<h3>3.2 Two kinds of attack, two kinds of defence</h3>\n<ul>\n<li><strong>Online — Hydra.</strong> Guessing against a <em>live</em> service (SSH, a web login). Noisy, rate-limited, and defeatable by lockout, throttling and MFA — but lethal against weak passwords. A <strong>password spray</strong> tries <em>one</em> common password across <em>many</em> accounts to slip under lockout thresholds.</li>\n<li><strong>Offline — hashcat / John the Ripper.</strong> Cracking <em>stolen hashes</em> locally, at enormous speed, with <strong>no lockout and no limit</strong>. This is why a stolen hash database is a catastrophe, and why the storage choice in §3.1 matters so much.</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — online guessing (Hydra) vs offline cracking (hashcat / John)</span></div><pre><code># ONLINE: guess SSH credentials against the authorised lab host\nhydra -l labuser -P assets/lab-wordlist.txt ssh://10.13.4.20\n\n# OFFLINE: crack the looted unsalted-MD5 hashes (either tool)\nhashcat -m 0 -a 0 hashes.txt assets/lab-wordlist.txt\njohn --format=raw-md5 --wordlist=assets/lab-wordlist.txt hashes.txt\njohn --show --format=raw-md5 hashes.txt</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>The control that makes a cracked password harmless</div><div class='callout-b'><p>A cracked or stolen password is bad; <strong>multi-factor authentication</strong> is what makes it <em>insufficient on its own</em>. Combine <strong>strong, salted hashing</strong> (so a stolen database is slow to crack), <strong>lockout/throttling</strong> (so online guessing fails) and <strong>phishing-resistant MFA</strong> (so a known password still cannot log in). Colonial Pipeline fell because one of these — MFA — was missing on one account.</p></div></div>\n<h3>3.3 Cracking craft — modes, attacks, and why bcrypt wins</h3>\n<p>To crack a hash you must first <strong>identify</strong> it (by length and format, or with <code>hashid</code>), then tell the tool which algorithm (<code>-m</code> mode) and which strategy (<code>-a</code> attack) to use:</p>\n<div class='tablewrap'><table><thead><tr><th>hashcat <code>-m</code></th><th>Hash</th><th>Looks like</th></tr></thead><tbody><tr><td><code>0</code></td><td>MD5</td><td>32 hex chars</td></tr><tr><td><code>100</code></td><td>SHA1</td><td>40 hex chars</td></tr><tr><td><code>1000</code></td><td>NTLM (Windows)</td><td>32 hex chars</td></tr><tr><td><code>1800</code></td><td>sha512crypt</td><td>starts <code>$6$</code></td></tr><tr><td><code>3200</code></td><td><strong>bcrypt</strong></td><td>starts <code>$2b$</code></td></tr></tbody></table></div>\n<p>Attack modes decide <em>what</em> you throw at it:</p>\n<ul>\n<li><code>-a 0</code> <strong>straight</strong> — a wordlist (e.g. <code>rockyou.txt</code>, ~14 million real leaked passwords).</li>\n<li><code>-a 0 -r rules/best64.rule</code> — the wordlist <strong>mutated</strong> by rules (<code>password</code> → <code>P@ssw0rd!</code>, <code>Password123</code>). This is what cracks \"complex\" passwords.</li>\n<li><code>-a 3</code> <strong>mask / brute force</strong> — every combination in a pattern, e.g. <code>?u?l?l?l?l?d?d</code> (upper, four lower, two digits).</li>\n</ul>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the cracking workflow</span></div><pre><code>hashid hash.txt                                    # which algorithm is this?\nhashcat -m 0 -a 0 hashes.txt rockyou.txt           # MD5, straight wordlist\nhashcat -m 0 -a 0 hashes.txt rockyou.txt -r rules/best64.rule   # + mutation rules\nhashcat -m 0 hashes.txt --show                     # show cracked (reads the potfile)</code></pre></div>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Why slow hashing is the whole defence</div><div class='callout-b'><p>A modern GPU tries <strong>billions of MD5 guesses per second</strong> — an unsalted-MD5 database falls in minutes. The <em>same</em> GPU manages only a few <strong>thousand bcrypt guesses per second</strong>, because bcrypt is deliberately slow and has a tunable <em>work factor</em> you raise as hardware improves. Salt defeats precomputed (rainbow) tables; slow hashing defeats brute force. That is why the storage choice — not the password policy — is what actually protects a stolen database.</p></div></div>\n<hr>\n<h2>4 · The SOC and Alert Triage</h2>\n<p>The <strong>Security Operations Centre</strong> is the team (or the one on-call person) that watches the alerts. It is usually tiered: <strong>Tier 1</strong> triages and escalates, <strong>Tier 2</strong> investigates, <strong>Tier 3</strong> hunts and handles the hard cases. Their core skill is <strong>triage</strong> — for each alert decide <strong>True Positive / False Positive / Needs Investigation</strong>, and escalate what matters.</p>\n<p>The tooling: a <strong>SIEM</strong> (Security Information and Event Management, e.g. Wazuh, Splunk) aggregates logs from across the estate and raises alerts against rules; <strong>SOAR</strong> automates the repetitive response (enrich, block, ticket). Two metrics govern effectiveness and appear in every board pack: <strong>MTTD</strong> (mean time to detect) and <strong>MTTR</strong> (mean time to respond). Lower is better; both are the difference between an incident and a breach.</p>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>The real enemy is alert fatigue</div><div class='callout-b'><p>A busy SIEM throws thousands of low-value alerts a day. A tired analyst starts closing them to clear the queue — and that is <em>precisely</em> when the real attack slips past, dressed as one more \"failed login\". Volume is not noise to be dismissed; <strong>volume is itself a signal</strong>. Many low-severity alerts from one source can be a single high-severity attack.</p></div></div>\n<figure class='fig'><div class='fig-svg'><svg viewBox=\"0 0 660 180\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\">\n  <defs><marker id=\"soc-a\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"currentColor\"/></marker></defs>\n  <g text-anchor=\"middle\" font-size=\"9.5\">\n    <rect x=\"12\"  y=\"44\" width=\"104\" height=\"50\" rx=\"5\" fill=\"currentColor\" fill-opacity=\"0.07\" stroke=\"currentColor\"/>\n    <text x=\"64\" y=\"63\" fill=\"currentColor\" font-weight=\"bold\">log sources</text><text x=\"64\" y=\"77\" fill=\"currentColor\" opacity=\"0.8\">EDR, firewall,</text><text x=\"64\" y=\"88\" fill=\"currentColor\" opacity=\"0.8\">DNS, auth</text>\n    <rect x=\"150\" y=\"44\" width=\"120\" height=\"50\" rx=\"5\" fill=\"var(--blue,#5b8def)\" fill-opacity=\"0.14\" stroke=\"currentColor\"/>\n    <text x=\"210\" y=\"62\" fill=\"currentColor\" font-weight=\"bold\">SIEM</text><text x=\"210\" y=\"76\" fill=\"currentColor\" opacity=\"0.8\">collect · parse</text><text x=\"210\" y=\"87\" fill=\"currentColor\" opacity=\"0.8\">correlate → alert</text>\n    <rect x=\"304\" y=\"44\" width=\"110\" height=\"50\" rx=\"5\" fill=\"var(--gold,#e0a93b)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"359\" y=\"62\" fill=\"currentColor\" font-weight=\"bold\">Tier 1 triage</text><text x=\"359\" y=\"78\" fill=\"currentColor\" opacity=\"0.8\">TP / FP / ?</text>\n    <rect x=\"448\" y=\"44\" width=\"116\" height=\"50\" rx=\"5\" fill=\"var(--brand,#8b5cf6)\" fill-opacity=\"0.16\" stroke=\"currentColor\"/>\n    <text x=\"506\" y=\"62\" fill=\"currentColor\" font-weight=\"bold\">Tier 2/3 + SOAR</text><text x=\"506\" y=\"78\" fill=\"currentColor\" opacity=\"0.8\">investigate · hunt</text>\n    <rect x=\"596\" y=\"50\" width=\"56\" height=\"38\" rx=\"5\" fill=\"var(--green,#4cae74)\" fill-opacity=\"0.20\" stroke=\"currentColor\"/>\n    <text x=\"624\" y=\"73\" fill=\"currentColor\" font-weight=\"bold\">respond</text>\n  </g>\n  <g stroke=\"currentColor\" fill=\"none\" stroke-width=\"1.4\">\n    <line x1=\"116\" y1=\"69\" x2=\"148\" y2=\"69\" marker-end=\"url(#soc-a)\"/>\n    <line x1=\"270\" y1=\"69\" x2=\"302\" y2=\"69\" marker-end=\"url(#soc-a)\"/>\n    <line x1=\"414\" y1=\"69\" x2=\"446\" y2=\"69\" marker-end=\"url(#soc-a)\"/>\n    <line x1=\"564\" y1=\"69\" x2=\"594\" y2=\"69\" marker-end=\"url(#soc-a)\"/>\n  </g>\n  <g stroke=\"currentColor\" stroke-width=\"1\" opacity=\"0.6\">\n    <line x1=\"64\" y1=\"110\" x2=\"359\" y2=\"110\"/><text x=\"210\" y=\"124\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\">MTTD — time to detect</text>\n    <line x1=\"359\" y1=\"140\" x2=\"624\" y2=\"140\"/><text x=\"490\" y=\"154\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"currentColor\">MTTR — time to contained</text>\n  </g>\n</svg></div><figcaption>The SOC pipeline — logs to a decision, measured by MTTD/MTTR</figcaption></figure>\n<hr>\n<h2>5 · Correlation — The Master Skill</h2>\n<p>Ten alerts are rarely ten problems. They are usually <strong>one attack seen from ten angles</strong>. Correlation is the discipline of linking alerts by a shared indicator — most often a <strong>source IP</strong> — into a single narrative, and then asking the only question that matters: <em>did it work?</em></p>\n<p>In this course you triage a realistic <strong>Wazuh</strong> alert feed (a JSON file) with <code>jq</code>, rather than stand up a full SIEM — the deployment needs far more RAM than a classroom laptop has, but the <em>skill</em> is identical.</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — correlate a Wazuh feed with jq</span></div><pre><code># Rank alerts by severity to see what matters\njq -r '.[] | \"\\(.rule.level)\\t\\(.rule.description)\"' assets/wazuh-alerts.json | sort -rn | head\n\n# Which source IP appears most? (the thread that ties the story together)\njq -r '.[].data.srcip // empty' assets/wazuh-alerts.json | sort | uniq -c | sort -rn\n\n# What is the single highest severity firing?\njq '[.[].rule.level] | max' assets/wazuh-alerts.json</code></pre></div>\n<p>Read the output as a timeline. Dozens of <strong>failed SSH logins</strong> from one IP (brute force, ATT&amp;CK <strong>T1110</strong>) → a <strong>web scan</strong> from the <em>same</em> IP → an <strong>authentication SUCCESS</strong> from that IP → a <strong>sudo to root</strong> → a <strong>new cron job created as root</strong> (persistence, ATT&amp;CK <strong>T1053</strong>). Individually: noise. Correlated by that shared source IP: a brute-force that <strong>succeeded</strong>, escalated to admin, and established persistence. That is the difference between \"we had alerts\" and \"we caught the intrusion\".</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a few more jq patterns for triage</span></div><pre><code># Build a timeline: timestamp + rule for one source IP\njq -r '.[] | select(.data.srcip==\"10.13.4.66\") | \"\\(.timestamp)\\t\\(.rule.description)\"' assets/wazuh-alerts.json | sort\n# Only the high-severity alerts (level &gt;= 10)\njq -r '.[] | select(.rule.level&gt;=10) | .rule.description' assets/wazuh-alerts.json\n# Did a success follow the failures from that IP? (the question that matters)\njq -r '.[] | select(.data.srcip==\"10.13.4.66\") | .rule.description' assets/wazuh-alerts.json | grep -i accept</code></pre></div>\n<hr>\n<h2>6 · Detection Engineering — Catching It, Not Just Finding It</h2>\n<p>The SOC in §4 <em>triages</em> alerts; but a good alert doesn't appear by magic — someone <strong>engineers</strong> it. Detection engineering is the discipline that turns \"we should catch brute-force-then-success\" into a rule that fires reliably and rarely cries wolf. The lifecycle:</p>\n<p><strong>Use case → log source → rule → test → tune → document the response.</strong></p>\n<p>You pick a behaviour worth catching (a use case), confirm the <strong>log source</strong> actually shows it (no DNS log → no DNS detection, Module 3's lesson), write the <strong>rule</strong>, <strong>test</strong> it against real attack traffic <em>and</em> a normal day, <strong>tune</strong> out the false positives, and write the <strong>response</strong> so the Tier-1 analyst knows what to do when it fires.</p>\n<h3>6.1 Detection as code — Sigma and Wazuh</h3>\n<p>Modern teams write detections as <strong>code</strong> so they are versioned and reviewed. <strong>Sigma</strong> is a vendor-neutral rule format that <em>compiles</em> to Splunk, Elastic, Wazuh and others — write once, deploy anywhere:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — a Sigma rule for the brute-force → success chain (illustrative)</span></div><pre><code>title: SSH brute force followed by a successful login (same source)\nlogsource: { product: linux, service: sshd }\ndetection:\n  failed:  { message|contains: 'Failed password' }\n  success: { message|contains: 'Accepted password' }\n  timeframe: 10m\n  condition: failed | count() by src_ip &gt;= 20 and success by src_ip\nlevel: high</code></pre></div>\n<p>The SIEM this course uses, <strong>Wazuh</strong>, expresses the same idea as a <em>composite</em> rule that fires only when the pattern repeats from one source:</p>\n<div class='term'><div class='term-bar'><span class='dots'><i></i><i></i><i></i></span><span class='term-title'>Terminal — the equivalent Wazuh composite rule</span></div><pre><code>&lt;rule id=\"100120\" level=\"12\" frequency=\"8\" timeframe=\"120\"&gt;\n  &lt;if_matched_sid&gt;5716&lt;/if_matched_sid&gt;   &lt;!-- 5716 = sshd authentication failed --&gt;\n  &lt;same_source_ip/&gt;\n  &lt;description&gt;Possible SSH brute force: 8+ failures from one IP in 120s&lt;/description&gt;\n&lt;/rule&gt;</code></pre></div>\n<h3>6.2 Tuning, SOAR and hunting</h3>\n<ul>\n<li><strong>Tuning.</strong> A rule too noisy gets ignored (alert fatigue again); too narrow and it misses the attack. You <strong>baseline</strong> normal, <strong>allow-list</strong> known scanners and backup jobs, and set thresholds from real data — then review the rule's hit rate.</li>\n<li><strong>Aim up the Pyramid of Pain</strong> (Module 1): a rule that matches the <em>behaviour</em> (\"20 failures then a success from one IP\") survives the attacker changing their IP; a rule that blocks one IP does not.</li>\n<li><strong>SOAR playbooks</strong> automate the dull, fast parts: on this alert, auto-enrich (geo-locate the IP, check threat intel), auto-contain (block the IP, disable the account), and open a ticket — so humans spend their time on judgement, not copy-paste.</li>\n<li><strong>Threat hunting</strong> is the proactive complement: <em>assume</em> a breach slipped past the rules and go looking with a hypothesis (\"if an attacker were living off the land, I'd see unusual <code>sudo</code> from a service account\") — findings become new detections.</li>\n</ul>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>A detection you haven&#x27;t tuned and tested is decoration</div><div class='callout-b'><p>The failure mode isn't too few rules — it's thousands of untuned rules nobody trusts. Fewer, well-tuned, behaviour-based detections with a clear response beat a wall of noisy ones every time. And none of it works without the <strong>log source</strong>: detection engineering begins with logging the right thing.</p></div></div>\n<hr>\n<h2>7 · Mapping the Chain to MITRE ATT&amp;CK</h2>\n<div class='tablewrap'><table><thead><tr><th>Stage</th><th>What happened</th><th>ATT&amp;CK technique</th></tr></thead><tbody><tr><td>Reconnaissance</td><td>Web fingerprint + content discovery</td><td>T1595 Active Scanning</td></tr><tr><td>Credential Access</td><td>SSH brute force / password spray</td><td><strong>T1110</strong> Brute Force</td></tr><tr><td>Credential Access</td><td>Cracking looted unsalted-MD5 hashes</td><td>T1110.002 Password Cracking</td></tr><tr><td>Initial Access / Persistence of access</td><td>Logging in with a cracked/valid account</td><td>T1078 Valid Accounts</td></tr><tr><td>Privilege Escalation</td><td>Gaining root</td><td>TA0004 (e.g. T1548)</td></tr><tr><td>Persistence</td><td>New root cron job</td><td><strong>T1053.003</strong> Scheduled Task/Job: Cron</td></tr></tbody></table></div>\n<hr>\n<h2>8 · Scenarios — The Unpatched Flaw and the Weak Credential</h2>\n<div class='callout callout-ghana'><div class='callout-h'><span class='ci'>🇬🇭</span>Ghana &amp; West Africa</div><div class='callout-b'><p>At 02:00 a SOC analyst at a Ghanaian bank sees dozens of low-severity \"failed SSH login\" alerts — trivially easy to wave through when tired. But <strong>one source IP is behind all of them</strong>, and minutes later there is an \"authentication success\" from that same IP, then a \"sudo to root\", then a new cron job. Individually: noise. <strong>Correlated: a brute force that succeeded and escalated to admin.</strong> The breached institutions almost always <em>had</em> the alerts — they simply did not correlate them in time. The same pattern drives MoMo-agent account takeovers across the region.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Equifax, 2017 — 147 million people</div><div class='callout-b'><p>The breach exploited <strong>CVE-2017-5638</strong> in Apache Struts — a vulnerability with a patch available for <strong>months</strong> before the attack. A functioning vulnerability-management loop (discover → prioritise → remediate → <strong>verify</strong>) would have closed it. This is the price of a broken loop, and why <em>verify</em> is not optional.</p></div></div>\n<div class='callout callout-case'><div class='callout-h'><span class='ci'>📁</span>Colonial Pipeline, 2021 — fuel to the US east coast halted</div><div class='callout-b'><p>Ransomware entered through a <strong>single reused VPN password with no MFA</strong>. Not an exotic zero-day — a credential-and-MFA failure, exactly the threat Hydra and John exist to make you take seriously. One missing control on one account stopped a pipeline.</p></div></div>\n<hr>\n<h2>9 · The Worked Investigation (what the lab asks of you)</h2>\n<p><code>labctl start m4</code> gives you a <strong>leaky Apache web server</strong> (<code>10.13.4.10</code>) and an <strong>SSH host with a weak account</strong> (<code>10.13.4.20</code>), plus a looted hash file and a realistic <strong>Wazuh</strong> alert feed. Work it end to end:</p>\n<ol>\n<li><strong>Assess the web server</strong> — fingerprint it (Apache), discover the exposed <code>/admin/</code> path with gobuster, and loot the world-readable <code>db_dump.sql</code> and the <code>config.php.bak</code> that leaks the <strong>database password</strong>.</li>\n<li><strong>Crack the loot</strong> — recognise the storage weakness (<strong>unsalted MD5</strong>), extract the <code>admin</code> hash, and crack it to plaintext with hashcat/John. Crack the <code>backup</code> account too, and demonstrate Hydra recovering the SSH password.</li>\n<li><strong>Triage the SOC feed</strong> — with <code>jq</code>, find the <strong>source IP</strong> behind both the brute force and the web scan, the <strong>highest Wazuh rule level</strong>, whether the attacker <strong>got in</strong>, and how they established <strong>persistence</strong> (the root cron job → T1053).</li>\n</ol>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>Your values are unique</div><div class='callout-b'><p>The admin password (and therefore its MD5 hash) and the leaked database password are <strong>randomised per student</strong>; the examples here are illustrative. Crack and report <em>your own</em> values — <code>labctl verify m4</code> grades against your personal answer key, so a classmate's plaintext will fail.</p></div></div>\n<p>Then write the two deliverables: a <strong>remediation register</strong> that prioritises by CVSS + KEV + exposure + criticality, and a <strong>SOC case ticket</strong> that correlates the alerts into one incident with its ATT&amp;CK mapping. Use <code>labctl worksheet m4</code>.</p>\n<hr>\n<h2>Common mistakes</h2>\n<div class='callout callout-warning'><div class='callout-h'><span class='ci'>⚠</span>What trips students up</div><div class='callout-b'><ul>\n<li><strong>Chasing CVSS alone.</strong> A 9.8 nobody can reach matters less than a 6.5 on your internet-facing payroll box that is in KEV.</li>\n<li>**Skipping <em>verify</em>.** \"Patched\" without confirmation is how Equifax-shaped holes stay open.</li>\n<li><strong>Running Hydra/John/hashcat outside the lab.</strong> Only the authorised targets and the provided hashes — anywhere else is an offence under Act 1038.</li>\n<li><strong>Closing alerts to clear the queue.</strong> \"Resolved\" without investigation is where breaches hide.</li>\n<li><strong>Dismissing a low-severity flood.</strong> Volume from one source <em>is</em> the signal.</li>\n<li><strong>Reporting alerts, not an incident.</strong> The deliverable is the correlated story, not a list.</li>\n</ul></div></div>\n<hr>\n<h2>Key takeaways</h2>\n<div class='callout callout-key'><div class='callout-h'><span class='ci'>🔑</span>Carry these out of Module 4</div><div class='callout-b'><ul>\n<li>Vulnerability management is a <strong>loop</strong> — discover → prioritise → remediate → <strong>verify</strong> → repeat.</li>\n<li>Prioritise by <strong>CVSS + KEV + EPSS + context</strong>; context and active exploitation outrank the raw score.</li>\n<li>Web assessment: <strong>nmap/whatweb → Nikto → gobuster → loot</strong>; forgotten backups and <code>*.bak</code> configs are the classic finding.</li>\n<li><strong>Read the CVSS vector</strong> (AV:N/PR:N/UI:N → the 9.8 profile), not just the number; <strong>KEV = temporal, context = environmental.</strong> Patch to an <strong>SLA</strong>; when you can't, deploy a <strong>compensating control</strong>, then <strong>verify</strong>.</li>\n<li><strong>Unsalted MD5 is broken;</strong> salt defeats rainbow tables and <strong>slow hashing (bcrypt)</strong> defeats brute force — a GPU does billions of MD5/s but only thousands of bcrypt/s. <strong>Hydra</strong> = online guessing; <strong>hashcat/John</strong> = offline cracking; <strong>MFA</strong> makes a cracked password insufficient.</li>\n<li>SOC = <strong>Tier 1/2/3 + SIEM/SOAR</strong>; watch <strong>MTTD/MTTR</strong>; beware <strong>alert fatigue</strong>.</li>\n<li><strong>Correlation</strong> turns ten alerts into one incident; <strong>detection engineering</strong> encodes that into a tuned, behaviour-based rule (Sigma/Wazuh) with a SOAR response. ATT&amp;CK: <strong>T1110</strong> (brute force), <strong>T1053</strong> (cron persistence).</li>\n</ul></div></div>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>CVSS 9.1 on an internal test box (not in KEV) vs CVSS 6.8 on your public payment portal, listed in KEV. Which first, and why?</strong> → The 6.8 — internet-facing, critical asset, and <em>actively exploited</em> (KEV). Context and exploitation beat the raw score.</li>\n</ol>\n<ol>\n<li><strong>What does CISA KEV tell you that CVSS does not?</strong> → Whether the vulnerability is being <em>actively exploited in the wild right now</em> — turning a theoretical score into a present threat.</li>\n</ol>\n<ol>\n<li><strong>Hydra vs hashcat/John — the core difference, and the defence against each?</strong> → Hydra guesses against a <em>live</em> service (online, rate-limited) — defeated by lockout/throttling + MFA. hashcat/John crack <em>stolen hashes</em> offline (no lockout, very fast) — defeated by salting + slow hashes.</li>\n</ol>\n<ol>\n<li><strong>Failed logins, a web scan and a successful login — all from 10.13.4.66. How many incidents, and what's the skill?</strong> → One incident — a successful intrusion. The skill is <strong>correlation</strong> by shared indicator (the source IP).</li>\n</ol>\n<ol>\n<li><strong>A cracked password is bad; what single control makes it insufficient alone?</strong> → Phishing-resistant <strong>MFA</strong>.</li>\n</ol>\n<ol>\n<li><strong>Why do we deliberately store the lab's passwords as unsalted MD5?</strong> → To let you <em>see</em> why it is broken — identical passwords share a hash and are precomputed/cracked in seconds; the fix is per-password salt + a slow hash.</li>\n</ol>\n<ol>\n<li><strong>A finding's CVSS vector is <code>AV:N/AC:L/PR:N/UI:N/...C:H/I:H/A:H</code>. Why is that the worst-case profile?</strong> → Reachable over the <strong>network</strong>, <strong>low</strong> complexity, <strong>no</strong> privileges and <strong>no</strong> user interaction, with full impact — an unauthenticated remote exploit anyone can run. That's the ~9.8 profile of Struts/VPN-style RCEs.</li>\n</ol>\n<ol>\n<li><strong>Your brute-force rule fires 300 times a day, all false positives, so the team mutes it. What went wrong and how do you fix it?</strong> → It wasn't <strong>tuned</strong> — baseline normal, allow-list known scanners/backup jobs, and raise the threshold to a real attack pattern (e.g. 20 failures <em>then a success</em> from one IP). An untuned rule is worse than none: it trains the team to ignore alerts.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>CVE / CVSS</strong> — a vulnerability's catalogue id / its 0–10 severity score.</li>\n<li><strong>CISA KEV</strong> — the catalogue of vulnerabilities known to be actively exploited.</li>\n<li><strong>EPSS</strong> — predicted probability a CVE will be exploited in the next 30 days.</li>\n<li><strong>Nikto / whatweb / gobuster</strong> — web-vuln scanner / web fingerprinter / content brute-forcer.</li>\n<li><strong>Hash / salt</strong> — a password's one-way fingerprint / per-password randomness that defeats precomputation.</li>\n<li><strong>Unsalted MD5</strong> — a fast, broken storage scheme; <code>-m 0</code> in hashcat.</li>\n<li><strong>Hydra / hashcat / John</strong> — online guesser / offline GPU cracker / offline CPU cracker.</li>\n<li><strong>CVSS vector</strong> — the metric string (AV/AC/PR/UI/S/C/I/A) behind the score; base vs temporal vs environmental.</li>\n<li><strong>Patch SLA / compensating control</strong> — the deadline to fix by severity / a stop-gap (WAF, segmentation) when you can't patch yet.</li>\n<li><strong>hashcat mode (<code>-m</code>) / attack (<code>-a</code>)</strong> — which algorithm / which strategy (wordlist, rules, mask).</li>\n<li><strong>rockyou / potfile / rules</strong> — a 14M-password wordlist / hashcat's store of cracked hashes / mutations applied to a wordlist.</li>\n<li><strong>SIEM / SOAR</strong> — alert aggregation &amp; rules / automated response (playbooks).</li>\n<li><strong>Detection engineering</strong> — building and tuning the rules that generate good alerts (as code: Sigma, Wazuh).</li>\n<li><strong>Sigma</strong> — a vendor-neutral detection-rule format that compiles to many SIEMs.</li>\n<li><strong>Threat hunting</strong> — proactively searching for intrusions the rules missed, hypothesis-first.</li>\n<li><strong>MTTD / MTTR</strong> — mean time to detect / to respond.</li>\n<li><strong>Triage / correlation</strong> — classifying alerts / linking them into one incident.</li>\n<li><strong>KEV, cron persistence</strong> — see ATT&amp;CK <strong>T1110</strong>, <strong>T1053.003</strong>.</li>\n</ul>", "sheets": [{"name": "m4-remediation-register.md", "html": "<h1>Vulnerability Remediation Register &amp; SOC Case Ticket — Module 4 Deliverable</h1>\n<p><strong>Analyst:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Authorised targets:</strong> 10.13.4.10, 10.13.4.20</p>\n<blockquote>Two deliverables from one investigation: a <strong>remediation register</strong> that</blockquote>\n<blockquote>prioritises by more than CVSS, and a <strong>SOC case ticket</strong> that correlates the</blockquote>\n<blockquote>alert feed into one incident. See <code>labctl learn m4</code>.</blockquote>\n<hr>\n<h2>Part A — Remediation Register</h2>\n<p><em>Prioritise by severity <strong>and</strong> active exploitation (CISA KEV), exposure and asset criticality — not CVSS alone.</em></p>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Finding (from Nikto / scan / loot)</th><th>CVSS</th><th>In KEV?</th><th>Exposure</th><th>Asset criticality</th><th>Priority</th><th>Fix</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> config.php.bak leaks DB password</td><td>—</td><td>—</td><td>Internet</td><td>High</td><td><strong>High</strong></td><td>Delete file; rotate credential</td><td>IT</td><td>[ ]</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<p><strong>Priority rule of thumb:</strong> internet-facing + KEV + critical asset = do first, even at a lower CVSS.</p>\n<p><strong>Credential findings (from cracking):</strong></p>\n<ul>\n<li>Password storage scheme observed: [ ] — <em>why it is weak:</em> [ ]</li>\n<li>Accounts cracked (do <strong>not</strong> paste full plaintext in a shared doc — note count + strength): [ ]</li>\n<li>Single control that would make these cracks harmless: [ ]</li>\n</ul>\n<hr>\n<h2>Part B — SOC Triage Case Ticket</h2>\n<p><strong>Ticket ref:</strong> [ ]  <strong>Analyst:</strong> [your name]  <strong>Opened:</strong> [date/time]</p>\n<div class='tablewrap'><table><thead><tr><th>Field</th><th>Detail</th></tr></thead><tbody><tr><td>Alert(s) involved</td><td>[rule IDs / descriptions]</td></tr><tr><td>Source IP (correlating indicator)</td><td>[ ]</td></tr><tr><td>Highest Wazuh rule level</td><td>[ ]</td></tr><tr><td>Correlation — the one-paragraph story</td><td>[how the alerts link: scan + brute force + success + escalation + persistence, all from one IP]</td></tr><tr><td>Classification</td><td>[True Positive / False Positive / Needs Investigation]</td></tr><tr><td>Did the attacker succeed?</td><td>[evidence — e.g. auth success after the failures]</td></tr><tr><td>Persistence established?</td><td>[e.g. root cron job → T1053.003]</td></tr><tr><td>ATT&amp;CK techniques</td><td>[e.g. T1110 Brute Force, T1053 Scheduled Task/Job]</td></tr><tr><td>Containment action</td><td>[e.g. block IP, disable account, kill cron, rotate creds]</td></tr><tr><td>Escalated to</td><td>[Tier 2/3 / IR lead]</td></tr><tr><td>Status</td><td>[open / contained / closed]</td></tr></tbody></table></div>\n<h3>Evidence timeline</h3>\n<p>[Key log lines in time order that justify the classification — the proof.]</p>\n<h3>Detection to add (so you catch the next one automatically)</h3>\n<ul>\n<li><strong>Behaviour to catch:</strong> [e.g. N+ SSH failures then a success from one source IP in M minutes]</li>\n<li><strong>Log source required:</strong> [e.g. sshd auth logs shipped to the SIEM]</li>\n<li><strong>Rule (Sigma/Wazuh sketch):</strong> [threshold, timeframe, same-source-IP condition]</li>\n<li><strong>Tuning / allow-list:</strong> [known scanners, backup jobs, admin jump host]</li>\n<li><strong>SOAR response:</strong> [auto-enrich IP, block, disable account, open ticket]</li>\n</ul>\n<hr>\n<h2>Self-check before you submit</h2>\n<ul>\n<li>[ ] Every priority in Part A reflects <strong>KEV + exposure + criticality</strong>, not just CVSS.</li>\n<li>[ ] The cracked values are <strong>my own</strong> (randomised per student).</li>\n<li>[ ] Part B tells <strong>one</strong> story from the shared source IP, not a list of alerts.</li>\n<li>[ ] I stated plainly <strong>whether the attacker got in</strong> and <strong>how they persisted</strong>.</li>\n<li>[ ] I only touched 10.13.4.10 / 10.13.4.20 and the provided hashes.</li>\n</ul>\n<h2>Grading rubric (100 pts)</h2>\n<div class='tablewrap'><table><thead><tr><th>Band</th><th>Register &amp; prioritisation (35)</th><th>Cracking &amp; controls (25)</th><th>Correlation &amp; \"did it work?\" (25)</th><th>Containment &amp; ATT&amp;CK (15)</th></tr></thead><tbody><tr><td>Excellent (full)</td><td>Findings prioritised by KEV+exposure+criticality, each with a fix/owner/date</td><td>Weakness named, cracks demonstrated, MFA/salting argued</td><td>One clear incident from the shared IP; success + persistence proven</td><td>Right containment steps; correct ATT&amp;CK IDs</td></tr><tr><td>Adequate (~60%)</td><td>Mostly CVSS, some context</td><td>Cracks done, control argument thin</td><td>Alerts linked but story loose</td><td>Generic actions, partial ATT&amp;CK</td></tr><tr><td>Weak (&lt;40%)</td><td>CVSS-only list</td><td>\"cracked some\" with no reasoning</td><td>Alerts listed, not correlated</td><td>No containment / no ATT&amp;CK</td></tr></tbody></table></div>\n<hr>\n<h2>Worked example (reference — fictional \"Adom Microfinance Ltd\")</h2>\n<p><em>Illustrative values — yours are randomised.</em></p>\n<p><strong>Part A (top items):</strong> (1) <code>config.php.bak</code> leaks the live DB password — internet-facing, High asset → <strong>High</strong>: delete, rotate credential (IT, this week). (2) World-readable <code>/backup/db_dump.sql</code> with <strong>unsalted-MD5</strong> passwords — Internet, High → <strong>High</strong>: remove, enforce salted bcrypt, force reset (IT). (3) Exposed <code>/admin/</code> with weak auth — Internet, High → <strong>High</strong>: restrict + MFA. (4) Outdated Apache modules (CVSS 7.5, <strong>in KEV</strong>) — <strong>High</strong> over an internal CVSS 8.1 not in KEV: patch, then <strong>verify</strong>.</p>\n<p><strong>Credentials:</strong> storage = unsalted MD5 (identical passwords share a hash, precomputed in seconds). Cracked: <code>admin</code> (a top-100 password) and <code>backup</code> (<code>12345</code>); SSH <code>labuser</code> fell to Hydra. <strong>One control makes all of this harmless: phishing-resistant MFA.</strong></p>\n<p><strong>Part B:</strong> source IP <strong>10.13.4.66</strong> behind both the web scan and the SSH brute force; highest rule level <strong>12</strong>. Story: scan (T1595) → dozens of failed SSH logins (T1110) → <strong>authentication SUCCESS</strong> (rule 5715) from the same IP → sudo-to-root → <strong>new root cron job</strong> (persistence, T1053.003). Classification: <strong>True Positive — intrusion succeeded and persisted.</strong> Containment: block 10.13.4.66, disable <code>labuser</code>, remove the cron job, rotate all cracked creds, escalate to IR lead. <strong>BLUF:</strong> <em>\"An attacker brute-forced a weak SSH account, got root and installed a cron backdoor — contain now; the host is owned.\"</em></p>"}]}, "m5": {"day": 3, "title": "Module 5 — Cyber Fraud, BEC & Mobile Money Security", "lesson": "<h1>Module 5 — Cyber Fraud, BEC &amp; Mobile Money Security</h1>\n<p><strong>Day 3 · Morning Session · ~4 hours · Hands-on lab: <code>labctl start m5</code></strong></p>\n<p>The most expensive cyberattacks in Ghana — and among the most expensive on earth — do not break encryption, bypass a firewall, or drop any malware. They break <strong>trust</strong>. They convince a real, competent, well-meaning person to send money to the wrong account, and they do it so plausibly that the victim never suspects until the funds are gone. This module teaches you to prove that fraud from the evidence the attacker <em>cannot</em> hide — the email's headers and the attachment's metadata — and then to design the one process control that stops the entire category.</p>\n<p>The two registers again. The <strong>conceptual</strong> half explains <em>why</em> fraud works: the psychology it weaponises, the Ghana-specific mobile-money threats, and the process failure that every BEC exploits. The <strong>practical</strong> half makes you an investigator: reading full email headers, tracing a message to the server that truly sent it, exposing SPF/DKIM/DMARC failures, and running <strong>exiftool</strong> on a malicious attachment to recover the attacker's own author name, authoring timezone, and — devastatingly — proof that they prepared the fraud <em>days before</em> they sent it.</p>\n<div class='callout callout-outcome'><div class='callout-h'><span class='ci'>🎯</span>By the end of this module you will be able to</div><div class='callout-b'><ol>\n<li>Define <strong>Business Email Compromise (BEC)</strong> and name its five classic plays.</li>\n<li>Explain <em>why</em> fraud works using the <strong>Fraud Triangle</strong> and <strong>Cialdini's principles</strong>, and recognise the BEC signature in a message.</li>\n<li>Read a full header set — the <strong><code>Received</code> chain</strong> (bottom-up to the originating IP), <code>Return-Path</code>, <code>Reply-To</code>, Message-ID and X-headers — versus the attacker-controlled <code>From:</code> display.</li>\n<li>Read an <strong><code>Authentication-Results</code></strong> header in detail (<code>smtp.mailfrom</code> vs <code>header.from</code>, DMARC alignment) and use the genuine-vs-spoof contrast as proof.</li>\n<li><strong>Harden your own domain</strong> — publish SPF <code>-all</code>, DKIM, and roll DMARC from <code>p=none</code> to <code>p=reject</code> — so your brand can't be spoofed.</li>\n<li>Recover <strong>attachment metadata</strong> with <strong>exiftool</strong> (PDF and Office/OOXML), triage macros with <strong>olevba</strong>, and prove <strong>premeditation</strong> from the timestamps.</li>\n<li>Explain the Ghana <strong>mobile-money</strong> fraud taxonomy (SIM swap, vishing, prompt-approval, reversal scams), the ecosystem (BoG/GhIPSS/telcos, SS7), and the controls that hold.</li>\n<li><strong>Follow the money</strong> — mules, layering and cash-out — act within the <strong>golden hour</strong> to freeze/recall, and work the <strong>Ghana reporting chain</strong> (bank fraud desk → receiving bank/telco → CSA/CERT-GH → BoG → Police Cybercrime/EOCO).</li>\n<li>Build a defensible <strong>evidence timeline</strong> and specify the fraudulent payment details for a <strong>bank recall</strong>.</li>\n<li>Design the <strong>dual-control + out-of-band callback</strong> process that defeats BEC, and map the attack to <strong>MITRE ATT&amp;CK (T1566 / T1656)</strong>.</li>\n</ol></div></div>\n<h3>Session structure</h3>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Content</th></tr></thead><tbody><tr><td>0:00 – 0:25</td><td>Fraud is deception, not malware: BEC and its five plays</td></tr><tr><td>0:25 – 1:00</td><td>The psychology: Fraud Triangle, Cialdini, and the BEC signature</td></tr><tr><td>1:00 – 1:45</td><td>Email header forensics: the Received chain, Authentication-Results, genuine vs spoof</td></tr><tr><td>1:45 – 2:00</td><td>Break</td></tr><tr><td>2:00 – 2:25</td><td>Hardening your own email: SPF/DKIM and the DMARC p=none→reject rollout</td></tr><tr><td>2:25 – 2:55</td><td>Attachment forensics: exiftool (PDF + Office), olevba, proving premeditation</td></tr><tr><td>2:55 – 3:25</td><td>Mobile money fraud + follow the money: mules, the golden hour, the reporting chain</td></tr><tr><td>3:25 – 3:45</td><td>The control that stops BEC: dual control + out-of-band callback</td></tr><tr><td>3:45 – 4:15</td><td>Lab: <code>labctl start m5</code> — work the thread, write the fraud brief</td></tr></tbody></table></div>\n<div class='callout callout-note'><div class='callout-h'><span class='ci'>ℹ</span>Before you begin</div><div class='callout-b'><p><strong>Pre-reading:</strong> one FBI IC3 BEC advisory, and the headers of any real email in your own inbox (view \"Show original\"). <strong>Lab requirement:</strong> a Kali terminal with <code>grep</code>, <code>exiftool</code>, <code>pdfinfo</code>, <code>dig</code>, <code>whois</code>. This lab is <strong>file-based</strong> — the evidence is in the lab's <code>assets/</code>; nothing t
