 you hold data about identifiable people — customers, citizens, staff — it applies to you.</li>\n<li><strong>Cybersecurity Act 2020 (Act 1038)</strong> governs <em>cybersecurity</em>. It created the <strong>Cyber Security Authority (CSA)</strong>, licenses cybersecurity providers, designates <strong>Critical Information Infrastructure (CII)</strong>, and sets incident-reporting duties. <strong>CERT-GH</strong> is the national coordination centre under the CSA.</li>\n</ul>\n<p>Act 843 rests on data-protection <strong>principles</strong>: process data lawfully and for a stated <strong>purpose</strong>; collect only what you need (<strong>minimisation</strong>); keep it <strong>accurate</strong> and <strong>secure</strong>; keep it only as long as needed (<strong>retention</strong>); and be <strong>accountable</strong> for all of it. Practical rule: <em>if you hold personal data in Ghana, you are a data controller — register with the DPC, comply, protect.</em></p>\n<p>Two roles with different obligations:</p>\n<ul>\n<li><strong>Data controller</strong> — decides <em>why and how</em> data is processed (your institution). Carries the primary legal liability.</li>\n<li><strong>Data processor</strong> — processes it <em>on the controller's behalf</em> (e.g. a cloud vendor). <strong>Outsourcing the processing does not outsource your accountability.</strong></li>\n</ul>\n<p>Some data is <strong>sensitive</strong> — health, biometrics, financial, criminal records — and demands heightened protection.</p>\n<h2>2. The global benchmark: GDPR</h2>\n<p>Even when it does not directly bind you, the EU <strong>GDPR</strong> sets the expectations clients, partners and regulators increasingly assume: a <strong>72-hour</strong> breach- notification norm, data-subject rights (access, rectification, erasure), <strong>Data Protection Impact Assessments (DPIAs)</strong> for high-risk processing, privacy by design and by default, and very large fines (up to 4% of global turnover). Its enforcement shows the stakes: <strong>British Airways</strong> and <strong>Marriott</strong> drew multi-million-pound penalties after breaches of customer data. Knowing GDPR tells you where the regulatory world is heading — and where Ghanaian practice is expected to meet it.</p>\n<h2>3. How breach response actually works — the first 72 hours</h2>\n<p>A disciplined order, aligned with the technical work in Module 6:</p>\n<ol>\n<li><strong>Contain first, investigate second</strong> — stop active access (while preserving evidence — Module 6's \"isolate, don't power off\").</li>\n<li><strong>Scope it</strong> — what data, which systems, how many people, is the attacker still present?</li>\n<li><strong>Triage notification</strong> — scope and data sensitivity drive the obligation.</li>\n<li><strong>Engage legal counsel</strong> <em>before</em> any external communication.</li>\n</ol>\n<p>Notification differs by breach type — a working mental grid:</p>\n<div class='tablewrap'><table><thead><tr><th>Breach type</th><th>Immediate action</th><th>Notification question</th></tr></thead><tbody><tr><td>Ransomware, systems encrypted only</td><td>Isolate, preserve, restore from clean backup</td><td>Was data <em>exfiltrated</em>? If yes, notification may apply</td></tr><tr><td>Ransomware + confirmed data theft</td><td>Isolate, preserve, engage counsel now</td><td>Notification likely — scope &amp; timing need legal advice</td></tr><tr><td>Phishing / credential compromise</td><td>Reset creds, revoke sessions, investigate</td><td>What could that account reach?</td></tr><tr><td>BEC / financial fraud</td><td>Preserve email evidence, contact bank to recall</td><td>Financial recovery first; data exposure may be secondary</td></tr><tr><td>Cloud misconfiguration exposing data</td><td>Remove public access, then scope duration</td><td>Duration + sensitivity drive the obligation</td></tr></tbody></table></div>\n<p>For <strong>CII operators</strong>, Act 1038 imposes <strong>mandatory incident reporting</strong> to the CSA/CERT-GH. Because exact timelines and formats can change, treat them as a matter to confirm with counsel and the current CSA directives — not to guess.</p>\n<h2>4. An analogy</h2>\n<p>Treat personal data as cash you hold <em>in trust</em> for other people. You don't own it; you are a custodian. You keep only what you were given reason to hold, store it in a safe, don't lend it out carelessly, return or destroy it when the reason ends — and you can be audited on how you handled it. Hiring a security-van firm (a processor) to move the cash does not end your responsibility for it; if they lose it, <em>you</em> still answer to the owner.</p>\n<h2>5. Scenarios — exposure and consequence</h2>\n<h3>Local (Ghana)</h3>\n<ul>\n<li>A Ghanaian hospital discovers a cloud repository of patient records left publicly accessible, with logs showing external downloads. Act 843 is squarely engaged: the data is <em>sensitive</em> (health); the hospital is the <em>controller</em> even though a vendor ran the cloud; and the download logs mean this is probable <em>exfiltration</em>, not mere exposure. The immediate steps — remove public access, preserve the logs, scope, and get counsel on DPC notification — are the fusion of Module 6's forensics and this module's law.</li>\n</ul>\n<h3>International (well-documented)</h3>\n<ul>\n<li><strong>Equifax, 2017.</strong> Beyond the technical failure, the aftermath — regulatory settlements, consumer redress, executive departures — showed that a breach is a <em>legal and governance</em> event, not only a technical one.</li>\n<li><strong>British Airways &amp; Marriott</strong> GDPR penalties demonstrated that regulators now fine inadequate protection of personal data heavily, independent of the attacker's sophistication.</li>\n</ul>\n<h2>6. Why it matters</h2>\n<ul>\n<li>Non-compliance carries real consequences — DPC enforcement, CSA action, and the reputational and financial hit of a public breach.</li>\n<li>Knowing your controller/processor status tells you <em>whose</em> responsibility a breach is (almost always still yours).</li>\n<li>A rehearsed first-72-hours process prevents the panicked missteps — destroyed evidence, premature public statements — that make breaches worse.</li>\n</ul>\n<h2>7. Common mistakes</h2>\n<ul>\n<li><strong>\"The cloud vendor is responsible.\"</strong> You remain the controller; accountability does not transfer.</li>\n<li><strong>Public statement before counsel.</strong> Early, wrong communication creates legal and reputational damage.</li>\n<li><strong>Assuming every breach must be notified — or that none must.</strong> Scope and sensitivity decide; confirm with counsel.</li>\n<li><strong>Keeping data \"just in case.\"</strong> Minimisation and retention limits are legal duties.</li>\n</ul>\n<h2>Put it to work</h2>\n<p>In the course you take a simulated healthcare data exposure, scope it from access logs and cloud findings, assess obligations under Act 843, list the questions for counsel, and produce a <strong>breach assessment</strong> and a <strong>compliance gap register</strong> with named owners (<code>labctl worksheet m8</code>) — feeding the Module 9 board memo and the Module 10 capstone's legal/privacy cell.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Act 843</strong> = personal data (DPC); <strong>Act 1038</strong> = cybersecurity (CSA, CII, reporting). <strong>GDPR</strong> is the global benchmark (72-hour norm, DPIAs, big fines).</li>\n<li>You are almost certainly a <strong>data controller</strong> — register and comply.</li>\n<li><strong>Outsourcing processing never outsources accountability.</strong></li>\n<li>First 72 hours: <strong>contain → scope → triage notification → counsel.</strong></li>\n<li>Notification depends on <strong>scope + data sensitivity</strong>; CII has mandatory reporting.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>A cloud vendor misconfigures storage and leaks your customers' data. Who is accountable under Act 843?</strong> → You — the data controller. The vendor is a processor; accountability does not transfer with the task.</li>\n</ol>\n<ol>\n<li><strong>Ransomware encrypts your systems but you find no evidence of data theft. Is the notification question the same as a confirmed-exfiltration breach?</strong> → No — the key question is whether data left your control. Encryption-only vs confirmed exfiltration are different; confirm specifics with counsel.</li>\n</ol>\n<ol>\n<li><strong>First action in the first 72 hours — investigate or contain?</strong> → Contain (stop active access) first — while preserving evidence — then investigate.</li>\n</ol>\n<ol>\n<li><strong>What is the GDPR breach-notification norm, and why should a Ghanaian institution care?</strong> → Notification to the regulator within 72 hours of becoming aware; it sets the expectation partners, clients and regulators increasingly assume.</li>\n</ol>\n<ol>\n<li><strong>Which Ghanaian body oversees personal data, and which oversees cybersecurity?</strong> → The Data Protection Commission (Act 843) and the Cyber Security Authority (Act 1038).</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Act 843</strong> — Ghana Data Protection Act 2012 (personal data; DPC).</li>\n<li><strong>Act 1038</strong> — Ghana Cybersecurity Act 2020 (CSA, CII, reporting).</li>\n<li><strong>GDPR</strong> — the EU data-protection regulation; the global benchmark.</li>\n<li><strong>Data controller / processor</strong> — decides how data is used / processes it for the controller.</li>\n<li><strong>CII</strong> — Critical Information Infrastructure, designated under Act 1038.</li>\n<li><strong>DPIA</strong> — Data Protection Impact Assessment for high-risk processing.</li>\n<li><strong>Data minimisation / retention</strong> — collect only what's needed / keep only as long as needed.</li>\n<li><strong>CERT-GH</strong> — national incident-response team under the CSA.</li>\n</ul>", "sheets": [{"name": "m8-breach-assessment.md", "html": "<h1>Data Breach Assessment — Module 8 Deliverable</h1>\n<p><strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Incident ref:</strong> [ ]</p>\n<blockquote>Work the first-72-hours order: **contain → scope → triage notification →</blockquote>\n<blockquote>counsel.** This assessment informs — it does not replace — legal advice. See</blockquote>\n<blockquote><code>labctl learn m8</code>.</blockquote>\n<h2>1. What happened</h2>\n<p>[Plain description of the breach.]</p>\n<h2>2. Classification</h2>\n<ul>\n<li>Breach type: [ransomware / phishing / BEC / cloud misconfiguration / other]</li>\n<li>Data involved: [ ]  <strong>Sensitive?</strong> [health / biometric / financial / criminal — yes/no]</li>\n<li>Volume: [approx. number of records / individuals]</li>\n<li>Was data <strong>exfiltrated</strong> (left your control), or only exposed/encrypted? [ ]</li>\n</ul>\n<h2>3. Our role under Act 843</h2>\n<ul>\n<li>Are we the <strong>data controller</strong> or <strong>processor</strong> for this data? [ ]</li>\n<li>(Remember: using a cloud vendor does <strong>not</strong> transfer your accountability.)</li>\n</ul>\n<h2>4. Containment &amp; scoping actions taken</h2>\n<div class='tablewrap'><table><thead><tr><th>Action</th><th>Date/time</th><th>By</th></tr></thead><tbody><tr><td>[e.g. removed public access / isolated host]</td><td></td><td></td></tr><tr><td>[preserved logs &amp; evidence]</td><td></td><td></td></tr></tbody></table></div>\n<h2>5. Notification triage</h2>\n<div class='tablewrap'><table><thead><tr><th>Question</th><th>Answer / status</th></tr></thead><tbody><tr><td>Did personal data leave our control?</td><td>[ ]</td></tr><tr><td>Is the data sensitive?</td><td>[ ]</td></tr><tr><td>Are we (or is this) CII under Act 1038?</td><td>[ ]</td></tr><tr><td>Does this likely trigger DPC notification?</td><td>[confirm with counsel]</td></tr><tr><td>Do affected individuals likely need to be told?</td><td>[confirm with counsel]</td></tr></tbody></table></div>\n<h2>6. Questions for legal counsel (before any external communication)</h2>\n<ol>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<h2>7. Immediate remediation</h2>\n<p>[What stops this recurring — the control gap to close.]</p>"}, {"name": "m8-compliance-gap-register.md", "html": "<h1>Compliance Gap Register — Module 8 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>Map your real practice against Act 843 (data protection) and Act 1038</blockquote>\n<blockquote>(cybersecurity). For each requirement: are you compliant, and if not, who owns</blockquote>\n<blockquote>closing the gap and by when? See <code>labctl learn m8</code>.</blockquote>\n<h2>Act 843 — Data Protection</h2>\n<div class='tablewrap'><table><thead><tr><th>Requirement</th><th>Compliant? (Y/P/N)</th><th>Evidence / gap</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>Registered with the Data Protection Commission</td><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Lawful basis &amp; purpose documented</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Data minimisation (collect only what's needed)</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Retention limits defined &amp; enforced</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Security safeguards for personal data</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Sensitive data given heightened protection</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Processor contracts with data-protection clauses</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Data-subject request process exists</td><td>[ ]</td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Act 1038 — Cybersecurity</h2>\n<div class='tablewrap'><table><thead><tr><th>Requirement</th><th>Compliant? (Y/P/N)</th><th>Evidence / gap</th><th>Owner</th><th>Target date</th></tr></thead><tbody><tr><td>Know whether we are designated CII</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Incident reporting process to CSA/CERT-GH</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Using licensed cybersecurity providers where required</td><td>[ ]</td><td></td><td></td><td></td></tr><tr><td>Current, owned cyber-risk documentation (CSA may request)</td><td>[ ]</td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Top 3 compliance gaps to close first</h2>\n<ol>\n<li>[requirement — why it's highest priority]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>\n<p>(Y = compliant · P = partial · N = not compliant)</p>"}]}, "m9": {"day": 5, "title": "Module 9 — Cyber Governance & Business Continuity", "lesson": "<h1>Module 9 — Cyber Governance &amp; Business Continuity</h1>\n<p><strong>Day 5 · Morning · Leadership module (no Kali lab — you brief a board)</strong></p>\n<p>Everything from the week only creates value if leadership can <em>govern</em> it — set direction, demand assurance, measure what matters, and keep the institution running through a crisis. This module teaches you to translate five days of technical work into the language of the board, and to build the resilience that decides whether an incident is a bad day or an existential one.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>distinguish governance from management and place accountability correctly;</li>\n<li>choose the metrics a board should actually care about;</li>\n<li>set recovery priorities with Business Impact Analysis, RTO and RPO;</li>\n<li>write a one-page board memo and run a crisis-command structure.</li>\n</ul>\n<hr>\n<h2>1. The big picture: governance is direction and assurance</h2>\n<p><strong>Governance is not management.</strong> Governance <em>sets direction and demands assurance</em> — the board decides risk appetite, approves policy and budget, and asks \"are we actually protected?\" Management <em>does the work</em> — the CISO and teams implement, operate and report. Confusing the two is the classic failure: when security is \"IT's problem\", no one at the top owns the risk, and <strong>Act 1038</strong> now makes that a legal problem, not merely a bad habit. <strong>NIST CSF 2.0's GOVERN function</strong> and <strong>ISO/IEC 27001</strong> (the information-security management-system standard) both exist to make this accountability explicit and auditable.</p>\n<p>The <strong>three lines model</strong> places accountability cleanly:</p>\n<ul>\n<li><strong>First line</strong> — operations <em>own and run</em> the risk day to day.</li>\n<li><strong>Second line</strong> — risk and compliance <em>oversee and challenge</em>.</li>\n<li><strong>Third line</strong> — internal audit provides <em>independent assurance</em>.</li>\n</ul>\n<p>And the <strong>policy hierarchy</strong>, general to specific: <strong>Policy → Standard → Procedure → Guideline.</strong> A policy says \"we protect data\"; a standard says \"AES-256 and MFA\"; a procedure gives the exact steps; a guideline offers advice.</p>\n<h2>2. Metrics that matter to a board</h2>\n<p>Boards drown in technical detail and starve for meaning. Translate security into business risk with a small, honest set of metrics:</p>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>What it measures</th><th>Why the board cares</th></tr></thead><tbody><tr><td>Patch compliance rate</td><td>% of critical fixes applied within SLA</td><td>Unpatched = open doors</td></tr><tr><td>MFA adoption</td><td>% of accounts with MFA</td><td>The single highest-impact control vs credential theft</td></tr><tr><td>Mean Time to Detect (MTTD)</td><td>Attack start → detection</td><td>Longer = more damage</td></tr><tr><td>Mean Time to Respond (MTTR)</td><td>Detection → containment</td><td>Longer = more cost</td></tr><tr><td>Phishing-sim failure rate</td><td>% of staff who click</td><td>The human firewall; should trend down</td></tr><tr><td>Backup restore test result</td><td>Last <em>verified</em> successful restore</td><td>A failed restore = no disaster recovery</td></tr></tbody></table></div>\n<p>A board that reviews these quarterly — especially the <strong>restore test</strong> — is doing the single most valuable thing a board can do for cyber resilience.</p>\n<h2>3. Business continuity: surviving and recovering</h2>\n<ul>\n<li><strong>Business Impact Analysis (BIA)</strong> — for each critical service, what fails downstream if it goes down? This ranks what to recover first.</li>\n<li><strong>RTO</strong> (Recovery Time Objective) — the maximum acceptable <em>downtime</em>.</li>\n<li><strong>RPO</strong> (Recovery Point Objective) — the maximum acceptable <em>data loss</em> (how far back the last good backup is).</li>\n<li><strong>ISO 22301</strong> — the business-continuity-management standard that formalises all of this.</li>\n<li><strong>Crisis command</strong> — a clear structure borrowed from emergency management (an <strong>Incident Command</strong> model): an <strong>Incident Commander</strong> over <strong>Technical</strong>, <strong>Communications</strong> and <strong>Legal/Privacy</strong> cells, with a <strong>decision log</strong> recording every call, who made it, and why. That log is your audit trail afterwards.</li>\n</ul>\n<h2>4. An analogy</h2>\n<p>A ship. The <strong>board</strong> is the owner, setting the destination and how much rough weather is acceptable (risk appetite). The <strong>captain</strong> (CISO) sails the ship, reports position, and raises the alarm. The owner does not steer — but they <em>insist</em> on knowing whether the lifeboats work, whether the crew has drilled, and whether the last inspection passed. A board that only hears \"all fine, trust me\" and never demands evidence is an owner who discovers the lifeboats leak when the ship is already going down.</p>\n<h2>5. Scenarios — governance decides the outcome</h2>\n<h3>Local (Ghana)</h3>\n<ul>\n<li>Recall the <strong>CSSPS disruption</strong> (Module 2). Whether a national-system outage is a bad day or a disaster is decided by <em>governance</em> questions asked long before: Had the board set an RTO for the service? Was there a tested recovery plan and an owner? Were backups verified? Institutions that answer \"yes\" recover in hours; those that assumed \"IT had it\" recover in weeks and headlines.</li>\n</ul>\n<h3>International (well-documented)</h3>\n<ul>\n<li><strong>Maersk / NotPetya, 2017 (~US$300M).</strong> The company survived a total IT wipe-out largely by chance — a single domain-controller backup had been offline (in a Ghana office) during the attack. Afterwards, Maersk rebuilt its resilience deliberately. The governance lesson every board now cites: <strong>tested recovery is not optional</strong>, and luck is not a strategy.</li>\n<li>Post-incident, the firms that recover reputation are those whose <strong>crisis communications</strong> were honest, prompt and coordinated — a governance capability, not a technical one.</li>\n</ul>\n<h2>6. Why it matters</h2>\n<ul>\n<li>Clear governance means someone <em>accountable</em> owns cyber risk before a crisis, not after.</li>\n<li>The right metrics let non-technical leaders make good funding and risk decisions.</li>\n<li>RTO/RPO agreed in advance turn a chaotic outage into an orderly, prioritised recovery.</li>\n</ul>\n<h2>7. Common mistakes</h2>\n<ul>\n<li><strong>\"Security is IT's problem.\"</strong> It is a board accountability under Act 1038.</li>\n<li><strong>Drowning the board in jargon.</strong> Report business risk and the six metrics, not CVE numbers.</li>\n<li><strong>Untested backups.</strong> An unverified backup is a hope, not a control — the restore test is the metric that matters.</li>\n<li><strong>No decision log in a crisis.</strong> Without it you cannot explain or defend your choices afterwards.</li>\n</ul>\n<h2>Put it to work</h2>\n<p>In the course you take conflicting reports of a critical outage and produce an <strong>executive cyber-risk memo</strong> and a <strong>service recovery priority table</strong> with RTO/RPO (<code>labctl worksheet m9</code>) — the deliverable you defend before an executive panel, and the leadership backbone of the Module 10 capstone.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li><strong>Governance sets direction and demands assurance; management executes.</strong> Anchored by <strong>CSF 2.0 GOVERN</strong> and <strong>ISO 27001</strong>.</li>\n<li><strong>Three lines</strong>: operations own risk, risk/compliance oversee, audit assures.</li>\n<li>Policy hierarchy: <strong>Policy → Standard → Procedure → Guideline.</strong></li>\n<li>Report <strong>board-level metrics</strong> (MFA %, MTTD/MTTR, patch rate, restore tests).</li>\n<li><strong>BIA + RTO + RPO</strong> drive recovery (<strong>ISO 22301</strong>); a <strong>decision log</strong> is your crisis audit trail.</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>The board asks \"are we secure?\" What kind of answer shows good governance?</strong> → Evidence, not reassurance: the six metrics and the top residual risks, so the board can <em>decide</em> rather than just trust.</li>\n</ol>\n<ol>\n<li><strong>RTO vs RPO?</strong> → RTO = maximum acceptable downtime; RPO = maximum acceptable data loss (how old the last recoverable backup can be).</li>\n</ol>\n<ol>\n<li><strong>Governance or management: approving the cybersecurity budget and risk appetite?</strong> → Governance (the board). Implementing the controls it funds is management.</li>\n</ol>\n<ol>\n<li>**Why is the backup <em>restore test</em> more important than the backup itself?** → A backup you have never restored may not work; only a verified restore proves you actually have disaster recovery — as Maersk's near-miss showed.</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Governance vs management</strong> — directing and assuring vs executing.</li>\n<li><strong>NIST CSF GOVERN / ISO 27001 / ISO 22301</strong> — governance function / ISMS standard / business-continuity standard.</li>\n<li><strong>Three lines model</strong> — operations / risk &amp; compliance / internal audit.</li>\n<li><strong>Policy hierarchy</strong> — Policy → Standard → Procedure → Guideline.</li>\n<li><strong>MTTD / MTTR</strong> — mean time to detect / respond.</li>\n<li><strong>BIA / RTO / RPO</strong> — business-impact analysis / max downtime / max data loss.</li>\n<li><strong>Decision log</strong> — timestamped record of crisis decisions and rationale.</li>\n</ul>", "sheets": [{"name": "m9-executive-risk-memo.md", "html": "<h1>Executive Cyber Risk Memo — Module 9 Deliverable</h1>\n<p><strong>To:</strong> [Board / Executive Committee]  <strong>From:</strong> [your name, role] <strong>Date:</strong> [YYYY-MM-DD]  <strong>Re:</strong> [subject]  <strong>Length target: ONE page.</strong></p>\n<blockquote>Write for decision-makers, not engineers. Lead with the decision you need.</blockquote>\n<blockquote>Use business language and the board metrics — not CVE numbers. See</blockquote>\n<blockquote><code>labctl learn m9</code>.</blockquote>\n<h2>Decision required</h2>\n<p>[State in one or two sentences exactly what you are asking the board to decide, approve or fund.]</p>\n<h2>Situation (3–4 sentences)</h2>\n<p>[What is happening / the risk, in business terms — money, trust, legal, safety, continuity.]</p>\n<h2>Where we stand — the metrics that matter</h2>\n<div class='tablewrap'><table><thead><tr><th>Metric</th><th>Current</th><th>Target</th><th>Trend</th></tr></thead><tbody><tr><td>MFA adoption (% accounts)</td><td>[ ]</td><td>[ ]</td><td>[↑/↓/→]</td></tr><tr><td>Patch compliance (critical, within SLA)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Mean Time to Detect (MTTD)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Mean Time to Respond (MTTR)</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Phishing-sim failure rate</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr><tr><td>Last verified backup restore</td><td>[date/result]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<h2>Options &amp; recommendation</h2>\n<div class='tablewrap'><table><thead><tr><th>Option</th><th>Cost / effort</th><th>Risk reduction</th><th>Recommend?</th></tr></thead><tbody><tr><td>[A]</td><td>[ ]</td><td>[ ]</td><td>[✔/—]</td></tr><tr><td>[B]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<p><strong>Recommendation:</strong> [one clear sentence.]</p>\n<h2>If we do nothing</h2>\n<p>[The residual risk the board is choosing to accept — named owner, review date.]</p>"}, {"name": "m9-recovery-priority-table.md", "html": "<h1>Service Recovery Priority Table (BIA / RTO / RPO) — Module 9 Deliverable</h1>\n<p><strong>Institution:</strong> [name]  <strong>Prepared by:</strong> [your name]  <strong>Date:</strong> [YYYY-MM-DD]</p>\n<blockquote>For each critical service, agree how fast it must come back (<strong>RTO</strong>) and how</blockquote>\n<blockquote>much data you can afford to lose (<strong>RPO</strong>), then rank recovery order. These are</blockquote>\n<blockquote>business decisions, agreed with service owners — not IT guesses. See</blockquote>\n<blockquote><code>labctl learn m9</code>.</blockquote>\n<div class='tablewrap'><table><thead><tr><th>Priority</th><th>Critical service</th><th>Business impact if down</th><th>RTO (max downtime)</th><th>RPO (max data loss)</th><th>Depends on</th><th>Owner</th></tr></thead><tbody><tr><td>1</td><td><em>Example:</em> Core payment system</td><td>Revenue stops; customer harm; reputational</td><td>1 hour</td><td>5 min</td><td>Database, network</td><td>CFO / Head of IT</td></tr><tr><td>2</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td>[FILL IN]</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>Recovery sequence rationale</h2>\n<p>[Why this order? Note dependencies — a service can't recover before the things it relies on. Explain any trade-offs.]</p>\n<h2>Backup posture check (per critical service)</h2>\n<div class='tablewrap'><table><thead><tr><th>Service</th><th>Backup exists?</th><th>3-2-1 (3 copies/2 media/1 offsite)?</th><th>Last <strong>restore test</strong> (date/result)</th></tr></thead><tbody><tr><td>[ ]</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr></tbody></table></div>\n<blockquote>A backup you have never restored is a hope, not a control. The restore-test</blockquote>\n<blockquote>column is the one leadership should check every quarter.</blockquote>"}]}, "m10": {"day": 5, "title": "Module 10 — Operation Cyber Resilience (Capstone)", "lesson": "<h1>Module 10 — Operation Cyber Resilience (Capstone)</h1>\n<p><strong>Day 5 · Afternoon · Hands-on lab: <code>labctl start m10</code></strong></p>\n<p>A real attack does not arrive as one neat module. It hits email, network, identity, data and people at once, over hours, while the pressure mounts and the information is incomplete. This capstone is where the whole week comes together — you work a live, multi-vector incident as both the technical investigator and the decision-maker.</p>\n<p>By the end you will be able to:</p>\n<ul>\n<li>investigate a live, multi-vector attack across every tool from the week;</li>\n<li>correlate scattered evidence into one coherent attack story;</li>\n<li>drive both the technical response and the leadership decisions;</li>\n<li>make defensible calls fast, on incomplete information, and record them.</li>\n</ul>\n<hr>\n<h2>1. The big picture: the orchestra, not the instruments</h2>\n<p>Every earlier module taught one instrument. The capstone is the orchestra. A fictional Ghanaian institution is under a <strong>multi-vector attack</strong> that unfolds as <strong>eight injects</strong> over a simulated morning, and you work it from two sides at once:</p>\n<ul>\n<li><strong>Technical investigation</strong> — Nmap the range, read the capture in Wireshark, trace the BEC email's headers, triage the Wazuh alerts, recover and decode evidence.</li>\n<li><strong>Leadership &amp; response</strong> — declare severity, contain without destroying evidence, apply the deepfake protocol, set recovery priorities, handle the Act 843/1038 reporting questions.</li>\n</ul>\n<p>The single skill the capstone tests is <strong>correlation</strong>: recognising that the supplier email, the odd privileged login, the internal scan, the voice-note transfer request, the data exfiltration and the database going dark are <em>not six problems</em> — they are one adversary moving through the <strong>Cyber Kill Chain</strong>, and every stage maps to <strong>MITRE ATT&amp;CK</strong>.</p>\n<h2>2. An analogy</h2>\n<p>A hospital trauma team when a bus crash arrives. No single doctor owns it: one commander triages and directs; specialists work airway, bleeding and fractures in parallel; someone logs every decision and every drug. The week trained each specialist skill. The capstone is the trauma call where they work <em>together</em>, fast, under a commander, with the clock running and an institution on the line.</p>\n<h2>3. How it works — the eight injects, mapped</h2>\n<p>The injects map straight onto the week and onto the Kill Chain:</p>\n<div class='tablewrap'><table><thead><tr><th>Inject</th><th>Event</th><th>Kill Chain / module</th><th>ATT&amp;CK</th></tr></thead><tbody><tr><td>T+00</td><td>Supplier payment-change email (urgent)</td><td>Delivery · M5</td><td>T1566</td></tr><tr><td>T+20</td><td>Privileged login, unusual IP, off-hours</td><td>Exploitation · M3/M4</td><td>T1078</td></tr><tr><td>T+40</td><td>Internal host scanning the network</td><td>Recon/Lateral · M3</td><td>T1046</td></tr><tr><td>T+65</td><td>Vendor bank details changed 48h ago; near-miss transfer</td><td>Actions · M5/M2</td><td>T1565</td></tr><tr><td>T+90</td><td>Synthetic executive <em>voice note</em> orders a wire transfer</td><td>Delivery · M7</td><td>T1656</td></tr><tr><td>T+120</td><td>Data exfiltration — large outbound to unknown IP</td><td>Actions · M3/M6</td><td>T1041</td></tr><tr><td>T+145</td><td>Critical database offline (ransomware trigger)</td><td>Actions · M6</td><td>T1486</td></tr><tr><td>T+160</td><td>AI assistant leaks data via an injected document</td><td>Execution · M7</td><td>T1059</td></tr></tbody></table></div>\n<p>Four <strong>operational cells</strong> run in parallel, exactly as a real crisis team does: <strong>Crisis Leadership, Technical Investigation, Fraud/Finance, Legal/Privacy/Comms.</strong></p>\n<p>The working method:</p>\n<ol>\n<li><strong>Collect</strong> — every piece: alerts, the packet capture, the email, scan results.</li>\n<li><strong>Correlate</strong> — tie them with shared indicators. The same foothold IP appears in the privileged login, the internal scan <em>and</em> the exfiltration — that is your through-line.</li>\n<li><strong>Decide</strong> — contain the foothold (<strong>isolate, don't power off</strong> — preserve evidence, Module 6), refuse-and-verify the voice-note transfer (callback on a known number, Module 7), declare severity, set recovery priorities (RTO/RPO, Module 9).</li>\n<li><strong>Record</strong> — a decision log with timestamps and rationale.</li>\n</ol>\n<h2>4. Scenarios — because this is how real attacks actually arrive</h2>\n<p>Every inject is drawn from a real pattern you studied this week — the GCB-style BEC, SIM/MoMo and deepfake-voice fraud, the hospital ransomware with its backup and power-off failures, the exposed-service foothold. Internationally, the same <em>combination</em> is the modern norm: the <strong>2016 Bangladesh Bank</strong> heist fused intrusion, fraud and timing; <strong>NotPetya</strong> fused worm propagation with destructive impact; the <strong>Arup 2024</strong> deepfake fused social engineering with finance process failure. Real campaigns mix fraud, intrusion and social engineering precisely to maximise damage and confusion. Resilience is the ability to keep thinking clearly while all of it happens at once.</p>\n<h2>5. Why it matters</h2>\n<ul>\n<li>Real incidents are messy and simultaneous; practising the <em>integration</em> is what separates a team that contains a breach from one overwhelmed by it.</li>\n<li>Correlation under pressure is the hardest and most valuable SOC skill — and the one you can only build by doing.</li>\n<li>The habit of <strong>deciding and logging</strong> fast, on incomplete information, is what leadership in a crisis actually looks like.</li>\n</ul>\n<h2>6. Common mistakes</h2>\n<ul>\n<li><strong>Treating injects in isolation</strong> — the whole point is that they are one campaign; correlate by shared indicators.</li>\n<li><strong>Powering off the foothold</strong> to \"stop it\" — isolate instead, to preserve evidence.</li>\n<li><strong>Actioning the voice-note transfer</strong> because it sounds urgent and real — verify out-of-band.</li>\n<li><strong>No decision log</strong> — in the debrief you must show <em>what you decided, when, and why.</em></li>\n</ul>\n<h2>Do it yourself</h2>\n<p><code>labctl start m10</code> brings up the live range (finance portal, records host, AI assistant) plus the evidence package (an 8-inject Wazuh feed, the BEC email, a network capture). Work the timeline, correlate to the foothold IP, find the C2 domain and exfiltration target, make the response calls, and assemble the incident dossier and 90-day roadmap with <code>labctl worksheet m10</code>. <code>labctl verify m10</code> grades the full picture. This is your <code>labctl progress</code> finale.</p>\n<h2>Key takeaways</h2>\n<ul>\n<li>A real attack is <strong>multi-vector and simultaneous</strong> — the capstone integrates the whole week along the <strong>Kill Chain</strong> and <strong>ATT&amp;CK</strong>.</li>\n<li>The master skill is <strong>correlation</strong>: a shared indicator (one foothold IP) turns scattered alerts into one story.</li>\n<li>Respond by the playbook: <strong>isolate (don't power off), verify out-of-band, declare severity, set RTO/RPO, log decisions.</strong></li>\n<li>Climax techniques: <strong>T1041</strong> (exfiltration), <strong>T1486</strong> (ransomware).</li>\n</ul>\n<h2>Check yourself</h2>\n<ol>\n<li><strong>The BEC email, a privileged login, an internal scan and an exfiltration all involve one IP. What does that tell you?</strong> → They are one campaign, not four incidents — the shared IP is the foothold tying the attack together. Correlate; don't triage them separately.</li>\n</ol>\n<ol>\n<li><strong>A voice note \"from the CEO\" demands an urgent transfer mid-incident. Action it?</strong> → No — verify out-of-band on a known number first. It is a likely deepfake (Module 7); the urgency is the manipulation.</li>\n</ol>\n<ol>\n<li><strong>You contain the foothold host — isolate or power off?</strong> → Isolate from the network; powering off destroys volatile memory evidence (Module 6).</li>\n</ol>\n<ol>\n<li><strong>Name the ATT&amp;CK techniques for the exfiltration and the ransomware.</strong> → T1041 (Exfiltration Over C2 Channel) and T1486 (Data Encrypted for Impact).</li>\n</ol>\n<h2>Glossary</h2>\n<ul>\n<li><strong>Multi-vector attack</strong> — one campaign using several techniques at once.</li>\n<li><strong>Inject</strong> — a scripted event introduced during an exercise.</li>\n<li><strong>Correlation</strong> — linking separate events via shared indicators into one story.</li>\n<li><strong>Kill Chain / ATT&amp;CK</strong> — where in the intrusion / which specific technique.</li>\n<li><strong>Operational cell</strong> — a focused response team (leadership, technical, fraud, legal/comms).</li>\n<li><strong>Decision log</strong> — timestamped record of crisis decisions and rationale.</li>\n<li><strong>T1041 / T1486</strong> — exfiltration over C2 / data encrypted for impact.</li>\n</ul>", "sheets": [{"name": "m10-incident-dossier.md", "html": "<h1>Incident Dossier &amp; 90-Day Roadmap — Module 10 Capstone Deliverable</h1>\n<p><strong>Team / name:</strong> [ ]  <strong>Date:</strong> [YYYY-MM-DD]  <strong>Exercise:</strong> Operation Cyber Resilience</p>\n<blockquote>The capstone deliverable pulls the whole week together: prove the attack story</blockquote>\n<blockquote>from evidence, show the decisions you made, and set the recovery path. See</blockquote>\n<blockquote><code>labctl learn m10</code>.</blockquote>\n<h2>1. Executive summary (for leadership)</h2>\n<p>[What happened, business impact, current status — 4–5 sentences.]</p>\n<h2>2. The attack story (correlation)</h2>\n<p>[Narrative tying the eight injects into ONE campaign. Name the shared indicator (e.g. the foothold IP) that links them.]</p>\n<div class='tablewrap'><table><thead><tr><th>Inject</th><th>Time</th><th>Event</th><th>Evidence</th><th>ATT&amp;CK</th></tr></thead><tbody><tr><td>T+00</td><td>09:00</td><td>Supplier payment-change email</td><td>payment-change.eml</td><td>T1566</td></tr><tr><td>T+20</td><td>09:20</td><td>Privileged login, unusual IP</td><td>Wazuh alerts</td><td>T1078</td></tr><tr><td>T+40</td><td>09:40</td><td>Internal host scanning</td><td>Wazuh / Nmap</td><td>T1046</td></tr><tr><td>T+65</td><td>10:05</td><td>Vendor bank details changed 48h ago</td><td>email / finance</td><td>T1565</td></tr><tr><td>T+90</td><td>10:30</td><td>Synthetic executive voice transfer order</td><td>—</td><td>T1656</td></tr><tr><td>T+120</td><td>11:00</td><td>Data exfiltration to unknown IP</td><td>pcap / Wazuh</td><td>T1041</td></tr><tr><td>T+145</td><td>11:25</td><td>Critical database offline (ransomware)</td><td>Wazuh</td><td>T1486</td></tr><tr><td>T+160</td><td>11:40</td><td>AI assistant leaks data via injected doc</td><td>—</td><td>—</td></tr></tbody></table></div>\n<p>Key indicators — Foothold IP: [ ]  C2 domain: [ ]  Exfil destination IP: [ ] Look-alike domain: [ ]  Highest alert severity: [ ]</p>\n<h2>3. Decision log (your crisis audit trail)</h2>\n<div class='tablewrap'><table><thead><tr><th>Time</th><th>Decision</th><th>Made by</th><th>Rationale</th></tr></thead><tbody><tr><td>[ ]</td><td>[e.g. isolate foothold host — NOT power off]</td><td>[IC]</td><td>preserve evidence</td></tr><tr><td>[ ]</td><td>[refuse &amp; verify voice-note transfer via callback]</td><td></td><td>likely deepfake</td></tr><tr><td>[ ]</td><td>[declare severity: ___]</td><td></td><td></td></tr></tbody></table></div>\n<h2>4. Response summary (NIST lifecycle)</h2>\n<ul>\n<li>Containment: [ ]</li>\n<li>Eradication: [ ]</li>\n<li>Recovery priorities (RTO/RPO): [ ]</li>\n</ul>\n<h2>5. Reporting obligations considered</h2>\n<p>[Act 1038 CSA / Act 843 DPC questions — to confirm with counsel.]</p>\n<h2>6. 90-Day resilience roadmap</h2>\n<div class='tablewrap'><table><thead><tr><th>#</th><th>Action</th><th>Addresses</th><th>Owner</th><th>Target</th><th>CSF function</th></tr></thead><tbody><tr><td>1</td><td>[FILL IN]</td><td>[inject/root cause]</td><td></td><td></td><td>[Govern/Identify/Protect/Detect/Respond/Recover]</td></tr><tr><td>2</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>3</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4</td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5</td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>\n<h2>7. Three lessons for the board</h2>\n<ol>\n<li>[ ]</li>\n<li>[ ]</li>\n<li>[ ]</li>\n</ol>"}]}};
const DAYS={1:"Day 1",2:"Day 2",3:"Day 3",4:"Day 4",5:"Day 5"};
function buildNav(){
  const order=Object.keys(DATA);
  let lastDay=null,h="";
  for(const mid of order){
    const d=DATA[mid];
    if(d.day!==lastDay){h+=`<div class="day-h">${DAYS[d.day]||("Day "+d.day)}</div>`;lastDay=d.day;}
    const label=d.title.replace(/^Module\s+\d+\s*[—-]\s*/,"");
    h+=`<a data-mid="${mid}" onclick="show('${mid}')"><span class="mid">${mid.toUpperCase()}</span>${label}</a>`;
  }
  document.getElementById('navlist').innerHTML=h;
}
function show(mid){
  const d=DATA[mid]; if(!d) return;
  let h=d.lesson;
  if(d.sheets&&d.sheets.length){
    for(const s of d.sheets){
      h+=`<details><summary>📝 Deliverable template — ${s.name}</summary><div class="body">${s.html}</div></details>`;
    }
  }
  document.getElementById('content').innerHTML=h;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.mid===mid));
  window.scrollTo(0,0);
  try{localStorage.setItem('caic_last',mid);}catch(e){}
  if(location.hash!=='#'+mid) history.replaceState(null,'','#'+mid);
}
function filter(q){
  q=q.toLowerCase();
  document.querySelectorAll('nav a').forEach(a=>{
    const d=DATA[a.dataset.mid];
    const hay=(d.title+' '+d.lesson).toLowerCase();
    a.style.display=hay.includes(q)?'block':'none';
  });
}
function toggleTheme(){
  const r=document.documentElement;
  const t=r.getAttribute('data-theme')==='light'?'dark':'light';
  r.setAttribute('data-theme',t);
  try{localStorage.setItem('caic_theme',t);}catch(e){}
}
(function init(){
  try{const t=localStorage.getItem('caic_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  buildNav();
  let start=(location.hash||'').replace('#','');
  if(!DATA[start]){try{start=localStorage.getItem('caic_last');}catch(e){}}
  if(!DATA[start]) start=Object.keys(DATA)[0];
  show(start);
})();
</script>
</body>
